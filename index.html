<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oikko - ক্যাম্পাস সোশ্যাল নেটওয়ার্ক</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f3f6f2;
      --text-primary: #1e2c24;
      --text-muted: #6d7a72;
      --border-color: #dce6df;
      --border-subtle: #eef3ee;
      --primary-olive: #2f6f57;
      --primary-dark: #245544;
      --brand-ink: #12231c;
      --brand-mint: #d8f3e4;
      --brand-coral: #ef7358;
      --brand-yellow: #f4c45a;
      --glass: rgba(255,255,255,.72);
    }
    html.dark {
      --bg-canvas: #101612;
      --text-primary: #edf3ee;
      --text-muted: #9aa89f;
      --border-color: #2b3831;
      --border-subtle: #222c27;
      --primary-olive: #6dba97;
      --primary-dark: #4e9474;
      --glass: rgba(18,28,23,.78);
    }
    body {
      background:
        radial-gradient(circle at 8% -8%, rgba(216, 243, 228, .9), transparent 28rem),
        radial-gradient(circle at 100% 0%, rgba(244, 196, 90, .16), transparent 24rem),
        radial-gradient(circle at 70% 100%, rgba(239, 115, 88, .08), transparent 22rem),
        var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Hind Siliguri', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      letter-spacing: .01em;
    }
    html, body {
      margin: 0;
      min-width: 100%;
    }
    /* Dark mode component overrides for Tailwind classes */
    html.dark body {
      background-color: #101612;
      color: #edf3ee;
    }
    html.dark body {
      background:
        radial-gradient(circle at 8% -8%, rgba(47, 111, 87, .28), transparent 28rem),
        radial-gradient(circle at 100% 0%, rgba(117, 91, 42, .16), transparent 24rem),
        #101612;
    }
    ::selection {
      background: #bddfc9;
      color: #1f2a24;
    }
    button, a, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(242, 125, 97, .38);
      outline-offset: 2px;
    }
    .app-topbar {
      background: rgba(16, 32, 26, .9);
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 40px rgba(18, 35, 28, .2);
      backdrop-filter: blur(22px);
    }
    .app-header-inner {
      min-height: 4.5rem;
    }
    .app-brand-mark {
      background: linear-gradient(135deg, #e7fbef, #8ed9b0);
      color: #12231c;
      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }
    .app-brand-name {
      font-family: Outfit, 'Hind Siliguri', sans-serif;
      letter-spacing: -.04em;
    }
    .app-search {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      color: white;
      min-width: 0;
      flex: 1 1 16rem;
      transition: .2s ease;
    }
    .app-search:focus-within {
      background: rgba(255,255,255,.2);
      border-color: rgba(216,243,228,.85);
      box-shadow: 0 0 0 4px rgba(216,243,228,.14);
    }
    .app-search input {
      min-width: 0;
      width: 100%;
      background: transparent !important;
      border: 0 !important;
      color: #fff !important;
      font-size: .875rem;
      line-height: 1.45;
    }
    .app-search input::placeholder {
      color: rgba(255,255,255,.58);
    }
    html.dark .app-search input {
      background-color: transparent !important;
      color: #fff !important;
      border-color: transparent !important;
    }
    .app-hero {
      background:
        linear-gradient(118deg, rgba(18,35,28,.98), rgba(47,111,87,.94)),
        radial-gradient(circle at 100% 0%, rgba(239,115,88,.48), transparent 24rem);
      box-shadow: 0 22px 48px rgba(18,35,28,.16);
    }
    .app-hero-orb {
      width: 18rem;
      height: 18rem;
      right: -5rem;
      top: -7rem;
      border: 1px solid rgba(223,244,232,.2);
      background: rgba(223,244,232,.08);
      box-shadow: 0 0 0 2rem rgba(223,244,232,.035), 0 0 0 4rem rgba(223,244,232,.025);
    }
    .app-stat {
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 10px 24px rgba(66,66,47,.06);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .app-stat:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(66,66,47,.11);
    }
    html.dark .app-stat {
      background: rgba(38,38,29,.82);
      border-color: #3b3b30;
    }
    .app-card {
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 10px 28px rgba(66,66,47,.055);
      transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
    }
    .app-card:hover {
      border-color: rgba(90,90,64,.28);
      box-shadow: 0 16px 34px rgba(66,66,47,.09);
    }
    html.dark .app-card {
      border-color: #3b3b30;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .app-section-label {
      color: #7c806a;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .app-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      border-radius: .85rem;
      padding: .62rem .9rem;
      font-size: .75rem;
      font-weight: 800;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .app-action:hover {
      transform: translateY(-1px);
    }
    .app-action-primary {
      background: var(--brand-coral);
      color: white;
      box-shadow: 0 8px 18px rgba(242,125,97,.24);
    }
    .app-action-primary:hover { background: #df674f; }
    .app-action-soft {
      background: var(--brand-mint);
      color: var(--brand-ink);
    }
    html.dark .app-action-soft {
      background: #304838;
      color: #dff4e8;
    }
    .app-nav {
      background: rgba(16,32,26,.96);
      border-top: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 -14px 36px rgba(16,32,26,.22);
      backdrop-filter: blur(22px);
    }
    .app-nav-item {
      min-height: 3.35rem;
      border-radius: 1.05rem;
    }
    .app-nav-item.active {
      background: var(--brand-mint);
      color: var(--brand-ink);
      box-shadow: 0 7px 18px rgba(0,0,0,.14);
    }
    .search-results-panel {
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 16px 34px rgba(66,66,47,.09);
    }
    .auth-shell {
      background:
        radial-gradient(circle at 8% 12%, rgba(223,244,232,.9), transparent 23rem),
        radial-gradient(circle at 96% 88%, rgba(245,202,104,.18), transparent 22rem),
        var(--bg-canvas);
    }
    .auth-panel {
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 25px 70px rgba(31,42,36,.13);
    }
    .auth-aside {
      background:
        linear-gradient(145deg, rgba(31,42,36,.98), rgba(53,82,66,.96)),
        radial-gradient(circle at 100% 0%, rgba(242,125,97,.48), transparent 20rem);
    }
    .auth-feature {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
    }
    html.dark .auth-panel {
      border-color: #3b3b30;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }
    html.dark .search-results-panel {
      border-color: #3b3b30;
    }
    #app main .bg-white {
      border-radius: 1.25rem;
    }
    html.dark #app main .bg-white {
      background-color: #21211a !important;
    }
    @media (max-width: 640px) {
      .app-header-inner { min-height: 3.9rem; }
      .app-brand-name { font-size: 1rem; }
      .app-hero { border-radius: 1.35rem; }
      .app-stat { padding: .8rem; }
    }
    html.dark .bg-white {
      background-color: #21211A !important;
      color: #EDEDE4 !important;
    }
    html.dark .bg-\[\#F5F5F0\] {
      background-color: #1A1A14 !important;
      color: #EDEDE4 !important;
    }
    html.dark .bg-\[\#F9F9F4\] {
      background-color: #282820 !important;
      color: #EDEDE4 !important;
    }
    html.dark .bg-\[\#F0F0E0\] {
      background-color: #323228 !important;
    }
    html.dark .text-\[\#42422F\] {
      color: #EDEDE4 !important;
    }
    html.dark .text-\[\#8A8A6A\] {
      color: #A6A690 !important;
    }
    html.dark .text-\[\#5A5A40\] {
      color: #D6D6BC !important;
    }
    html.dark .border-\[\#E2E2D5\] {
      border-color: #36362B !important;
    }
    html.dark .border-\[\#F0F0E0\] {
      border-color: #2C2C22 !important;
    }
    html.dark input, html.dark textarea, html.dark select {
      background-color: #1A1A14 !important;
      color: #EDEDE4 !important;
      border-color: #3B3B30 !important;
    }
    html.dark .divide-\[\#F0F0E0\] > * + * {
      border-color: #2C2C22 !important;
    }
    html.dark .hover\:bg-\[\#F5F5F0\]:hover {
      background-color: #2A2A20 !important;
    }
    html.dark .hover\:bg-\[\#F9F9F4\]:hover {
      background-color: #2A2A20 !important;
    }
    html.dark .hover\:bg-\[\#E2E2D5\]:hover {
      background-color: #36362B !important;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1eb;
    }
    html.dark ::-webkit-scrollbar-track {
      background: #21211a;
    }
    ::-webkit-scrollbar-thumb {
      background: #c5c5b5;
      border-radius: 4px;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #444436;
      border-radius: 4px;
    }
    .badge-verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #3b82f6;
      color: white;
      border-radius: 9999px;
    }
    .pb-safe {
      padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
    }
    @keyframes smoothMarqueeLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee-continuous {
      display: flex;
      width: max-content;
      animation: smoothMarqueeLeft 45s linear infinite;
      will-change: transform;
    }
    .animate-marquee-continuous:hover,
    .marquee-paused {
      animation-play-state: paused !important;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ===== Amar Album — Oikko UI-native gallery ===== */
    .oikko-album-shell{max-width:72rem;margin:0 auto;padding:1rem .75rem 7rem}
    .oikko-album-hero{position:relative;overflow:hidden;border-radius:1.6rem;padding:1.5rem;background:
      linear-gradient(120deg,rgba(18,35,28,.98),rgba(47,111,87,.96)),
      radial-gradient(circle at 100% 0%,rgba(239,115,88,.42),transparent 22rem);
      box-shadow:0 20px 45px rgba(18,35,28,.16);color:#fff}
    .oikko-album-hero:after{content:"";position:absolute;width:15rem;height:15rem;border-radius:50%;right:-5rem;top:-8rem;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 1.8rem rgba(255,255,255,.035),0 0 0 3.6rem rgba(255,255,255,.02)}
    .oikko-album-hero>*{position:relative;z-index:1}
    .oikko-album-eyebrow{font-size:.68rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#c9e8d4}
    .oikko-album-hero h1{margin:.45rem 0 .35rem;font-family:Outfit,'Hind Siliguri',sans-serif;font-size:clamp(1.8rem,4vw,3rem);line-height:1.08;letter-spacing:-.035em}
    .oikko-album-hero p{margin:0;color:rgba(255,255,255,.72);font-size:.82rem;line-height:1.75;max-width:42rem}
    .oikko-album-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
    .oikko-album-stat{padding:.55rem .8rem;border-radius:.85rem;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);font-size:.68rem}
    .oikko-album-stat b{font-size:1rem;margin-right:.2rem}
    .oikko-album-toolbar{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:1rem 0}
    .oikko-album-tabs{display:flex;gap:.25rem;padding:.25rem;border-radius:.9rem;background:var(--brand-mint)}
    .oikko-album-tab{border:0;background:transparent;color:var(--brand-ink);padding:.55rem .75rem;border-radius:.7rem;font-size:.72rem;font-weight:800}
    .oikko-album-tab.active{background:#fff;box-shadow:0 5px 15px rgba(0,0,0,.08)}
    html.dark .oikko-album-tab.active{background:#21211a;color:#edf3ee}
    .oikko-album-tools{display:flex;gap:.45rem;align-items:center;flex:1;justify-content:flex-end}
    .oikko-album-search{height:2.55rem;min-width:12rem;max-width:20rem;flex:1;border:1px solid var(--border-color);background:var(--surface,#fff);color:var(--text-primary);border-radius:.85rem;padding:0 .8rem 0 2.25rem;outline:0;font-size:.75rem}
    .oikko-album-search:focus{border-color:var(--primary-olive);box-shadow:0 0 0 3px rgba(47,111,87,.12)}
    .oikko-album-search-wrap{position:relative;display:flex;align-items:center;max-width:20rem;flex:1}
    .oikko-album-search-wrap i{position:absolute;left:.75rem;width:1rem;color:var(--text-muted)}
    .oikko-album-viewbtn{height:2.55rem;width:2.55rem;border:1px solid var(--border-color);background:var(--surface,#fff);color:var(--text-primary);border-radius:.8rem;display:grid;place-items:center}
    .oikko-album-viewbtn.active{background:var(--primary-olive);color:#fff;border-color:var(--primary-olive)}
    .oikko-album-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
    .oikko-album-card{background:var(--surface,#fff);border:1px solid var(--border-color);border-radius:1.2rem;overflow:hidden;box-shadow:0 9px 25px rgba(66,66,47,.055);transition:.22s ease;cursor:pointer}
    .oikko-album-card:hover{transform:translateY(-4px);box-shadow:0 17px 32px rgba(66,66,47,.11);border-color:rgba(90,90,64,.3)}
    .oikko-album-media{position:relative;aspect-ratio:4/3;background:#dfe8e2;overflow:hidden}
    .oikko-album-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
    .oikko-album-card:hover .oikko-album-media img{transform:scale(1.045)}
    .oikko-album-heart{position:absolute;right:.6rem;top:.6rem;width:2.2rem;height:2.2rem;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.92);border-radius:50%;display:grid;place-items:center;color:#354039;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.16)}
    .oikko-album-heart.active{color:#e55362}.oikko-album-heart svg{width:1rem;height:1rem}
    .oikko-album-badge{position:absolute;left:.6rem;bottom:.6rem;padding:.3rem .5rem;border-radius:.55rem;background:rgba(18,35,28,.66);backdrop-filter:blur(7px);color:#fff;font-size:.58rem;font-weight:800}
    .oikko-album-body{padding:.75rem .8rem .8rem}
    .oikko-album-title{
      font-size:.82rem;
      font-weight:900;
      line-height:1.35;
      color:#26382f !important;
      opacity:1 !important;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-shadow:none;
    }
    .oikko-album-meta{
      display:flex;
      justify-content:space-between;
      gap:.5rem;
      margin-top:.35rem;
      font-size:.66rem;
      font-weight:650;
      color:#68776f !important;
      opacity:1 !important;
    }
    .oikko-album-meta span{
      color:#68776f !important;
      opacity:1 !important;
    }
    /* Dark mode readability fix */
    html.dark .oikko-album-card{
      background:#18221d !important;
      border-color:#2d3b34 !important;
      box-shadow:0 10px 28px rgba(0,0,0,.28);
    }
    html.dark .oikko-album-body{
      background:#18221d !important;
    }
    html.dark .oikko-album-card .oikko-album-title,
    body.dark .oikko-album-card .oikko-album-title{
      color:#ffffff !important;
      opacity:1 !important;
      text-shadow:none !important;
    }
    html.dark .oikko-album-card .oikko-album-meta,
    html.dark .oikko-album-card .oikko-album-meta span,
    body.dark .oikko-album-card .oikko-album-meta,
    body.dark .oikko-album-card .oikko-album-meta span{
      color:#c6d2cb !important;
      opacity:1 !important;
    }
    html.dark .oikko-album-badge{
      background:rgba(10,18,14,.82);
      color:#ffffff !important;
    }
    .oikko-album-list{display:grid;grid-template-columns:1fr;gap:.65rem}
    .oikko-album-list .oikko-album-card{display:grid;grid-template-columns:9rem 1fr}
    .oikko-album-list .oikko-album-media{aspect-ratio:16/10}
    .oikko-album-empty{padding:3.5rem 1rem;text-align:center;border:1px dashed var(--border-color);border-radius:1.2rem;color:var(--text-muted);grid-column:1/-1;background:var(--surface,#fff)}
    .oikko-album-empty-icon{width:3.6rem;height:3.6rem;margin:0 auto .7rem;border-radius:1.1rem;background:var(--surface2,#eef4f0);display:grid;place-items:center}
    .oikko-album-lightbox{position:fixed;inset:0;z-index:100;background:rgba(2,7,4,.94);display:none;align-items:center;justify-content:center;padding:1rem}
    .oikko-album-lightbox.show{display:flex}
    .oikko-album-viewer{width:min(70rem,100%);height:min(90vh,50rem);display:flex;flex-direction:column;gap:.6rem}
    .oikko-album-viewer-top,.oikko-album-viewer-bottom{display:flex;align-items:center;justify-content:space-between;gap:.7rem;color:#fff}
    .oikko-album-viewer-top strong{font-size:.8rem}.oikko-album-viewer-top span,.oikko-album-viewer-bottom{font-size:.65rem;color:#b9c5be}
    .oikko-album-viewer-image{position:relative;flex:1;min-height:0;display:grid;place-items:center}
    .oikko-album-viewer-image img{max-width:100%;max-height:100%;object-fit:contain;border-radius:.8rem;box-shadow:0 24px 75px rgba(0,0,0,.45)}
    .oikko-album-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .oikko-album-nav button,.oikko-album-close{pointer-events:auto;width:2.7rem;height:2.7rem;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;border-radius:50%;display:grid;place-items:center;backdrop-filter:blur(9px)}
    .oikko-album-close{position:static}
    .oikko-album-actions{display:flex;gap:.4rem}.oikko-album-action{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:.65rem;padding:.45rem .6rem;font-size:.65rem}
    @media(max-width:1050px){.oikko-album-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:800px){.oikko-album-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){
      .oikko-album-shell{padding-left:.65rem;padding-right:.65rem}
      .oikko-album-grid{grid-template-columns:1fr}
      .oikko-album-toolbar{align-items:stretch}
      .oikko-album-tools{width:100%;justify-content:stretch}
      .oikko-album-search-wrap{max-width:none}
      .oikko-album-list .oikko-album-card{grid-template-columns:7.5rem 1fr}
      .oikko-album-hero{padding:1.25rem}
      .oikko-album-viewer-bottom{align-items:flex-start;flex-direction:column}
    }

  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Toast Container (positioned above bottom navigation bar) -->
  <div id="toast-container" class="fixed bottom-20 sm:bottom-22 right-4 sm:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- App Main Wrapper (rendered dynamically by JavaScript) -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Profile Modal Container -->
  <div id="modal-container"></div>

  <!-- Fullscreen Media Lightbox Container -->
  <div id="lightbox-container"></div>

  <!-- Mention Autocomplete Portal Container -->
  <div id="mention-dropdown-portal" class="hidden fixed z-50 bg-white dark:bg-[#21211A] rounded-2xl shadow-2xl border border-[#E2E2D5] dark:border-[#36362B] overflow-hidden w-72 sm:w-80 max-h-72 flex flex-col animate-in fade-in zoom-in-95 duration-150"></div>

  <!-- Firebase Initialization with Cloud Firestore -->

    function normalizeAdminUser(user = {}) {

      return normalized;

    function loadUsers() {

        localStorage.setItem('student_portal_users', JSON.stringify(parsed));
        return parsed;
      } catch (e) {
        return INITIAL_USERS;
      }
    }

    function safeSaveStorage(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (err) {
        console.warn("LocalStorage write skipped for " + key + " due to quota limit:", err);
        try {
          if (Array.isArray(data)) {
            const stripped = data.map(item => {
              if (item && typeof item === "object") {
                const copy = { ...item };
                if (copy.imageUrl && copy.imageUrl.length > 2000) {
                  copy.imageUrl = "";
                }
                if (copy.videoUrl && copy.videoUrl.length > 2000) {
                  copy.videoUrl = "";
                }
                return copy;
              }
              return item;
            });
            localStorage.setItem(key, JSON.stringify(stripped));
          }
        } catch (e2) {
          // In-memory state remains authoritative
        }
      }
    }

    // --- Device Media File Helpers (Photo & Video) ---
    // Fix: Prevent mobile / browser canvas green tint issue by directly loading data URLs for standard files
    // and using solid background with colorSpace srgb for resized images.
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.85) {
      return new Promise((resolve) => {
        if (!file) return resolve('');

        // 1. Files under 2.5MB: read directly as DataURL to preserve 100% true native colors without any canvas green distortion
        if (file.size <= 2.5 * 1024 * 1024) {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
          return;
        }

        // 2. Large files: resize safely with solid white background to eliminate color-space channel mismatch
        try {
          const objectUrl = URL.createObjectURL(file);
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
            if (!ctx) {
              const r = new FileReader();
              r.onload = (ev) => resolve(ev.target.result);
              r.readAsDataURL(file);
              return;
            }
            // Fill solid white background so transparent or mobile camera buffer never turns green
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            
            const mime = (file.type && file.type.startsWith('image/')) ? file.type : 'image/jpeg';
            try {
              const out = canvas.toDataURL(mime, quality);
              resolve(out);
            } catch (err) {
              const r = new FileReader();
              r.onload = (ev) => resolve(ev.target.result);
              r.readAsDataURL(file);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            const r = new FileReader();
            r.onload = (ev) => resolve(ev.target.result);
            r.readAsDataURL(file);
          };
          img.src = objectUrl;
        } catch (e) {
          const r = new FileReader();
          r.onload = (ev) => resolve(ev.target.result);
          r.readAsDataURL(file);
        }
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      try {
        const d = localStorage.getItem('student_portal_past_event_photos');
        if (!d) {
          localStorage.setItem('student_portal_past_event_photos', JSON.stringify(INITIAL_PAST_EVENT_PHOTOS));
          return INITIAL_PAST_EVENT_PHOTOS;
        }
        return JSON.parse(d);

    // --- 3. App State ---
    const initialIsDark = localStorage.getItem('student_portal_theme') === 'dark';

    let state = {

    window.toggleDarkMode = toggleDarkMode;

    // --- কমেন্ট ভিউ টগল (শুধু প্রথম কমেন্ট নাকি সকল কমেন্ট দেখানো হবে) ---
    function toggleAllComments(postId) {
      state.expandedComments[postId] = !state.expandedComments[postId];
      renderApp();
    }
    window.toggleAllComments = toggleAllComments;

    // --- অডিও নোটিফিকেশন সাউন্ড হেল্পার ---
    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn('AudioContext sound note:', e);
      }
    }

    // --- ডিভাইস নোটিফিকেশন পারমিশন ও পুশ সেন্ডার ---
    function requestNotificationPermission() {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              showToast('ডিভাইস নোটিফিকেশন সফলভাবে চালু করা হয়েছে!', 'success');
              playNotificationSound();
            }
          });
        } else if (Notification.permission === 'granted') {
          showToast('ডিভাইস নোটিফিকেশন সক্রিয় আছে', 'info');
        } else {
          showToast('ব্রাউজারের সেটিংস থেকে নোটিফিকেশন অনুমোদন করুন', 'info');
        }
      }
    }
    window.requestNotificationPermission = requestNotificationPermission;

    function sendDeviceNotification(title, options = {}) {
      // ১. মোবাইল ভাইব্রেশন
      if ('vibrate' in navigator) {
        try { navigator.vibrate([180, 80, 180]); } catch (e) {}
      }

      // ২. অডিও বেল সাউন্ড
      playNotificationSound();

      // ৩. ডিভাইসের আসল সিস্টেম নোটিফিকেশন (মোবাইল / ডেক্সটপ পপআপ)
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            const notif = new Notification(title, {
              body: options.body || '',
              icon: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              badge: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              silent: false,
              ...options
            });
            notif.onclick = function() {
              window.focus();
              this.close();
            };
          } catch (e) {
            console.warn('Native notification trigger error:', e);
          }
        } else if (Notification.permission === 'default') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') {
              try {
                new Notification(title, options);
              } catch (e) {}
            }
          });
        }
      }

      // ৪. ইন-অ্যাপ লাইভ টোস্ট অ্যালার্ট
      showToast(`🔔 ${title}: ${options.body || ''}`, 'info');
    }
    window.sendDeviceNotification = sendDeviceNotification;

    // --- Oikko Messenger: Realtime Database notification sync ---
    let messengerNotificationUnsubscribe = null;
    let messengerNotificationUserId = '';
    const handledMessengerNotificationIds = new Set();

    function stopMessengerNotificationListener() {
      if (typeof messengerNotificationUnsubscribe === 'function') {
        try { messengerNotificationUnsubscribe(); } catch (e) {}
      }
      messengerNotificationUnsubscribe = null;
      messengerNotificationUserId = '';
    }

    async function startMessengerNotificationListener() {
      const rtdb = window.firebaseRealtimeDb;
      const r = window.rtdb;
      const me = state.currentUser;
      if (!rtdb || !r || !me?.id) return;
      const firebaseUser = await ensureFirebaseCampusAuth(me);
      if (!firebaseUser) return;
      if (messengerNotificationUserId === me.id && messengerNotificationUnsubscribe) return;
      stopMessengerNotificationListener();
      messengerNotificationUserId = me.id;
      try {
        const notificationsRef = r.ref(rtdb, `oikko_notifications/${me.id}`);
        messengerNotificationUnsubscribe = r.onChildAdded(notificationsRef, snap => {
          const data = snap.val() || {};
          const notificationId = snap.key;
          if (!notificationId || handledMessengerNotificationIds.has(notificationId)) return;
          handledMessengerNotificationIds.add(notificationId);
          const createdAt = Number(data.createdAt || 0);
          // Ignore old notifications when the listener first connects.
          if (!createdAt || (Date.now() - createdAt) > 30000) return;
          if (data.senderId === me.id) return;
          const senderId = data.senderId || '';
          state.messengerUnreadCounts[senderId] = (state.messengerUnreadCounts[senderId] || 0) + 1;
          const isCurrentChat = state.activeView === 'messenger' && state.activeChatUserId === senderId;
          if (!isCurrentChat) {
            sendDeviceNotification(`💬 ${data.senderName || 'নতুন মেসেজ'}`, {
              body: data.text || (data.imageUrl ? '📷 একটি ছবি পাঠিয়েছেন' : 'আপনাকে একটি নতুন মেসেজ পাঠিয়েছেন'),
              icon: data.senderAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200',
              tag: `oikko-chat-${senderId}`
            });
          }
          if (state.activeView === 'messenger') renderMessengerOnly();
        });
      } catch (err) {
        console.warn('Messenger RTDB notification listener error:', err);
      }
    }
    window.startMessengerNotificationListener = startMessengerNotificationListener;
    window.stopMessengerNotificationListener = stopMessengerNotificationListener;

    async function createMessengerNotification(targetUserId, payload) {
      const rtdb = window.firebaseRealtimeDb;
      const r = window.rtdb;
      const me = state.currentUser;
      if (!rtdb || !r || !me || !targetUserId) return false;
      try {
        const notificationRef = r.push(r.ref(rtdb, `oikko_notifications/${targetUserId}`));
        await r.set(notificationRef, {
          type: 'message',
          senderId: me.id,
          senderName: me.fullName || 'Oikko user',
          senderAvatar: me.profilePicture || '',
          receiverId: targetUserId,
          text: payload.text || '',
          imageUrl: payload.imageUrl || '',
          videoUrl: payload.videoUrl || '',
          mediaType: payload.mediaType || '',
          fileName: payload.fileName || '',
          fileSize: Number(payload.fileSize || 0),
          createdAt: Date.now(),
          serverCreatedAt: r.serverTimestamp()
        });
        return true;
      } catch (err) {
        console.warn('Messenger RTDB notification write failed:', err);
        return false;
      }
    }
    window.createMessengerNotification = createMessengerNotification;

    // --- 3.1 Firebase Firestore Realtime Synchronizer ---
    let isFirebaseSyncInitialized = false;
    window._prevPostCommentCount = window._prevPostCommentCount || {};
    window._knownPostIds = window._knownPostIds || new Set();
    window._knownCommentIds = window._knownCommentIds || new Set();
    let isInitialFirebasePostsLoad = true;

    function initFirebaseSync() {
      if (!window.firebaseDb || !window.fb || isFirebaseSyncInitialized) return;
      isFirebaseSyncInitialized = true;
      const db = window.firebaseDb;
      const { collection, onSnapshot, doc, setDoc } = window.fb;

      // ১. রিয়েল-টাইমে পোস্ট সিঙ্ক (সব মোবাইল ও ডিভাইসের জন্য)
      try {
        const postsCol = collection(db, 'posts');
        onSnapshot(postsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPosts = [];
            snapshot.forEach(docSnap => {
              const pData = { id: docSnap.id, ...docSnap.data() };
              cloudPosts.push(pData);

              // রিয়েল-টাইমে অন্য ডিভাইস থেকে নতুন পোস্ট আসলে মেনশন নোটিফিকেশন পাঠানো
              if (!isInitialFirebasePostsLoad && !window._knownPostIds.has(pData.id)) {
                window._knownPostIds.add(pData.id);
                if (state.currentUser && pData.authorStudentId !== state.currentUser.studentId && pData.authorId !== state.currentUser.id) {
                  if (typeof dispatchMentionNotifications === 'function') {
                    dispatchMentionNotifications(pData.content, {
                      id: pData.authorId,
                      studentId: pData.authorStudentId,
                      fullName: pData.authorName,
                      profilePicture: pData.authorAvatar
                    }, 'পোস্টে');
                  }
                }
              } else {
                window._knownPostIds.add(pData.id);
              }

              // রিয়েল-টাইমে অন্য ডিভাইস থেকে নতুন কমেন্ট আসলে ডিভাইসে নোটিফিকেশন ও মেনশন নোটিফিকেশন পাঠানো
              const currentComments = Array.isArray(pData.comments) ? pData.comments : [];
              if (window._prevPostCommentCount[pData.id] !== undefined) {
                const prevCount = window._prevPostCommentCount[pData.id];
                if (currentComments.length > prevCount) {
                  const newestComment = currentComments[currentComments.length - 1];
                  
                  // মেনশন চেক (যদি নতুন কমেন্টে @everyone বা কারেন্ট ইউজারকে মেনশন করা থাকে)
                  if (!isInitialFirebasePostsLoad && newestComment && state.currentUser && newestComment.authorStudentId !== state.currentUser.studentId) {
                    if (typeof dispatchMentionNotifications === 'function') {
                      dispatchMentionNotifications(newestComment.content, {
                        id: newestComment.authorId,
                        studentId: newestComment.authorStudentId,
                        fullName: newestComment.authorName,
                        profilePicture: newestComment.authorAvatar
                      }, 'মন্তব্যে');
                    }
                  }

                  // যদি পোস্টের লেখক স্বয়ং লগইন করা ইউজার হন এবং মন্তব্যকারী অন্য কেউ হন
                  if (state.currentUser && (pData.authorStudentId === state.currentUser.studentId || pData.authorId === state.currentUser.id)) {
                    if (newestComment && newestComment.authorStudentId !== state.currentUser.studentId) {
                      sendDeviceNotification(`${newestComment.authorName || "একজন শিক্ষার্থী"} আপনার পোস্টে মন্তব্য করেছেন!`, {
                        body: `"${newestComment.content || ""}"`,
                        icon: newestComment.authorAvatar
                      });
                    }
                  }
                }
              }
              window._prevPostCommentCount[pData.id] = currentComments.length;
            });

            isInitialFirebasePostsLoad = false;

            // লেটেস্ট পোস্ট সবার আগে সাজানো
            cloudPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.posts = cloudPosts;
            savePosts(cloudPosts);
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ক্লাউড সম্পূর্ণ খালি থাকলে প্রাথমিক পোস্ট ক্লাউডে জমা করা
            INITIAL_POSTS.forEach(p => {
              setDoc(doc(db, 'posts', p.id), { ...p, timestamp: Date.now() }).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase posts onSnapshot note:', error);
          state.cloudStatus = 'offline';
          renderApp();
        });
      } catch (err) {
        console.warn('Posts listener exception:', err);
      }

      // ২. রিয়েল-টাইমে ইউজার ও ভেরিফিকেশন ডাটা সিঙ্ক
      try {
        const usersCol = collection(db, 'users');
        onSnapshot(usersCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudUsers = [];
            snapshot.forEach(docSnap => {
              cloudUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            
            // এডমিন প্রোফাইল নিশ্চিত করা; cloud sync যেন custom avatar মুছে না দেয়।
            const localAdmin = (state.users || []).find(isAdminUserRecord);
            const cloudAdmin = cloudUsers.find(isAdminUserRecord);
            if (!cloudAdmin) {
              const adminToSync = normalizeAdminUser(localAdmin || ADMIN_DATA);
              cloudUsers.unshift(adminToSync);
              setDoc(doc(db, 'users', adminToSync.id), adminToSync).catch(console.warn);
            } else {
              const localPicture = localAdmin && typeof localAdmin.profilePicture === 'string'
                ? localAdmin.profilePicture.trim()
                : '';
              const cloudPicture = typeof cloudAdmin.profilePicture === 'string'
                ? cloudAdmin.profilePicture.trim()
                : '';
              const localPictureIsCustom = localPicture && localPicture !== ADMIN_DATA.profilePicture;
              const cloudPictureIsCustom = cloudPicture && cloudPicture !== ADMIN_DATA.profilePicture;
              const localPictureTime = Number(localAdmin && localAdmin.profilePictureUpdatedAt) || 0;
              const cloudPictureTime = Number(cloudAdmin.profilePictureUpdatedAt) || 0;

              // Old/empty cloud records should not roll back a newer local avatar.
              if (localPicture && (!cloudPicture || (localPictureIsCustom && !cloudPictureIsCustom) || (localPictureTime > cloudPictureTime))) {
                cloudAdmin.profilePicture = localPicture;
                if (localPictureTime) cloudAdmin.profilePictureUpdatedAt = localPictureTime;
              }
              cloudUsers[cloudUsers.indexOf(cloudAdmin)] = normalizeAdminUser(cloudAdmin);
            }

            state.users = cloudUsers.map(user => isAdminUserRecord(user) ? normalizeAdminUser(user) : user);
            saveUsers(state.users);

            // কারেন্ট সেশন ইউজারের তথ্য আপডেট
            if (state.currentUser) {
              const fresh = cloudUsers.find(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId);
              if (fresh) {
                state.currentUser = isAdminUserRecord(fresh) ? normalizeAdminUser(fresh) : fresh;
                saveCurrentUser(state.currentUser);
              }
            }
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ইনিশিয়াল ইউজারদের ফায়ারবেসে সিঙ্ক করা
            INITIAL_USERS.forEach(u => {
              setDoc(doc(db, 'users', u.id), u).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase users onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Users listener exception:', err);
      }

      // ৩. রিয়েল-টাইমে ইভেন্ট ও অংশগ্রহণকারীদের ডাটা সিঙ্ক
      try {
        const eventsCol = collection(db, 'events');
        onSnapshot(eventsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudEvents = [];
            snapshot.forEach(docSnap => {
              cloudEvents.push({ id: docSnap.id, ...docSnap.data() });
            });
            cloudEvents.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.events = cloudEvents;
            saveEvents(cloudEvents);
            renderApp();
          } else {
            INITIAL_EVENTS.forEach(ev => {
              setDoc(doc(db, 'events', ev.id), { ...ev, timestamp: ev.timestamp || Date.now() }, { merge: true }).catch(console.warn);
            });
            state.events = INITIAL_EVENTS;
            saveEvents(INITIAL_EVENTS);
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase events onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Events listener exception:', err);
      }

      // ৪. রিয়েল-টাইমে পূর্ববর্তী ইভেন্ট গ্যালারির ছবি সিঙ্ক (Past Events Gallery)
      try {
        const galleryCol = collection(db, 'past_events_gallery');
        onSnapshot(galleryCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPhotos = [];
            snapshot.forEach(docSnap => {
              cloudPhotos.push({ id: docSnap.id, ...docSnap.data() });
            });
            cloudPhotos.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.pastEventPhotos = cloudPhotos;
            savePastEventPhotos(cloudPhotos);
            try { localStorage.setItem('oikko_gallery_seeded', '1'); } catch(e) {}
            renderApp();
          } else {
            let seeded = false;
            try { seeded = localStorage.getItem('oikko_gallery_seeded') === '1'; } catch(e) {}
            if (!seeded) {
              const seedTime = Date.now();
              INITIAL_PAST_EVENT_PHOTOS.forEach(photo => {
                setDoc(doc(db, 'past_events_gallery', photo.id), { ...photo, timestamp: seedTime }, { merge: true }).catch(console.warn);
              });
              state.pastEventPhotos = [...INITIAL_PAST_EVENT_PHOTOS];
              savePastEventPhotos(state.pastEventPhotos);
              try { localStorage.setItem('oikko_gallery_seeded', '1'); } catch(e) {}
            } else {
              state.pastEventPhotos = [];
              savePastEventPhotos([]);
            }
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase past_events_gallery onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Gallery listener exception:', err);
      }
    }
    window.initFirebaseSync = initFirebaseSync;

    // Multi-fallback listener and poller to guarantee Firebase connection startup
    async function startFirebaseSyncIfReady() {
      if (window.firebaseDb && window.fb && typeof window.initFirebaseSync === 'function') {
        window.initFirebaseSync();
      }
      if (window.firebaseRealtimeDb && window.rtdb && typeof window.startMessengerNotificationListener === 'function') {
        window.startMessengerNotificationListener();
      }
    }
    window.addEventListener('firebaseReady', startFirebaseSyncIfReady);
    document.addEventListener('DOMContentLoaded', startFirebaseSyncIfReady);
    startFirebaseSyncIfReady();
    let syncPollerAttempts = 0;
    const syncPoller = setInterval(() => {
      syncPollerAttempts++;
      if (isFirebaseSyncInitialized || syncPollerAttempts > 30) {
        clearInterval(syncPoller);
        return;
      }
      startFirebaseSyncIfReady();
    }, 200);

    // --- 4. Toast Notification ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      const isError = type === 'error';
      const bg = isError ? 'bg-red-600' : isSuccess ? 'bg-[#5A5A40]' : 'bg-slate-800';
      
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // --- 4.1 Mention System & Automatic Notifications ---
    let mentionState = {
      activeInput: null,
      atIndex: -1,
      query: '',
      selectedIndex: 0,
      candidates: []
    };

    function getMentionQuery(input) {
      if (!input) return null;
      const val = input.value || '';
      const selStart = input.selectionStart !== undefined ? input.selectionStart : val.length;
      const textBefore = val.slice(0, selStart);
      const atIndex = textBefore.lastIndexOf('@');
      if (atIndex === -1) return null;

      // Ensure @ is at start or preceded by space / newline
      if (atIndex > 0) {
        const charBefore = textBefore[atIndex - 1];
        if (!/\s/.test(charBefore)) return null;
      }

      const query = textBefore.slice(atIndex + 1);
      if (/[\n\r]/.test(query)) return null;
      if (query.length > 25) return null;

      return { atIndex, query, selStart };
    }

    function getMentionCandidates(query) {
      const cleanQ = (query || '').toLowerCase().trim();
      const list = [];

      // 1. @everyone option
      if (!cleanQ || 'everyone'.includes(cleanQ) || 'সকল'.includes(cleanQ) || 'all'.includes(cleanQ) || 'sobay'.includes(cleanQ)) {
        list.push({
          type: 'everyone',
          id: 'everyone',
          name: 'everyone',
          displayName: '@everyone',
          subtitle: 'সকল ইউজার ও সদস্যকে নোটিফিকেশন পাঠাবে',
          icon: 'megaphone'
        });
      }

      // 2. Filter users from state.users
      const matchingUsers = (state.users || []).filter(u => {
        if (!cleanQ) return true;
        return (
          (u.fullName && u.fullName.toLowerCase().includes(cleanQ)) ||
          (u.studentId && u.studentId.toLowerCase().includes(cleanQ)) ||
          (u.roll && u.roll.toLowerCase().includes(cleanQ)) ||
          (u.studentClass && u.studentClass.toLowerCase().includes(cleanQ))
        );
      }).map(u => ({
        type: 'user',
        id: u.id,
        studentId: u.studentId,
        name: u.fullName,
        displayName: `@${u.fullName}`,
        subtitle: `${u.studentClass || 'শিক্ষার্থী'} • ID: ${u.studentId} ${u.roll ? '• রোল #' + u.roll : ''}`,
        avatar: u.profilePicture,
        isVerified: Boolean(u.isVerified) || u.studentId === 'ADMIN001'
      }));

      list.push(...matchingUsers);
      return list;
    }

    function showMentionDropdown(input, atIndex, query) {
      const portal = document.getElementById('mention-dropdown-portal');
      if (!portal || !input) return;

      const candidates = getMentionCandidates(query);
      mentionState.activeInput = input;
      mentionState.atIndex = atIndex;
      mentionState.query = query;
      mentionState.candidates = candidates;
      if (mentionState.selectedIndex >= candidates.length) {
        mentionState.selectedIndex = 0;
      }

      if (candidates.length === 0) {
        hideMentionDropdown();
        return;
      }

      // Viewport metrics
      let rect = input.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      const windowWidth = window.innerWidth;
      const bottomNavMargin = 70; // space reserved for bottom navigation / footer
      const topHeaderMargin = 60; // space reserved for sticky header

      // If comment box is too close to bottom edge, smoothly scroll it slightly so user has full view
      if (rect.bottom > windowHeight - bottomNavMargin - 60) {
        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        rect = input.getBoundingClientRect();
      }

      const spaceBelow = windowHeight - rect.bottom - bottomNavMargin;
      const spaceAbove = rect.top - topHeaderMargin;

      // Smart placement: if space below is small (< 200px) and space above is roomier, or space below < 120px, place ABOVE input
      const placeAbove = (spaceBelow < 200 && spaceAbove > 140) || (spaceBelow < 120);

      const targetHeight = 240;
      let maxHeight, top;

      if (placeAbove) {
        maxHeight = Math.min(targetHeight, Math.max(120, spaceAbove - 10));
        top = Math.max(topHeaderMargin + 6, rect.top - maxHeight - 6);
      } else {
        maxHeight = Math.min(targetHeight, Math.max(100, spaceBelow - 8));
        top = rect.bottom + 6;
      }

      // Hard clamp: dropdown bottom must never exceed (windowHeight - bottomNavMargin)
      if (top + maxHeight > windowHeight - bottomNavMargin) {
        maxHeight = Math.max(80, windowHeight - bottomNavMargin - top);
      }
      if (top < topHeaderMargin + 4) {
        top = topHeaderMargin + 4;
      }

      // Width & horizontal placement: align with comment box / input
      const dropdownWidth = Math.min(Math.max(rect.width, 280), Math.min(380, windowWidth - 24));
      let left = rect.left;
      if (left + dropdownWidth > windowWidth - 12) {
        left = windowWidth - dropdownWidth - 12;
      }
      if (left < 12) left = 12;

      portal.style.position = 'fixed';
      portal.style.top = `${Math.round(top)}px`;
      portal.style.left = `${Math.round(left)}px`;
      portal.style.width = `${Math.round(dropdownWidth)}px`;
      portal.style.maxHeight = `${Math.round(maxHeight)}px`;
      portal.style.height = 'auto';
      portal.style.zIndex = '99999';

      const innerListMaxHeight = Math.max(60, Math.round(maxHeight) - 44);

      portal.innerHTML = `
        <div class="bg-[#F9F9F4] dark:bg-[#1E1E17] px-3 py-2 border-b border-[#E2E2D5] dark:border-[#36362B] flex items-center justify-between text-xs text-[#8A8A6A] shrink-0 select-none">
          <span class="font-bold flex items-center gap-1.5 text-[#5A5A40] dark:text-[#D6D6BC]">
            <i data-lucide="at-sign" class="w-3.5 h-3.5"></i>
            <span>কাউকে বা @everyone মেনশন করুন</span>
          </span>
          <span class="text-[10px] text-[#8A8A6A]">ক্লিক বা Tab</span>
        </div>
        <div class="overflow-y-auto p-1.5 divide-y divide-[#F0F0E0] dark:divide-[#2C2C22] flex-1" style="max-height: ${innerListMaxHeight}px;">
          ${candidates.map((c, idx) => {
            const isSelected = idx === mentionState.selectedIndex;
            if (c.type === 'everyone') {
              return `
                <div
                  onmousedown="selectMentionCandidate(${idx}, event)"
                  class="p-2 rounded-xl cursor-pointer transition-colors flex items-center gap-2.5 ${isSelected ? 'bg-blue-50 dark:bg-blue-950/50 text-blue-900 dark:text-blue-100 font-bold' : 'hover:bg-[#F5F5F0] dark:hover:bg-[#2A2A20]'}"
                >
                  <div class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-xs">
                    <i data-lucide="megaphone" class="w-3.5 h-3.5"></i>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5 text-xs font-bold text-blue-700 dark:text-blue-400">
                      <span>@everyone</span>
                      <span class="text-[9px] px-1.5 py-0.2 rounded bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 font-bold">সবাই</span>
                    </div>
                    <div class="text-[10px] text-[#8A8A6A] truncate">সকল শিক্ষার্থী ও সদস্যকে নোটিফিকেশন পাঠাবে</div>
                  </div>
                </div>
              `;
            } else {
              return `
                <div
                  onmousedown="selectMentionCandidate(${idx}, event)"
                  class="p-2 rounded-xl cursor-pointer transition-colors flex items-center gap-2.5 ${isSelected ? 'bg-[#F0F0E0] dark:bg-[#2A2A20] text-[#42422F] dark:text-white font-bold' : 'hover:bg-[#F5F5F0] dark:hover:bg-[#2A2A20]'}"
                >
                  <img src="${c.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="w-7 h-7 rounded-full object-cover border border-[#E2E2D5] shrink-0" />
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1 text-xs text-[#42422F] dark:text-[#EDEDE4]">
                      <span class="truncate font-semibold">${c.name}</span>
                      ${c.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                    </div>
                    <div class="text-[10px] text-[#8A8A6A] truncate">${c.subtitle}</div>
                  </div>
                </div>
              `;
            }
          }).join('')}
        </div>
      `;

      portal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function hideMentionDropdown() {
      const portal = document.getElementById('mention-dropdown-portal');
      if (portal) portal.classList.add('hidden');
      mentionState.activeInput = null;
      mentionState.atIndex = -1;
      mentionState.candidates = [];
    }
    window.hideMentionDropdown = hideMentionDropdown;

    function selectMentionCandidate(idx, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const candidate = mentionState.candidates[idx];
      const input = mentionState.activeInput;
      if (!candidate || !input) return;

      const val = input.value || '';
      const atIndex = mentionState.atIndex >= 0 ? mentionState.atIndex : val.lastIndexOf('@');
      const selStart = input.selectionStart !== undefined ? input.selectionStart : val.length;

      const mentionText = candidate.type === 'everyone' ? '@everyone ' : `@${candidate.name} `;
      const before = atIndex >= 0 ? val.slice(0, atIndex) : val;
      const after = val.slice(selStart);

      input.value = before + mentionText + after;
      const newPos = before.length + mentionText.length;
      input.focus();
      input.setSelectionRange(newPos, newPos);

      hideMentionDropdown();
      showToast(`${candidate.displayName} মেনশন যুক্ত হয়েছে!`, 'info');
    }
    window.selectMentionCandidate = selectMentionCandidate;

    function triggerMentionPopup(inputId) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.focus();
      const val = input.value || '';
      const selStart = input.selectionStart !== undefined ? input.selectionStart : val.length;

      const textBefore = val.slice(0, selStart);
      const endsWithAt = textBefore.endsWith('@');
      if (!endsWithAt) {
        const needsSpace = textBefore.length > 0 && !textBefore.endsWith(' ');
        const insertion = (needsSpace ? ' ' : '') + '@';
        input.value = textBefore + insertion + val.slice(selStart);
        const newPos = textBefore.length + insertion.length;
        input.setSelectionRange(newPos, newPos);
      }
      const atIdx = input.value.slice(0, input.selectionStart).lastIndexOf('@');
      showMentionDropdown(input, atIdx, '');
    }
    window.triggerMentionPopup = triggerMentionPopup;

    function handleMentionKeyDown(e, input) {
      const portal = document.getElementById('mention-dropdown-portal');
      if (!portal || portal.classList.contains('hidden') || mentionState.candidates.length === 0) {
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        mentionState.selectedIndex = (mentionState.selectedIndex + 1) % mentionState.candidates.length;
        showMentionDropdown(input, mentionState.atIndex, mentionState.query);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        mentionState.selectedIndex = (mentionState.selectedIndex - 1 + mentionState.candidates.length) % mentionState.candidates.length;
        showMentionDropdown(input, mentionState.atIndex, mentionState.query);
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        selectMentionCandidate(mentionState.selectedIndex);
      } else if (e.key === 'Escape') {
        hideMentionDropdown();
      }
    }
    window.handleMentionKeyDown = handleMentionKeyDown;

    function handleMentionInputEvent(input) {
      const m = getMentionQuery(input);
      if (m) {
        showMentionDropdown(input, m.atIndex, m.query);
      } else {
        hideMentionDropdown();
      }
    }
    window.handleMentionInputEvent = handleMentionInputEvent;

    // Formatting raw text to highlight @everyone and @student mentions
    function formatFormattedTextWithMentions(text) {
      if (!text) return '';

      let escaped = String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // 1. @everyone or @all or @সকল
      escaped = escaped.replace(/(^|\s)@(everyone|all|সকল)(\b|[^\w\u0980-\u09FF]|$)/gi, (match, prefix, tag, suffix) => {
        return `${prefix}<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 font-bold text-xs border border-blue-200 dark:border-blue-700 shadow-2xs cursor-default"><svg class="w-3 h-3 text-blue-600 dark:text-blue-400 inline shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg><span>@everyone</span></span>${suffix}`;
      });

      // 2. Specific users in state.users
      const sortedUsers = [...(state.users || [])].sort((a, b) => (b.fullName || '').length - (a.fullName || '').length);
      for (const usr of sortedUsers) {
        if (!usr || !usr.fullName) continue;
        const escapedName = usr.fullName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(^|\\s)@(${escapedName})([\\s,।!?;:]|$)`, 'gi');
        escaped = escaped.replace(regex, (match, prefix, name, suffix) => {
          return `${prefix}<span onclick="openProfileModal('${usr.id}')" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-[#F0F0E0] hover:bg-[#EAEAE0] dark:bg-[#323228] dark:hover:bg-[#3E3E32] text-[#5A5A40] dark:text-[#D6D6BC] font-bold text-xs cursor-pointer border border-[#E2E2D5] dark:border-[#444436] transition-colors" title="${usr.fullName}-এর সম্পূর্ণ প্রোফাইল দেখুন"><span>@${usr.fullName}</span></span>${suffix}`;
        });

        if (usr.studentId) {
          const regexId = new RegExp(`(^|\\s)@(${usr.studentId})([\\s,।!?;:]|$)`, 'gi');
          escaped = escaped.replace(regexId, (match, prefix, sId, suffix) => {
            return `${prefix}<span onclick="openProfileModal('${usr.id}')" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-[#F0F0E0] hover:bg-[#EAEAE0] dark:bg-[#323228] dark:hover:bg-[#3E3E32] text-[#5A5A40] dark:text-[#D6D6BC] font-bold text-xs cursor-pointer border border-[#E2E2D5] dark:border-[#444436] transition-colors" title="${usr.fullName} (${usr.studentId})-এর সম্পূর্ণ প্রোফাইল দেখুন"><span>@${usr.fullName}</span></span>${suffix}`;
          });
        }
      }

      return escaped;
    }
    window.formatFormattedTextWithMentions = formatFormattedTextWithMentions;

    // Extract mentions from text
    function extractMentionsFromContent(text) {
      if (!text) return { isEveryone: false, mentionedUsers: [] };
      const lower = text.toLowerCase();
      const isEveryone = /@(everyone|all|সকল)\b/i.test(text);
      const mentionedUsers = [];

      for (const usr of (state.users || [])) {
        if (!usr) continue;
        const nameMatch = usr.fullName && lower.includes(`@${usr.fullName.toLowerCase()}`);
        const idMatch = usr.studentId && lower.includes(`@${usr.studentId.toLowerCase()}`);
        if (nameMatch || idMatch) {
          if (!mentionedUsers.some(m => m.id === usr.id)) {
            mentionedUsers.push(usr);
          }
        }
      }
      return { isEveryone, mentionedUsers };
    }

    // Automatic notification dispatcher for mentions
    function dispatchMentionNotifications(content, author, contextName = 'পোস্টে') {
      if (!content) return;
      const { isEveryone, mentionedUsers } = extractMentionsFromContent(content);
      const authorId = author.id || author.studentId;
      const authorName = author.fullName || author.authorName || 'একজন শিক্ষার্থী';
      const authorAvatar = author.profilePicture || author.authorAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200';

      const truncated = content.length > 70 ? content.substring(0, 70) + '...' : content;

      // 1. If @everyone is mentioned
      if (isEveryone) {
        if (state.currentUser && state.currentUser.id !== authorId && state.currentUser.studentId !== authorId) {
          sendDeviceNotification(`📢 ${authorName} @everyone মেনশন করেছেন!`, {
            body: `"${truncated}"`,
            icon: authorAvatar
          });
        } else {
          showToast(`📢 @everyone সকল সদস্যের কাছে নোটিফিকেশন পাঠানো হয়েছে।`, 'success');
        }
      }

      // 2. If specific users are mentioned
      if (mentionedUsers.length > 0) {
        const isCurrentUserMentioned = state.currentUser && 
          mentionedUsers.some(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId) &&
          state.currentUser.id !== authorId && state.currentUser.studentId !== authorId;

        if (isCurrentUserMentioned) {
          sendDeviceNotification(`🔔 ${authorName} আপনাকে ${contextName} মেনশন করেছেন!`, {
            body: `"${truncated}"`,
            icon: authorAvatar
          });
        }

        if (state.currentUser && (state.currentUser.id === authorId || state.currentUser.studentId === authorId)) {
          const names = mentionedUsers.map(u => u.fullName).join(', ');
          showToast(`🔔 ${names}-কে মেনশন নোটিফিকেশন পাঠানো হয়েছে!`, 'info');
        }
      }
    }
    window.dispatchMentionNotifications = dispatchMentionNotifications;

    // Dismiss mention dropdown on click outside
    document.addEventListener('click', (e) => {
      const portal = document.getElementById('mention-dropdown-portal');
      if (!portal || portal.classList.contains('hidden')) return;
      if (!portal.contains(e.target) && e.target !== mentionState.activeInput && !e.target.closest('[onclick*="triggerMentionPopup"]')) {
        hideMentionDropdown();
      }
    });

    // Dynamic repositioning on scroll and resize so mention dropdown stays cleanly anchored
    function updateActiveMentionDropdownPosition() {
      if (mentionState.activeInput && mentionState.candidates && mentionState.candidates.length > 0) {
        const portal = document.getElementById('mention-dropdown-portal');
        if (portal && !portal.classList.contains('hidden')) {
          showMentionDropdown(mentionState.activeInput, mentionState.atIndex, mentionState.query);
        }
      }
    }
    window.addEventListener('scroll', updateActiveMentionDropdownPosition, { passive: true });
    window.addEventListener('resize', updateActiveMentionDropdownPosition, { passive: true });

    // --- 5. Verified Badge Helper ---
    function getVerifiedBadgeHTML(size = 'sm') {
      const dim = size === 'md' ? 'w-4 h-4' : 'w-3.5 h-3.5';
      return `<span class="badge-verified ${dim} inline-flex items-center justify-center shadow-xs" title="ভেরিফাইড শিক্ষার্থী">
        <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>`;
    }

    // --- 6. Render Functions ---

    function renderApp() {
      const active = document.activeElement;
      const typingSearch = active && (active.id === 'global-search' || active.id === 'global-search-mobile');
      if (typingSearch) {
        pendingAppRender = true;
        return;
      }

      const app = document.getElementById('app');
      if (!state.currentUser) {
        app.innerHTML = renderAuthScreen();
      } else if (state.activeView === 'messenger') {
        app.innerHTML = renderMessengerScreen();
      } else {
        if (state.activeView === 'youtube') state.activeView = 'feed';
        let viewHtml = '';
        if (state.activeView === 'admin') {
          viewHtml = renderAdminView();
        } else if (state.activeView === 'events') {
          viewHtml = renderEventsView();
        } else if (state.activeView === 'album') {
          viewHtml = renderAlbumView();
        } else if (state.activeView === 'admin_posts') {
          viewHtml = renderAdminPostsView();
        } else {
          viewHtml = renderFeedView();
        }
        app.innerHTML = renderTopHeader() + viewHtml + renderBottomNavbar();
      }
      if (window.lucide) {
        lucide.createIcons();
      }
      pendingAppRender = false;
    }

    let pendingAppRender = false;
    function flushPendingRender() {
      if (pendingAppRender) renderApp();
    }
    window.flushPendingRender = flushPendingRender;

    let messengerUnsubscribe = null;
    let messengerListenerChatId = '';

    function renderMessengerPeerList(peers, targetId, searchValue) {
      const search = String(searchValue || '').trim().toLowerCase();
      const visiblePeers = peers.filter(u => {
        if (!search) return true;
        return [u.fullName, u.studentId, u.mobileNumber, u.studentClass, u.roll]
          .filter(Boolean).some(v => String(v).toLowerCase().includes(search));
      });

      const avatar = (u, size='w-10 h-10') =>

      if (!visiblePeers.length) return `<div class="px-5 py-12 text-center messenger-secondary-text"><div class="w-12 h-12 mx-auto rounded-2xl messenger-empty-icon flex items-center justify-center mb-3"><i data-lucide="search-x" class="w-5 h-5"></i></div><p class="text-sm font-bold">কোনো user পাওয়া যায়নি</p><p class="text-xs mt-1">অন্য নাম বা Student ID দিয়ে চেষ্টা করুন।</p></div>`;

        return `<button type="button" onclick="selectChatUser('${user.id}')" class="messenger-touch messenger-chat-item w-full text-left rounded-2xl px-2.5 py-2.5 flex items-center gap-3 transition-all ${active ? 'messenger-active' : ''}"><div class="relative shrink-0">${avatar(user,'messenger-list-avatar w-14 h-14')}<span class="absolute right-0 bottom-0 w-3.5 h-3.5 rounded-full bg-[#2F6F57] border-2 border-white dark:border-[#12231C]"></span></div><div class="min-w-0 flex-1 py-0.5"><div class="flex items-center gap-1"><span class="messenger-name font-bold text-[15px] truncate">${escapeHtml(user.fullName)}</span>${user.isVerified ? '<span class="text-[10px] text-[#2F6F57] shrink-0">●</span>' : ''}</div><div class="flex items-center gap-2"><p class="text-[12px] messenger-secondary-text truncate mt-0.5 flex-1">${escapeHtml(preview)}</p>${(state.messengerUnreadCounts[user.id] || 0) > 0 ? `<span class="messenger-unread-badge min-w-5 h-5 px-1.5 rounded-full bg-[#F27D61] text-white text-[10px] font-extrabold flex items-center justify-center shadow-sm">${Math.min(state.messengerUnreadCounts[user.id],99)}</span>` : ''}</div></div></button>`;

    function getMessengerPeers() {
      const me = state.currentUser;
      if (!me) return [];
      return state.users.filter(u => u && u.id !== me.id);
    }

    function makeChatId(a, b) {
      return [String(a), String(b)].sort().join('__');
    }

    function canMessageUser(userId) {
      const me = state.currentUser;
      return Boolean(
        me &&
        userId &&
        userId !== me.id &&
        state.users.some(u => u && u.id === userId)
      );
    }

    function stopMessengerListener() {
      if (typeof messengerUnsubscribe === 'function') {
        try { messengerUnsubscribe(); } catch (e) {}
      }
      messengerUnsubscribe = null;
      messengerListenerChatId = '';
    }

    function normalizeCloudMessage(data) {
      const createdAt =
        typeof data.createdAt === 'number'
          ? data.createdAt
          : (data.createdAt && typeof data.createdAt.toMillis === 'function'
              ? data.createdAt.toMillis()
              : Date.now());

      return {
        id: data.id || ('cloud_' + createdAt + '_' + Math.random().toString(36).slice(2)),
        text: typeof data.text === 'string' ? data.text : '',
        imageUrl: typeof data.imageUrl === 'string' ? data.imageUrl : '',
        videoUrl: typeof data.videoUrl === 'string' ? data.videoUrl : '',
        mediaType: typeof data.mediaType === 'string' ? data.mediaType : (data.videoUrl ? 'video' : (data.imageUrl ? 'image' : 'text')),
        fileName: typeof data.fileName === 'string' ? data.fileName : '',
        fileSize: Number(data.fileSize || 0),
        sender: data.senderId === state.currentUser?.id ? 'me' : 'them',
        senderId: data.senderId || '',
        receiverId: data.receiverId || '',
        senderName: data.senderName || '',
        time: data.time || new Date(createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        createdAt
      };
    }

    async function subscribeToMessengerChat(targetUserId) {
      if (!state.currentUser || !canMessageUser(targetUserId)) return;

      // Authenticate before attaching the Firestore realtime listener.
      const firebaseUser = await ensureFirebaseCampusAuth(state.currentUser);
      if (!firebaseUser) return;

      const chatId = makeChatId(state.currentUser.id, targetUserId);
      if (messengerListenerChatId === chatId && messengerUnsubscribe) return;

      stopMessengerListener();

      const db = window.firebaseDb;
      const fb = window.fb;

      if (!db || !fb) {
        // Local fallback keeps the UI usable if Firestore is temporarily unavailable.
        if (!state.messages[targetUserId]) state.messages[targetUserId] = [];
        return;
      }

      const messagesRef = fb.collection(db, 'oikko_chats', chatId, 'messages');

      messengerListenerChatId = chatId;
      messengerUnsubscribe = fb.onSnapshot(
        messagesRef,
        snapshot => {
          const cloudMessages = snapshot.docs
            .map(d => normalizeCloudMessage({id: d.id, ...d.data()}))
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          const localMessages = Array.isArray(state.messages[targetUserId]) ? state.messages[targetUserId] : [];
          const cloudIds = new Set(cloudMessages.map(m => m.id));
          const pendingLocal = localMessages.filter(m => {
            if (!m) return false;
            if (m.firebaseId && cloudIds.has(m.firebaseId)) return false;
            if (m.id && cloudIds.has(m.id)) return false;
            return true;
          });
          state.messages[targetUserId] = [...cloudMessages, ...pendingLocal].sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
          saveMessages(state.messages);
          window.firestoreStatus = 'connected';
          if (state.activeView === 'messenger' && state.activeChatUserId === targetUserId) {
            renderMessengerOnly();
            scrollChatToBottom();
          }
        },
        err => {
          console.error('Messenger realtime sync error:', err);
          // Keep any local messages instead of replacing them on a transient error.
          window.firestoreStatus = 'error';
          showToast(`Firestore sync error: ${err?.code || 'unknown'}`, 'error');
        }
      );
    }

    function renderMessengerOnly() {
      const app = document.getElementById('app');
      if (!app || !state.currentUser || state.activeView !== 'messenger') return;
      const active = document.activeElement;
      const activeId = active && active.id ? active.id : '';
      const selectionStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
      const selectionEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
      app.innerHTML = renderMessengerScreen();
      if (window.lucide) lucide.createIcons();
      if (activeId) requestAnimationFrame(() => {
        const restored = document.getElementById(activeId);
        if (!restored) return;
        restored.focus({preventScroll:true});
        if (selectionStart !== null && typeof restored.setSelectionRange === 'function') {
          const len = restored.value.length;
          restored.setSelectionRange(Math.min(selectionStart,len), Math.min(selectionEnd ?? selectionStart,len));
        }
      });
    }

    function makeFirebaseLoginEmail(campusUser) {
      const raw = String(campusUser?.studentId || campusUser?.id || '').trim().toLowerCase();
      const safe = raw.replace(/[^a-z0-9._-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      return `${safe || 'user'}@oikko-campus.local`;

    async function ensureFirebaseCampusAuth(campusUser, campusPassword) {
      // No Firebase Authentication, OTP, password provider, email verification or reCAPTCHA.
      // Kept as a harmless compatibility function for existing Messenger code.
      return { uid: String(campusUser?.id || campusUser?.studentId || 'oikko-user') };
    }
    window.ensureFirebaseCampusAuth = ensureFirebaseCampusAuth;

    async function persistMessengerMessage(targetUserId, payload) {
      if (!state.currentUser || !canMessageUser(targetUserId)) {
        showToast('শুধু Oikko Campus-এর নিবন্ধিত ব্যবহারকারীদের সাথেই চ্যাট করা যাবে', 'error');
        return false;
      }

      const now = Date.now();
      const timeStr = new Date(now).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const localId = 'local_' + now + '_' + Math.random().toString(36).slice(2,8);
      const messageData = {
        senderId: String(state.currentUser.id),
        receiverId: String(targetUserId),
        senderName: String(state.currentUser.fullName || ''),
        text: String(payload.text || ''),
        imageUrl: String(payload.imageUrl || ''),
        videoUrl: String(payload.videoUrl || ''),
        mediaType: payload.mediaType || (payload.videoUrl ? 'video' : (payload.imageUrl ? 'image' : 'text')),
        fileName: String(payload.fileName || ''),
        fileSize: Number(payload.fileSize || 0),
        time: timeStr,
        createdAt: now
      };

      // Show the message immediately in the UI.
      const localMessage = {
        id: localId,
        ...messageData,
        sender: 'me'
      };
      if (!state.messages[targetUserId]) state.messages[targetUserId] = [];
      state.messages[targetUserId].push(localMessage);
      saveMessages(state.messages);

      // The important part: write the SAME message to Cloud Firestore.
      const db = window.firebaseDb;
      const fb = window.fb;
      if (!db || !fb) {
        showToast('Firestore এখনো প্রস্তুত হয়নি। একটু পরে আবার পাঠান।', 'error');
        return true;
      }

      try {
        const chatId = makeChatId(state.currentUser.id, targetUserId);
        const messagesCollection = fb.collection(db, 'oikko_chats', chatId, 'messages');
        const cloudRef = await fb.addDoc(messagesCollection, messageData);

        localMessage.firebaseId = cloudRef.id;
        localMessage.id = cloudRef.id;
        window.firestoreStatus = 'connected';
        saveMessages(state.messages);

        try {
          await createMessengerNotification(targetUserId, {
            ...payload,
            senderId: state.currentUser.id,
            receiverId: targetUserId,
            senderName: state.currentUser.fullName || ''
          });
        } catch (notifyErr) {
          console.warn('Notification sync skipped:', notifyErr);
        }

        return true;
      } catch (err) {
        window.firestoreStatus = 'error';
        console.error('FIRESTORE MESSAGE WRITE FAILED:', err);
        console.error('code:', err?.code, 'message:', err?.message);
        showToast(`Firestore-এ পাঠানো যায়নি: ${err?.code || 'unknown'}`, 'error');
        return true;
      }
    }

        return;

      const input = document.getElementById('chat-input-field');
      const text = input ? input.value.trim() : '';
      if (!text) return;

      if (input) input.value = '';

      const sent = await persistMessengerMessage(targetUserId, {text});
      if (sent) {
        renderApp();
        scrollChatToBottom();
      }
    }

    const MAX_MESSENGER_MEDIA_BYTES = 5 * 1024 * 1024 * 1024;

    function openMessengerMediaPicker(targetUserId) {
      if (!canMessageUser(targetUserId)) {
        showToast('শুধু Oikko Campus-এর users-কে মেসেজ করা যাবে', 'error');
