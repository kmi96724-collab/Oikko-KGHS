  <style>
    :root {
      --bg-canvas: #f3f6f2;
      --text-primary: #1e2c24;
      --text-muted: #6d7a72;
      --border-color: #dce6df;
      --border-subtle: #eef3ee;
      --primary-olive: #2f6f57;
      --primary-dark: #245544;
      --brand-ink: #12231c;
      --brand-mint: #d8f3e4;
      --brand-coral: #ef7358;
      --brand-yellow: #f4c45a;
      --glass: rgba(255,255,255,.72);
    }
    html.dark {
      --bg-canvas: #101612;
      --text-primary: #edf3ee;
      --text-muted: #9aa89f;
      --border-color: #2b3831;
      --border-subtle: #222c27;
      --primary-olive: #6dba97;
      --primary-dark: #4e9474;
      --glass: rgba(18,28,23,.78);
    }
    body {
      background:
        radial-gradient(circle at 8% -8%, rgba(216, 243, 228, .9), transparent 28rem),
        radial-gradient(circle at 100% 0%, rgba(244, 196, 90, .16), transparent 24rem),
        radial-gradient(circle at 70% 100%, rgba(239, 115, 88, .08), transparent 22rem),
        var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Hind Siliguri', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      letter-spacing: .01em;
    }
    html, body {
      margin: 0;
      min-width: 100%;
    }
    /* Dark mode component overrides for Tailwind classes */
    html.dark body {
      background-color: #101612;
      color: #edf3ee;
    }
    html.dark body {
      background:
        radial-gradient(circle at 8% -8%, rgba(47, 111, 87, .28), transparent 28rem),
        radial-gradient(circle at 100% 0%, rgba(117, 91, 42, .16), transparent 24rem),
        #101612;
    }
    ::selection {
      background: #bddfc9;
      color: #1f2a24;
    }
    button, a, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid rgba(47, 111, 87, .24);
      outline-offset: 2px;
    }
    .app-topbar {
      background: rgba(16, 32, 26, .9);
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 40px rgba(18, 35, 28, .2);
      backdrop-filter: blur(22px);
    }
    .app-header-inner {
      min-height: 4.5rem;
    }
    .app-brand-mark {
      background: linear-gradient(135deg, #e7fbef, #8ed9b0);
      color: #12231c;
      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }
    .app-brand-name {
      font-family: Outfit, 'Hind Siliguri', sans-serif;
      letter-spacing: -.04em;
    }
    .app-search {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      color: white;
      min-width: 0;
      flex: 1 1 16rem;
      transition: .2s ease;
    }
    .app-search:focus-within {
      background: rgba(255,255,255,.2);
      border-color: rgba(216,243,228,.85);
      box-shadow: 0 0 0 4px rgba(216,243,228,.14);
    }
    .app-search input {
      min-width: 0;
      width: 100%;
      background: transparent !important;
      border: 0 !important;
      color: #fff !important;
      font-size: .875rem;
      line-height: 1.45;
    }
    .app-search input::placeholder {
      color: rgba(255,255,255,.58);
    }
    html.dark .app-search input {
      background-color: transparent !important;
      color: #fff !important;
      border-color: transparent !important;
    }

    /* ঐক্য ব্যানারের ব্রাশ-স্ট্রোক/পেইন্ট-সুইপ ডিজাইন */
    .app-hero::before {
      content: "";
      position: absolute;
      inset: -18% -5% -28% -8%;
      z-index: 0;
      pointer-events: none;
      opacity: .82;
      transform: rotate(-3deg);
      background:
        linear-gradient(167deg, transparent 0 10%, rgba(255,255,255,.06) 11% 15%, transparent 16% 25%, rgba(255,255,255,.055) 26% 31%, transparent 32%),
        linear-gradient(171deg, transparent 0 23%, rgba(223,244,232,.09) 24% 32%, transparent 33% 41%, rgba(223,244,232,.055) 42% 49%, transparent 50%),
        linear-gradient(160deg, transparent 0 48%, rgba(5,39,30,.32) 49% 58%, transparent 59% 69%, rgba(223,244,232,.07) 70% 76%, transparent 77%);
      filter: blur(.15px);
    }
    .app-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 92% 18%, rgba(223,244,232,.16), transparent 16rem),
        radial-gradient(circle at 72% 105%, rgba(3,31,24,.28), transparent 22rem),
        linear-gradient(90deg, rgba(6,34,27,.18), transparent 45%, rgba(255,255,255,.04));
    }
    .app-hero-pattern {
      position: absolute;
      z-index: 1;
      right: 7%;
      top: 13%;
      display: flex;
      align-items: center;
      gap: 1.6rem;
      color: rgba(223,244,232,.25);
      pointer-events: none;
      transform: rotate(-2deg);
    }
    .app-hero-pattern i { width: 2.1rem; height: 2.1rem; stroke-width: 1.45; }
    .app-hero-pattern i:nth-child(2) { transform: translateY(10px); }
    .app-hero-pattern i:nth-child(3) { transform: translateY(4px); }
    .app-hero-pattern i:nth-child(4) { transform: translateY(25px); }
    .app-hero-orb {
      width: 18rem;
      height: 18rem;
      right: -5rem;
      top: -7rem;
      z-index: 1;
      border: 1px solid rgba(223,244,232,.16);
      background: rgba(223,244,232,.035);
      box-shadow: 0 0 0 2rem rgba(223,244,232,.025), 0 0 0 4rem rgba(223,244,232,.018);
    }
    /* Use the supplied banner artwork as-is; do not stack the old generated decorations. */
    .app-hero::before,
    .app-hero::after,
    .app-hero-pattern,
    .app-hero-orb {
      display: none !important;
    }
    .app-hero > .relative.z-10 {
      position: relative;
      z-index: 2;
    }

    .app-stat {
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 10px 24px rgba(66,66,47,.06);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .app-stat:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(66,66,47,.11);
    }
    html.dark .app-stat {
      background: rgba(38,38,29,.82);
      border-color: #3b3b30;
    }
    .app-card {
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 10px 28px rgba(66,66,47,.055);
      transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
    }
    .app-card:hover {
      border-color: rgba(90,90,64,.28);
      box-shadow: 0 16px 34px rgba(66,66,47,.09);
    }
    html.dark .app-card {
      border-color: #3b3b30;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .app-section-label {
      color: #7c806a;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .app-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      border-radius: .85rem;
      padding: .62rem .9rem;
      font-size: .75rem;
      font-weight: 800;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .app-action:hover {
      transform: translateY(-1px);
    }
    .app-action-primary {
      background: var(--brand-coral);
      color: white;
      box-shadow: 0 8px 18px rgba(242,125,97,.24);
    }
    .app-action-primary:hover { background: #df674f; }
    .app-action-soft {
      background: var(--brand-mint);
      color: var(--brand-ink);
    }
    html.dark .app-action-soft {
      background: #304838;
      color: #dff4e8;
    }
    .app-nav {
      background: rgba(16,32,26,.96);
      border-top: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 -14px 36px rgba(16,32,26,.22);
      backdrop-filter: blur(22px);
    }
    .app-nav-item {
      min-height: 3.35rem;
      border-radius: 1.05rem;
    }
    .app-nav-item.active {
      background: var(--brand-mint);
      color: var(--brand-ink);
      box-shadow: 0 7px 18px rgba(0,0,0,.14);
    }
    .search-results-panel {
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 16px 34px rgba(66,66,47,.09);
    }
    .auth-shell {
      background:
        radial-gradient(circle at 8% 12%, rgba(223,244,232,.9), transparent 23rem),
        radial-gradient(circle at 96% 88%, rgba(245,202,104,.18), transparent 22rem),
        var(--bg-canvas);
    }
    .auth-panel {
      border: 1px solid rgba(226,226,213,.9);
      box-shadow: 0 25px 70px rgba(31,42,36,.13);
    }
    @media (max-width: 640px) {
      .auth-panel { grid-template-columns: minmax(145px, .82fr) minmax(210px, 1.18fr); }
      .auth-aside { min-height: 455px; padding: 1rem; }
      .auth-aside h2 { font-size: 1.45rem; }
      .auth-aside p { font-size: .72rem; }
      .auth-feature { padding: .55rem; gap: .5rem; }
      .auth-feature span:last-child { font-size: .64rem; line-height: 1.25; }
    }
    .auth-aside {
      background:
        linear-gradient(145deg, rgba(31,42,36,.98), rgba(53,82,66,.96)),
        radial-gradient(circle at 100% 0%, rgba(242,125,97,.48), transparent 20rem);
    }
    .auth-feature {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
    }
    html.dark .auth-panel {
      border-color: #3b3b30;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }
    html.dark .search-results-panel {
      border-color: #3b3b30;
    }
    #app main .bg-white {
      border-radius: 1.25rem;
    }
    html.dark #app main .bg-white {
      background-color: #21211a !important;
    }
    @media (max-width: 640px) {
      .app-hero-pattern { right: 3%; top: 8%; gap: .7rem; opacity: .7; }
      .app-hero-pattern i { width: 1.45rem; height: 1.45rem; }
      .app-hero-pattern i:nth-child(4) { display:none; }
      .app-header-inner { min-height: 3.9rem; }
      .app-brand-name { font-size: 1rem; }
      .app-hero { border-radius: 1.35rem; }
      .app-stat { padding: .8rem; }
      .auth-aside {
        min-height: 390px;
        border-radius: 0;
      }
      .auth-aside h2 {
        font-size: 1.9rem;
        line-height: 1.12;
      }
      .auth-feature {
        padding: .72rem;
      }
    }
    html.dark .bg-white {
      background-color: #21211A !important;
      color: #EDEDE4 !important;
    }

    /* Mobile: hide the desktop-only Campus Hero and use the form full-width. */
    @media (max-width: 767px) {
      .auth-panel {
        grid-template-columns: minmax(0, 1fr) !important;
      }
      .auth-aside {
        display: none !important;
      }
    }

    /* Desktop: keep the Campus Hero beside the authentication panel. */
    @media (min-width: 768px) {
      .auth-panel {
        grid-template-columns: .82fr 1.18fr !important;
      }
      .auth-aside {
        display: flex !important;
      }

    }

    function compactForLocalStorage(value, depth = 0) {
      if (depth > 6) return null;
      if (Array.isArray(value)) return value.map(v => compactForLocalStorage(v, depth + 1));
      if (!value || typeof value !== 'object') return value;
      const copy = {};
      for (const [k, v] of Object.entries(value)) {
        if ((k === 'imageUrl' || k === 'videoUrl' || k === 'dataUrl' || k === 'base64' || k === 'fileData') && typeof v === 'string') {
          // Data URLs/base64 media do not belong in localStorage. Firebase/remote URLs are kept.
          if (v.startsWith('data:') || v.length > 20000) {
            copy[k] = '';
            continue;
          }
        }
        copy[k] = compactForLocalStorage(v, depth + 1);
      }
      return copy;
    }

    function safeSaveStorage(key, data) {
      const serialized = JSON.stringify(data);
      try {
        localStorage.setItem(key, serialized);
        return true;
      } catch (err) {
        console.warn('LocalStorage quota reached for ' + key + '; saving a lightweight cache instead.', err);
        try {
          const compact = compactForLocalStorage(data);
          localStorage.setItem(key, JSON.stringify(compact));
          return true;
        } catch (e2) {
          // Last resort: remove only this cache. Firebase remains the source of truth.
          try { localStorage.removeItem(key); } catch (_) {}
          return false;
        }
      }
    }

    // --- Device Media File Helpers (Photo & Video) ---
    // Fix: Prevent mobile / browser canvas green tint issue by directly loading data URLs for standard files
    // and using solid background with colorSpace srgb for resized images.
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.85) {
      return new Promise((resolve) => {
        if (!file) return resolve('');

        // 1. Files under 2.5MB: read directly as DataURL to preserve 100% true native colors without any canvas green distortion
        if (file.size <= 2.5 * 1024 * 1024) {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
          return;
        }

        // 2. Large files: resize safely with solid white background to eliminate color-space channel mismatch
        try {
          const objectUrl = URL.createObjectURL(file);
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
            if (!ctx) {
              const r = new FileReader();
              r.onload = (ev) => resolve(ev.target.result);
              r.readAsDataURL(file);
              return;
            }
            // Fill solid white background so transparent or mobile camera buffer never turns green
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            
            const mime = (file.type && file.type.startsWith('image/')) ? file.type : 'image/jpeg';
            try {
              const out = canvas.toDataURL(mime, quality);
              resolve(out);
            } catch (err) {
              const r = new FileReader();
              r.onload = (ev) => resolve(ev.target.result);
              r.readAsDataURL(file);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            const r = new FileReader();
            r.onload = (ev) => resolve(ev.target.result);
            r.readAsDataURL(file);
          };
          img.src = objectUrl;
        } catch (e) {
          const r = new FileReader();
          r.onload = (ev) => resolve(ev.target.result);
          r.readAsDataURL(file);
        }
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn('AudioContext sound note:', e);
      }
    }

    // --- ডিভাইস নোটিফিকেশন পারমিশন ও পুশ সেন্ডার ---
    function requestNotificationPermission() {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              showToast('ডিভাইস নোটিফিকেশন সফলভাবে চালু করা হয়েছে!', 'success');
              playNotificationSound();
            }
          });
        } else if (Notification.permission === 'granted') {
          showToast('ডিভাইস নোটিফিকেশন সক্রিয় আছে', 'info');
        } else {
          showToast('ব্রাউজারের সেটিংস থেকে নোটিফিকেশন অনুমোদন করুন', 'info');
        }
      }
    }
    window.requestNotificationPermission = requestNotificationPermission;

    function sendDeviceNotification(title, options = {}) {
      // ১. মোবাইল ভাইব্রেশন
      if ('vibrate' in navigator) {
        try { navigator.vibrate([180, 80, 180]); } catch (e) {}
      }

      // ২. অডিও বেল সাউন্ড
      playNotificationSound();

      // ৩. ডিভাইসের আসল সিস্টেম নোটিফিকেশন (মোবাইল / ডেক্সটপ পপআপ)
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            const notif = new Notification(title, {
              body: options.body || '',
              icon: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              badge: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              silent: false,
              ...options
            });
            notif.onclick = function() {
              window.focus();
              this.close();
            };
          } catch (e) {
            console.warn('Native notification trigger error:', e);
          }
        } else if (Notification.permission === 'default') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') {
              try {
                new Notification(title, options);
              } catch (e) {}
            }
          });
        }
      }

      // ৪. ইন-অ্যাপ লাইভ টোস্ট অ্যালার্ট
      showToast(`🔔 ${title}: ${options.body || ''}`, 'info');
    }
    window.sendDeviceNotification = sendDeviceNotification;

    // --- Oikko Messenger: Realtime Database notification sync ---
    let messengerNotificationUnsubscribe = null;
    let messengerNotificationUserId = '';
    const handledMessengerNotificationIds = new Set();

    function stopMessengerNotificationListener() {
      if (typeof messengerNotificationUnsubscribe === 'function') {
        try { messengerNotificationUnsubscribe(); } catch (e) {}
      }
      messengerNotificationUnsubscribe = null;
      messengerNotificationUserId = '';
    }

    async function startMessengerNotificationListener() {
      const rtdb = window.firebaseRealtimeDb;
      const r = window.rtdb;
      const me = state.currentUser;
      if (!rtdb || !r || !me?.id) return;
      const firebaseUser = await ensureFirebaseCampusAuth(me);
      if (!firebaseUser) return;
      if (messengerNotificationUserId === me.id && messengerNotificationUnsubscribe) return;
      stopMessengerNotificationListener();
      messengerNotificationUserId = me.id;
      try {
        const notificationsRef = r.ref(rtdb, `oikko_notifications/${me.id}`);
        messengerNotificationUnsubscribe = r.onChildAdded(notificationsRef, snap => {
          const data = snap.val() || {};
          const notificationId = snap.key;
          if (!notificationId || handledMessengerNotificationIds.has(notificationId)) return;
          handledMessengerNotificationIds.add(notificationId);
          const createdAt = Number(data.createdAt || 0);
          // Ignore old notifications when the listener first connects.
          if (!createdAt || (Date.now() - createdAt) > 30000) return;
          if (data.senderId === me.id) return;
          const senderId = data.senderId || '';
          state.messengerUnreadCounts[senderId] = (state.messengerUnreadCounts[senderId] || 0) + 1;
          const isCurrentChat = state.activeView === 'messenger' && state.activeChatUserId === senderId;
          if (!isCurrentChat) {
            sendDeviceNotification(`💬 ${data.senderName || 'নতুন মেসেজ'}`, {
              body: data.text || (data.imageUrl ? '📷 একটি ছবি পাঠিয়েছেন' : 'আপনাকে একটি নতুন মেসেজ পাঠিয়েছেন'),
              icon: data.senderAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200',
              tag: `oikko-chat-${senderId}`
            });
          }
          if (state.activeView === 'messenger') renderMessengerOnly();
        });
      } catch (err) {
        console.warn('Messenger RTDB notification listener error:', err);
      }
    }
    window.startMessengerNotificationListener = startMessengerNotificationListener;
    window.stopMessengerNotificationListener = stopMessengerNotificationListener;

    async function createMessengerNotification(targetUserId, payload) {
      const rtdb = window.firebaseRealtimeDb;
      const r = window.rtdb;
      const me = state.currentUser;
      if (!rtdb || !r || !me || !targetUserId) return false;
      try {
        const notificationRef = r.push(r.ref(rtdb, `oikko_notifications/${targetUserId}`));
        await r.set(notificationRef, {
          type: 'message',
          senderId: me.id,
          senderName: me.fullName || 'Oikko user',
          senderAvatar: me.profilePicture || '',
          receiverId: targetUserId,
          text: payload.text || '',
          imageUrl: payload.imageUrl || '',
          videoUrl: payload.videoUrl || '',
          mediaType: payload.mediaType || '',
          fileName: payload.fileName || '',
          fileSize: Number(payload.fileSize || 0),
          createdAt: Date.now(),
          serverCreatedAt: r.serverTimestamp()
        });
        return true;
      } catch (err) {
        console.warn('Messenger RTDB notification write failed:', err);
        return false;
      }
    }
    window.createMessengerNotification = createMessengerNotification;

    // --- 3.1 Firebase Firestore Realtime Synchronizer ---
    let isFirebaseSyncInitialized = false;
    window._prevPostCommentCount = window._prevPostCommentCount || {};
    window._knownPostIds = window._knownPostIds || new Set();
    window._knownCommentIds = window._knownCommentIds || new Set();
    let isInitialFirebasePostsLoad = true;

    function initFirebaseSync() {
      if (!window.firebaseDb || !window.fb || isFirebaseSyncInitialized) return;
      isFirebaseSyncInitialized = true;
      const db = window.firebaseDb;
      const { collection, onSnapshot, doc, setDoc } = window.fb;

      // ১. রিয়েল-টাইমে পোস্ট সিঙ্ক (সব মোবাইল ও ডিভাইসের জন্য)
      try {
        const postsCol = collection(db, 'posts');
        onSnapshot(postsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPosts = [];
            snapshot.forEach(docSnap => {
              const pData = { id: docSnap.id, ...docSnap.data() };
              cloudPosts.push(pData);

              // রিয়েল-টাইমে অন্য ডিভাইস থেকে নতুন পোস্ট আসলে মেনশন নোটিফিকেশন পাঠানো
              if (!isInitialFirebasePostsLoad && !window._knownPostIds.has(pData.id)) {
                window._knownPostIds.add(pData.id);
                if (state.currentUser && pData.authorStudentId !== state.currentUser.studentId && pData.authorId !== state.currentUser.id) {
                  if (typeof dispatchMentionNotifications === 'function') {
                    dispatchMentionNotifications(pData.content, {
                      id: pData.authorId,
                      studentId: pData.authorStudentId,
                      fullName: pData.authorName,
                      profilePicture: pData.authorAvatar
                    }, 'পোস্টে');
                  }
                }
              } else {
                window._knownPostIds.add(pData.id);
              }

              // রিয়েল-টাইমে অন্য ডিভাইস থেকে নতুন কমেন্ট আসলে ডিভাইসে নোটিফিকেশন ও মেনশন নোটিফিকেশন পাঠানো
              const currentComments = Array.isArray(pData.comments) ? pData.comments : [];
              if (window._prevPostCommentCount[pData.id] !== undefined) {
                const prevCount = window._prevPostCommentCount[pData.id];
                if (currentComments.length > prevCount) {
                  const newestComment = currentComments[currentComments.length - 1];
                  
                  // মেনশন চেক (যদি নতুন কমেন্টে @everyone বা কারেন্ট ইউজারকে মেনশন করা থাকে)
                  if (!isInitialFirebasePostsLoad && newestComment && state.currentUser && newestComment.authorStudentId !== state.currentUser.studentId) {
                    if (typeof dispatchMentionNotifications === 'function') {
                      dispatchMentionNotifications(newestComment.content, {
                        id: newestComment.authorId,
                        studentId: newestComment.authorStudentId,
                        fullName: newestComment.authorName,
                        profilePicture: newestComment.authorAvatar
                      }, 'মন্তব্যে');
                    }
                  }

                  // যদি পোস্টের লেখক স্বয়ং লগইন করা ইউজার হন এবং মন্তব্যকারী অন্য কেউ হন
                  if (state.currentUser && (pData.authorStudentId === state.currentUser.studentId || pData.authorId === state.currentUser.id)) {
                    if (newestComment && newestComment.authorStudentId !== state.currentUser.studentId) {
                      sendDeviceNotification(`${newestComment.authorName || "একজন শিক্ষার্থী"} আপনার পোস্টে মন্তব্য করেছেন!`, {
                        body: `"${newestComment.content || ""}"`,
                        icon: newestComment.authorAvatar
                      });
                    }
                  }
                }
              }
              window._prevPostCommentCount[pData.id] = currentComments.length;
            });

            isInitialFirebasePostsLoad = false;

            // লেটেস্ট পোস্ট সবার আগে সাজানো
            cloudPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.posts = cloudPosts;
            savePosts(cloudPosts);
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ক্লাউড সম্পূর্ণ খালি থাকলে প্রাথমিক পোস্ট ক্লাউডে জমা করা
            INITIAL_POSTS.forEach(p => {
              setDoc(doc(db, 'posts', p.id), { ...p, timestamp: Date.now() }).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase posts onSnapshot note:', error);
          state.cloudStatus = 'offline';
          renderApp();
        });
      } catch (err) {
        console.warn('Posts listener exception:', err);
      }

      // ২. রিয়েল-টাইমে ইউজার ও ভেরিফিকেশন ডাটা সিঙ্ক
      try {
        const usersCol = collection(db, 'users');
        onSnapshot(usersCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudUsers = [];
            snapshot.forEach(docSnap => {
              cloudUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            
            // এডমিন প্রোফাইল নিশ্চিত করা; cloud sync যেন custom avatar মুছে না দেয়।
            const localAdmin = (state.users || []).find(isAdminUserRecord);
            const cloudAdmin = cloudUsers.find(isAdminUserRecord);
            if (!cloudAdmin) {
              const adminToSync = normalizeAdminUser(localAdmin || ADMIN_DATA);
              cloudUsers.unshift(adminToSync);
              setDoc(doc(db, 'users', adminToSync.id), adminToSync).catch(console.warn);
            } else {
              const localPicture = localAdmin && typeof localAdmin.profilePicture === 'string'
                ? localAdmin.profilePicture.trim()
                : '';
              const cloudPicture = typeof cloudAdmin.profilePicture === 'string'
                ? cloudAdmin.profilePicture.trim()
                : '';
              const localPictureIsCustom = localPicture && localPicture !== ADMIN_DATA.profilePicture;
              const cloudPictureIsCustom = cloudPicture && cloudPicture !== ADMIN_DATA.profilePicture;
              const localPictureTime = Number(localAdmin && localAdmin.profilePictureUpdatedAt) || 0;
              const cloudPictureTime = Number(cloudAdmin.profilePictureUpdatedAt) || 0;

              // Old/empty cloud records should not roll back a newer local avatar.
              if (localPicture && (!cloudPicture || (localPictureIsCustom && !cloudPictureIsCustom) || (localPictureTime > cloudPictureTime))) {
                cloudAdmin.profilePicture = localPicture;
                if (localPictureTime) cloudAdmin.profilePictureUpdatedAt = localPictureTime;
              }
              cloudUsers[cloudUsers.indexOf(cloudAdmin)] = normalizeAdminUser(cloudAdmin);
            }

            state.users = cloudUsers.map(user => isAdminUserRecord(user) ? normalizeAdminUser(user) : user);
            saveUsers(state.users);

            // কারেন্ট সেশন ইউজারের তথ্য আপডেট
            if (state.currentUser) {
              const fresh = cloudUsers.find(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId);
              if (fresh) {
                state.currentUser = isAdminUserRecord(fresh) ? normalizeAdminUser(fresh) : fresh;
                saveCurrentUser(state.currentUser);
              }
            }
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ইনিশিয়াল ইউজারদের ফায়ারবেসে সিঙ্ক করা
            INITIAL_USERS.forEach(u => {
              setDoc(doc(db, 'users', u.id), u).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase users onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Users listener exception:', err);
      }

      // ৩. রিয়েল-টাইমে ইভেন্ট ও অংশগ্রহণকারীদের ডাটা সিঙ্ক
      try {
        const eventsCol = collection(db, 'events');
        onSnapshot(eventsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudEvents = [];
            snapshot.forEach(docSnap => {
              cloudEvents.push({ id: docSnap.id, ...docSnap.data() });
            });
            cloudEvents.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.events = cloudEvents;
            saveEvents(cloudEvents);
            renderApp();
          } else {
            INITIAL_EVENTS.forEach(ev => {
              setDoc(doc(db, 'events', ev.id), { ...ev, timestamp: ev.timestamp || Date.now() }, { merge: true }).catch(console.warn);
            });
            state.events = INITIAL_EVENTS;
            saveEvents(INITIAL_EVENTS);
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase events onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Events listener exception:', err);
      }

      // ৪. রিয়েল-টাইমে পূর্ববর্তী ইভেন্ট গ্যালারির ছবি সিঙ্ক (Past Events Gallery)
      try {
        const galleryCol = collection(db, 'past_events_gallery');
        onSnapshot(galleryCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPhotos = [];
            snapshot.forEach(docSnap => {
              cloudPhotos.push({ id: docSnap.id, ...docSnap.data() });
            });
            cloudPhotos.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.pastEventPhotos = cloudPhotos;
            savePastEventPhotos(cloudPhotos);
            renderApp();
          } else {
            INITIAL_PAST_EVENT_PHOTOS.forEach(photo => {
              setDoc(doc(db, 'past_events_gallery', photo.id), { ...photo, timestamp: Date.now() }).catch(console.warn);
            });
            state.pastEventPhotos = INITIAL_PAST_EVENT_PHOTOS;
            savePastEventPhotos(INITIAL_PAST_EVENT_PHOTOS);
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase past_events_gallery onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Gallery listener exception:', err);
      }
    }
    window.initFirebaseSync = initFirebaseSync;

    // Firebase bootstrap + realtime startup.  Firestore listeners/writes start
    // only after the Firebase Auth session is ready, so Rules using request.auth
    // do not reject the very first connection attempt.
    let firebaseBootstrapStarted = false;
    async function bootstrapFirestoreDatabase() {
      if (firebaseBootstrapStarted || !window.firebaseDb || !window.fb) return;
      firebaseBootstrapStarted = true;
      const db = window.firebaseDb;
      const fb = window.fb;
      try {
        await (window.firebaseAuthReady || Promise.resolve());

        // This document is a real connectivity/write test and also makes the
        // oikko_system collection visible in Firestore Console.
        const markerRef = fb.doc(db, 'oikko_system', 'firestore_connection');
        await fb.setDoc(markerRef, {
          app: 'Oikko Campus',
          projectId: 'oikko-kghs',
          firestore: true,
          authUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '',
          lastBootstrapAt: Date.now(),
          version: 'firestore-bootstrap-v2'
        }, { merge: true });

        window.firestoreStatus = 'connected';
        window.dispatchEvent(new CustomEvent('firestoreConnected'));

        // Seed only the collections that already have legitimate built-in app
        // data.  We do not create fake documents for empty user-created
        // collections such as chats/friends/TUBE. Those appear automatically
        // when the corresponding feature is first used.
        const seedCollection = async (name, rows) => {
          if (!Array.isArray(rows) || !rows.length) return;
          const snap = await fb.getDocs(fb.collection(db, name));
          if (!snap.empty) return;
          await Promise.all(rows.map(row => {
            const id = String(row.id || row.studentId || '').trim();
            if (!id) return Promise.resolve();
            return fb.setDoc(fb.doc(db, name, id), {
              ...row,
              ownerUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '',
              firestoreSeededAt: Date.now()
            }, { merge: true });
          }));
        };

        await seedCollection('users', INITIAL_USERS);
        await seedCollection('posts', INITIAL_POSTS);
        await seedCollection('events', INITIAL_EVENTS);
        await seedCollection('past_events_gallery', INITIAL_PAST_EVENT_PHOTOS);
      } catch (err) {
        window.firestoreStatus = 'error';
        console.error('Oikko Firestore bootstrap failed:', err?.code, err?.message || err);
        if (typeof window.showToast === 'function') {
          window.showToast('Firestore সংযোগ ব্যর্থ: ' + (err?.code || 'unknown-error'), 'error');
        }
      }
    }
    window.bootstrapFirestoreDatabase = bootstrapFirestoreDatabase;

    async function startFirebaseSyncIfReady() {
      try {
        if (window.firebaseDb && window.fb) {
          await (window.firebaseAuthReady || Promise.resolve());
          await bootstrapFirestoreDatabase();
          if (typeof window.initFirebaseSync === 'function') {
            window.initFirebaseSync();
          }
        }
        if (window.firebaseRealtimeDb && window.rtdb && typeof window.startMessengerNotificationListener === 'function') {
          window.startMessengerNotificationListener();
        }
      } catch (err) {
        console.warn('Firebase startup skipped:', err);
      }
    }
    window.startFirebaseSyncIfReady = startFirebaseSyncIfReady;
    window.addEventListener('firebaseReady', startFirebaseSyncIfReady);
    document.addEventListener('DOMContentLoaded', startFirebaseSyncIfReady);
    startFirebaseSyncIfReady();
    let syncPollerAttempts = 0;
    const syncPoller = setInterval(() => {
      syncPollerAttempts++;
      if (isFirebaseSyncInitialized || syncPollerAttempts > 30) {
        clearInterval(syncPoller);
        return;
      }
      startFirebaseSyncIfReady();
    }, 200);

    // --- 4. Toast Notification ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      const isError = type === 'error';
      const bg = isError ? 'bg-red-600' : isSuccess ? 'bg-[#5A5A40]' : 'bg-slate-800';
      
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // --- 4.1 Mention System & Automatic Notifications ---
    let mentionState = {
      activeInput: null,
      atIndex: -1,
      query: '',
      selectedIndex: 0,
      candidates: []
    };

    function getMentionQuery(input) {
      if (!input) return null;
      const val = input.value || '';
      const selStart = input.selectionStart !== undefined ? input.selectionStart : val.length;
      const textBefore = val.slice(0, selStart);
      const atIndex = textBefore.lastIndexOf('@');
      if (atIndex === -1) return null;

      // Ensure @ is at start or preceded by space / newline
      if (atIndex > 0) {
        const charBefore = textBefore[atIndex - 1];
        if (!/\s/.test(charBefore)) return null;
      }

      const query = textBefore.slice(atIndex + 1);
      if (/[\n\r]/.test(query)) return null;
      if (query.length > 25) return null;

      return { atIndex, query, selStart };
    }

    function getMentionCandidates(query) {
      const cleanQ = (query || '').toLowerCase().trim();
      const list = [];

      // 1. @everyone option
      if (!cleanQ || 'everyone'.includes(cleanQ) || 'সকল'.includes(cleanQ) || 'all'.includes(cleanQ) || 'sobay'.includes(cleanQ)) {
        list.push({
          type: 'everyone',
          id: 'everyone',
          name: 'everyone',
          displayName: '@everyone',
          subtitle: 'সকল ইউজার ও সদস্যকে নোটিফিকেশন পাঠাবে',
          icon: 'megaphone'
        });
      }

      // 2. Filter users from state.users
      const matchingUsers = (state.users || []).filter(u => {
        if (!cleanQ) return true;
        return (
          (u.fullName && u.fullName.toLowerCase().includes(cleanQ)) ||
          (u.studentId && u.studentId.toLowerCase().includes(cleanQ)) ||
          (u.roll && u.roll.toLowerCase().includes(cleanQ)) ||
          (u.studentClass && u.studentClass.toLowerCase().includes(cleanQ))
        );
      }).map(u => ({
        type: 'user',
        id: u.id,
        studentId: u.studentId,
        name: u.fullName,
        displayName: `@${u.fullName}`,
        subtitle: `${u.studentClass || 'শিক্ষার্থী'} • ID: ${u.studentId} ${u.roll ? '• রোল #' + u.roll : ''}`,
        avatar: u.profilePicture,
        isVerified: Boolean(u.isVerified) || u.studentId === 'ADMIN001'
      }));

      list.push(...matchingUsers);
      return list;
    }

    function showMentionDropdown(input, atIndex, query) {
      const portal = document.getElementById('mention-dropdown-portal');
      if (!portal || !input) return;

      const candidates = getMentionCandidates(query);
      mentionState.activeInput = input;
      mentionState.atIndex = atIndex;
      mentionState.query = query;
      mentionState.candidates = candidates;
      if (mentionState.selectedIndex >= candidates.length) {
        mentionState.selectedIndex = 0;
      }

      if (candidates.length === 0) {
        hideMentionDropdown();
        return;
      }

      // Viewport metrics
      let rect = input.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      const windowWidth = window.innerWidth;
      const bottomNavMargin = 70; // space reserved for bottom navigation / footer
      const topHeaderMargin = 60; // space reserved for sticky header

      // If comment box is too close to bottom edge, smoothly scroll it slightly so user has full view
      if (rect.bottom > windowHeight - bottomNavMargin - 60) {
        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        rect = input.getBoundingClientRect();
      }

      const spaceBelow = windowHeight - rect.bottom - bottomNavMargin;
      const spaceAbove = rect.top - topHeaderMargin;

      // Smart placement: if space below is small (< 200px) and space above is roomier, or space below < 120px, place ABOVE input
      const placeAbove = (spaceBelow < 200 && spaceAbove > 140) || (spaceBelow < 120);

      const targetHeight = 240;
      let maxHeight, top;

      if (placeAbove) {
        maxHeight = Math.min(targetHeight, Math.max(120, spaceAbove - 10));
        top = Math.max(topHeaderMargin + 6, rect.top - maxHeight - 6);
      } else {
        maxHeight = Math.min(targetHeight, Math.max(100, spaceBelow - 8));
        top = rect.bottom + 6;
      }

      // Hard clamp: dropdown bottom must never exceed (windowHeight - bottomNavMargin)
      if (top + maxHeight > windowHeight - bottomNavMargin) {
        maxHeight = Math.max(80, windowHeight - bottomNavMargin - top);
      }
      if (top < topHeaderMargin + 4) {
        top = topHeaderMargin + 4;
      }

      // Width & horizontal placement: align with comment box / input
      const dropdownWidth = Math.min(Math.max(rect.width, 280), Math.min(380, windowWidth - 24));
      let left = rect.left;
      if (left + dropdownWidth > windowWidth - 12) {
        left = windowWidth - dropdownWidth - 12;
      }
      if (left < 12) left = 12;

      portal.style.position = 'fixed';
      portal.style.top = `${Math.round(top)}px`;
      portal.style.left = `${Math.round(left)}px`;
      portal.style.width = `${Math.round(dropdownWidth)}px`;
      portal.style.maxHeight = `${Math.round(maxHeight)}px`;
      portal.style.height = 'auto';
      portal.style.zIndex = '99999';

      const innerListMaxHeight = Math.max(60, Math.round(maxHeight) - 44);

      portal.innerHTML = `
        <div class="bg-[#F9F9F4] dark:bg-[#1E1E17] px-3 py-2 border-b border-[#E2E2D5] dark:border-[#36362B] flex items-center justify-between text-xs text-[#8A8A6A] shrink-0 select-none">
          <span class="font-bold flex items-center gap-1.5 text-[#5A5A40] dark:text-[#D6D6BC]">
            <i data-lucide="at-sign" class="w-3.5 h-3.5"></i>
            <span>কাউকে বা @everyone মেনশন করুন</span>
          </span>
          <span class="text-[10px] text-[#8A8A6A]">ক্লিক বা Tab</span>
        </div>
        <div class="overflow-y-auto p-1.5 divide-y divide-[#F0F0E0] dark:divide-[#2C2C22] flex-1" style="max-height: ${innerListMaxHeight}px;">
          ${candidates.map((c, idx) => {
            const isSelected = idx === mentionState.selectedIndex;
            if (c.type === 'everyone') {
              return `
                <div
                  onmousedown="selectMentionCandidate(${idx}, event)"
                  class="p-2 rounded-xl cursor-pointer transition-colors flex items-center gap-2.5 ${isSelected ? 'bg-blue-50 dark:bg-blue-950/50 text-blue-900 dark:text-blue-100 font-bold' : 'hover:bg-[#F5F5F0] dark:hover:bg-[#2A2A20]'}"
                >
                  <div class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-xs">
                    <i data-lucide="megaphone" class="w-3.5 h-3.5"></i>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5 text-xs font-bold text-blue-700 dark:text-blue-400">
                      <span>@everyone</span>
                      <span class="text-[9px] px-1.5 py-0.2 rounded bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 font-bold">সবাই</span>
                    </div>
                    <div class="text-[10px] text-[#8A8A6A] truncate">সকল শিক্ষার্থী ও সদস্যকে নোটিফিকেশন পাঠাবে</div>
                  </div>
                </div>
              `;
            } else {
              return `
                <div
                  onmousedown="selectMentionCandidate(${idx}, event)"
                  class="p-2 rounded-xl cursor-pointer transition-colors flex items-center gap-2.5 ${isSelected ? 'bg-[#F0F0E0] dark:bg-[#2A2A20] text-[#42422F] dark:text-white font-bold' : 'hover:bg-[#F5F5F0] dark:hover:bg-[#2A2A20]'}"
                >
                  <img src="${c.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="w-7 h-7 rounded-full object-cover border border-[#E2E2D5] shrink-0" />
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1 text-xs text-[#42422F] dark:text-[#EDEDE4]">
                      <span class="truncate font-semibold">${c.name}</span>
                      ${c.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                    </div>
                    <div class="text-[10px] text-[#8A8A6A] truncate">${c.subtitle}</div>
                  </div>
                </div>
              `;
            }
          }).join('')}
        </div>
      `;

      portal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function hideMentionDropdown() {
      const portal = document.getElementById('mention-dropdown-portal');
      if (portal) portal.classList.add('hidden');
      mentionState.activeInput = null;
      mentionState.atIndex = -1;
      mentionState.candidates = [];
    }
    window.hideMentionDropdown = hideMentionDropdown;

    function selectMentionCandidate(idx, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const candidate = mentionState.candidates[idx];
      const input = mentionState.activeInput;
      if (!candidate || !input) return;

      const val = input.value || '';
      const atIndex = mentionState.atIndex >= 0 ? mentionState.atIndex : val.lastIndexOf('@');
      const selStart = input.selectionStart !== undefined ? input.selectionStart : val.length;

      const mentionText = candidate.type === 'everyone' ? '@everyone ' : `@${candidate.name} `;
      const before = atIndex >= 0 ? val.slice(0, atIndex) : val;
      const after = val.slice(selStart);

      input.value = before + mentionText + after;
      const newPos = before.length + mentionText.length;
      input.focus();
      input.setSelectionRange(newPos, newPos);

      hideMentionDropdown();
      showToast(`${candidate.displayName} মেনশন যুক্ত হয়েছে!`, 'info');
    }
    window.selectMentionCandidate = selectMentionCandidate;

    function triggerMentionPopup(inputId) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.focus();
      const val = input.value || '';
      const selStart = input.selectionStart !== undefined ? input.selectionStart : val.length;

      const textBefore = val.slice(0, selStart);
      const endsWithAt = textBefore.endsWith('@');
      if (!endsWithAt) {
        const needsSpace = textBefore.length > 0 && !textBefore.endsWith(' ');
        const insertion = (needsSpace ? ' ' : '') + '@';
        input.value = textBefore + insertion + val.slice(selStart);
        const newPos = textBefore.length + insertion.length;
        input.setSelectionRange(newPos, newPos);
      }
      const atIdx = input.value.slice(0, input.selectionStart).lastIndexOf('@');
      showMentionDropdown(input, atIdx, '');
    }
    window.triggerMentionPopup = triggerMentionPopup;

    function handleMentionKeyDown(e, input) {
      const portal = document.getElementById('mention-dropdown-portal');
      if (!portal || portal.classList.contains('hidden') || mentionState.candidates.length === 0) {
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        mentionState.selectedIndex = (mentionState.selectedIndex + 1) % mentionState.candidates.length;
        showMentionDropdown(input, mentionState.atIndex, mentionState.query);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        mentionState.selectedIndex = (mentionState.selectedIndex - 1 + mentionState.candidates.length) % mentionState.candidates.length;
        showMentionDropdown(input, mentionState.atIndex, mentionState.query);
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        selectMentionCandidate(mentionState.selectedIndex);
      } else if (e.key === 'Escape') {
        hideMentionDropdown();
      }
    }
    window.handleMentionKeyDown = handleMentionKeyDown;

    function handleMentionInputEvent(input) {
      const m = getMentionQuery(input);
      if (m) {
        showMentionDropdown(input, m.atIndex, m.query);
      } else {
        hideMentionDropdown();
      }
    }
    window.handleMentionInputEvent = handleMentionInputEvent;

    // Formatting raw text to highlight @everyone and @student mentions
    function formatFormattedTextWithMentions(text) {
      if (!text) return '';

      let escaped = String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // 1. @everyone or @all or @সকল
      escaped = escaped.replace(/(^|\s)@(everyone|all|সকল)(\b|[^\w\u0980-\u09FF]|$)/gi, (match, prefix, tag, suffix) => {
        return `${prefix}<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 font-bold text-xs border border-blue-200 dark:border-blue-700 shadow-2xs cursor-default"><svg class="w-3 h-3 text-blue-600 dark:text-blue-400 inline shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg><span>@everyone</span></span>${suffix}`;
      });

      // 2. Specific users in state.users
      const sortedUsers = [...(state.users || [])].sort((a, b) => (b.fullName || '').length - (a.fullName || '').length);
      for (const usr of sortedUsers) {
        if (!usr || !usr.fullName) continue;
        const escapedName = usr.fullName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(^|\\s)@(${escapedName})([\\s,।!?;:]|$)`, 'gi');
        escaped = escaped.replace(regex, (match, prefix, name, suffix) => {
          return `${prefix}<span onclick="openProfileModal('${usr.id}')" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-[#F0F0E0] hover:bg-[#EAEAE0] dark:bg-[#323228] dark:hover:bg-[#3E3E32] text-[#5A5A40] dark:text-[#D6D6BC] font-bold text-xs cursor-pointer border border-[#E2E2D5] dark:border-[#444436] transition-colors" title="${usr.fullName}-এর সম্পূর্ণ প্রোফাইল দেখুন"><span>@${usr.fullName}</span></span>${suffix}`;
        });

        if (usr.studentId) {
          const regexId = new RegExp(`(^|\\s)@(${usr.studentId})([\\s,।!?;:]|$)`, 'gi');
          escaped = escaped.replace(regexId, (match, prefix, sId, suffix) => {
            return `${prefix}<span onclick="openProfileModal('${usr.id}')" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-[#F0F0E0] hover:bg-[#EAEAE0] dark:bg-[#323228] dark:hover:bg-[#3E3E32] text-[#5A5A40] dark:text-[#D6D6BC] font-bold text-xs cursor-pointer border border-[#E2E2D5] dark:border-[#444436] transition-colors" title="${usr.fullName} (${usr.studentId})-এর সম্পূর্ণ প্রোফাইল দেখুন"><span>@${usr.fullName}</span></span>${suffix}`;
          });
        }
      }

      return escaped;
    }
    window.formatFormattedTextWithMentions = formatFormattedTextWithMentions;

    // Extract mentions from text
    function extractMentionsFromContent(text) {
      if (!text) return { isEveryone: false, mentionedUsers: [] };
      const lower = text.toLowerCase();
      const isEveryone = /@(everyone|all|সকল)\b/i.test(text);
      const mentionedUsers = [];

      for (const usr of (state.users || [])) {
        if (!usr) continue;
        const nameMatch = usr.fullName && lower.includes(`@${usr.fullName.toLowerCase()}`);
        const idMatch = usr.studentId && lower.includes(`@${usr.studentId.toLowerCase()}`);
        if (nameMatch || idMatch) {
          if (!mentionedUsers.some(m => m.id === usr.id)) {
            mentionedUsers.push(usr);
          }
        }
      }
      return { isEveryone, mentionedUsers };
    }

    // Automatic notification dispatcher for mentions
    function dispatchMentionNotifications(content, author, contextName = 'পোস্টে') {
      if (!content) return;
      const { isEveryone, mentionedUsers } = extractMentionsFromContent(content);
      const authorId = author.id || author.studentId;
      const authorName = author.fullName || author.authorName || 'একজন শিক্ষার্থী';
      const authorAvatar = author.profilePicture || author.authorAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200';

      const truncated = content.length > 70 ? content.substring(0, 70) + '...' : content;

      // 1. If @everyone is mentioned
      if (isEveryone) {
        if (state.currentUser && state.currentUser.id !== authorId && state.currentUser.studentId !== authorId) {
          sendDeviceNotification(`📢 ${authorName} @everyone মেনশন করেছেন!`, {
            body: `"${truncated}"`,
            icon: authorAvatar
          });
        } else {
          showToast(`📢 @everyone সকল সদস্যের কাছে নোটিফিকেশন পাঠানো হয়েছে।`, 'success');
        }
      }

      // 2. If specific users are mentioned
      if (mentionedUsers.length > 0) {
        const isCurrentUserMentioned = state.currentUser && 
          mentionedUsers.some(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId) &&
          state.currentUser.id !== authorId && state.currentUser.studentId !== authorId;

        if (isCurrentUserMentioned) {
          sendDeviceNotification(`🔔 ${authorName} আপনাকে ${contextName} মেনশন করেছেন!`, {
            body: `"${truncated}"`,
            icon: authorAvatar
          });
        }

        if (state.currentUser && (state.currentUser.id === authorId || state.currentUser.studentId === authorId)) {
          const names = mentionedUsers.map(u => u.fullName).join(', ');
          showToast(`🔔 ${names}-কে মেনশন নোটিফিকেশন পাঠানো হয়েছে!`, 'info');
        }
      }
    }
    window.dispatchMentionNotifications = dispatchMentionNotifications;

    // Dismiss mention dropdown on click outside
    document.addEventListener('click', (e) => {
      const portal = document.getElementById('mention-dropdown-portal');
      if (!portal || portal.classList.contains('hidden')) return;
      if (!portal.contains(e.target) && e.target !== mentionState.activeInput && !e.target.closest('[onclick*="triggerMentionPopup"]')) {
        hideMentionDropdown();
      }
    });

    // Dynamic repositioning on scroll and resize so mention dropdown stays cleanly anchored
    function updateActiveMentionDropdownPosition() {
      if (mentionState.activeInput && mentionState.candidates && mentionState.candidates.length > 0) {
        const portal = document.getElementById('mention-dropdown-portal');
        if (portal && !portal.classList.contains('hidden')) {
          showMentionDropdown(mentionState.activeInput, mentionState.atIndex, mentionState.query);
        }
      }
    }
    window.addEventListener('scroll', updateActiveMentionDropdownPosition, { passive: true });
    window.addEventListener('resize', updateActiveMentionDropdownPosition, { passive: true });

    // --- 5. Verified Badge Helper ---
    function getVerifiedBadgeHTML(size = 'sm') {
      const dim = size === 'md' ? 'w-4 h-4' : 'w-3.5 h-3.5';
      return `<span class="badge-verified ${dim} inline-flex items-center justify-center shadow-xs" title="ভেরিফাইড শিক্ষার্থী">
        <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>`;
    }

    // --- 6. Render Functions ---

    // --- OIKKO TUBE: Firebase video-only feed ---
    const OIKKO_TUBE_MAX_URL_LENGTH = 4096;
    let oikkoTubeUnsubscribe = null;
    let oikkoTubeLoaded = false;
    let oikkoTubeLastError = '';

    function formatTubeBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes < 0) return '0 B';
      const units = ['B','KB','MB','GB','TB'];
      let n = bytes, i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n >= 10 || i === 0 ? n.toFixed(0) : n.toFixed(1)} ${units[i]}`;
    }

    function getTubeErrorMessage(err) {
      const code = String(err?.code || 'unknown');
      const map = {
        'permission-denied': 'Firestore Rules এই ভিডিও পোস্টের অনুমতি দিচ্ছে না।',
        'unavailable': 'Firestore সাময়িকভাবে unavailable। Internet connection পরীক্ষা করে আবার চেষ্টা করুন।',
        'failed-precondition': 'Firestore configuration/index-এর একটি সমস্যা হয়েছে।',
        'network-request-failed': 'Network connection পাওয়া যাচ্ছে না।',
        'invalid-argument': 'ভিডিও URL বা পোস্টের তথ্য সঠিক নয়.'
      };
      return `${map[code] || 'ভিডিও পোস্ট করা যায়নি।'} [${code}]${err?.message ? ` ${err.message}` : ''}`;
    }

    function setTubeUploadStatus(text, type='info') {
      const el = document.getElementById('oikko-tube-upload-status');
      if (!el) return;
      el.textContent = text;
      el.className = `mt-2 text-[11px] leading-relaxed ${type === 'error' ? 'text-red-600' : type === 'success' ? 'text-emerald-700' : 'text-[#687060]'}`;
    }

    function getOikkoTubeMediaHtml(videoUrl) {
      const raw = String(videoUrl || '').trim();
      if (!raw) return '';

      let u;
      try { u = new URL(raw); }
      catch (_) {
        return `<div class="aspect-video flex items-center justify-center bg-[#071B15] text-[#A8B9B1] text-sm p-6 text-center">ভিডিও URL সঠিক নয়</div>`;
      }

      if (!/^https?:$/.test(u.protocol)) {
        return `<div class="aspect-video flex items-center justify-center bg-[#071B15] text-[#A8B9B1] text-sm p-6 text-center">শুধু http/https URL ব্যবহার করা যাবে</div>`;
      }

      const host = u.hostname.replace(/^www\./, '').toLowerCase();
      const path = decodeURIComponent(u.pathname || '');
      const parts = path.split('/').filter(Boolean);
      const esc = (value) => escapeHtml(String(value || ''));

      const iframe = (src, label = 'Oikko Tube video') => `<div class="aspect-video bg-black relative overflow-hidden">
        <iframe class="w-full h-full border-0"
          src="${esc(src)}"
          title="${esc(label)}"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-popups"></iframe>
      </div>`;

      // 1) YouTube: watch, shorts, embed, youtu.be and live URLs.
      let youtubeId = '';
      if (host === 'youtu.be') youtubeId = parts[0] || '';
      else if (host === 'youtube.com' || host === 'm.youtube.com') {
        if (u.pathname === '/watch') youtubeId = u.searchParams.get('v') || '';
        else if (parts[0] === 'shorts' || parts[0] === 'embed' || parts[0] === 'live') youtubeId = parts[1] || '';
      }
      if (youtubeId && /^[A-Za-z0-9_-]{6,20}$/.test(youtubeId)) {
        const qs = new URLSearchParams();
        ['start','end','si'].forEach(k => { if (u.searchParams.get(k)) qs.set(k, u.searchParams.get(k)); });
        return iframe(`https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}${qs.toString() ? `?${qs}` : ''}`, 'YouTube video');
      }

      // 2) Vimeo.
      let vimeoId = '';
      if (host === 'vimeo.com' || host === 'player.vimeo.com') {
        const match = path.match(/(?:video\/)?(\d{6,15})/);
        vimeoId = match?.[1] || '';
      }
      if (vimeoId) return iframe(`https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}`, 'Vimeo video');

      // 3) Dailymotion / dai.ly.
      let dmId = '';
      if (host === 'dai.ly') dmId = parts[0] || '';
      else if (host === 'dailymotion.com' || host === 'geo.dailymotion.com') {
        const match = path.match(/(?:video\/|embed\/video\/)?([A-Za-z0-9]+)/);
        dmId = match?.[1] || '';
      }
      if (dmId) return iframe(`https://geo.dailymotion.com/player.html?video=${encodeURIComponent(dmId)}`, 'Dailymotion video');

      // 4) Google Drive shared video/file preview.
      if (host === 'drive.google.com') {
        const match = path.match(/\/file\/d\/([^/]+)/i);
        const fileId = match?.[1] || u.searchParams.get('id') || '';
        if (fileId) return iframe(`https://drive.google.com/file/d/${encodeURIComponent(fileId)}/preview`, 'Google Drive video');
      }

      // 5) OneDrive share/embed links.
      if (host === 'onedrive.live.com' || host === '1drv.ms') {
        if (/\/embed/i.test(path) || /embed/i.test(u.search)) return iframe(raw, 'OneDrive video');
        return iframe(raw, 'OneDrive media');
      }

      // 6) Dropbox shared files. ?raw=1 makes the media resource available directly when permitted.
      if (host === 'dropbox.com' || host === 'www.dropbox.com') {
        const dropboxRaw = new URL(raw);
        dropboxRaw.searchParams.set('raw', '1');
        return iframe(dropboxRaw.toString(), 'Dropbox video');
      }

      // 7) Loom.
      if (host === 'loom.com' || host === 'www.loom.com') {
        const loomMatch = path.match(/\/share\/([^/]+)/i);
        if (loomMatch?.[1]) return iframe(`https://www.loom.com/embed/${encodeURIComponent(loomMatch[1])}`, 'Loom video');
        if (/\/embed\//i.test(path)) return iframe(raw, 'Loom video');
      }

      // 8) Wistia.
      if (host === 'wistia.com' || host === 'fast.wistia.net' || host.endsWith('.wistia.net')) {
        const wistiaMatch = path.match(/(?:medias|embed\/iframe)\/([^/?#]+)/i);
        if (wistiaMatch?.[1]) return iframe(`https://fast.wistia.net/embed/iframe/${encodeURIComponent(wistiaMatch[1])}`, 'Wistia video');
        if (host === 'fast.wistia.net') return iframe(raw, 'Wistia video');
      }

      // 9) Streamable.
      if (host === 'streamable.com') {
        const streamId = parts[parts.length - 1] || '';
        if (streamId) return iframe(`https://streamable.com/e/${encodeURIComponent(streamId)}`, 'Streamable video');
      }

      // 10) TikTok video/post pages that expose an embeddable page.
      if (host === 'tiktok.com' || host === 'vm.tiktok.com' || host === 'vt.tiktok.com') {
        return iframe(raw, 'TikTok video');
      }

      // 11) Instagram/Facebook/X pages: use their own page when embedding is permitted.
      if (host === 'instagram.com' || host === 'facebook.com' || host === 'fb.watch' || host === 'x.com' || host === 'twitter.com') {
        return iframe(raw, `${host} video`);
      }

      // 12) Direct media resources. Extension is not mandatory: common media query parameters
      // are also detected for signed/CDN URLs such as ?format=mp4 or ?type=video/mp4.
      const mediaHint = [
        u.pathname,
        u.searchParams.get('format') || '',
        u.searchParams.get('ext') || '',
        u.searchParams.get('type') || '',
        u.searchParams.get('mime') || ''
      ].join(' ');
      const isDirectVideo = /\.(mp4|webm|ogg|ogv|m4v|mov|m3u8)(?:$|[?#])/i.test(u.pathname + u.search)
        || /(?:^|[\s=&])(?:video\/)?(?:mp4|webm|ogg|ogv|m4v|mov|m3u8)(?:$|[\s&#])/i.test(mediaHint)
        || /(?:^|[?&])(mime|type)=video%2F/i.test(u.search);

      if (isDirectVideo) {
        const mime = /\.webm(?:$|[?#])/i.test(u.pathname) ? 'video/webm'
          : /\.ogg(?:$|[?#])/i.test(u.pathname) || /\.ogv(?:$|[?#])/i.test(u.pathname) ? 'video/ogg'
          : /\.m3u8(?:$|[?#])/i.test(u.pathname) ? 'application/vnd.apple.mpegurl'
          : 'video/mp4';
        return `<div class="aspect-video bg-black relative overflow-hidden">
          <video controls playsinline preload="metadata" class="w-full h-full object-contain"
            onerror="this.parentElement.querySelector('.tube-video-error')?.classList.remove('hidden')">
            <source src="${esc(raw)}" type="${mime}">
          </video>
          <div class="tube-video-error hidden absolute inset-0 flex flex-col items-center justify-center gap-2 bg-black/85 text-white p-5 text-center">
            <div class="font-bold">ভিডিওটি browser থেকে চালানো যাচ্ছে না</div>
            <div class="text-xs text-white/70">ভিডিও server-এর MIME type/codec বা access policy-এর কারণে সমস্যা হতে পারে।</div>
            <a href="${esc(raw)}" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-xl bg-white text-black text-xs font-bold">ভিডিও URL খুলুন</a>
          </div>
        </div>`;
      }

      // 13) Universal fallback: EVERY valid http/https URL gets a rich visual card.
      // We do not force arbitrary websites into an iframe because many sites explicitly
      // disable framing with X-Frame-Options/CSP. Instead, the card is hydrated from
      // page metadata/screenshot by the preview service; if that fails, a safe URL card
      // still remains visible. This makes arbitrary links look like a social-media post.
      return getOikkoTubeUniversalLinkCardHtml(raw);
    }
    window.getOikkoTubeMediaHtml = getOikkoTubeMediaHtml;

    // --- OIKKO TUBE: Universal link-preview card ---
    // A normal browser page cannot reliably read another site's OG metadata because of
    // cross-origin restrictions. Microlink provides a browser-rendered metadata/screenshot
    // endpoint, so arbitrary public URLs can still receive a visual preview card.
    const oikkoTubeLinkPreviewCache = new Map();
    const OIKKO_TUBE_PREVIEW_ENDPOINT = 'https://api.microlink.io';

    function getOikkoTubeUniversalLinkCardHtml(rawUrl) {
      let u;
      try { u = new URL(rawUrl); } catch (_) {
        return `<div class="aspect-video flex items-center justify-center bg-[#071B15] text-[#A8B9B1] p-6 text-center text-sm">লিংকটি সঠিক নয়</div>`;

      const safeUrl = escapeHtml(u.toString());
      const domain = escapeHtml(u.hostname.replace(/^www\./i, ''));
      const key = encodeURIComponent(u.toString());
      return `<div class="oikko-universal-link-preview bg-[#071B15] overflow-hidden" data-oikko-link-preview="${key}">
        <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="block relative aspect-video bg-gradient-to-br from-[#0A2A20] via-[#0D3A2B] to-[#06130F] group">
          <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-white/90">
            <div class="w-14 h-14 rounded-full bg-white/10 border border-white/20 backdrop-blur flex items-center justify-center shadow-lg"><i data-lucide="globe-2" class="w-7 h-7"></i></div>
            <div class="font-extrabold text-sm">লিংক প্রিভিউ তৈরি হচ্ছে…</div>
            <div class="text-[11px] text-white/60 max-w-[85%] truncate">${domain}</div>
          </div>
          <div class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/70 to-transparent"><div class="text-xs text-white/80 truncate">${safeUrl}</div></div>
        </a>
      </div>`;
    }
    window.getOikkoTubeUniversalLinkCardHtml = getOikkoTubeUniversalLinkCardHtml;

    async function hydrateOikkoTubeLinkPreviews(root = document) {
      const cards = Array.from(root.querySelectorAll?.('[data-oikko-link-preview]') || []);
      if (!cards.length) return;
      await Promise.all(cards.map(async card => {
        const encoded = card.getAttribute('data-oikko-link-preview');
        let raw = '';
        try { raw = decodeURIComponent(encoded || ''); } catch (_) {}
        if (!raw) return;

        try {
          let data = oikkoTubeLinkPreviewCache.get(raw);
          if (!data) {
            const apiUrl = `${OIKKO_TUBE_PREVIEW_ENDPOINT}?url=${encodeURIComponent(raw)}&meta=true&screenshot=true`;
            const response = await fetch(apiUrl, { headers: { 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`Preview API ${response.status}`);
            const json = await response.json();
            data = json?.data || {};
            oikkoTubeLinkPreviewCache.set(raw, data);
          }

          const parsed = new URL(raw);
          const domain = parsed.hostname.replace(/^www\./i, '');
          const title = String(data.title || data.siteName || domain || 'External link').trim();
          const description = String(data.description || '').trim();
          const image = String(data.screenshot?.url || data.image?.url || data.image || '').trim();
          const logo = String(data.logo?.url || '').trim();
          const esc = value => escapeHtml(String(value || ''));

          card.innerHTML = `<a href="${esc(raw)}" target="_blank" rel="noopener noreferrer" class="block bg-[#071B15] group">
            <div class="relative aspect-video bg-[#0B1713] overflow-hidden">
              ${image ? `<img src="${esc(image)}" alt="" loading="lazy" referrerpolicy="no-referrer" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.02]" onerror="this.style.display='none';this.nextElementSibling?.classList.remove('hidden')">` : ''}
              <div class="${image ? 'hidden ' : ''}absolute inset-0 flex items-center justify-center bg-gradient-to-br from-[#0A2A20] to-[#06130F]">
                ${logo ? `<img src="${esc(logo)}" alt="" class="w-14 h-14 rounded-2xl object-contain bg-white/10 p-2 border border-white/10">` : `<div class="w-14 h-14 rounded-full bg-white/10 border border-white/20 flex items-center justify-center"><i data-lucide="globe-2" class="w-7 h-7 text-white/80"></i></div>`}
              </div>
              <div class="absolute left-3 top-3 px-2.5 py-1 rounded-full bg-black/55 backdrop-blur text-[10px] font-extrabold text-white border border-white/10">${esc(domain)}</div>
              <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="w-14 h-14 rounded-full bg-black/45 backdrop-blur border border-white/20 flex items-center justify-center text-white shadow-xl"><i data-lucide="external-link" class="w-6 h-6"></i></span></div>
            </div>
            <div class="p-4 bg-[#071B15]">
              <div class="flex items-start gap-2">
                ${logo ? `<img src="${esc(logo)}" alt="" class="w-7 h-7 rounded-lg object-contain bg-white/10 p-1 shrink-0">` : ''}
                <div class="min-w-0"><h3 class="font-black text-[#EAF7F1] text-base line-clamp-2">${esc(title)}</h3>${description ? `<p class="mt-1 text-xs text-[#A8B9B1] line-clamp-2">${esc(description)}</p>` : ''}</div>
              </div>
              <div class="mt-3 text-[10px] text-[#6F837A] truncate">${esc(raw)}</div>
            </div>
          </a>`;
          if (window.lucide) lucide.createIcons();
        } catch (error) {
          // Keep the universal card visible even when preview metadata is unavailable.
          const parsed = (() => { try { return new URL(raw); } catch (_) { return null; } })();
          const domain = parsed ? parsed.hostname.replace(/^www\./i, '') : 'External link';
          card.innerHTML = `<a href="${escapeHtml(raw)}" target="_blank" rel="noopener noreferrer" class="block aspect-video bg-gradient-to-br from-[#0A2A20] to-[#06130F] relative group">
            <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-white/90 p-6 text-center">
              <div class="w-14 h-14 rounded-full bg-white/10 border border-white/20 flex items-center justify-center"><i data-lucide="link-2" class="w-7 h-7"></i></div>
              <div class="font-black">${escapeHtml(domain)}</div>
              <div class="text-xs text-white/60 break-all line-clamp-2">${escapeHtml(raw)}</div>
              <span class="px-4 py-2 rounded-full bg-white text-[#123B2E] text-xs font-extrabold">লিংক খুলুন</span>
            </div>
          </a>`;
          if (window.lucide) lucide.createIcons();
        }
      }));
    }
    window.hydrateOikkoTubeLinkPreviews = hydrateOikkoTubeLinkPreviews;

    // --- OIKKO TUBE: Internal age verification ---
    // This verification checks the user's registered Oikko Campus profile data.
    // It does NOT query or impersonate BDRIS/government records.
    function getOikkoTubeAgeStorageKey() {
      return `oikko_tube_age_gate_${String(state.currentUser?.id || state.currentUser?.studentId || 'user')}`;
    }

    function calculateAgeFromDob(dob) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dob || ''))) return null;
      const birth = new Date(`${dob}T00:00:00`);
      if (Number.isNaN(birth.getTime())) return null;
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const month = today.getMonth() - birth.getMonth();
      if (month < 0 || (month === 0 && today.getDate() < birth.getDate())) age--;
      return age >= 0 && age <= 130 ? age : null;
    }

    function normalizeBirthReg(value) {
      return String(value || '').replace(/\D/g, '').slice(0, 17);
    }

    function getCurrentUserVerificationRecord() {
      const me = state.currentUser;
      if (!me) return null;
      return {
        birthRegistrationNumber: normalizeBirthReg(me.birthRegistrationNumber),
        dateOfBirth: String(me.dateOfBirth || '').trim()
      };
    }

    function loadOikkoTubeAgeVerification() {
      state.oikkoTubeAgeGroup = null;
      state.oikkoTubeAgeVerified = false;
      if (!state.currentUser) return false;
      try {
        const saved = JSON.parse(localStorage.getItem(getOikkoTubeAgeStorageKey()) || 'null');
        if (saved && (saved.ageGroup === 'under18' || saved.ageGroup === '18plus')) {
          const age = calculateAgeFromDob(state.currentUser.dateOfBirth);
          if ((saved.ageGroup === '18plus' && age !== null && age >= 18) ||
              (saved.ageGroup === 'under18' && age !== null && age < 18)) {
            state.oikkoTubeAgeGroup = saved.ageGroup;
            state.oikkoTubeAgeVerified = true;
            return true;
          }
        }
      } catch (_) {}
      return false;
    }

    function saveOikkoTubeAgeVerification(ageGroup) {
      if (ageGroup !== 'under18' && ageGroup !== '18plus') return false;
      const age = calculateAgeFromDob(state.currentUser?.dateOfBirth);
      if (age === null) return false;
      if (ageGroup === '18plus' && age < 18) return false;
      if (ageGroup === 'under18' && age >= 18) return false;

      state.oikkoTubeAgeGroup = ageGroup;
      state.oikkoTubeAgeVerified = true;
      try {
        localStorage.setItem(getOikkoTubeAgeStorageKey(), JSON.stringify({
          ageGroup,
          verifiedAt: Date.now()
        }));
      } catch (_) {}
      return true;
    }

    function clearOikkoTubeAgeVerification() {
      try { localStorage.removeItem(getOikkoTubeAgeStorageKey()); } catch (_) {}
      state.oikkoTubeAgeGroup = null;
      state.oikkoTubeAgeVerified = false;
    }
    window.clearOikkoTubeAgeVerification = clearOikkoTubeAgeVerification;

    // Oikko-এর নিজস্ব CAPTCHA; এটি BDRIS/API নয়।
    let oikkoAgeCaptchaAnswer = '';
    function refreshOikkoAgeCaptcha() {
      const canvas = document.getElementById('oikko-age-captcha-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 8) + 1;
      oikkoAgeCaptchaAnswer = String(a + b);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f7fbff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 70; i++) {
        ctx.fillStyle = `rgba(47,111,87,${(Math.random() * .45 + .15).toFixed(2)})`;
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1.5, 1.5);
      }
      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = `rgba(47,111,87,${(Math.random() * .25 + .15).toFixed(2)})`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
      }
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2 + 11);
      ctx.rotate((Math.random() - .5) * .08);
      ctx.font = '700 30px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#173d2f';
      ctx.fillText(`${a} + ${b} = ?`, 0, 0);
      ctx.restore();
    }
