    // --- Device Media File Helpers (Photo & Video) ---
    // Fix: Prevent mobile / browser canvas green tint issue by directly loading data URLs for standard files
    // and using solid background with colorSpace srgb for resized images.
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.85) {
      return new Promise((resolve) => {
        if (!file) return resolve('');

        // 1. Files under 2.5MB: read directly as DataURL to preserve 100% true native colors without any canvas green distortion
        if (file.size <= 2.5 * 1024 * 1024) {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
          return;
        }

        // 2. Large files: resize safely with solid white background to eliminate color-space channel mismatch
        try {
          const objectUrl = URL.createObjectURL(file);
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
            if (!ctx) {
              const r = new FileReader();
              r.onload = (ev) => resolve(ev.target.result);
              r.readAsDataURL(file);
              return;
            }
            // Fill solid white background so transparent or mobile camera buffer never turns green
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            
            const mime = (file.type && file.type.startsWith('image/')) ? file.type : 'image/jpeg';
            try {
              const out = canvas.toDataURL(mime, quality);
              resolve(out);
            } catch (err) {
              const r = new FileReader();
              r.onload = (ev) => resolve(ev.target.result);
              r.readAsDataURL(file);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            const r = new FileReader();
            r.onload = (ev) => resolve(ev.target.result);
            r.readAsDataURL(file);
          };
          img.src = objectUrl;
        } catch (e) {
          const r = new FileReader();
          r.onload = (ev) => resolve(ev.target.result);
          r.readAsDataURL(file);
        }
      });
    }

    function readFileAsDataURL(file) {

        reader.onload = (e) => resolve(e.target.result);

        reader.readAsDataURL(file);
      });

    function toggleAllComments(postId) {

    // --- অডিও নোটিফিকেশন সাউন্ড হেল্পার ---
    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn('AudioContext sound note:', e);
      }
    }

    // --- ডিভাইস নোটিফিকেশন পারমিশন ও পুশ সেন্ডার ---
    function requestNotificationPermission() {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              showToast('ডিভাইস নোটিফিকেশন সফলভাবে চালু করা হয়েছে!', 'success');
              playNotificationSound();
            }
          });
        } else if (Notification.permission === 'granted') {
          showToast('ডিভাইস নোটিফিকেশন সক্রিয় আছে', 'info');
        } else {
          showToast('ব্রাউজারের সেটিংস থেকে নোটিফিকেশন অনুমোদন করুন', 'info');
        }
      }
    }
    window.requestNotificationPermission = requestNotificationPermission;

    function sendDeviceNotification(title, options = {}) {
      // ১. মোবাইল ভাইব্রেশন
      if ('vibrate' in navigator) {
        try { navigator.vibrate([180, 80, 180]); } catch (e) {}
      }

      // ২. অডিও বেল সাউন্ড
      playNotificationSound();

      // ৩. ডিভাইসের আসল সিস্টেম নোটিফিকেশন (মোবাইল / ডেক্সটপ পপআপ)
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            const notif = new Notification(title, {
              body: options.body || '',
              icon: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              badge: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              silent: false,
              ...options
            });
            notif.onclick = function() {
              window.focus();
              this.close();
            };
          } catch (e) {
            console.warn('Native notification trigger error:', e);
          }
        } else if (Notification.permission === 'default') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') {
              try {
                new Notification(title, options);
              } catch (e) {}
            }
          });
        }
      }

      // ৪. ইন-অ্যাপ লাইভ টোস্ট অ্যালার্ট
      showToast(`🔔 ${title}: ${options.body || ''}`, 'info');
    }
    window.sendDeviceNotification = sendDeviceNotification;

    // --- 3.1 Firebase Firestore Realtime Synchronizer ---
    let isFirebaseSyncInitialized = false;
    window._prevPostCommentCount = window._prevPostCommentCount || {};

    function initFirebaseSync() {
      if (!window.firebaseDb || !window.fb || isFirebaseSyncInitialized) return;
      isFirebaseSyncInitialized = true;
      const db = window.firebaseDb;
      const { collection, onSnapshot, doc, setDoc } = window.fb;

      // ১. রিয়েল-টাইমে পোস্ট সিঙ্ক (সব মোবাইল ও ডিভাইসের জন্য)
      try {
        const postsCol = collection(db, 'posts');
        onSnapshot(postsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPosts = [];
            snapshot.forEach(docSnap => {
              const pData = { id: docSnap.id, ...docSnap.data() };
              cloudPosts.push(pData);

              // রিয়েল-টাইমে অন্য ডিভাইস থেকে নতুন কমেন্ট আসলে ডিভাইসে নোটিফিকেশন পাঠানো
              const currentComments = pData.comments || [];
              if (window._prevPostCommentCount[pData.id] !== undefined) {
                const prevCount = window._prevPostCommentCount[pData.id];
                if (currentComments.length > prevCount) {
                  const newestComment = currentComments[currentComments.length - 1];
                  // যদি পোস্টের লেখক স্বয়ং লগইন করা ইউজার হন এবং মন্তব্যকারী অন্য কেউ হন
                  if (state.currentUser && (pData.authorStudentId === state.currentUser.studentId || pData.authorId === state.currentUser.id)) {
                    if (newestComment.authorStudentId !== state.currentUser.studentId) {
                      sendDeviceNotification(`${newestComment.authorName} আপনার পোস্টে মন্তব্য করেছেন!`, {
                        body: `"${newestComment.content}"`,
                        icon: newestComment.authorAvatar
                      });
                    }
                  }
                }
              }
              window._prevPostCommentCount[pData.id] = currentComments.length;
            });

            // লেটেস্ট পোস্ট সবার আগে সাজানো
            cloudPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.posts = cloudPosts;
            savePosts(cloudPosts);
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ক্লাউড সম্পূর্ণ খালি থাকলে প্রাথমিক পোস্ট ক্লাউডে জমা করা
            INITIAL_POSTS.forEach(p => {
              setDoc(doc(db, 'posts', p.id), { ...p, timestamp: Date.now() }).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase posts onSnapshot note:', error);
          state.cloudStatus = 'offline';
          renderApp();
        });
      } catch (err) {
        console.warn('Posts listener exception:', err);
      }

      // ২. রিয়েল-টাইমে ইউজার ও ভেরিফিকেশন ডাটা সিঙ্ক
      try {
        const usersCol = collection(db, 'users');
        onSnapshot(usersCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudUsers = [];
            snapshot.forEach(docSnap => {
              cloudUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            
            // এডমিন প্রোফাইল নিশ্চিত করা
            const hasAdmin = cloudUsers.some(u => u.role === 'admin' || u.studentId === 'ADMIN001');
            if (!hasAdmin) {
              cloudUsers.unshift(ADMIN_DATA);
              setDoc(doc(db, 'users', ADMIN_DATA.id), ADMIN_DATA).catch(console.warn);
            }

            state.users = cloudUsers;
            saveUsers(cloudUsers);

            // কারেন্ট সেশন ইউজারের তথ্য আপডেট
            if (state.currentUser) {
              const fresh = cloudUsers.find(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId);
              if (fresh) {
                state.currentUser = fresh;
                saveCurrentUser(fresh);
              }
            }
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ইনিশিয়াল ইউজারদের ফায়ারবেসে সিঙ্ক করা
            INITIAL_USERS.forEach(u => {
              setDoc(doc(db, 'users', u.id), u).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase users onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Users listener exception:', err);
      }
    }
    window.initFirebaseSync = initFirebaseSync;

    // --- 4. Toast Notification ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      const isError = type === 'error';
      const bg = isError ? 'bg-red-600' : isSuccess ? 'bg-[#5A5A40]' : 'bg-slate-800';
      
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

      return `
        <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#5A5A40] text-white border-t border-[#4A4A33] shadow-[0_-5px_25px_rgba(0,0,0,0.18)] pb-safe transition-all">

    // --- POST CARD & TIME FORMATTER ---
    function formatPostTimestamp(dateStr, timestamp) {
      if (!dateStr && !timestamp) return 'সম্প্রতি';
      try {
        let d = null;
        if (typeof timestamp === 'number' && !isNaN(timestamp)) {
          d = new Date(timestamp);
        } else if (dateStr) {
          let normalized = dateStr;
          if (/[০-৯]/.test(dateStr)) {
            normalized = dateStr.replace(/[০-৯]/g, dig => '০১২৩৪৫৬৭৮৯'.indexOf(dig).toString());
          }
          const parsed = new Date(normalized);
          if (!isNaN(parsed.getTime())) {
            d = parsed;
          }
        }

        if (!d || isNaN(d.getTime())) {
          return dateStr || 'সম্প্রতি';
        }

        const now = Date.now();
        const diffMs = Math.max(0, now - d.getTime());
        const diffMin = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMin / 60);
        const diffDays = Math.floor(diffHours / 24);

        let relative = '';
        if (diffMin < 1) {
          relative = 'এইমাত্র';
        } else if (diffMin < 60) {
          relative = `${diffMin.toLocaleString('bn-BD')} মিনিট আগে`;
        } else if (diffHours < 24) {
          relative = `${diffHours.toLocaleString('bn-BD')} ঘণ্টা আগে`;
        } else if (diffDays < 7) {
          relative = `${diffDays.toLocaleString('bn-BD')} দিন আগে`;
        }

        const exactTime = d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
        const exactDate = d.toLocaleDateString('bn-BD', { year: 'numeric', month: 'short', day: 'numeric' });

        if (relative) {
          return `${exactDate}, ${exactTime} • (${relative})`;
        }
        return `${exactDate}, ${exactTime}`;
      } catch (err) {
        return dateStr || 'সম্প্রতি';
      }
    }

                  <span>মন্তব্য</span>
                </button>

        </div>

    // --- STUDENT PROFILE MODAL ---
    function openProfileModal(identifier) {
      let targetId = identifier;
      if (!targetId && state.currentUser) {
        targetId = state.currentUser.id || state.currentUser.studentId;
      }
      if (!targetId) {
        showToast('প্রোফাইল লোড করতে শিক্ষার্থীর আইডি পাওয়া যায়নি', 'error');
        return;
      }

      const cleanId = String(targetId).trim().toLowerCase();
      let user = state.users.find(u => 
        (u.id && u.id.toLowerCase() === cleanId) || 
        (u.studentId && u.studentId.toLowerCase() === cleanId)
      );

      // If not found in users array, check current user
      if (!user && state.currentUser && (
        (state.currentUser.id && state.currentUser.id.toLowerCase() === cleanId) ||
        (state.currentUser.studentId && state.currentUser.studentId.toLowerCase() === cleanId)
      )) {
        user = state.currentUser;
      }

      // If still not found, check author information from posts
      if (!user && state.posts) {
        const postAuthor = state.posts.find(p => 
          (p.authorId && p.authorId.toLowerCase() === cleanId) ||
          (p.authorStudentId && p.authorStudentId.toLowerCase() === cleanId)
        );
        if (postAuthor) {
          user = {
            id: postAuthor.authorId || `user_${postAuthor.authorStudentId}`,
            studentId: postAuthor.authorStudentId,
            fullName: postAuthor.authorName,
            fatherName: 'তথ্য হালনাগাদ করা হয়নি',
            motherName: 'তথ্য হালনাগাদ করা হয়নি',
            studentClass: 'শিক্ষার্থী',
            roll: 'N/A',
            section: 'সাধারণ',
            shift: 'দিবা',

            permanentAddress: 'তথ্য দেওয়া হয়নি',
            mobileNumber: '',
            email: '',
            facebookLink: '',
            profilePicture: postAuthor.authorAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
            isVerified: postAuthor.authorStudentId === 'ADMIN001',

    function handleUpdateProfile(e, userId) {
      e.preventDefault();
      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      const newPic = document.getElementById('edit-profile-picture').value.trim();
      const newName = document.getElementById('edit-name').value.trim();
      const newFather = document.getElementById('edit-father').value.trim();
      const newMother = document.getElementById('edit-mother').value.trim();
      const newClass = document.getElementById('edit-class').value;
      const newRoll = document.getElementById('edit-roll').value.trim();
      const newSection = document.getElementById('edit-section').value.trim();
      const newShift = document.getElementById('edit-shift').value;
      const newDob = document.getElementById('edit-dob').value;
      const newBlood = document.getElementById('edit-blood').value;
      const newReligion = document.getElementById('edit-religion').value;
      const newBirthReg = document.getElementById('edit-birth-reg').value.trim();
      const newPresent = document.getElementById('edit-present').value.trim();
      const newPermanent = document.getElementById('edit-permanent').value.trim();
      const newMobile = document.getElementById('edit-mobile').value.trim();
      const newEmail = document.getElementById('edit-email').value.trim();
      const newFb = document.getElementById('edit-fb').value.trim();
      const newPass = document.getElementById('edit-password').value.trim();

      user.fullName = newName;
      if (newPic) user.profilePicture = newPic;
      user.fatherName = newFather;
      user.motherName = newMother;
      user.studentClass = newClass;
      user.roll = newRoll;
      user.section = newSection;
      user.shift = newShift;
      user.dateOfBirth = newDob;
      user.bloodGroup = newBlood;
      user.religion = newReligion;
      user.birthRegistrationNumber = newBirthReg;
      user.presentAddress = newPresent;
      user.permanentAddress = newPermanent;
      user.mobileNumber = newMobile;
      user.email = newEmail;
      user.facebookLink = newFb;
      if (newPass) {
        user.password = newPass;
      }

      // Update author details on all existing posts & comments by this user
      state.posts.forEach(p => {
        if (p.authorId === user.id || p.authorStudentId === user.studentId) {
          p.authorName = user.fullName;
          p.authorAvatar = user.profilePicture;
        }
        if (p.comments) {
          p.comments.forEach(c => {
            if (c.authorId === user.id || c.authorStudentId === user.studentId) {
              c.authorName = user.fullName;
              c.authorAvatar = user.profilePicture;
            }
          });
        }
      });

      // Update current session user if editing own profile
      if (state.currentUser.id === user.id) {
        state.currentUser = { ...user };
        saveCurrentUser(state.currentUser);
      }

      saveUsers(state.users);
      savePosts(state.posts);

      closeProfileModal();
      showToast('আপনার তথ্য সফলভাবে পরিবর্তন ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Sync updated user to Cloud Firestore
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.id), user, { merge: true }).catch(console.warn);
      }
    }

    function setAuthTab(tab) {

    function handleUserLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-user-id');
      const mobileInput = document.getElementById('login-user-mobile');
      const passInput = document.getElementById('login-user-password');

      const id = idInput ? idInput.value.trim() : '';
      const mobile = mobileInput ? mobileInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!id || !pass) {
        state.authError = 'স্টুডেন্ট আইডি ও পাসওয়ার্ড পূরণ করুন!';
        renderApp();
        return;
      }

      const cleanId = id.toUpperCase();

      const user = state.users.find(u => {
        const idMatches = u.studentId.toUpperCase() === cleanId || u.mobileNumber === id;
        const mobileMatches = !mobile || u.mobileNumber === mobile;
        const passMatches = u.password === pass;
        return idMatches && mobileMatches && passMatches;
      });

      if (!user) {
        state.authError = 'স্টুডেন্ট আইডি, মোবাইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      state.currentUser = user;
      saveCurrentUser(user);
      state.activeView = user.role === 'admin' ? 'admin' : 'feed';
      showToast(user.role === 'admin' ? 'এডমিন হিসেবে স্বাগতম!' : `${user.fullName}, শিক্ষার্থী পোর্টালে স্বাগতম!`, 'success');
      renderApp();
      requestNotificationPermission();
    }

    function handleAdminLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-admin-id');
      const passInput = document.getElementById('login-admin-password');

      const idOrEmail = idInput ? idInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!idOrEmail || !pass) {
        state.authError = 'এডমিন আইডি/ইমেইল ও পাসওয়ার্ড প্রদান করুন!';
        renderApp();
        return;
      }

      const cleanInput = idOrEmail.toLowerCase();
      const cleanId = idOrEmail.toUpperCase();

      const admin = state.users.find(u => {
        const isAdmin = u.role === 'admin' || u.studentId === 'ADMIN001' || u.email === 'kmi96724@gmail.com';
        const identifierMatches = (
          u.studentId.toUpperCase() === cleanId ||
          (u.email && u.email.toLowerCase() === cleanInput) ||
          u.mobileNumber === idOrEmail
        );
        const passMatches = u.password === pass;
        return isAdmin && identifierMatches && passMatches;
      });

      if (!admin) {
        state.authError = 'এডমিন আইডি/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      state.currentUser = admin;
      saveCurrentUser(admin);
      state.activeView = 'admin';
      showToast('প্রধান এডমিন হিসেবে স্বাগতম!', 'success');
      renderApp();
      requestNotificationPermission();
    }

    // Fallback legacy handler
    function handleLoginSubmit(e) {
      if (state.authMode === 'admin_login') {
        handleAdminLoginSubmit(e);
      } else {
        handleUserLoginSubmit(e);
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const password = document.getElementById('reg-pass').value;
      const confirmPassword = document.getElementById('reg-confirm-pass').value;

      if (password !== confirmPassword) {
        state.authError = 'দুইটি পাসওয়ার্ড মিলছে না!';
        renderApp();
        return;
      }

      const newId = document.getElementById('reg-student-id').value.trim().toUpperCase();
      if (state.users.some(u => u.studentId.toUpperCase() === newId)) {
        state.authError = 'এই স্টুডেন্ট আইডি দিয়ে ইতিমধ্যে অ্যাকাউন্ট তৈরি করা আছে!';
        renderApp();
        return;
      }

      const picInput = document.getElementById('reg-profile-picture');
      const profilePicUrl = (picInput && picInput.value.trim()) 
        ? picInput.value.trim() 
        : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80';

      const newUser = {
        id: 'user_' + Date.now(),
        studentId: newId,
        fullName: document.getElementById('reg-name').value.trim(),

    // --- Profile Avatar Device Upload Handler ---
    async function handleProfileAvatarFileSelect(e, mode) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে শুধুমাত্র ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('প্রোফাইল ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressedDataUrl = await compressImage(file, 400, 400, 0.85);
        if (mode === 'reg') {
          const preview = document.getElementById('reg-avatar-preview');
          const input = document.getElementById('reg-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        } else if (mode === 'edit') {
          const preview = document.getElementById('edit-avatar-preview');
          const input = document.getElementById('edit-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        }
        showToast('ডিভাইস থেকে প্রোফাইল ছবি যুক্ত হয়েছে!', 'success');
      } catch (err) {
        console.error('Avatar error:', err);
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }

    // --- Post Media Upload from Device (Image & Video) ---
    async function handleMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');

      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.82);
          state.selectedMedia = {
            type: 'image',
            url: dataUrl,
            name: file.name
          };
        } else {
          // ভিডিও সাইজ চেক (২০MB লিমিট)
          if (file.size > 20 * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ২০MB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          state.selectedMedia = {
            type: 'video',
            url: dataUrl,
            name: file.name
          };
        }

        showToast(`${isImage ? 'ছবি' : 'ভিডিও'} সফলভাবে নির্বাচন করা হয়েছে!`, 'success');
        updateMediaPreviewUI();
      } catch (err) {
        console.error('File load error:', err);
        showToast('ফাইল লোড করতে সমস্যা হয়েছে', 'error');
      }
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const content = document.getElementById('new-post-content').value.trim();
      const media = state.selectedMedia;

      if (!content && !media) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন', 'error');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
      const newPost = {
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: content,
        mediaType: media ? media.type : null,
        imageUrl: (media && media.type === 'image') ? media.url : '',
        videoUrl: (media && media.type === 'video') ? media.url : '',
        likes: [],
        comments: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      document.getElementById('new-post-content').value = '';
      state.selectedMedia = null;
      const fileInput = document.getElementById('post-media-file');
      if (fileInput) fileInput.value = '';

      // Save directly to Firebase Firestore for all mobiles & devices
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'posts'), newPost);
          showToast('নতুন পোস্ট রিয়েল-টাইমে ক্লাউডে শেয়ার হয়েছে!', 'success');
        } catch (err) {
          console.error('Firestore addDoc error:', err);
          state.posts.unshift({ id: 'post_' + Date.now(), ...newPost });
          savePosts(state.posts);
          showToast('পোস্ট হয়েছে (লোকাল মেমোরি)। ফায়ারবেস রুলস চেক করুন!', 'error');
          renderApp();
        }
      } else {
        state.posts.unshift({ id: 'post_' + Date.now(), ...newPost });
        savePosts(state.posts);
        showToast('নতুন পোস্ট প্রকাশিত হয়েছে!', 'success');
        renderApp();
      }
    }

    async function handleToggleLike(postId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const updatedLikes = [...(post.likes || [])];
      const idx = updatedLikes.indexOf(u.studentId);
      if (idx === -1) updatedLikes.push(u.studentId);
      else updatedLikes.splice(idx, 1);

      post.likes = updatedLikes;
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            likes: updatedLikes
          });
        } catch (err) {
          console.warn('Like sync error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
      }
    }

    function toggleReplyInput(commentId, targetAuthorName = '') {
      state.openReplyBoxes = state.openReplyBoxes || {};
      state.openReplyBoxes[commentId] = !state.openReplyBoxes[commentId];
      renderApp();
      if (state.openReplyBoxes[commentId]) {
        setTimeout(() => {
          const input = document.getElementById('reply-input-' + commentId);
          if (input) {
            if (targetAuthorName) {
              input.value = `@${targetAuthorName} `;
            }
            input.focus();
          }
        }, 50);
      }

    async function handleAddReply(e, postId, commentId) {
      e.preventDefault();
      const input = document.getElementById('reply-input-' + commentId);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment) return;

      if (!comment.replies) comment.replies = [];

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

      const newReply = {
        id: 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: text,
        likes: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      comment.replies.push(newReply);
      state.expandedComments[postId] = true; // রিপ্লাই দিলে পুরো কমেন্ট থ্রেড দৃশ্যমান থাকা
      state.openReplyBoxes = state.openReplyBoxes || {};
      state.openReplyBoxes[commentId] = true; // রিপ্লাই বক্স খোলা রাখা যাতে সাথে সাথে আবার রিপ্লাই করা যায়
      
      savePosts(state.posts);
      renderApp();

      // ইনপুট ক্লিয়ার এবং পুনরায় ফোকাস যাতে সহজে পরবর্তী রিপ্লাই দেওয়া যায়
      setTimeout(() => {
        const nextInput = document.getElementById('reply-input-' + commentId);
        if (nextInput) {
          nextInput.value = '';
        }
      }, 20);

      // ডিভাইসে তাৎক্ষণিক নোটিফিকেশন অ্যালার্ট
      sendDeviceNotification('মন্তব্যে রিপ্লাই যোগ হয়েছে!', {
        body: `${state.currentUser.fullName}: "${text.length > 50 ? text.substring(0, 50) + '...' : text}"`,
        icon: state.currentUser.profilePicture
      });

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
          showToast('রিপ্লাই সফলভাবে যোগ করা হয়েছে', 'success');
        } catch (err) {
          console.warn('Reply sync error:', err);
        }
      } else {
        showToast('রিপ্লাই যুক্ত হয়েছে', 'success');
      }
    }

                <button type="submit" class="px-5 py-2 rounded-xl bg-[#5A5A40] hover:bg-[#4A4A33] text-white font-bold text-xs shadow-xs transition-colors flex items-center gap-1.5 cursor-pointer">

    window.openEditPostModal = openEditPostModal;

    function renderEditPostMediaHTML() {
      if (!editPostMediaState || !editPostMediaState.url) {
        return `<div class="p-3 rounded-xl bg-[#F9F9F4] border border-dashed border-[#E2E2D5] text-center text-[#8A8A6A] text-xs">কোনো ছবি বা ভিডিও যুক্ত নেই</div>`;
      }
      if (editPostMediaState.type === 'video') {
        return `
          <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] bg-black max-h-56 flex items-center justify-center">
            <video src="${editPostMediaState.url}" controls class="max-h-56 w-full object-contain"></video>
            <button type="button" onclick="handleRemoveEditPostMedia()" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-md cursor-pointer" title="ভিডিও মুছে ফেলুন">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }
      return `
        <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] max-h-56 flex items-center justify-center bg-[#F5F5F0]">
          <img src="${editPostMediaState.url}" class="max-h-56 w-full object-cover" />
          <button type="button" onclick="handleRemoveEditPostMedia()" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-md cursor-pointer" title="ছবি মুছে ফেলুন">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `;
    }

    function handleRemoveEditPostMedia() {
      editPostMediaState = { type: null, url: '', name: '' };
      const box = document.getElementById('edit-post-media-box');
      if (box) {
        box.innerHTML = renderEditPostMediaHTML();
        if (window.lucide) lucide.createIcons();
      }
    }
    window.handleRemoveEditPostMedia = handleRemoveEditPostMedia;

    async function handleEditMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');
      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.85);
          editPostMediaState = { type: 'image', url: dataUrl, name: file.name };
        } else {
          if (file.size > 20 * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ২০MB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          editPostMediaState = { type: 'video', url: dataUrl, name: file.name };
        }
        const box = document.getElementById('edit-post-media-box');
        if (box) {
          box.innerHTML = renderEditPostMediaHTML();
          if (window.lucide) lucide.createIcons();
        }
        showToast('মিডিয়া নির্বাচন করা হয়েছে!', 'success');
      } catch (err) {
        showToast('মিডিয়া লোড করা যায়নি', 'error');
      }
    }
    window.handleEditMediaFileSelect = handleEditMediaFileSelect;

    async function handleSaveEditPost(e, postId) {
      e.preventDefault();
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const contentInput = document.getElementById('edit-post-content');
      const newContent = contentInput ? contentInput.value.trim() : '';

      const hasMedia = editPostMediaState && editPostMediaState.url;
      if (!newContent && !hasMedia) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও রাখুন!', 'error');
        return;
      }

      post.content = newContent;
      if (editPostMediaState && editPostMediaState.url) {
        post.mediaType = editPostMediaState.type;
        post.imageUrl = editPostMediaState.type === 'image' ? editPostMediaState.url : '';
        post.videoUrl = editPostMediaState.type === 'video' ? editPostMediaState.url : '';
      } else {
        post.mediaType = null;
        post.imageUrl = '';
        post.videoUrl = '';
      }
      post.isEdited = true;

      savePosts(state.posts);
      closeProfileModal();
      showToast('পোস্ট সফলভাবে এডিট ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            content: post.content,
            imageUrl: post.imageUrl || '',
            videoUrl: post.videoUrl || '',
            mediaType: post.mediaType || null,
            isEdited: true
          });
        } catch (err) {
          console.warn('Firestore edit post sync note:', err);
        }
      }
    }
    window.handleSaveEditPost = handleSaveEditPost;

              ${isAdmin ? `
                <div class="mt-4">

                    <i data-lucide="plus-circle" class="w-4 h-4"></i>

              </div>
              <h3 class="font-bold text-sm text-[#42422F] mb-1">এই ক্যাটাগরিতে কোনো ইভেন্ট নেই</h3>
              <p class="text-xs text-[#8A8A6A]">অন্য ক্যাটাগরি বাছাই করুন অথবা পরবর্তীতে আবার চেক করুন।</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${filteredEvents.map(ev => {
                const isParticipating = (ev.participants || []).includes(u.studentId);

                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>

    function handleToggleEventRsvp(eventId) {
      const ev = state.events.find(e => e.id === eventId);
      if (!ev) return;
      if (!ev.participants) ev.participants = [];

      const idx = ev.participants.indexOf(state.currentUser.studentId);
      if (idx === -1) {
        ev.participants.push(state.currentUser.studentId);
        showToast('ইভেন্টে অংশগ্রহণের তালিকাভুক্ত করা হয়েছে!', 'success');
      } else {
        ev.participants.splice(idx, 1);
        showToast('ইভেন্ট থেকে অংশগ্রহণ প্রত্যাহার করা হয়েছে', 'info');
      }
      saveEvents(state.events);
      renderApp();
    }

              </div>

              <!-- Actions -->
              <div class="pt-3 border-t border-[#F0F0E0] flex items-center justify-end gap-2">
                <button type="button" onclick="closeProfileModal()" class="px-4 py-2 rounded-xl bg-white hover:bg-[#E2E2D5] text-[#5A5A40] border border-[#E2E2D5] font-bold text-xs transition-colors cursor-pointer">
                  বাতিল
                </button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-[#5A5A40] hover:bg-[#4A4A33] text-white font-bold text-xs shadow-xs transition-colors flex items-center gap-1.5 cursor-pointer">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>ইভেন্ট প্রকাশ করুন</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }
    window.openCreateEventModal = openCreateEventModal;

    function handleCreateEvent(e) {
      e.preventDefault();
      const title = document.getElementById('ev-title').value.trim();
      const date = document.getElementById('ev-date').value.trim();
      const time = document.getElementById('ev-time').value.trim();
      const location = document.getElementById('ev-location').value.trim();
      const category = document.getElementById('ev-category').value;
      const banner = document.getElementById('ev-banner').value.trim() || 'https://images.unsplash.com/photo-1511578314322-379afb476865?w=800';
      const desc = document.getElementById('ev-desc').value.trim();

      const newEvent = {
        id: 'ev_' + Date.now(),
        title,
        date,
        time,
        location,
        category,
        banner,
        description: desc,
        participants: [state.currentUser.studentId]
      };

      state.events.unshift(newEvent);
      saveEvents(state.events);
      closeProfileModal();
      showToast('নতুন ইভেন্ট সফলভাবে প্রকাশ করা হয়েছে!', 'success');
      renderApp();
    }
    window.handleCreateEvent = handleCreateEvent;

    function handleDeleteEvent(eventId) {
      if (!confirm('আপনি কি নিশ্চিত যে এই ইভেন্টটি মুছে ফেলতে চান?')) return;
      state.events = state.events.filter(e => e.id !== eventId);
      saveEvents(state.events);
      showToast('ইভেন্ট মুছে ফেলা হয়েছে', 'info');
      renderApp();
    }
    window.handleDeleteEvent = handleDeleteEvent;

    // --- ADMIN POSTS VIEW ---
    function renderAdminPostsView() {
      const adminPosts = state.posts.filter(p => 
        p.authorStudentId === 'ADMIN001' || 
        (state.users.find(u => (u.studentId === p.authorStudentId || u.id === p.authorId) && u.role === 'admin'))
      );

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-28 flex-1 w-full">
          <!-- Admin Posts Header Banner -->
          <div class="bg-gradient-to-r from-[#5A5A40] to-[#42422F] text-white rounded-3xl p-6 sm:p-7 mb-6 shadow-md relative overflow-hidden">
            <div class="relative z-10">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-600 text-white text-xs font-bold mb-3 shadow-xs">
                <i data-lucide="megaphone" class="w-3.5 h-3.5"></i>
                <span>অফিসিয়াল নোটিশ বোর্ড</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">প্রধান এডমিন ও অফিশিয়াল নোটিশ</h1>
              <p class="text-xs sm:text-sm text-[#E2E2D5] leading-relaxed">প্রতিষ্ঠান প্রশাসন ও প্রধান এডমিনের সকল আনুষ্ঠানিক ঘোষণা, বিজ্ঞপ্তি ও গুরুত্বপূর্ণ নির্দেশনা এখানে পাওয়া যায়।</p>
            </div>
            <div class="absolute -right-8 -bottom-8 opacity-15 pointer-events-none">
              <i data-lucide="shield-check" class="w-52 h-52 text-white"></i>
            </div>
          </div>

          <!-- Admin Posts List -->
          ${adminPosts.length === 0 ? `
            <div class="bg-white rounded-2xl border border-[#E2E2D5] p-12 text-center">
              <div class="w-14 h-14 rounded-full bg-[#F5F5F0] flex items-center justify-center mx-auto mb-3 text-[#8A8A6A]">
                <i data-lucide="info" class="w-7 h-7"></i>
              </div>
              <h3 class="font-bold text-sm text-[#42422F] mb-1">কোনো এডমিন নোটিশ পাওয়া যায়নি</h3>
              <p class="text-xs text-[#8A8A6A]">এডমিন কর্তৃক নতুন পোস্ট প্রকাশ করা হলে তা স্বয়ংক্রিয়ভাবে এখানে দেখা যাবে।</p>
            </div>
          ` : `
            <div class="space-y-6">
              ${adminPosts.map(p => renderPostCard(p)).join('')}
            </div>
          `}
        </main>
      `;
    }

    function handleAdminSearch(val) {
      state.searchQuery = val;
      renderApp();
    }

    async function handleToggleVerify(userId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র এডমিন কোনো শিক্ষার্থীকে ভেরিফাই করতে পারেন।', 'error');
        return;
      }
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      user.isVerified = !user.isVerified;
      saveUsers(state.users);
      showToast(`${user.fullName}-কে ${user.isVerified ? 'ভেরিফাইড করা হয়েছে' : 'আনভেরিফাইড করা হয়েছে'}`, 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', user.id), {
            isVerified: user.isVerified
          });
        } catch (err) {
          console.warn('Verify sync error:', err);
        }
      }
    }

    async function handleDeleteStudent(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`${user.fullName}-এর একাউন্ট স্থায়ীভাবে ডিলিট করতে চান?`)) return;
      state.users = state.users.filter(u => u.id !== userId);
      saveUsers(state.users);
      showToast('শিক্ষার্থী সফলভাবে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', user.id));
        } catch (err) {
          console.warn('Delete user cloud error:', err);
        }
      }
    }

    // --- 8. Initialize App ---
    renderApp();
    if (window.firebaseDb) {
      initFirebaseSync();
    }
  </script>
</body>
</html>
