    // ==========================================
    // ২. লোকাল স্টোরেজ ব্যাকআপ হেল্পার
    // ==========================================
    function loadUsers() {
      try {
        const d = localStorage.getItem('student_portal_users');
        if (!d) {
          localStorage.setItem('student_portal_users', JSON.stringify(INITIAL_USERS));
          return INITIAL_USERS;
        }
        const parsed = JSON.parse(d);
        const aIdx = parsed.findIndex(u => u.role === 'admin' || u.studentId === 'ADMIN001');
        if (aIdx !== -1) parsed[aIdx] = { ...parsed[aIdx], ...ADMIN_DATA };
        else parsed.unshift(ADMIN_DATA);
        localStorage.setItem('student_portal_users', JSON.stringify(parsed));
        return parsed;
      } catch (e) {
        return INITIAL_USERS;
      }
    }

    function saveUsers(u) {
      localStorage.setItem('student_portal_users', JSON.stringify(u));
    }

    function loadPosts() {
      try {
        const d = localStorage.getItem('student_portal_posts');
        if (!d) {
          localStorage.setItem('student_portal_posts', JSON.stringify(INITIAL_POSTS));
          return INITIAL_POSTS;
        }
        return JSON.parse(d);
      } catch (e) {
        return INITIAL_POSTS;
      }
    }

    function savePosts(p) {
      localStorage.setItem('student_portal_posts', JSON.stringify(p));
    }

    function loadCurrentUser() {
      try {
        const d = localStorage.getItem('student_portal_current_user');
        if (!d) return null;
        const u = JSON.parse(d);
        if (u.role === 'admin' || u.studentId === 'ADMIN001') return ADMIN_DATA;
        return u;
      } catch (e) {
        return null;
      }
    }

    function saveCurrentUser(u) {
      if (!u) localStorage.removeItem('student_portal_current_user');
      else localStorage.setItem('student_portal_current_user', JSON.stringify(u));
    }

    // ==========================================
    // ৩. অ্যাপ স্টেট
    // ==========================================
    let state = {
      users: loadUsers(),
      posts: loadPosts(),
      currentUser: loadCurrentUser(),
      authMode: 'user_login', // 'user_login' | 'admin_login' | 'register'
      activeView: 'feed',     // 'feed' | 'admin'
      searchQuery: '',
      postContent: '',
      postImageUrl: '',
      showImageInput: false,
      selectedStudentForProfile: null,
      authError: '',
      cloudStatus: 'connecting' // 'connecting' | 'connected' | 'offline'
    };

    // ==========================================
    // ৩.১ ফায়ারবেস ক্লাউড ফায়ারস্টোর রিয়েল-টাইম সিঙ্ক
    // ==========================================
    let isFirebaseSyncInitialized = false;

    function initFirebaseSync() {
      if (!window.firebaseDb || !window.fb || isFirebaseSyncInitialized) return;
      isFirebaseSyncInitialized = true;
      const db = window.firebaseDb;
      const { collection, onSnapshot, doc, setDoc } = window.fb;

      // ১. রিয়েল-টাইমে পোস্ট সিঙ্ক (সব মোবাইল ও ডিভাইসের জন্য)
      try {
        const postsCol = collection(db, 'posts');
        onSnapshot(postsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPosts = [];
            snapshot.forEach(docSnap => {
              cloudPosts.push({ id: docSnap.id, ...docSnap.data() });
            });
            // লেটেস্ট পোস্ট সবার আগে সাজানো
            cloudPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.posts = cloudPosts;
            savePosts(cloudPosts);
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ক্লাউড সম্পূর্ণ খালি থাকলে প্রাথমিক পোস্ট ক্লাউডে জমা করা
            INITIAL_POSTS.forEach(p => {
              setDoc(doc(db, 'posts', p.id), { ...p, timestamp: Date.now() }).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase posts onSnapshot note:', error);
          state.cloudStatus = 'offline';
          renderApp();
        });
      } catch (err) {
        console.warn('Posts listener exception:', err);
      }

      // ২. রিয়েল-টাইমে ইউজার ও ভেরিফিকেশন ডাটা সিঙ্ক
      try {
        const usersCol = collection(db, 'users');
        onSnapshot(usersCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudUsers = [];
            snapshot.forEach(docSnap => {
              cloudUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            
            // এডমিন প্রোফাইল নিশ্চিত করা
            const hasAdmin = cloudUsers.some(u => u.role === 'admin' || u.studentId === 'ADMIN001');
            if (!hasAdmin) {
              cloudUsers.unshift(ADMIN_DATA);
              setDoc(doc(db, 'users', ADMIN_DATA.id), ADMIN_DATA).catch(console.warn);
            }

            state.users = cloudUsers;
            saveUsers(cloudUsers);

            // কারেন্ট সেশন ইউজারের তথ্য আপডেট
            if (state.currentUser) {
              const fresh = cloudUsers.find(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId);
              if (fresh) {
                state.currentUser = fresh;
                saveCurrentUser(fresh);
              }
            }
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ইনিশিয়াল ইউজারদের ফায়ারবেসে সিঙ্ক করা
            INITIAL_USERS.forEach(u => {
              setDoc(doc(db, 'users', u.id), u).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase users onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Users listener exception:', err);
      }
    }
    window.initFirebaseSync = initFirebaseSync;

    // ==========================================
    // ৪. নোটিফিকেশন ও ব্যাজ হেল্পার
    // ==========================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      const isError = type === 'error';
      const bg = isError ? 'bg-red-600' : isSuccess ? 'bg-[#5A5A40]' : 'bg-slate-800';
      
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>`;
    }

    // ==========================================
    // ৫. রেন্ডার ইঞ্জিন
    // ==========================================
    function renderApp() {
      const app = document.getElementById('app');
      if (!state.currentUser) {
        app.innerHTML = renderAuthScreen();
      } else if (state.activeView === 'admin') {
        app.innerHTML = renderNavbar() + renderAdminView();
      } else {
        app.innerHTML = renderNavbar() + renderFeedView();
      }
      if (window.lucide) lucide.createIcons();
    }

                  <!-- প্রোফাইল দেখা ও তথ্য পরিবর্তনের বাটন -->
                  <div class="mt-4 flex gap-2">
                    <button onclick="openProfileModal('${u.id}')" class="flex-1 py-2 px-2 bg-[#F5F5F0] hover:bg-[#E2E2D5] text-[#5A5A40] text-xs font-bold rounded-xl transition-colors border border-[#E2E2D5] flex items-center justify-center gap-1.5">
                      <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                      <span>প্রোফাইল</span>
                    </button>
                    <button onclick="openEditProfileModal('${u.id}')" class="flex-1 py-2 px-2 bg-[#5A5A40] hover:bg-[#4A4A33] text-white text-xs font-bold rounded-xl transition-colors shadow-xs flex items-center justify-center gap-1.5">
                      <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                      <span>তথ্য পরিবর্তন</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-2xl p-5 shadow-xs border border-[#E2E2D5]">
                <div class="flex items-center gap-2 mb-3">
                  <div class="p-1.5 rounded-lg bg-[#F5F5F0] text-[#5A5A40]">
                    <i data-lucide="award" class="w-4 h-4"></i>
                  </div>
                  <h4 class="font-bold text-xs sm:text-sm text-[#42422F]">ভেরিফাইড শিক্ষার্থী</h4>
                </div>
                <div class="space-y-2.5">
                  ${verifiedStudents.length === 0 ? '<p class="text-xs text-[#8A8A6A]">কোনো শিক্ষার্থী এখনো ভেরিফাইড হয়নি।</p>' : 
                    verifiedStudents.slice(0, 4).map(stu => `
                      <div onclick="openProfileModal('${stu.id}')" class="flex items-center justify-between p-2 rounded-xl hover:bg-[#F9F9F4] cursor-pointer transition-colors" title="${stu.fullName}-এর প্রোফাইল দেখুন">
                        <div class="flex items-center gap-2">
                          <img src="${stu.profilePicture}" class="w-8 h-8 rounded-full object-cover border border-[#E2E2D5]" />
                          <div>
                            <div class="font-semibold text-xs text-[#42422F] flex items-center gap-1">
                              <span>${stu.fullName}</span>
                              ${getVerifiedBadgeHTML('sm')}
                            </div>
                            <span class="text-[10px] font-mono text-[#8A8A6A]">ID: ${stu.studentId}</span>
                          </div>
                        </div>
                        <span class="text-[10px] font-semibold text-[#5A5A40] bg-[#F5F5F0] px-2 py-0.5 rounded">${stu.studentClass}</span>
                      </div>
                    `).join('')}
                </div>
              </div>
            </div>

            <!-- Right Feed Content -->
            <div class="lg:col-span-8 space-y-5">
              <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-xs border border-[#E2E2D5]">
                <form onsubmit="handleCreatePost(event)">
                  <div class="flex gap-3">
                    <img src="${u.profilePicture}" class="w-10 h-10 rounded-full object-cover border border-[#E2E2D5] shrink-0 cursor-pointer" onclick="openProfileModal('${u.id}')" />
                    <div class="flex-1">
                      <textarea id="new-post-content" rows="3" required placeholder="ক্যাম্পাসের স্মৃতি, পড়াশোনার প্রশ্ন বা যেকোনো আপডেট শেয়ার করুন..." class="w-full p-3 rounded-xl bg-[#F5F5F0] border border-[#E2E2D5] text-[#42422F] placeholder-[#8A8A6A] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-[#5A5A40] focus:bg-white resize-none"></textarea>
                    </div>
                  </div>

                  <div id="post-image-input-container" class="mt-3 ${state.showImageInput ? '' : 'hidden'}">
                    <div class="flex items-center gap-2 bg-[#F5F5F0] p-2 rounded-xl border border-[#E2E2D5]">
                      <i data-lucide="image" class="w-4 h-4 text-[#8A8A6A]"></i>
                      <input id="new-post-img-url" type="url" placeholder="ছবির URL দিন (যেমন: https://...)" class="w-full bg-transparent text-xs sm:text-sm text-[#42422F] focus:outline-none" />
                    </div>
                  </div>

                  <div class="mt-3 pt-3 border-t border-[#F0F0E0] flex items-center justify-between">
                    <button type="button" onclick="togglePostImageInput()" class="flex items-center gap-1.5 text-xs text-[#5A5A40] hover:text-[#42422F] font-semibold px-3 py-1.5 rounded-lg hover:bg-[#F5F5F0] transition-colors">
                      <i data-lucide="image" class="w-4 h-4"></i>
                      <span>ছবি যুক্ত করুন</span>
                    </button>

                    <button type="submit" class="px-5 py-2 rounded-xl text-white text-xs sm:text-sm font-bold bg-[#5A5A40] hover:bg-[#4A4A33] shadow-xs flex items-center gap-1.5 transition-all">
                      <i data-lucide="send" class="w-3.5 h-3.5"></i>
                      <span>পোস্ট করুন</span>
                    </button>
                  </div>
                </form>
              </div>

              <div class="flex items-center justify-between px-1">
                <h3 class="text-xs sm:text-sm font-bold text-[#42422F] flex items-center gap-2">
                  <i data-lucide="book-open" class="w-4 h-4 text-[#5A5A40]"></i>
                  <span>সকল শিক্ষার্থীর শেয়ারকৃত পোস্ট (${state.posts.length})</span>
                </h3>
                <span class="text-[11px] text-[#8A8A6A]">সর্বশেষ পোস্ট আগে</span>
              </div>

              <div class="space-y-4">
                ${state.posts.length === 0 ? `
                  <div class="bg-white rounded-2xl p-12 text-center border border-[#E2E2D5]">
                    <i data-lucide="megaphone" class="w-10 h-10 text-[#8A8A6A] mx-auto mb-3 opacity-60"></i>
                    <h4 class="text-base font-bold text-[#42422F]">এখনো কোনো পোস্ট করা হয়নি</h4>
                  </div>
                ` : state.posts.map(post => renderPostCard(post)).join('')}
              </div>
            </div>

          </div>
        </main>
      `;
    }

    // পোস্ট কার্ড ভিউ
    function renderPostCard(post) {
      const u = state.currentUser;
      const isAuthor = post.authorStudentId === u.studentId;
      const isAdmin = u.role === 'admin';
      const canDelete = isAuthor || isAdmin;
      const isLiked = post.likes && post.likes.includes(u.studentId);
      const authorIdentifier = post.authorStudentId || post.authorId;

      return `
        <div class="bg-white rounded-2xl shadow-xs border border-[#E2E2D5] overflow-hidden transition-all">
          <div class="p-4 sm:p-5">
            <!-- Header (ক্লিক করে প্রোফাইল দেখার ব্যবস্থা) -->
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3 cursor-pointer group" onclick="openProfileModal('${authorIdentifier}')" title="${post.authorName}-এর প্রোফাইল দেখুন">
                <img src="${post.authorAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200'}" class="w-10 h-10 rounded-full object-cover border border-[#E2E2D5] group-hover:ring-2 group-hover:ring-[#5A5A40] transition-all" />
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xs sm:text-sm text-[#42422F] group-hover:text-[#5A5A40] group-hover:underline">${post.authorName}</span>
                    ${getVerifiedBadgeHTML('sm')}
                  </div>
                  <div class="flex items-center gap-2 text-[11px] text-[#8A8A6A]">
                    <span class="font-mono bg-[#F5F5F0] px-1.5 py-0.2 rounded border border-[#E2E2D5]">ID: ${post.authorStudentId}</span>
                    <span>•</span>
                    <span>${post.createdAt}</span>
                  </div>
                </div>
              </div>

              ${canDelete ? `
                <button onclick="handleDeletePost('${post.id}')" title="পোস্ট ডিলিট করুন" class="p-1.5 text-[#8A8A6A] hover:text-red-600 rounded-lg hover:bg-red-50 transition-colors">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              ` : ''}
            </div>

            <!-- Content Body -->
            <p class="text-xs sm:text-sm text-[#42422F] whitespace-pre-line leading-relaxed mb-3">${post.content}</p>

            ${post.imageUrl ? `
              <div class="rounded-xl overflow-hidden mb-3 border border-[#E2E2D5]">
                <img src="${post.imageUrl}" class="w-full max-h-96 object-cover" />
              </div>
            ` : ''}

            <!-- Post Reactions Bar -->
            <div class="pt-3 border-t border-[#F0F0E0] flex items-center justify-between text-xs">
              <div class="flex items-center gap-3">
                <button onclick="handleToggleLike('${post.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-colors font-semibold ${isLiked ? 'text-blue-600 bg-blue-50' : 'text-[#8A8A6A] hover:bg-[#F5F5F0]' }">
                  <i data-lucide="thumbs-up" class="w-4 h-4 ${isLiked ? 'fill-blue-600' : ''}"></i>
                  <span>${(post.likes || []).length} পছন্দ</span>
                </button>
                <span class="text-[#8A8A6A] flex items-center gap-1">
                  <i data-lucide="message-square" class="w-4 h-4"></i>
                  <span>${(post.comments || []).length} মন্তব্য</span>
                </span>
              </div>
            </div>

            <!-- Comments Section -->
            <div class="mt-3 pt-3 border-t border-[#F0F0E0] space-y-2.5">
              ${(post.comments || []).map(c => {
                const commentAuthorId = c.authorStudentId || c.authorId;
                return `
                <div class="flex items-start gap-2 bg-[#F9F9F4] p-2.5 rounded-xl border border-[#F0F0E0]">
                  <img onclick="openProfileModal('${commentAuthorId}')" src="${c.authorAvatar}" class="w-6 h-6 rounded-full object-cover border border-[#E2E2D5] mt-0.5 cursor-pointer hover:ring-2 hover:ring-[#5A5A40] transition-all" title="${c.authorName}-এর প্রোফাইল দেখুন" />
                  <div class="flex-1 text-xs">
                    <div class="flex items-center justify-between">
                      <span onclick="openProfileModal('${commentAuthorId}')" class="font-bold text-[#42422F] cursor-pointer hover:underline hover:text-[#5A5A40]">${c.authorName}</span>
                      <span class="text-[10px] text-[#8A8A6A]">${c.createdAt}</span>
                    </div>
                    <p class="text-[#42422F] mt-0.5">${c.content}</p>
                  </div>
                </div>
              `;}).join('')}

              <!-- Add Comment Input -->
              <form onsubmit="handleAddComment(event, '${post.id}')" class="flex items-center gap-2 mt-2">
                <input id="comment-input-${post.id}" required placeholder="একটি মন্তব্য লিখুন..." class="flex-1 px-3 py-1.5 rounded-xl bg-[#F5F5F0] border border-[#E2E2D5] text-xs text-[#42422F] focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#5A5A40]" />
                <button type="submit" class="px-3 py-1.5 rounded-xl bg-[#5A5A40] text-white text-xs font-semibold hover:bg-[#4A4A33] transition-colors">মন্তব্য</button>
              </form>
            </div>

          </div>
        </div>
      `;
    }

    // অ্যাডমিন প্যানেল ভিউ
    function renderAdminView() {
      const students = state.users.filter(u => u.role !== 'admin');
      const filtered = students.filter(s => {
        if (!state.searchQuery) return true;
        const q = state.searchQuery.toLowerCase();
        return s.fullName.toLowerCase().includes(q) ||
               s.studentId.toLowerCase().includes(q) ||
               s.roll.toLowerCase().includes(q) ||
               s.studentClass.toLowerCase().includes(q);
      });

      const totalStudents = students.length;
      const verifiedCount = students.filter(s => s.isVerified).length;
      const pendingCount = totalStudents - verifiedCount;

      return `
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white p-4 rounded-2xl border border-[#E2E2D5] shadow-xs">
              <span class="text-xs text-[#8A8A6A] font-semibold block">মোট শিক্ষার্থী</span>
              <span class="text-2xl font-bold text-[#42422F]">${totalStudents} জন</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-[#E2E2D5] shadow-xs">
              <span class="text-xs text-blue-600 font-semibold block">ভেরিফাইড শিক্ষার্থী</span>
              <span class="text-2xl font-bold text-blue-700">${verifiedCount} জন</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-[#E2E2D5] shadow-xs">
              <span class="text-xs text-amber-600 font-semibold block">অপেক্ষমাণ আবেদন</span>
              <span class="text-2xl font-bold text-amber-600">${pendingCount} জন</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-[#E2E2D5] shadow-xs">
              <span class="text-xs text-[#5A5A40] font-semibold block">মোট পোস্ট</span>
              <span class="text-2xl font-bold text-[#5A5A40]">${state.posts.length} টি</span>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-[#E2E2D5] shadow-xs overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-[#F0F0E0] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 class="font-bold text-base text-[#42422F]">শিক্ষার্থী তালিকা ও ভেরিফিকেশন নিয়ন্ত্রণ</h3>
                <p class="text-xs text-[#8A8A6A]">যেকোনো শিক্ষার্থীর ব্লু ভেরিফাইড টিক চিহ্ন প্রদান বা বাতিল করুন</p>
              </div>

              <div class="relative w-full sm:w-64">
                <i data-lucide="search" class="w-4 h-4 text-[#8A8A6A] absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input id="admin-search" oninput="handleAdminSearch(this.value)" value="${state.searchQuery}" placeholder="নাম বা আইডি দিয়ে খুঁজুন..." class="w-full pl-9 pr-3 py-1.5 bg-[#F5F5F0] border border-[#E2E2D5] rounded-xl text-xs text-[#42422F] focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#5A5A40]" />
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-[#42422F]">
                <thead class="bg-[#F9F9F4] text-[#8A8A6A] uppercase font-bold text-[11px] border-b border-[#F0F0E0]">
                  <tr>
                    <th class="p-3.5">শিক্ষার্থী</th>
                    <th class="p-3.5">ক্লাস ও রোল</th>
                    <th class="p-3.5">মোবাইল ও ইমেইল</th>
                    <th class="p-3.5">রক্তের গ্রুপ</th>
                    <th class="p-3.5">স্ট্যাটাস</th>
                    <th class="p-3.5 text-right">অ্যাকশন</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#F0F0E0]">
                  ${filtered.length === 0 ? `
                    <tr>
                      <td colspan="6" class="p-8 text-center text-[#8A8A6A]">কোনো শিক্ষার্থী পাওয়া যায়নি</td>
                    </tr>
                  ` : filtered.map(s => `
                    <tr class="hover:bg-[#F9F9F4] transition-colors">
                      <td class="p-3.5">
                        <div class="flex items-center gap-2.5 cursor-pointer group" onclick="openProfileModal('${s.id}')" title="${s.fullName}-এর প্রোফাইল দেখুন">
                          <img src="${s.profilePicture}" class="w-8 h-8 rounded-full object-cover border border-[#E2E2D5] group-hover:ring-2 group-hover:ring-[#5A5A40] transition-all" />
                          <div>
                            <div class="font-bold flex items-center gap-1 group-hover:underline group-hover:text-[#5A5A40]">
                              <span>${s.fullName}</span>
                              ${s.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                            </div>
                            <span class="text-[10px] font-mono text-[#8A8A6A]">ID: ${s.studentId}</span>
                          </div>
                        </div>
                      </td>
                      <td class="p-3.5 font-medium">
                        <div>${s.studentClass}</div>
                        <div class="text-[#8A8A6A] text-[11px]">রোল: ${s.roll} | শাখা: ${s.section}</div>
                      </td>
                      <td class="p-3.5">
                        <div class="font-mono text-[11px]">${s.mobileNumber}</div>
                        <div class="text-[#8A8A6A] text-[11px]">${s.email}</div>
                      </td>
                      <td class="p-3.5 font-bold text-rose-600">${s.bloodGroup || 'O+'}</td>
                      <td class="p-3.5">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${s.isVerified ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">
                          ${s.isVerified ? 'ভেরিফাইড' : 'অপেক্ষমাণ'}
                        </span>
                      </td>
                      <td class="p-3.5 text-right space-x-1.5 whitespace-nowrap">
                        <button onclick="handleToggleVerify('${s.id}')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-colors ${s.isVerified ? 'bg-amber-50 text-amber-700 hover:bg-amber-100' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}">
                          ${s.isVerified ? 'আনভেরিফাই' : 'ভেরিফাই করুন'}
                        </button>
                        <button onclick="openProfileModal('${s.id}')" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F5F5F0] hover:bg-[#E2E2D5] text-[#5A5A40] transition-colors">
                          প্রোফাইল
                        </button>
                        <button onclick="openEditProfileModal('${s.id}')" title="তথ্য এডিট করুন" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#5A5A40] hover:bg-[#4A4A33] text-white transition-colors">
                          এডিট
                        </button>
                        <button onclick="handleDeleteStudent('${s.id}')" class="px-2 py-1 rounded-lg text-xs font-bold text-red-600 hover:bg-red-50 transition-colors">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5 inline"></i>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </main>
      `;
    }

    // ==========================================
    // ৬. প্রোফাইল দেখা ও এডিট করার মোডাল
    // ==========================================
    function openProfileModal(identifier) {
      if (!identifier) return;
      const cleanId = String(identifier).trim().toLowerCase();
      const user = state.users.find(u => 
        (u.id && u.id.toLowerCase() === cleanId) || 
        (u.studentId && u.studentId.toLowerCase() === cleanId)
      );
      if (!user) {
        showToast('শিক্ষার্থীর প্রোফাইল তথ্য পাওয়া যায়নি', 'error');
        return;
      }

      const modalContainer = document.getElementById('modal-container');

      modalContainer.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
          <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-[#E2E2D5] overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <!-- Modal Header -->
            <div class="bg-[#5A5A40] text-white p-5 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <img src="${user.profilePicture}" class="w-12 h-12 rounded-full object-cover border-2 border-white/40 shadow-xs" />
                <div>
                  <h3 class="font-bold text-base flex items-center gap-1.5">
                    <span>${user.fullName}</span>
                    ${user.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                  </h3>
                  <span class="text-xs text-[#D1D1C2] font-mono">ID: ${user.studentId} • ${user.studentClass}</span>
                </div>
              </div>
              <button onclick="closeProfileModal()" class="p-1 rounded-lg hover:bg-white/20 text-white transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Modal Content -->
            <div class="p-5 max-h-[75vh] overflow-y-auto space-y-4 text-xs text-[#42422F]">
              
              <!-- Academic Info -->
              <div class="bg-[#F9F9F4] p-3.5 rounded-xl border border-[#F0F0E0]">
                <h4 class="font-bold text-[#5A5A40] mb-2 uppercase text-[11px] tracking-wider">শিক্ষা সংক্রান্ত তথ্য</h4>
                <div class="grid grid-cols-2 gap-2">
                  <div><span class="text-[#8A8A6A]">শ্রেণি:</span> <strong>${user.studentClass}</strong></div>
                  <div><span class="text-[#8A8A6A]">রোল:</span> <strong>${user.roll}</strong></div>
                  <div><span class="text-[#8A8A6A]">শাখা:</span> <strong>${user.section}</strong></div>
                  <div><span class="text-[#8A8A6A]">শিফট:</span> <strong>${user.shift}</strong></div>
                </div>
              </div>

              <!-- Personal Info -->

    function updateEditAvatarPreview(url) {
      const preview = document.getElementById('edit-avatar-preview');
      if (preview) {
        preview.src = url.trim() || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400';

    function handleUpdateProfile(e, userId) {
      e.preventDefault();
      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      const newPic = document.getElementById('edit-profile-picture').value.trim();
      const newName = document.getElementById('edit-name').value.trim();
      const newFather = document.getElementById('edit-father').value.trim();
      const newMother = document.getElementById('edit-mother').value.trim();
      const newClass = document.getElementById('edit-class').value;
      const newRoll = document.getElementById('edit-roll').value.trim();
      const newSection = document.getElementById('edit-section').value.trim();
      const newShift = document.getElementById('edit-shift').value;
      const newDob = document.getElementById('edit-dob').value;
      const newBlood = document.getElementById('edit-blood').value;
      const newReligion = document.getElementById('edit-religion').value;
      const newBirthReg = document.getElementById('edit-birth-reg').value.trim();
      const newPresent = document.getElementById('edit-present').value.trim();
      const newPermanent = document.getElementById('edit-permanent').value.trim();
      const newMobile = document.getElementById('edit-mobile').value.trim();
      const newEmail = document.getElementById('edit-email').value.trim();
      const newFb = document.getElementById('edit-fb').value.trim();
      const newPass = document.getElementById('edit-password').value.trim();

      user.fullName = newName;
      if (newPic) user.profilePicture = newPic;
      user.fatherName = newFather;
      user.motherName = newMother;
      user.studentClass = newClass;
      user.roll = newRoll;
      user.section = newSection;
      user.shift = newShift;
      user.dateOfBirth = newDob;
      user.bloodGroup = newBlood;
      user.religion = newReligion;
      user.birthRegistrationNumber = newBirthReg;
      user.presentAddress = newPresent;
      user.permanentAddress = newPermanent;
      user.mobileNumber = newMobile;
      user.email = newEmail;
      user.facebookLink = newFb;
      if (newPass) {
        user.password = newPass;
      }

      // Update author details on all existing posts & comments by this user
      state.posts.forEach(p => {
        if (p.authorId === user.id || p.authorStudentId === user.studentId) {
          p.authorName = user.fullName;
          p.authorAvatar = user.profilePicture;
        }
        if (p.comments) {
          p.comments.forEach(c => {
            if (c.authorId === user.id || c.authorStudentId === user.studentId) {
              c.authorName = user.fullName;
              c.authorAvatar = user.profilePicture;
            }
          });
        }
      });

      // Update current session user if editing own profile
      if (state.currentUser.id === user.id) {
        state.currentUser = { ...user };
        saveCurrentUser(state.currentUser);
      }

      saveUsers(state.users);
      savePosts(state.posts);

      closeProfileModal();
      showToast('আপনার তথ্য সফলভাবে পরিবর্তন ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Sync updated user to Cloud Firestore
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.id), user, { merge: true }).catch(console.warn);
      }
    }

    function handleLoginSubmit(e, isAdmin) {
      e.preventDefault();
      const id = document.getElementById('login-id').value.trim().toUpperCase();
      const mobile = document.getElementById('login-mobile').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      const user = state.users.find(u => 
        u.studentId.toUpperCase() === id &&
        u.mobileNumber === mobile &&
        u.password === pass
      );

      if (!user) {
        state.authError = 'আইডি, মোবাইল নম্বর অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      if (isAdmin && user.role !== 'admin') {
        state.authError = 'এই আইডি অ্যাডমিন সুবিধাপ্রাপ্ত নয়!';
        renderApp();
        return;
      }

      state.currentUser = user;
      saveCurrentUser(user);
      state.activeView = user.role === 'admin' ? 'admin' : 'feed';
      showToast(`${user.fullName}, আপনাকে স্বাগতম!`, 'success');
      renderApp();
    }

    function updateAvatarPreview(url) {
      const preview = document.getElementById('reg-avatar-preview');
      if (preview) {
        preview.src = url.trim() || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80';
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const password = document.getElementById('reg-pass').value;
      const confirmPassword = document.getElementById('reg-confirm-pass').value;

      if (password !== confirmPassword) {
        state.authError = 'দুইটি পাসওয়ার্ড মিলছে না!';
        renderApp();
        return;
      }

      const newId = document.getElementById('reg-student-id').value.trim().toUpperCase();
      if (state.users.some(u => u.studentId.toUpperCase() === newId)) {
        state.authError = 'এই স্টুডেন্ট আইডি দিয়ে ইতিমধ্যে অ্যাকাউন্ট তৈরি করা আছে!';
        renderApp();
        return;
      }

      const picInput = document.getElementById('reg-profile-picture');
      const profilePicUrl = (picInput && picInput.value.trim()) 
        ? picInput.value.trim() 
        : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80';

      const newUser = {
        id: 'user_' + Date.now(),
        studentId: newId,
        fullName: document.getElementById('reg-name').value.trim(),
        fatherName: document.getElementById('reg-father').value.trim(),
        motherName: document.getElementById('reg-mother').value.trim(),
        studentClass: document.getElementById('reg-class').value,
        roll: document.getElementById('reg-roll').value.trim(),
        section: document.getElementById('reg-section').value.trim(),
        shift: document.getElementById('reg-shift').value,
        birthRegistrationNumber: document.getElementById('reg-birth-reg').value.trim(),
        dateOfBirth: document.getElementById('reg-dob').value,
        bloodGroup: document.getElementById('reg-blood').value,
        religion: document.getElementById('reg-religion').value,
        presentAddress: document.getElementById('reg-present').value.trim(),
        permanentAddress: document.getElementById('reg-permanent').value.trim(),
        mobileNumber: document.getElementById('reg-mobile').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        facebookLink: document.getElementById('reg-fb').value.trim(),
        password: password,
        profilePicture: profilePicUrl,
        isVerified: false,
        role: 'student',
        createdAt: new Date().toISOString()
      };

      state.users.push(newUser);
      saveUsers(state.users);
      state.currentUser = newUser;
      saveCurrentUser(newUser);
      state.activeView = 'feed';
      showToast('রেজিস্ট্রেশন সফল হয়েছে!', 'success');
      renderApp();

      // Save user to Cloud Firestore in Realtime
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', newUser.id), newUser);
          showToast('একাউন্ট ক্লাউডে সফলভাবে যুক্ত হয়েছে!', 'success');
        } catch (err) {
          console.warn('Firebase registration sync note:', err);
        }
      }
    }

    function handleLogout() {
      state.currentUser = null;
      saveCurrentUser(null);
      state.authMode = 'user_login';
      showToast('লগআউট সম্পন্ন হয়েছে', 'info');
      renderApp();
    }

    function switchView(v) {
      state.activeView = v;
      renderApp();
    }

    function togglePostImageInput() {
      state.showImageInput = !state.showImageInput;
      const el = document.getElementById('post-image-input-container');
      if (el) el.classList.toggle('hidden', !state.showImageInput);
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const content = document.getElementById('new-post-content').value.trim();
      const imgInput = document.getElementById('new-post-img-url');
      const imageUrl = imgInput ? imgInput.value.trim() : '';

      if (!content) return;

      const dateStr = new Date().toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
      const newPost = {
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: content,
        imageUrl: imageUrl || '',
        likes: [],
        comments: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      document.getElementById('new-post-content').value = '';
      if (imgInput) imgInput.value = '';
      state.showImageInput = false;

      // Save directly to Firebase Firestore for all mobiles & devices
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'posts'), newPost);
          showToast('নতুন পোস্ট রিয়েল-টাইমে ক্লাউডে শেয়ার হয়েছে!', 'success');
        } catch (err) {
          console.error('Firestore addDoc error:', err);
          state.posts.unshift({ id: 'post_' + Date.now(), ...newPost });
          savePosts(state.posts);
          showToast('পোস্ট হয়েছে (লোকাল মেমোরি)। ফায়ারবেস রুলস চেক করুন!', 'error');
          renderApp();
        }
      } else {
        state.posts.unshift({ id: 'post_' + Date.now(), ...newPost });
        savePosts(state.posts);
        showToast('নতুন পোস্ট প্রকাশিত হয়েছে!', 'success');
        renderApp();
      }
    }

    async function handleDeletePost(postId) {
      if (!confirm('আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?')) return;
      state.posts = state.posts.filter(p => p.id !== postId);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'posts', postId));
          showToast('পোস্ট ক্লাউড থেকে মুছে ফেলা হয়েছে', 'info');
        } catch (err) {
          console.warn('Delete post error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
        showToast('পোস্ট মুছে ফেলা হয়েছে', 'info');
      }
    }

    async function handleToggleLike(postId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const updatedLikes = [...(post.likes || [])];
      const idx = updatedLikes.indexOf(u.studentId);
      if (idx === -1) updatedLikes.push(u.studentId);
      else updatedLikes.splice(idx, 1);

      post.likes = updatedLikes;
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            likes: updatedLikes
          });
        } catch (err) {
          console.warn('Like sync error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
      }
    }

    async function handleAddComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('comment-input-' + postId);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const newComment = {
        id: 'c_' + Date.now(),
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: text,
        createdAt: 'এইমাত্র'
      };

      const updatedComments = [...(post.comments || []), newComment];
      post.comments = updatedComments;
      if (input) input.value = '';
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: updatedComments
          });
          showToast('মন্তব্য রিয়েল-টাইমে যোগ হয়েছে', 'success');
        } catch (err) {
          console.warn('Comment sync error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
        showToast('মন্তব্য যুক্ত হয়েছে', 'success');
      }
    }

    function handleAdminSearch(val) {
      state.searchQuery = val;
      renderApp();
    }

    async function handleToggleVerify(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      user.isVerified = !user.isVerified;
      saveUsers(state.users);
      showToast(`${user.fullName}-এর ভেরিফিকেশন স্ট্যাটাস আপডেট হয়েছে`, 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', user.id), {
            isVerified: user.isVerified
          });
        } catch (err) {
          console.warn('Verify sync error:', err);
        }
      }
    }

    async function handleDeleteStudent(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`${user.fullName}-এর একাউন্ট স্থায়ীভাবে ডিলিট করতে চান?`)) return;
      state.users = state.users.filter(u => u.id !== userId);
      saveUsers(state.users);
      showToast('শিক্ষার্থী সফলভাবে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', user.id));
        } catch (err) {
          console.warn('Delete user cloud error:', err);
        }
      }
    }

    // ==========================================
    // ৮. অ্যাপ্লিকেশন চালু করা
    // ==========================================
    renderApp();
    if (window.firebaseDb) {
      initFirebaseSync();
    }
  </script>
</body>
</html>
