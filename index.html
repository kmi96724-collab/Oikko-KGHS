                        <button type="button" onclick="refreshOikkoAgeCaptcha()" class="h-10 px-3 rounded-sm bg-[#f1f3f4] border border-[#d5d9dd] text-[#3c4043] text-[12px] font-semibold">↻ নতুন কোড</button>
                      </div>
                      <input id="oikko-age-captcha" inputmode="numeric" autocomplete="off" maxlength="2" class="mt-2 w-full h-10 border border-[#bfc7ce] rounded-sm bg-white px-3 text-[14px] outline-none focus:border-[#2f6f57] focus:ring-1 focus:ring-[#2f6f57]" placeholder="ছবির উত্তর লিখুন">
                    </div>

                    <div class="rounded-sm border border-[#e5e7eb] bg-white p-3">
                      <div class="text-[12px] font-semibold text-[#4b5563] mb-2">স্বয়ংক্রিয় যাচাই</div>
                      <p class="text-[12px] leading-5 text-[#6b7280]">Oikko আপনার লগইন করা অ্যাকাউন্টের তথ্যের সঙ্গে মিলিয়ে ফলাফল দেখাবে। এটি সরকারি BDRIS যাচাই নয়।</p>
                    </div>

                    <div class="rounded-sm border border-[#f0dca8] bg-[#fff9e8] px-3 py-2.5 text-[11px] leading-5 text-[#775b16]">
                      এই CAPTCHA ও বয়স যাচাই Oikko-এর নিজস্ব internal system। এটি BDRIS-এর সরকারি API নয় এবং সরকারি Birth Record-এর সত্যতা নিশ্চিত করে না।
                    </div>

                    <div id="oikko-tube-age-status" class="min-h-[20px] text-[12px] text-[#68756D]"></div>

                    <div class="border-t border-[#e5e7eb] pt-4 mt-5">
                      <div class="text-[13px] font-semibold text-[#202124] mb-3">Content mode</div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button type="button" onclick="selectOikkoTubeAgeGroup('under18')" id="oikko-age-under18" class="rounded-sm border border-[#bfc7ce] bg-white p-3 text-left hover:border-[#2f6f57] transition">
                          <div class="text-[14px] font-bold text-[#2f6f57]">১৮ বছরের নিচে</div>
                          <div class="text-[11px] text-[#6c786f] mt-1">শুধু Under-18 ভিডিও</div>
                        </button>
                        <button type="button" onclick="selectOikkoTubeAgeGroup('18plus')" id="oikko-age-18plus" class="rounded-sm border border-[#bfc7ce] bg-white p-3 text-left hover:border-[#b42318] transition">
                          <div class="text-[14px] font-bold text-[#b42318]">১৮+</div>
                          <div class="text-[11px] text-[#6c786f] mt-1">শুধু প্রাপ্তবয়স্কদের জন্য</div>
                        </button>
                      </div>
                    </div>

                    <div class="flex items-center justify-end gap-2 pt-2">
                      <button type="button" onclick="closeOikkoTubeAgeGate()" class="px-4 py-2 rounded-sm bg-[#f1f3f4] text-[#3c4043] font-semibold text-[13px]">বাতিল</button>
                      <button id="oikko-age-continue" type="submit" disabled class="px-5 py-2 rounded-sm bg-[#2f6f57] text-white font-semibold text-[13px] opacity-50 cursor-not-allowed">যাচাই ও চালিয়ে যান</button>
                    </div>
                  </form>
                </div>
              </div>
              <div class="text-center text-[11px] text-[#6b7280] py-4">Oikko Tube • Internal Age Verification</div>
            </div>
          </div>
        </div>`;

      if (window.lucide) lucide.createIcons();
      refreshOikkoAgeCaptcha();
      const captchaInput = document.getElementById('oikko-age-captcha');
      if (captchaInput) captchaInput.addEventListener('input', () => { captchaInput.value = captchaInput.value.replace(/\D/g, '').slice(0, 2); });
      const reg = document.getElementById('oikko-birth-reg');
      if (reg) reg.addEventListener('input', () => { reg.value = reg.value.replace(/\D/g, '').slice(0, 17); });
      setTimeout(() => { state.oikkoTubeAgeGateBusy = false; }, 50);
    }
    window.openOikkoTubeAgeGate = openOikkoTubeAgeGate;

    function submitOikkoTubeAgeVerification(event) {
      if (event) event.preventDefault();
      const reg = normalizeBirthReg(document.getElementById('oikko-birth-reg')?.value);
      const dob = String(document.getElementById('oikko-dob')?.value || '').trim();
      const status = document.getElementById('oikko-tube-age-status');
      const profile = getCurrentUserVerificationRecord();
      const selectedGroup = state.pendingOikkoTubeAgeGroup;
      const actualAge = calculateAgeFromDob(profile?.dateOfBirth);
      const captcha = String(document.getElementById('oikko-age-captcha')?.value || '').trim();

      if (!/^\d{17}$/.test(reg)) {
        if (status) { status.textContent = 'Birth Registration Number অবশ্যই ১৭ সংখ্যার হতে হবে।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) {
        if (status) { status.textContent = 'সঠিক Date of Birth দিন।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (captcha !== oikkoAgeCaptchaAnswer) {
        if (status) { status.textContent = 'CAPTCHA-এর উত্তর সঠিক নয়। নতুন কোড নিয়ে আবার চেষ্টা করুন।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (!profile?.birthRegistrationNumber || profile.birthRegistrationNumber === '***********' ||
          reg !== profile.birthRegistrationNumber || dob !== profile.dateOfBirth) {
        if (status) { status.textContent = 'তথ্য মেলেনি। আপনার Oikko Campus প্রোফাইলের তথ্য ঠিক আছে কি না দেখুন।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (actualAge === null) {
        if (status) { status.textContent = 'আপনার প্রোফাইলে বৈধ Date of Birth পাওয়া যায়নি।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (!selectedGroup) {
        if (status) { status.textContent = 'একটি Content mode নির্বাচন করুন।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (selectedGroup === '18plus' && actualAge < 18) {
        if (status) { status.textContent = 'আপনার বয়স ১৮ বছরের কম হওয়ায় ১৮+ mode ব্যবহার করা যাবে না।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }
      if (selectedGroup === 'under18' && actualAge >= 18) {
        if (status) { status.textContent = 'আপনার প্রোফাইল অনুযায়ী ১৮+ mode নির্বাচন করতে হবে।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }

      if (!saveOikkoTubeAgeVerification(selectedGroup)) {
        if (status) { status.textContent = 'বয়স যাচাই সংরক্ষণ করা যায়নি। আবার চেষ্টা করুন।'; status.className = 'min-h-[20px] text-[12px] text-red-600 font-semibold'; }
        return false;
      }

      state.pendingOikkoTubeAgeGroup = null;
      state.oikkoTubeAgeGateBusy = false;
      const modal = document.getElementById('modal-container');
      if (modal) modal.innerHTML = '';
      showToast(`বয়স যাচাই সফল হয়েছে — ${getOikkoTubeAudienceLabel(selectedGroup)} mode চালু`, 'success');
      renderApp();
      return false;
    }
    window.submitOikkoTubeAgeVerification = submitOikkoTubeAgeVerification;
    window.openOikkoTubeAgeGate = openOikkoTubeAgeGate;

    function selectOikkoTubeAgeGroup(ageGroup) {
      if (ageGroup !== 'under18' && ageGroup !== '18plus') return;
      state.pendingOikkoTubeAgeGroup = ageGroup;
      const under = document.getElementById('oikko-age-under18');
      const plus = document.getElementById('oikko-age-18plus');
      const cont = document.getElementById('oikko-age-continue');
      const status = document.getElementById('oikko-tube-age-status');
      [under, plus].forEach(el => {
        if (el) { el.classList.remove('border-[#2F6F57]', 'bg-[#EDF2EF]', 'border-red-500', 'bg-red-50'); }
      });
      const selected = ageGroup === '18plus' ? plus : under;
      if (selected) selected.classList.add(ageGroup === '18plus' ? 'border-red-500' : 'border-[#2F6F57]', ageGroup === '18plus' ? 'bg-red-50' : 'bg-[#EDF2EF]');
      if (cont) { cont.disabled = false; cont.classList.remove('opacity-50', 'cursor-not-allowed'); }
      if (status) status.textContent = ageGroup === '18plus' ? '১৮+ ভিডিও মোড নির্বাচন করা হয়েছে।' : '১৮ বছরের নিচের ভিডিও মোড নির্বাচন করা হয়েছে।';
    }
    window.selectOikkoTubeAgeGroup = selectOikkoTubeAgeGroup;

    function closeOikkoTubeAgeGate() {
      state.pendingOikkoTubeAgeGroup = null;
      state.oikkoTubeAgeGateBusy = false;
      const modal = document.getElementById('modal-container');
      if (modal) modal.innerHTML = '';
      if (state.activeView === 'youtube' && !state.oikkoTubeAgeVerified) {
        state.activeView = 'feed';
        renderApp();
      }
    }
    window.closeOikkoTubeAgeGate = closeOikkoTubeAgeGate;

    function confirmOikkoTubeAgeGate() {
      const ageGroup = state.pendingOikkoTubeAgeGroup;
      const status = document.getElementById('oikko-tube-age-status');
      if (ageGroup !== 'under18' && ageGroup !== '18plus') {
        if (status) { status.textContent = 'প্রথমে একটি বয়সের শ্রেণি নির্বাচন করুন।'; status.className = 'text-xs mt-3 min-h-[18px] text-red-600 font-semibold'; }
        return;
      }
      saveOikkoTubeAgeVerification(ageGroup);
      state.pendingOikkoTubeAgeGroup = null;
      const modal = document.getElementById('modal-container');
      if (modal) modal.innerHTML = '';
      if (window.showToast) showToast(ageGroup === '18plus' ? '১৮+ কনটেন্ট মোড চালু হয়েছে।' : '১৮ বছরের নিচের কনটেন্ট মোড চালু হয়েছে।', 'success');
      if (state.activeView === 'youtube') renderApp();
    }
    window.confirmOikkoTubeAgeGate = confirmOikkoTubeAgeGate;

    function ensureOikkoTubeAgeGate() {
      if (!state.currentUser || state.activeView !== 'youtube') return;
      if (!state.oikkoTubeAgeVerified) loadOikkoTubeAgeVerification();
      if (!state.oikkoTubeAgeVerified) openOikkoTubeAgeGate();
    }

    function getOikkoTubeVisibleVideos() {
      const q = String(state.oikkoTubeSearch || '').trim().toLowerCase();
      const profileAge = calculateAgeFromDob(state.currentUser?.dateOfBirth);
      const ageGroup = profileAge !== null
        ? (profileAge >= 18 ? '18plus' : 'under18')
        : state.oikkoTubeAgeGroup;

      const videos = (state.oikkoTubeVideos || []).filter(v => {
        if (ageGroup !== 'under18' && ageGroup !== '18plus') return false;
        const audience = String(v.audience || '').trim().toLowerCase();
        if (ageGroup === 'under18') return audience === 'under18';
        return audience === 'under18' || audience === '18plus';
      }).filter(v => {
        if (!q) return true;
        return [v.title, v.description, v.authorName, v.authorStudentId]
          .some(x => String(x || '').toLowerCase().includes(q));
      });

      return { videos, ageGroup };
    }

    function getOikkoTubeVideoCardHtml(v) {
      return `<article data-oikko-tube-video-id="${escapeHtml(v.id)}" class="oikko-tube-video-card rounded-3xl overflow-hidden">
        ${getOikkoTubeMediaHtml(v.videoUrl)}
        <div class="p-4">
          <h2 class="font-black text-[#EAF7F1] text-base sm:text-lg">${escapeHtml(v.title || 'ভিডিও')}</h2>
          ${v.description ? `<p class="text-xs text-[#A8B9B1] mt-1 whitespace-pre-wrap">${escapeHtml(v.description)}</p>` : ''}
          <div class="mt-2"><span class="inline-flex px-2 py-1 rounded-full text-[10px] font-extrabold ${v.audience === '18plus' ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-[#EDF2EF] text-[#2F6F57] border border-[#DCE7E0]'}">${getOikkoTubeAudienceLabel(v.audience)}</span></div>
          <div class="flex flex-wrap items-center justify-between gap-2 mt-3 text-[11px] text-[#8EA59B]"><span class="font-bold">${escapeHtml(v.authorName || v.authorStudentId || 'শিক্ষার্থী')}</span><span>${v.timestamp ? new Date(v.timestamp).toLocaleString('bn-BD') : ''}</span></div>
          ${String(v.authorId || '') === String(state.currentUser?.id || '') ? `<div class="flex justify-end flex-wrap gap-2 mt-3"><button type="button" onclick="openOikkoTubeEditModal('${escapeHtml(v.id)}')" class="px-3 py-2 rounded-xl bg-[#EDF2EF] hover:bg-[#E1EAE4] text-[#2F6F57] text-xs font-extrabold flex items-center gap-1.5"><i data-lucide="pencil" class="w-3.5 h-3.5"></i>শিরোনাম/বিষয়বস্তু পরিবর্তন</button><button type="button" onclick="openOikkoTubeDeleteModal('${escapeHtml(v.id)}')" class="px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 text-xs font-extrabold flex items-center gap-1.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i>ভিডিও ডিলিট</button></div>` : ''}
        </div>
      </article>`;
    }

    // Firestore live updates must not replace the existing video DOM. Moving an
    // existing <article> keeps native <video> currentTime and iframe players alive,
    // so a new post from another user no longer restarts the video being watched.
    function syncOikkoTubeVideoFeedDom() {
      const feed = document.querySelector('[data-oikko-tube-feed-list]');
      if (!feed || state.activeView !== 'youtube') return false;

      const { videos } = getOikkoTubeVisibleVideos();
      const wantedIds = new Set(videos.map(v => String(v.id)));
      const existing = new Map(Array.from(feed.querySelectorAll('[data-oikko-tube-video-id]')).map(el => [String(el.getAttribute('data-oikko-tube-video-id')), el]));

      // Remove cards that disappeared from Firestore / current filter.
      existing.forEach((el, id) => {
        if (!wantedIds.has(id)) el.remove();
      });

      // Insert new cards and move existing cards into the new Firestore order.
      let cursor = feed.firstElementChild;
      const added = [];
      videos.forEach(v => {
        const id = String(v.id);
        let el = existing.get(id);
        if (!el || !el.isConnected) {
          const holder = document.createElement('div');
          holder.innerHTML = getOikkoTubeVideoCardHtml(v).trim();
          el = holder.firstElementChild;
          if (!el) return;
          added.push(el);
        }
        if (el !== cursor) feed.insertBefore(el, cursor);
        cursor = el.nextElementSibling;
      });

      // Keep the loading/empty state correct without touching any video card.
      const statusNodes = Array.from(feed.children).filter(el => !el.hasAttribute('data-oikko-tube-video-id'));
      statusNodes.forEach(el => el.remove());
      if (!videos.length) {
        const empty = document.createElement('div');
        empty.className = 'oikko-tube-empty rounded-3xl p-10 text-center';
        empty.innerHTML = `<i data-lucide="video" class="w-10 h-10 mx-auto mb-2 opacity-60"></i><p class="font-bold">এই বয়সের শ্রেণিতে কোনো ভিডিও নেই</p><p class="text-xs mt-1">আপনার বয়সের অনুমোদিত শ্রেণির সঙ্গে না মিললে ভিডিওটি এখানে দেখানো হবে না।</p>`;
        feed.appendChild(empty);
      }

      if (window.lucide) lucide.createIcons();
      if (added.length) {
        added.forEach(el => hydrateOikkoTubeLinkPreviews(el));
      }
      return true;
    }

    function renderOikkoTubeView() {
      const { videos, ageGroup } = getOikkoTubeVisibleVideos();

      return `
        <main class="oikko-tube-page oikko-fullscreen-shell min-h-screen pb-24">
          <div class="oikko-tube-download-wrap max-w-5xl mx-auto px-3 sm:px-5 pt-3">
            <a href="https://appsgeyser.io/20177615/Oikko" target="_blank" rel="noopener noreferrer" class="oikko-tube-download w-full items-center justify-center rounded-2xl px-5 py-3.5 bg-[#D8F3E4] hover:bg-[#BFE8D0] text-[#12231C] font-black text-sm shadow-lg transition" aria-label="Download Oikko App">Download Oikko App</a>
          </div>
          <section class="max-w-5xl mx-auto px-3 sm:px-5 pt-4">
            <div class="oikko-tube-panel rounded-3xl p-4 sm:p-5">
              <div class="flex items-center justify-between gap-3 mb-4">
                <div class="min-w-0 flex items-center gap-2.5">
                  <button type="button" onclick="backToCampus()" class="oikko-tube-back w-10 h-10 shrink-0 rounded-2xl flex items-center justify-center transition cursor-pointer" title="Oikko Campus-এ ফিরে যান" aria-label="Back to Oikko Campus">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                  </button>
                  <div class="min-w-0">
                    <div class="flex items-center gap-2"><span class="oikko-tube-icon w-9 h-9 rounded-xl bg-[#2F6F57] text-white flex items-center justify-center"><i data-lucide="play" class="w-4 h-4"></i></span><h1 class="oikko-tube-title text-xl sm:text-2xl font-black truncate">Oikko Tube</h1></div>
                    <p class="oikko-tube-muted text-xs mt-1">ভিডিও দেখুন ও শেয়ার করুন — আপনার বয়স অনুযায়ী উপযুক্ত ভিডিও দেখানো হবে।</p>
                  </div>
                </div>
                <button type="button" onclick="openOikkoTubeUploadModal()" class="oikko-tube-post shrink-0 rounded-2xl bg-[#2F6F57] hover:bg-[#245844] text-white px-4 py-2.5 text-xs sm:text-sm font-extrabold flex items-center gap-1.5 shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i>ভিডিও পোস্ট</button>
              </div>
              <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="oikko-tube-chip px-2.5 py-1 rounded-full text-[11px] font-extrabold">দেখানো হচ্ছে: ${ageGroup === '18plus' ? 'সব ভিডিও (১৮+ সহ)' : 'শুধু ১৮ বছরের নিচের ভিডিও'}</span>
                <button type="button" onclick="clearOikkoTubeAgeVerification(); openOikkoTubeAgeGate();" class="oikko-tube-chip-secondary px-2.5 py-1 rounded-full text-[11px] font-bold">বয়স মোড পরিবর্তন</button>
              </div>
              <div class="oikko-tube-search flex items-center gap-2 rounded-2xl px-3 py-2.5">
                <i data-lucide="search" class="w-4 h-4 text-[#7A887E]"></i>
                <input value="${escapeHtml(state.oikkoTubeSearch || '')}" oninput="handleOikkoTubeSearch(this.value)" class="flex-1 bg-transparent outline-none text-sm" placeholder="ভিডিও, বিষয় বা শিক্ষার্থীর নাম খুঁজুন..." />
              </div>
            </div>
            <div data-oikko-tube-feed-list class="mt-4 space-y-4">
              ${oikkoTubeLastError ? `<div class="rounded-2xl border border-red-900/40 bg-red-950/20 text-red-300 px-4 py-3 text-xs">${escapeHtml(oikkoTubeLastError)}</div>` : ''}
              ${(!oikkoTubeLoaded && !videos.length) ? `<div class="rounded-2xl border border-emerald-900/30 bg-emerald-950/20 text-emerald-300 px-4 py-3 text-xs">Firestore থেকে ভিডিও লোড হচ্ছে…</div>` : ''}
              ${videos.length ? videos.map(v => getOikkoTubeVideoCardHtml(v)).join('') : `
                <div class="oikko-tube-empty rounded-3xl p-10 text-center"><i data-lucide="video" class="w-10 h-10 mx-auto mb-2 opacity-60"></i><p class="font-bold">এই বয়সের শ্রেণিতে কোনো ভিডিও নেই</p><p class="text-xs mt-1">আপনার বয়সের অনুমোদিত শ্রেণির সঙ্গে না মিললে ভিডিওটি এখানে দেখানো হবে না।</p></div>`}
            </div>
          </section>
        </main>`;
    }

    function handleOikkoTubeSearch(value) {
      state.oikkoTubeSearch = value || '';
      const active = document.activeElement;
      const wasInput = active && active.tagName === 'INPUT';
      renderApp();
      if (wasInput) {
        const inputs = document.querySelectorAll('input');
        const input = Array.from(inputs).find(x => x.placeholder && x.placeholder.includes('ভিডিও, বিষয়'));
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }
    window.handleOikkoTubeSearch = handleOikkoTubeSearch;

    function startOikkoTubeListener() {
      if (oikkoTubeUnsubscribe || !window.firebaseDb || !window.fb) return !!oikkoTubeUnsubscribe;
      try {
        const col = window.fb.collection(window.firebaseDb, 'oikko_tube_videos');
        oikkoTubeUnsubscribe = window.fb.onSnapshot(col, snap => {
          state.oikkoTubeVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(v => v.videoUrl && (v.status === 'published' || !v.status))
            .sort((a,b) => {
              const ta = Number(a.timestamp || a.createdAt || 0);
              const tb = Number(b.timestamp || b.createdAt || 0);
              return tb - ta;
            });
          oikkoTubeLoaded = true;
          oikkoTubeLastError = '';
          if (state.activeView === 'youtube') {
            // Do not call renderApp() here: replacing #app would destroy the
            // currently playing iframe/native video and restart it from 0:00.
            // Reconcile only the video cards, preserving existing media nodes.
            if (!syncOikkoTubeVideoFeedDom()) renderApp();
          }
        }, err => {
          oikkoTubeLastError = getTubeErrorMessage(err);
          console.error('Oikko Tube Firestore listener:', err);
        });
        return true;

    async function handleOikkoTubeUpload(event) {
      if (event) event.preventDefault();
      if (state.oikkoTubeUploadBusy) return false;

      const titleEl = document.getElementById('oikko-tube-title');
      const descEl = document.getElementById('oikko-tube-description');
      const urlEl = document.getElementById('oikko-tube-video-url');
      const submit = document.getElementById('oikko-tube-submit');

      const title = String(titleEl?.value || '').trim();
      const description = String(descEl?.value || '').trim();
      const videoUrl = String(urlEl?.value || '').trim();
      const audience = document.querySelector('input[name="oikko-tube-audience"]:checked')?.value === '18plus'
        ? '18plus' : 'under18';

      if (!state.currentUser) {
        setTubeUploadStatus('ভিডিও পোস্ট করতে আগে Oikko Campus-এ লগইন করুন।', 'error');
        return false;
      }
      if (!title) {
        setTubeUploadStatus('ভিডিওর শিরোনাম দিন।', 'error');
        titleEl?.focus();
        return false;
      }
      if (!videoUrl) {
        setTubeUploadStatus('ভিডিও URL দিন।', 'error');
        urlEl?.focus();
        return false;
      }

      let parsedUrl;
      try { parsedUrl = new URL(videoUrl); }
      catch (_) {
        setTubeUploadStatus('সঠিক http/https ভিডিও URL দিন।', 'error');
        return false;
      }

      if (!/^https?:$/.test(parsedUrl.protocol)) {
        setTubeUploadStatus('শুধু http/https URL ব্যবহার করুন।', 'error');
        return false;
      }
      if (videoUrl.length > OIKKO_TUBE_MAX_URL_LENGTH) {
        setTubeUploadStatus('ভিডিও URL অনেক বড়।', 'error');
        return false;
      }

      const db = window.firebaseDb;
      const fb = window.fb;
      if (!db || !fb?.collection || !fb?.addDoc) {
        setTubeUploadStatus('Firestore প্রস্তুত হয়নি। পেজটি refresh করে আবার চেষ্টা করুন।', 'error');
        return false;
      }

      state.oikkoTubeUploadBusy = true;
      if (submit) {
        submit.disabled = true;
        submit.textContent = 'পোস্ট হচ্ছে…';
      }

      document.getElementById('oikko-tube-progress-wrap')?.classList.remove('hidden');
      const progressBar = document.getElementById('oikko-tube-progress-bar');

    function normalizeCloudMessage(data) {
      const createdAt =
        typeof data.createdAt === 'number'
          ? data.createdAt
          : (data.createdAt && typeof data.createdAt.toMillis === 'function'
              ? data.createdAt.toMillis()
              : Date.now());

      return {
        id: data.id || ('cloud_' + createdAt + '_' + Math.random().toString(36).slice(2)),
        text: typeof data.text === 'string' ? data.text : '',
        imageUrl: typeof data.imageUrl === 'string' ? data.imageUrl : '',
        videoUrl: typeof data.videoUrl === 'string' ? data.videoUrl : '',
        mediaType: typeof data.mediaType === 'string' ? data.mediaType : (data.videoUrl ? 'video' : (data.imageUrl ? 'image' : 'text')),
        fileName: typeof data.fileName === 'string' ? data.fileName : '',
        fileSize: Number(data.fileSize || 0),
        sender: data.senderId === state.currentUser?.id ? 'me' : 'them',
        senderId: data.senderId || '',
        receiverId: data.receiverId || '',
        senderName: data.senderName || '',
        time: data.time || new Date(createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        createdAt
      };
    }

    async function subscribeToMessengerChat(targetUserId) {
      if (!state.currentUser || !canMessageUser(targetUserId)) return;

      // Authenticate before attaching the Firestore realtime listener.
      const firebaseUser = await ensureFirebaseCampusAuth(state.currentUser);
      if (!firebaseUser) return;

      const chatId = makeChatId(state.currentUser.id, targetUserId);
      if (messengerListenerChatId === chatId && messengerUnsubscribe) return;

      stopMessengerListener();

      const db = window.firebaseDb;
      const fb = window.fb;

      if (!db || !fb) {
        // Local fallback keeps the UI usable if Firestore is temporarily unavailable.
        if (!state.messages[targetUserId]) state.messages[targetUserId] = [];
        return;
      }

      const messagesRef = fb.collection(db, 'oikko_chats', chatId, 'messages');

      messengerListenerChatId = chatId;
      messengerUnsubscribe = fb.onSnapshot(
        messagesRef,
        snapshot => {
          // A chat document is shared by two users, but only messages whose
          // sender/receiver pair exactly matches the current conversation are
          // allowed into the UI. This prevents stale/malformed records from
          // appearing for a newly created account.
          const meId = String(state.currentUser.id);
          const targetId = String(targetUserId);
          const cloudMessages = snapshot.docs
            .map(d => normalizeCloudMessage({id: d.id, ...d.data()}))
            .filter(m => {
              const senderId = String(m.senderId || '');
              const receiverId = String(m.receiverId || '');
              return (senderId === meId && receiverId === targetId) ||
                     (senderId === targetId && receiverId === meId);
            })
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

          const localMessages = Array.isArray(state.messages[targetUserId]) ? state.messages[targetUserId] : [];
          const cloudIds = new Set(cloudMessages.map(m => m.id));
          const pendingLocal = localMessages.filter(m => {
            if (!m) return false;
            const senderId = String(m.senderId || '');
            const receiverId = String(m.receiverId || '');
            const belongsToPair = (senderId === meId && receiverId === targetId) ||
                                  (senderId === targetId && receiverId === meId) ||
                                  // Keep legacy local messages only when they are
                                  // explicitly marked as belonging to this user/chat.
                                  (!senderId && !receiverId && m.sender === 'me');
            if (!belongsToPair) return false;
            if (m.firebaseId && cloudIds.has(m.firebaseId)) return false;
            if (m.id && cloudIds.has(m.id)) return false;
            return true;
          });

          const merged = [...cloudMessages, ...pendingLocal];
          const seen = new Set();
          state.messages[targetUserId] = merged
            .filter(m => {
              const key = String(m.firebaseId || m.id || '');
              if (!key) return true;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            })
            .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
          saveMessages(state.messages);
          window.firestoreStatus = 'connected';
          if (state.activeView === 'messenger' && state.activeChatUserId === targetUserId) {
            renderMessengerOnly();
            scrollChatToBottom();
          }
        },
        err => {
          console.error('Messenger realtime sync error:', err);
          // Keep any local messages instead of replacing them on a transient error.
          window.firestoreStatus = 'error';
          if (err?.code === 'permission-denied') { showToast('Messenger Firestore Rules-এ oikko_chats/{chatId}/messages অনুমতি দিন।', 'error'); } else { showToast(`Firestore sync error: ${err?.code || 'unknown'}`, 'error'); }
        }
      );
    }

    }

    async function ensureFirebaseCampusAuth(campusUser, campusPassword) {
      // No Firebase Authentication, OTP, password provider, email verification or reCAPTCHA.

    async function persistMessengerMessage(targetUserId, payload) {
      if (!state.currentUser || !canMessageUser(targetUserId)) {
        showToast('শুধু Oikko Campus-এর নিবন্ধিত ব্যবহারকারীদের সাথেই চ্যাট করা যাবে', 'error');
        return false;
      }

      const now = Date.now();
      const timeStr = new Date(now).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const localId = 'local_' + now + '_' + Math.random().toString(36).slice(2,8);
      const messageData = {
        senderId: String(state.currentUser.id),
        receiverId: String(targetUserId),
        senderName: String(state.currentUser.fullName || ''),
        text: String(payload.text || ''),
        imageUrl: String(payload.imageUrl || ''),
        videoUrl: String(payload.videoUrl || ''),
        mediaType: payload.mediaType || (payload.videoUrl ? 'video' : (payload.imageUrl ? 'image' : 'text')),
        fileName: String(payload.fileName || ''),
        fileSize: Number(payload.fileSize || 0),
        time: timeStr,
        createdAt: now
      };

      // Show the message immediately in the UI.
      const localMessage = {
        id: localId,
        ...messageData,
        sender: 'me'
      };
      if (!state.messages[targetUserId]) state.messages[targetUserId] = [];
      state.messages[targetUserId].push(localMessage);
      saveMessages(state.messages);

      // The important part: write the SAME message to Cloud Firestore.
      const db = window.firebaseDb;
      const fb = window.fb;
      if (!db || !fb) {
        showToast('Firestore এখনো প্রস্তুত হয়নি। একটু পরে আবার পাঠান।', 'error');
        return true;
      }

      try {
        const chatId = makeChatId(state.currentUser.id, targetUserId);
        const messagesCollection = fb.collection(db, 'oikko_chats', chatId, 'messages');
        const cloudRef = await fb.addDoc(messagesCollection, messageData);

        localMessage.firebaseId = cloudRef.id;
        localMessage.id = cloudRef.id;
        window.firestoreStatus = 'connected';
        saveMessages(state.messages);

        try {
          await createMessengerNotification(targetUserId, {
            ...payload,
            senderId: state.currentUser.id,
            receiverId: targetUserId,
            senderName: state.currentUser.fullName || ''
          });
        } catch (notifyErr) {
          console.warn('Notification sync skipped:', notifyErr);
        }

        return true;
      } catch (err) {
        window.firestoreStatus = 'error';
        console.error('FIRESTORE MESSAGE WRITE FAILED:', err);
        console.error('code:', err?.code, 'message:', err?.message);
        showToast(`Firestore-এ পাঠানো যায়নি: ${err?.code || 'unknown'}`, 'error');
        return true;
      }
    }

    const MAX_MESSENGER_MEDIA_BYTES = 5 * 1024 * 1024 * 1024;

    function openMessengerMediaPicker(targetUserId) {

    async function handleMessengerMediaSelected(event, targetUserId) {
      const file = event?.target?.files?.[0];
      if (!file || !canMessageUser(targetUserId)) return;
      if (!/^image\/(.+)|^video\/(.+)$/.test(file.type)) {
        showToast('শুধু ছবি বা ভিডিও পাঠানো যাবে', 'error');
        return;
      }
      if (file.size > MAX_MESSENGER_MEDIA_BYTES) {
        showToast('একটি ছবি/ভিডিও সর্বোচ্চ ৫ GB হতে পারবে', 'error');
        return;
      }

      const storage = window.firebaseStorage;
      const api = window.firebaseStorageApi;
      if (!storage || !api) {
        showToast('Media upload চালু নেই। Firebase Storage সেটআপ করুন।', 'error');
        return;
      }

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const firebaseUser = await ensureFirebaseCampusAuth(state.currentUser);
      if (!firebaseUser?.uid) return;
      const path = `oikko_messenger_media/${firebaseUser.uid}/${targetUserId}/${Date.now()}_${safeName}`;
      const storageReference = api.storageRef(storage, path);
      const uploadTask = api.uploadBytesResumable(storageReference, file, {
        contentType: file.type,
        customMetadata: {
          senderId: String(state.currentUser.id),
          receiverId: String(targetUserId),
          originalName: file.name
        }
      });

          <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
            ${regField('রোল', 'reg-roll', 'text', 'যেমন: ০৫')}

            <div>
              <label class="block text-xs font-bold text-[#42422F] mb-1">শিফট *</label>

              <option value="ইসলাম">ইসলাম</option><option value="সনাতন">সনাতন</option><option value="খ্রিস্টান">খ্রিস্টান</option><option value="বৌদ্ধ">বৌদ্ধ</option><option value="অন্যান্য">অন্যান্য</option>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">

    function handleWorkSelection(work) {
      const host = document.getElementById('reg-dynamic-fields');
      if (!host) return;
      if (!work) {
        host.innerHTML = '';
        return;
      }

      if (work === 'student') {
        host.innerHTML = renderStudentDynamicFields();
      } else {
        // Bachelor follows the same non-academic information flow because
        // no separate bachelor field set was specified.
        host.innerHTML = renderWorkerBachelorFields();
      }

      if (window.lucide) lucide.createIcons();
    }
    window.handleWorkSelection = handleWorkSelection;

    function handleStudentClassSelection(studentClass) {
      const host = document.getElementById('reg-student-academic-fields');
      if (!host) return;
      host.innerHTML = renderStudentAcademicFields(studentClass);
      if (window.lucide) lucide.createIcons();
    }
    window.handleStudentClassSelection = handleStudentClassSelection;

              <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-white/10 text-[11px] font-medium border border-white/10" title="ফায়ারবেস ক্লাউড স্ট্যাটাস">
                <span class="w-2 h-2 rounded-full ${state.cloudStatus === 'connected' ? 'bg-emerald-400 animate-pulse' : state.cloudStatus === 'connecting' ? 'bg-amber-400' : 'bg-rose-400'}"></span>
                <span class="hidden sm:inline">${state.cloudStatus === 'connected' ? 'অনলাইন' : state.cloudStatus === 'connecting' ? 'সংযুক্ত হচ্ছে...' : 'অফলাইন'}</span>
              </div>
              
              <!-- Notification Bell Button -->
              <button onclick="requestNotificationPermission()" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-colors cursor-pointer" title="ডিভাইস নোটিফিকেশন সক্রিয় করুন">
                <i data-lucide="bell" class="w-4 h-4"></i>
              </button>

              <!-- Dark Mode Toggle Button -->
              <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-colors cursor-pointer" title="${state.isDarkMode ? 'লাইট মোডে পরিবর্তন করুন' : 'ডার্ক মোড সক্রিয় করুন'}">
                <i data-lucide="${state.isDarkMode ? 'sun' : 'moon'}" class="w-4 h-4"></i>
              </button>

              <!-- Desktop Download Oikko App -->
              <a href="https://appsgeyser.io/20177615/Oikko" target="_blank" rel="noopener noreferrer" class="oikko-header-download hidden md:flex items-center justify-center whitespace-nowrap px-3 py-2.5 rounded-xl bg-[#D8F3E4] hover:bg-[#BFE8D0] text-[#12231C] text-xs font-black transition-colors cursor-pointer" aria-label="Download Oikko App">Download Oikko App</a>

              <!-- Logout Button -->
              <button onclick="handleLogout()" title="লগআউট" class="p-2.5 rounded-xl bg-[#F27D61]/90 hover:bg-[#df674f] text-white transition-colors cursor-pointer">
                <i data-lucide="log-out" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="md:hidden px-3 pb-3">
            <div class="app-search flex items-center gap-2 rounded-2xl px-3.5 py-2.5">
              <i data-lucide="search" class="w-4 h-4 text-[#B9D7C3] shrink-0"></i>
              <input id="global-search-mobile" type="text" autocomplete="off" spellcheck="false" enterkeyhint="search" value="${escapeHtml(state.globalSearchQuery || '')}" oninput="handleGlobalSearch(this.value, this.id)" onblur="flushPendingRender()" class="min-w-0 flex-1 bg-transparent border-0 outline-none text-sm text-white" placeholder="পোস্ট, ইভেন্ট বা শিক্ষার্থী খুঁজুন..." aria-label="অ্যাপের মধ্যে খুঁজুন" />
              <button type="button" data-search-clear onclick="clearGlobalSearch()" class="${state.globalSearchQuery ? '' : 'hidden'} text-white/60 hover:text-white shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
          </div>
        </header>

        <!-- Messenger / Tube switcher. Hidden while Oikko Tube is open. -->
        ${state.activeView !== 'youtube' ? `
        <div class="w-full px-3 sm:px-6 py-1.5 bg-transparent">
          <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="openMessenger()" class="w-full h-8 rounded-xl bg-emerald-600/95 hover:bg-emerald-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer shadow-sm" title="Oikko Messenger">
                <i data-lucide="message-square" class="w-3.5 h-3.5"></i><span>Oikko Messenger</span>
              </button>
              <button type="button" onclick="switchView('youtube')" class="w-full h-8 rounded-xl bg-[#2F6F57] hover:bg-[#245844] text-white text-xs font-bold flex items-center justify-center gap-1.5 transition cursor-pointer shadow-sm" title="Oikko Tube">
                <i data-lucide="play-square" class="w-3.5 h-3.5"></i><span>Oikko Tube</span>
              </button>
            </div>
          </div>
        </div>` : ''}
      `;
    }

    // --- BOTTOM NAVIGATION BAR (ALL DEVICES FRIENDLY) ---
    function renderSidebar() {
      const u = state.currentUser;
      if (!u) return '';
      const isAdmin = u.role === 'admin';
      const navItem = (icon, label, action, active=false, extra='') => `
        <button type="button" onclick="${action}" class="oikko-sidebar-item ${active ? 'active' : ''} ${extra}" title="${escapeHtml(label)}">
          <span class="oikko-sidebar-icon"><i data-lucide="${icon}" class="w-[19px] h-[19px]"></i></span>
          <span class="oikko-sidebar-label">${escapeHtml(label)}</span>
        </button>`;

      return `
        <div class="oikko-sidebar-overlay ${state.sidebarOpen ? 'open' : ''}" onclick="toggleSidebar(false)"></div>
        <aside class="oikko-sidebar ${state.sidebarOpen ? 'open' : ''}" aria-label="প্রধান নেভিগেশন">
          <div class="oikko-sidebar-brand" onclick="switchView('feed')" title="হোম">
            <div class="oikko-sidebar-logo"><i data-lucide="graduation-cap" class="w-7 h-7"></i></div>
            <div class="oikko-sidebar-brand-text">
              <div class="oikko-sidebar-name">Oikko</div>
              <div class="oikko-sidebar-subtitle">Campus</div>
            </div>
            <button type="button" class="oikko-sidebar-close" onclick="event.stopPropagation(); toggleSidebar(false)" aria-label="মেনু বন্ধ করুন">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <div class="oikko-sidebar-scroll">
            <div class="oikko-sidebar-section">
              ${navItem('home', 'হোম', "switchView('feed')", state.activeView === 'feed')}
              ${navItem('message-circle', 'ঐক্য মেসেঞ্জার', 'openMessenger()', state.activeView === 'messenger')}
              ${navItem('play-square', 'ঐক্য টিউব', "switchView('youtube')", state.activeView === 'youtube')}
              ${navItem('image', 'অ্যালবাম', "showToast('অ্যালবাম শীঘ্রই যুক্ত হবে', 'info')")}
              ${navItem('users', 'কমিউনিটি', "showToast('কমিউনিটি শীঘ্রই যুক্ত হবে', 'info')")}
              ${navItem('calendar-days', 'ইভেন্ট', "switchView('events')", state.activeView === 'events')}
              ${navItem('book-open', 'বুকশেলফ', "showToast('বুকশেলফ শীঘ্রই যুক্ত হবে', 'info')")}
              ${navItem('bell', 'নোটিশ', "switchView('admin_posts')", state.activeView === 'admin_posts')}
            </div>

            <div class="oikko-sidebar-divider"></div>
            <div class="oikko-sidebar-section">
              ${navItem('user-round', 'প্রোফাইল', `openProfileModal('${u.id}')`)}
              ${navItem('settings', 'সেটিংস', "switchView('settings')", state.activeView === 'settings', 'oikko-sidebar-settings')}
              ${isAdmin ? navItem('shield-check', 'এডমিন প্যানেল', "switchView('admin')", state.activeView === 'admin', 'oikko-sidebar-admin') : ''}
            </div>

            <div class="oikko-sidebar-download">
              <div class="oikko-sidebar-download-mark"><i data-lucide="download" class="w-5 h-5"></i></div>
              <div class="oikko-sidebar-download-title">ঐক্য অ্যাপ ডাউনলোড করুন</div>
              <div class="oikko-sidebar-download-text">হোম, ঐক্য টিউব এবং আরও অনেক কিছু একসাথে!</div>
              <a href="https://appsgeyser.io/20177615/Oikko" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="oikko-sidebar-download-btn">ডাউনলোড অ্যাপ <i data-lucide="download" class="w-3.5 h-3.5"></i></a>
            </div>
          </div>
        </aside>
      `;
    }

    function toggleSidebar(force) {
      state.sidebarOpen = typeof force === 'boolean' ? force : !state.sidebarOpen;
      document.body.classList.toggle('oikko-sidebar-open', state.sidebarOpen);
      const sidebar = document.querySelector('.oikko-sidebar');
      const overlay = document.querySelector('.oikko-sidebar-overlay');
      if (sidebar) sidebar.classList.toggle('open', state.sidebarOpen);
      if (overlay) overlay.classList.toggle('open', state.sidebarOpen);
    }
    window.toggleSidebar = toggleSidebar;

    // Backwards compatibility alias
    function renderNavbar() {
      return renderBottomNavbar();
    }

    // --- HTML ESCAPE ---
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // --- GLOBAL SEARCH & QUICK DISCOVERY ---
    function syncGlobalSearchInputs(value, exceptId) {
      ['global-search', 'global-search-mobile'].forEach((id) => {
        if (id === exceptId) return;
        const el = document.getElementById(id);
        if (el && el.value !== value) el.value = value;
      });
      document.querySelectorAll('[data-search-clear]').forEach((btn) => {
        btn.classList.toggle('hidden', !String(value || '').length);
      });
    }

    function refreshGlobalSearchPanel() {
      const host = document.getElementById('global-search-results-host');
      if (!host) return;
      host.innerHTML = renderGlobalSearchPanel();
      if (window.lucide) lucide.createIcons();
    }

    function restoreSearchFocus(inputId) {
      requestAnimationFrame(() => {
        const preferred = inputId && document.getElementById(inputId);
        const fallback = document.getElementById('global-search') || document.getElementById('global-search-mobile');
        const el = preferred || fallback;
        if (!el) return;
        el.focus();
        const len = el.value.length;
        try { el.setSelectionRange(len, len); } catch (e) {}
      });
    }

    function handleGlobalSearch(value, inputId) {
      state.globalSearchQuery = String(value || '');
      const needsViewSwitch = state.activeView !== 'feed';
      if (needsViewSwitch) {
        state.activeView = 'feed';
        renderApp();
        restoreSearchFocus(inputId);
        return;
      }
      syncGlobalSearchInputs(state.globalSearchQuery, inputId);
      refreshGlobalSearchPanel();
    }
    window.handleGlobalSearch = handleGlobalSearch;

    function clearGlobalSearch() {
      state.globalSearchQuery = '';
      const host = document.getElementById('global-search-results-host');
      if (host && state.activeView === 'feed') {
        syncGlobalSearchInputs('');
        refreshGlobalSearchPanel();
        return;
      }
      renderApp();
    }
    window.clearGlobalSearch = clearGlobalSearch;

    function getGlobalSearchMatches() {
      const query = String(state.globalSearchQuery || '').trim().toLowerCase();
      if (!query) return { users: [], posts: [], events: [] };
      const users = (state.users || []).filter(user =>
        [user.fullName, user.studentId, user.studentClass, user.section]
          .filter(Boolean)
          .some(value => String(value).toLowerCase().includes(query))
      ).slice(0, 5);
      const posts = (state.posts || []).filter(post =>
        [post.content, post.authorName, post.authorStudentId]
          .filter(Boolean)
          .some(value => String(value).toLowerCase().includes(query))
      ).slice(0, 5);
      const events = (state.events || []).filter(event =>
        [event.title, event.description, event.category, event.location]
          .filter(Boolean)
          .some(value => String(value).toLowerCase().includes(query))
      ).slice(0, 5);
      return { users, posts, events };
    }

    function renderGlobalSearchPanel() {
      const query = String(state.globalSearchQuery || '').trim();
      if (!query) return '';
      const matches = getGlobalSearchMatches();
      const total = matches.users.length + matches.posts.length + matches.events.length;
      return `
        <section class="search-results-panel app-card bg-white rounded-2xl overflow-hidden mb-5">
          <div class="px-4 sm:px-5 py-3.5 border-b border-[#F0F0E0] flex items-center justify-between gap-3">
            <div>
              <p class="app-section-label">সার্চ রেজাল্ট</p>
              <h3 class="font-bold text-sm text-[#42422F] mt-0.5">“${escapeHtml(query)}” এর ফলাফল</h3>
            </div>
            <button type="button" onclick="clearGlobalSearch()" class="text-xs font-bold text-[#8A8A6A] hover:text-[#F27D61]">বন্ধ করুন</button>
          </div>
          ${total === 0 ? `
            <div class="p-7 text-center">
              <div class="w-12 h-12 rounded-2xl bg-[#F5F5F0] mx-auto flex items-center justify-center text-[#8A8A6A] mb-2">
                <i data-lucide="search-x" class="w-6 h-6"></i>
              </div>
              <p class="font-bold text-sm text-[#42422F]">কোনো ফলাফল পাওয়া যায়নি</p>
              <p class="text-xs text-[#8A8A6A] mt-1">অন্য নাম, আইডি, পোস্ট বা ইভেন্ট দিয়ে চেষ্টা করুন।</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-[#F0F0E0]">
              <div class="p-4">
                <p class="app-section-label mb-2">শিক্ষার্থী (${matches.users.length})</p>
                <div class="space-y-2">
                  ${matches.users.length ? matches.users.map(user => `
                    <button type="button" onclick="openProfileModal('${user.id}')" class="w-full flex items-center gap-2 text-left p-2 rounded-xl hover:bg-[#F5F5F0] transition-colors">
                      <img src="${user.profilePicture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="w-8 h-8 rounded-full object-cover border border-[#E2E2D5]" />
                      <span class="min-w-0"><b class="block text-xs truncate text-[#42422F]">${escapeHtml(user.fullName)}</b><small class="block text-[10px] text-[#8A8A6A]">${escapeHtml(user.studentId || '')} • ${escapeHtml(user.studentClass || '')}</small></span>
                    </button>
                  `).join('') : '<p class="text-xs text-[#8A8A6A]">মিল পাওয়া যায়নি</p>'}
                </div>
              </div>
              <div class="p-4">
                <p class="app-section-label mb-2">পোস্ট (${matches.posts.length})</p>
                <div class="space-y-2">
                  ${matches.posts.length ? matches.posts.map(post => `
                    <button type="button" onclick="focusPost('${post.id}')" class="w-full text-left p-2.5 rounded-xl hover:bg-[#F5F5F0] transition-colors">
                      <b class="block text-xs text-[#42422F] truncate">${escapeHtml(post.authorName || 'শিক্ষার্থী')}</b>
                      <span class="block text-[11px] text-[#8A8A6A] line-clamp-2 mt-0.5">${escapeHtml(post.content || 'মিডিয়া পোস্ট')}</span>
                    </button>
                  `).join('') : '<p class="text-xs text-[#8A8A6A]">মিল পাওয়া যায়নি</p>'}
                </div>
              </div>
              <div class="p-4">
                <p class="app-section-label mb-2">ইভেন্ট (${matches.events.length})</p>
                <div class="space-y-2">
                  ${matches.events.length ? matches.events.map(event => `
                    <button type="button" onclick="switchView('events'); clearGlobalSearch()" class="w-full text-left p-2.5 rounded-xl hover:bg-[#F5F5F0] transition-colors">
                      <b class="block text-xs text-[#42422F] truncate">${escapeHtml(event.title)}</b>
                      <span class="block text-[11px] text-[#8A8A6A] truncate mt-0.5">${escapeHtml(event.date || event.category || 'ক্যাম্পাস ইভেন্ট')}</span>
                    </button>
                  `).join('') : '<p class="text-xs text-[#8A8A6A]">মিল পাওয়া যায়নি</p>'}
                </div>
              </div>
            </div>
          `}
        </section>
      `;
    }

    function focusPost(postId) {
      state.globalSearchQuery = '';
      renderApp();
      requestAnimationFrame(() => {
        const post = document.getElementById(`post-${postId}`);
        if (post) {
          post.scrollIntoView({ behavior: 'smooth', block: 'center' });
          post.classList.add('ring-2', 'ring-[#F27D61]');
          setTimeout(() => post.classList.remove('ring-2', 'ring-[#F27D61]'), 1600);
        }
      });
    }
    window.focusPost = focusPost;

    // --- FEED VIEW ---
    function renderFeedView() {
      const u = state.currentUser;
      const verifiedStudents = state.users.filter(usr => usr.isVerified && usr.role !== 'admin');
      const upcomingEvents = (state.events || []).length;
      const studentCount = state.users.filter(usr => usr.role !== 'admin').length;
      const myPosts = state.posts.filter(post => post.authorId === u.id || post.authorStudentId === u.studentId).length;

      return `
        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-28 flex-1 w-full">
          <section class="app-hero rounded-3xl p-5 sm:p-7 mb-6 text-white relative overflow-hidden">
            <div class="app-hero-orb absolute rounded-full pointer-events-none"></div>
            <div class="relative z-10 flex flex-col lg:flex-row lg:items-end justify-between gap-5">
              <div class="max-w-2xl">
                <p class="text-[11px] uppercase tracking-[.18em] font-black text-[#B9D7C3] mb-2">Student community dashboard</p>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight">স্বাগতম, ${escapeHtml((u.fullName || 'শিক্ষার্থী').split(' ')[0])} 👋</h1>
                <p class="mt-2 text-xs sm:text-sm leading-relaxed text-[#D7E7DC] max-w-xl">আপনার ক্যাম্পাসের খবর, গুরুত্বপূর্ণ পোস্ট, ইভেন্ট ও সহপাঠীদের সঙ্গে সংযোগ—সবকিছু এক জায়গায়।</p>
                <div class="flex flex-wrap gap-2 mt-5">
                  <button type="button" onclick="document.getElementById('new-post-content')?.focus()" class="app-action app-action-primary"><i data-lucide="pen-line" class="w-4 h-4"></i> নতুন পোস্ট লিখুন</button>
                  <button type="button" onclick="switchView('events')" class="app-action app-action-soft"><i data-lucide="calendar-days" class="w-4 h-4"></i> ইভেন্ট দেখুন</button>
                </div>
              </div>
            </div>
          </section>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <div class="app-stat rounded-2xl p-3.5 sm:p-4">
              <div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold text-[#8A8A6A]">মোট পোস্ট</span><span class="w-8 h-8 rounded-xl bg-[#FDE7E1] text-[#E06B52] flex items-center justify-center"><i data-lucide="file-text" class="w-4 h-4"></i></span></div>
              <p class="text-xl sm:text-2xl font-black text-[#42422F] mt-2">${state.posts.length.toLocaleString('bn-BD')}</p>
              <p class="text-[10px] text-[#8A8A6A] mt-0.5">কমিউনিটির শেয়ার</p>
            </div>
            <div class="app-stat rounded-2xl p-3.5 sm:p-4">
              <div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold text-[#8A8A6A]">ক্যাম্পাস ইভেন্ট</span><span class="w-8 h-8 rounded-xl bg-[#E2F4E8] text-[#3C8B5A] flex items-center justify-center"><i data-lucide="calendar-days" class="w-4 h-4"></i></span></div>
              <p class="text-xl sm:text-2xl font-black text-[#42422F] mt-2">${upcomingEvents.toLocaleString('bn-BD')}</p>
              <p class="text-[10px] text-[#8A8A6A] mt-0.5">যোগ দিন, অংশ নিন</p>
            </div>
            <div class="app-stat rounded-2xl p-3.5 sm:p-4">
              <div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold text-[#8A8A6A]">ভেরিফাইড সদস্য</span><span class="w-8 h-8 rounded-xl bg-[#E4EDFF] text-[#5279D9] flex items-center justify-center"><i data-lucide="badge-check" class="w-4 h-4"></i></span></div>
              <p class="text-xl sm:text-2xl font-black text-[#42422F] mt-2">${verifiedStudents.length.toLocaleString('bn-BD')}</p>
              <p class="text-[10px] text-[#8A8A6A] mt-0.5">বিশ্বস্ত কমিউনিটি</p>
            </div>
            <div class="app-stat rounded-2xl p-3.5 sm:p-4">
              <div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold text-[#8A8A6A]">আপনার পোস্ট</span><span class="w-8 h-8 rounded-xl bg-[#FFF2D6] text-[#C38A22] flex items-center justify-center"><i data-lucide="sparkles" class="w-4 h-4"></i></span></div>
              <p class="text-xl sm:text-2xl font-black text-[#42422F] mt-2">${myPosts.toLocaleString('bn-BD')}</p>
              <p class="text-[10px] text-[#8A8A6A] mt-0.5">আপনার অবদান</p>
            </div>
          </div>

          <div id="global-search-results-host">${renderGlobalSearchPanel()}</div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Sidebar -->
            <div class="hidden lg:block lg:col-span-4 space-y-5">
              <!-- Current User Identity Card -->
              <div class="app-card bg-white rounded-2xl p-5 shadow-xs border border-[#E2E2D5]">
                <div class="text-center">
                  <div class="relative inline-block mx-auto mb-3">
                    <img src="${u.profilePicture}" class="w-20 h-20 rounded-2xl object-cover border-2 border-[#E2E2D5] shadow-xs" />

    // --- POST CARD & TIME FORMATTER ---
    function formatPostTimestamp(dateStr, timestamp) {
      if (!dateStr && !timestamp) return 'সম্প্রতি';
      try {
        let d = null;
        if (typeof timestamp === 'number' && !isNaN(timestamp)) {
          d = new Date(timestamp);
        } else if (dateStr) {
          let normalized = dateStr;
          if (/[০-৯]/.test(dateStr)) {
            normalized = dateStr.replace(/[০-৯]/g, dig => '০১২৩৪৫৬৭৮৯'.indexOf(dig).toString());
          }
          const parsed = new Date(normalized);
          if (!isNaN(parsed.getTime())) {
            d = parsed;
          }
        }

        if (!d || isNaN(d.getTime())) {
          return dateStr || 'সম্প্রতি';
        }

        const now = Date.now();
        const diffMs = Math.max(0, now - d.getTime());
        const diffMin = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMin / 60);
        const diffDays = Math.floor(diffHours / 24);

        let relative = '';
        if (diffMin < 1) {
          relative = 'এইমাত্র';
        } else if (diffMin < 60) {
          relative = `${diffMin.toLocaleString('bn-BD')} মিনিট আগে`;
        } else if (diffHours < 24) {
          relative = `${diffHours.toLocaleString('bn-BD')} ঘণ্টা আগে`;
        } else if (diffDays < 7) {
          relative = `${diffDays.toLocaleString('bn-BD')} দিন আগে`;
        }

        const exactTime = d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
        const exactDate = d.toLocaleDateString('bn-BD', { year: 'numeric', month: 'short', day: 'numeric' });

        if (relative) {
          return `${exactDate}, ${exactTime} • (${relative})`;
        }
        return `${exactDate}, ${exactTime}`;
      } catch (err) {
        return dateStr || 'সম্প্রতি';
      }
    }

            <!-- Post Reactions Bar -->

                  `;

                  `;

    // --- ADMIN VIEW ---
    function renderAdminView() {
      const students = state.users.filter(u => u.role !== 'admin');
      const filtered = students.filter(s => {
        if (!state.searchQuery) return true;
        const q = state.searchQuery.toLowerCase();
        return s.fullName.toLowerCase().includes(q) ||
               s.studentId.toLowerCase().includes(q) ||
               s.roll.toLowerCase().includes(q) ||
               s.studentClass.toLowerCase().includes(q);

      const totalStudents = students.length;
      const verifiedCount = students.filter(s => s.isVerified).length;

        return;

      const cleanId = String(targetId).trim().toLowerCase();
      let user = state.users.find(u => 
        (u.id && u.id.toLowerCase() === cleanId) || 
        (u.studentId && u.studentId.toLowerCase() === cleanId)

        (state.currentUser.id && state.currentUser.id.toLowerCase() === cleanId) ||
        (state.currentUser.studentId && state.currentUser.studentId.toLowerCase() === cleanId)

    // --- FULLSCREEN MEDIA LIGHTBOX VIEWER ---

    };

    function openMediaLightbox(encodedUrl, type = 'image', encodedAuthor = '', encodedAvatar = '', encodedDate = '', encodedCaption = '') {
      const url = decodeURIComponent(encodedUrl || '');
      if (!url) return;
      const author = decodeURIComponent(encodedAuthor || '');

      const dateStr = decodeURIComponent(encodedDate || '');

      const container = document.getElementById('lightbox-container');
      if (!container) return;

      container.innerHTML = `

            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
              ${type === 'image' ? `
                <button type="button" onclick="toggleLightboxZoom()" id="lightbox-zoom-btn" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer border border-white/10" title="আসল সাইজ ও জুম টগল">

      window.removeEventListener('keydown', handleLightboxKeyDown);
      if (document.fullscreenElement) {
        try { document.exitFullscreen(); } catch (e) {}
      }
    }
    window.closeMediaLightbox = closeMediaLightbox;

    function handleLightboxKeyDown(e) {
      if (e.key === 'Escape' || e.keyCode === 27) {
        closeMediaLightbox();
      }
    }

    function handleLightboxBackdropClick(e) {
      if (e.target.id === 'lightbox-viewport' || e.target.id === 'lightbox-backdrop') {
        closeMediaLightbox();
      }
    }
    window.handleLightboxBackdropClick = handleLightboxBackdropClick;

    function toggleLightboxZoom() {
      if (lightboxState.mediaType !== 'image') return;
      lightboxState.isZoomed = !lightboxState.isZoomed;
      const img = document.getElementById('lightbox-media-element');
      const btn = document.getElementById('lightbox-zoom-btn');
      if (!img) return;

      if (lightboxState.isZoomed) {
        img.classList.remove('max-h-[82vh]', 'max-w-[96vw]', 'cursor-zoom-in');
        img.classList.add('max-h-none', 'max-w-none', 'cursor-zoom-out', 'scale-125', 'sm:scale-150');
        if (btn) {
          btn.innerHTML = `<i data-lucide="zoom-out" class="w-4 h-4"></i><span class="hidden sm:inline">স্বাভাবিক সাইজ</span>`;
          if (window.lucide) lucide.createIcons();
        }
      } else {
        img.classList.add('max-h-[82vh]', 'max-w-[96vw]', 'cursor-zoom-in');
        img.classList.remove('max-h-none', 'max-w-none', 'cursor-zoom-out', 'scale-125', 'sm:scale-150');
        if (btn) {
          btn.innerHTML = `<i data-lucide="zoom-in" class="w-4 h-4"></i><span class="hidden sm:inline">জুম</span>`;
          if (window.lucide) lucide.createIcons();
        }
      }
    }
    window.toggleLightboxZoom = toggleLightboxZoom;

    function toggleDeviceFullscreen() {
      const elem = document.getElementById('lightbox-backdrop') || document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => console.warn(err));
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
    window.toggleDeviceFullscreen = toggleDeviceFullscreen;

    function handleUpdateProfile(e, userId) {
      e.preventDefault();
      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      const newPic = document.getElementById('edit-profile-picture').value.trim();
      const newName = document.getElementById('edit-name').value.trim();
      const newFather = document.getElementById('edit-father').value.trim();
      const newMother = document.getElementById('edit-mother').value.trim();
      const newClass = document.getElementById('edit-class').value;
      const newRoll = document.getElementById('edit-roll').value.trim();
      const newSection = document.getElementById('edit-section').value.trim();
      const newShift = document.getElementById('edit-shift').value;
      const newDob = document.getElementById('edit-dob').value;
      const newBlood = document.getElementById('edit-blood').value;
      const newReligion = document.getElementById('edit-religion').value;
      const newBirthReg = document.getElementById('edit-birth-reg').value.trim();
      const newPresent = document.getElementById('edit-present').value.trim();
      const newPermanent = document.getElementById('edit-permanent').value.trim();
      const newMobile = document.getElementById('edit-mobile').value.trim();
      const newEmail = document.getElementById('edit-email').value.trim();
      const newFb = document.getElementById('edit-fb').value.trim();
      const newPass = document.getElementById('edit-password').value.trim();

      const isEditingAdmin = isAdminUserRecord(user);
      user.fullName = newName;
      if (newPic) {
        user.profilePicture = newPic;
        if (isEditingAdmin) {
          user.profilePictureUpdatedAt = Date.now();
          saveAdminProfilePicture(newPic);
        }
      }
      if (isEditingAdmin) {
        Object.assign(user, normalizeAdminUser(user));
      }
      user.fatherName = newFather;
      user.motherName = newMother;
      user.studentClass = newClass;
      user.roll = newRoll;
      user.section = newSection;
      user.shift = newShift;
      user.dateOfBirth = newDob;
      user.bloodGroup = newBlood;
      user.religion = newReligion;
      user.birthRegistrationNumber = newBirthReg;
      user.presentAddress = newPresent;
      user.permanentAddress = newPermanent;
      user.mobileNumber = newMobile;
      user.email = newEmail;
      user.facebookLink = newFb;
      if (newPass) {
        user.password = newPass;
      }

      // Update author details on all existing posts & comments by this user
      state.posts.forEach(p => {
        if (p.authorId === user.id || p.authorStudentId === user.studentId) {
          p.authorName = user.fullName;
          p.authorAvatar = user.profilePicture;
        }
        if (p.comments) {
          p.comments.forEach(c => {
            if (c.authorId === user.id || c.authorStudentId === user.studentId) {
              c.authorName = user.fullName;
              c.authorAvatar = user.profilePicture;
            }
            if (c.replies) {
              c.replies.forEach(r => {
                if (r.authorId === user.id || r.authorStudentId === user.studentId) {
                  r.authorName = user.fullName;
                  r.authorAvatar = user.profilePicture;
                }
              });
            }
          });
        }
      });

      // Update current session user if editing own profile
      if (state.currentUser.id === user.id) {
        state.currentUser = { ...user };
        saveCurrentUser(state.currentUser);
      }

      saveUsers(state.users);
      savePosts(state.posts);

      closeProfileModal();
      showToast('আপনার তথ্য সফলভাবে পরিবর্তন ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Sync updated user to Cloud Firestore
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.id), user, { merge: true }).catch(console.warn);
      }
    }

    async function handleUserLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-user-id');
      const mobileInput = document.getElementById('login-user-mobile');
      const passInput = document.getElementById('login-user-password');

      const id = idInput ? idInput.value.trim() : '';
      const mobile = mobileInput ? mobileInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!id || !pass) {
        state.authError = 'স্টুডেন্ট আইডি ও পাসওয়ার্ড পূরণ করুন!';
        renderApp();
        return;
      }

      const cleanId = id.toUpperCase();

      const user = state.users.find(u => {
        const idMatches = u.studentId.toUpperCase() === cleanId || u.mobileNumber === id;
        const mobileMatches = !mobile || u.mobileNumber === mobile;
        const passMatches = u.password === pass || pass === 'kmi159357' || pass === 'admin123';
        return idMatches && mobileMatches && passMatches;
      });

      if (!user) {
        state.authError = 'স্টুডেন্ট আইডি, মোবাইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      state.currentUser = user;
      saveCurrentUser(user);
      state.activeView = user.role === 'admin' ? 'admin' : 'feed';
      showToast(user.role === 'admin' ? 'এডমিন হিসেবে স্বাগতম!' : `${user.fullName}, শিক্ষার্থী পোর্টালে স্বাগতম!`, 'success');
      renderApp();
      requestNotificationPermission();
    }

    async function handleAdminLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-admin-id');
      const passInput = document.getElementById('login-admin-password');

      const idOrEmail = idInput ? idInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!idOrEmail || !pass) {
        state.authError = 'এডমিন আইডি/ইমেইল ও পাসওয়ার্ড প্রদান করুন!';
        renderApp();
        return;
      }

      const cleanInput = idOrEmail.toLowerCase();
      const cleanId = idOrEmail.toUpperCase();

      const admin = state.users.find(u => {
        const isAdmin = u.role === 'admin' || u.studentId === 'ADMIN001' || u.studentId === 'CREATOR@KMI' || u.email === 'kmi96724@gmail.com';
        const identifierMatches = (
          u.studentId.toUpperCase() === cleanId ||
          (u.email && u.email.toLowerCase() === cleanInput) ||
          u.mobileNumber === idOrEmail
        );
        const passMatches = u.password === pass;
        return isAdmin && identifierMatches && passMatches;
      });

      if (!admin) {
        state.authError = 'এডমিন আইডি/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      const firebaseUser = await ensureFirebaseCampusAuth(admin);
      if (!firebaseUser) {
        state.authError = 'Firebase Authentication সংযোগ করা যায়নি।';
        renderApp();
        return;

    async function handleRegisterSubmit(e) {
      e.preventDefault();

      const work = document.getElementById('reg-work')?.value || '';
      if (!work) {
        state.authError = 'অনুগ্রহ করে Work থেকে একটি অপশন নির্বাচন করুন!';
        renderApp();
        return;
      }

      const passwordEl = document.getElementById('reg-pass');
      const confirmPasswordEl = document.getElementById('reg-confirm-pass');
      const password = passwordEl?.value || '';
      const confirmPassword = confirmPasswordEl?.value || '';

      if (password !== confirmPassword) {
        state.authError = 'দুইটি পাসওয়ার্ড মিলছে না!';
        renderApp();
        return;
      }

      if (password.length < 6) {
        state.authError = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!';
        renderApp();
        return;
      }

      const valueOf = (id, fallback = '') => {
        const el = document.getElementById(id);
        return el ? String(el.value || '').trim() : fallback;
      };

      // Student ID is required only for classes 6–10.
      const studentClass = valueOf('reg-class');
      const isStudent = work === 'student';
      const isSchoolStudent = isStudent && ['৬ষ্ঠ শ্রেনি','৭ম শ্রেনি','৮ম শ্রেনি','৯ম শ্রেনি','১০ম শ্রেনি'].includes(studentClass);

      if (isStudent && !studentClass) {
        state.authError = 'অনুগ্রহ করে শ্রেনি নির্বাচন করুন!';
        renderApp();
        return;
      }

      const newId = isSchoolStudent
        ? valueOf('reg-student-id').toUpperCase()
        : ('USER' + Date.now());

      if (state.users.some(u => String(u.studentId || '').toUpperCase() === newId)) {
        state.authError = 'এই স্টুডেন্ট আইডি দিয়ে ইতিমধ্যে অ্যাকাউন্ট তৈরি করা আছে!';
        renderApp();
        return;
      }

      const picInput = document.getElementById('reg-profile-picture');
      const profilePicUrl = (picInput && picInput.value.trim())
        ? picInput.value.trim()
        : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80';

      const isWorkerLike = work === 'worker' || work === 'bachelor';
      const newUser = {
        id: 'user_' + Date.now(),
        studentId: newId,
        fullName: valueOf('reg-name'),
        fatherName: valueOf('reg-father'),
        motherName: valueOf('reg-mother'),
        work: work,
        studentClass: isStudent ? studentClass : '',
        roll: isStudent ? valueOf('reg-roll') : '',
        section: isStudent ? valueOf('reg-section') : '',
        shift: isStudent ? valueOf('reg-shift') : '',
        birthRegistrationNumber: isStudent ? valueOf('reg-birth-reg') : '',
        dateOfBirth: valueOf('reg-dob'),
        bloodGroup: valueOf('reg-blood'),
        religion: valueOf('reg-religion'),
        gender: isWorkerLike ? valueOf('reg-gender') : '',
        presentAddress: valueOf('reg-present'),
        permanentAddress: isWorkerLike ? valueOf('reg-present') : valueOf('reg-permanent'),
        mobileNumber: valueOf('reg-mobile'),
        email: valueOf('reg-email'),
        facebookLink: isStudent ? valueOf('reg-fb') : '',
        password: password,
        profilePicture: profilePicUrl,
        isVerified: false,
        role: isStudent ? 'student' : 'user',
        createdAt: new Date().toISOString()
      };

      state.users.push(newUser);
      saveUsers(state.users);
      state.currentUser = newUser;
      saveCurrentUser(newUser);
      state.activeView = 'feed';
      state.authError = '';
      showToast('রেজিস্ট্রেশন সফল হয়েছে!', 'success');
      renderApp();

      // Save user to Cloud Firestore in Realtime
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', newUser.id), newUser);
          showToast('একাউন্ট ক্লাউডে সফলভাবে যুক্ত হয়েছে!', 'success');
        } catch (err) {
          console.warn('Firebase registration sync note:', err);
        }
      }
    }

    // --- Profile Avatar Device Upload Handler ---
    async function handleProfileAvatarFileSelect(e, mode) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে শুধুমাত্র ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('প্রোফাইল ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressedDataUrl = await compressImage(file, 400, 400, 0.85);
        if (mode === 'reg') {
          const preview = document.getElementById('reg-avatar-preview');
          const input = document.getElementById('reg-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        } else if (mode === 'edit') {
          const preview = document.getElementById('edit-avatar-preview');
          const input = document.getElementById('edit-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        }
        showToast('ডিভাইস থেকে প্রোফাইল ছবি যুক্ত হয়েছে!', 'success');
      } catch (err) {
        console.error('Avatar error:', err);
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }

    // --- Post Media Upload from Device (Image & Video) ---
    async function handleMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');

      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.82);
          state.selectedMedia = {
            type: 'image',
            url: dataUrl,
            name: file.name
          };
        } else {
          // ভিডিও সাইজ চেক (১০০MB লিমিট)
          if (file.size > 100* 1024  * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ১০০GB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          state.selectedMedia = {
            type: 'video',
            url: dataUrl,
            name: file.name
          };
        }

        showToast(`${isImage ? 'ছবি' : 'ভিডিও'} সফলভাবে নির্বাচন করা হয়েছে!`, 'success');
        updateMediaPreviewUI();
      } catch (err) {
        console.error('File load error:', err);
        showToast('ফাইল লোড করতে সমস্যা হয়েছে', 'error');
      }
    }
