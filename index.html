    body:before{width:22rem;height:22rem;left:-9rem;bottom:10%;background:#8ed9b0}
    body:after{width:18rem;height:18rem;right:-7rem;top:35%;background:#f4c45a;animation-delay:-7s}
    html.dark body:before{opacity:.12} html.dark body:after{opacity:.08}
    @keyframes oikkoFloat{50%{transform:translate(35px,-28px) scale(1.08)}}
    #app{position:relative;isolation:isolate}
    .app-topbar,.app-nav{backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
    .app-card,.auth-panel,.search-results-panel{box-shadow:var(--oikko-shadow)}
    .app-card{background:var(--oikko-surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .app-card:hover{transform:translateY(-3px)}
    button{touch-action:manipulation}
    img{max-width:100%;image-rendering:auto}
    input,textarea,select{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
    input:focus,textarea:focus,select:focus{box-shadow:0 0 0 4px var(--oikko-glow)!important}
    .oikko-status-pill{
      position:fixed;right:14px;bottom:82px;z-index:60;display:flex;align-items:center;gap:7px;
      padding:7px 11px;border-radius:999px;font-size:11px;font-weight:700;
      background:rgba(18,35,28,.88);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);
      backdrop-filter:blur(16px);transition:opacity .25s ease,transform .25s ease;
    }
    .oikko-status-dot{width:7px;height:7px;border-radius:50%;background:#67e8a4;box-shadow:0 0 0 4px rgba(103,232,164,.13)}
    .oikko-status-pill.offline .oikko-status-dot{background:#f4c45a;box-shadow:0 0 0 4px rgba(244,196,90,.13)}
    .oikko-backtop{
      position:fixed;right:16px;bottom:132px;z-index:55;width:42px;height:42px;border:0;border-radius:14px;
      display:grid;place-items:center;background:var(--primary-olive);color:white;
      box-shadow:0 12px 30px rgba(47,111,87,.30);opacity:0;transform:translateY(12px);
      pointer-events:none;transition:.22s ease;
    }
    .oikko-backtop.show{opacity:1;transform:none;pointer-events:auto}
    .oikko-skeleton{background:linear-gradient(90deg,rgba(128,128,128,.08),rgba(255,255,255,.34),rgba(128,128,128,.08));background-size:200% 100%;animation:oikkoShimmer 1.5s infinite}
    @keyframes oikkoShimmer{to{background-position:-200% 0}}
    @media (max-width:640px){
      body{background-attachment:scroll}
      body:before{width:15rem;height:15rem}
      body:after{width:12rem;height:12rem}
      .app-card:hover{transform:none}
      .oikko-status-pill{bottom:72px;right:10px}
      .oikko-backtop{right:12px;bottom:120px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
    }
  </style>

  <!-- Oikko Modern Visual Design v2 -->
  <style id="oikko-modern-design">
    :root{
      --o2-green:#2F6F57;
      --o2-green-dark:#173B2D;
      --o2-mint:#D8F3E4;
      --o2-coral:#F27D61;
      --o2-cream:#F7F8F4;
      --o2-line:rgba(47,111,87,.12);
      --o2-shadow:0 18px 60px rgba(18,35,28,.10);
      --o2-shadow-soft:0 8px 30px rgba(18,35,28,.07);
    }
    html.dark{
      --o2-cream:#101612;
      --o2-line:rgba(216,243,228,.10);
      --o2-shadow:0 20px 70px rgba(0,0,0,.30);
      --o2-shadow-soft:0 10px 34px rgba(0,0,0,.22);
    }

    /* App-wide visual language */
    body{font-feature-settings:"kern" 1,"liga" 1;overflow-x:hidden}
    .app-topbar{
      border-bottom:1px solid rgba(255,255,255,.10)!important;
      box-shadow:0 12px 38px rgba(18,35,28,.20)!important;
      background:linear-gradient(135deg,rgba(18,48,37,.96),rgba(35,86,66,.93))!important;
    }
    .app-brand-mark{
      box-shadow:0 8px 24px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.75);
      transition:transform .22s ease,box-shadow .22s ease;
    }
    .app-brand-mark:hover{transform:translateY(-2px) rotate(-1deg);box-shadow:0 12px 28px rgba(0,0,0,.20)}
    .app-search{
      border:1px solid rgba(255,255,255,.13)!important;
      background:rgba(255,255,255,.095)!important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.08);
      transition:all .22s ease;
    }
    .app-search:focus-within{background:rgba(255,255,255,.14)!important;border-color:rgba(216,243,228,.35)!important;box-shadow:0 0 0 2px rgba(216,243,228,.10),0 10px 28px rgba(0,0,0,.12)!important;outline:none!important}

    /* Modern Messenger launcher */
    body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5{position:relative}
    body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5 button{
      min-height:36px!important;
      background:linear-gradient(135deg,#2F6F57,#4A9874)!important;
      box-shadow:0 8px 24px rgba(47,111,87,.20)!important;
      border:1px solid rgba(255,255,255,.16);
      letter-spacing:.02em;
    }
    body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5 button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(47,111,87,.27)!important}

    /* Cards: premium glass / depth */
    .app-card,.auth-panel,.search-results-panel{
      border:1px solid var(--o2-line)!important;
      box-shadow:var(--o2-shadow)!important;
      border-radius:24px!important;
      transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .app-card:hover{box-shadow:0 24px 70px rgba(18,35,28,.14)!important;border-color:rgba(47,111,87,.20)!important}
    html.dark .app-card{border-color:rgba(216,243,228,.08)!important}

    /* Buttons feel tactile and consistent */
    button:not(.messenger-topbar button):not(.messenger-composer button){transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,opacity .18s ease}
    button:not(:disabled):active{transform:scale(.97)}
    .app-nav{
      background:rgba(18,35,28,.88)!important;
      border-top:1px solid rgba(255,255,255,.10)!important;
      box-shadow:0 -12px 38px rgba(18,35,28,.18)!important;
    }
    .app-nav-item{border-radius:16px!important;min-height:46px}
    .app-nav-item.active{background:linear-gradient(135deg,rgba(216,243,228,.18),rgba(255,255,255,.06))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 20px rgba(0,0,0,.10)}

    /* Feed / content hierarchy */
    main{scroll-margin-top:80px}
    main .rounded-3xl,main .rounded-2xl{transition:box-shadow .2s ease,border-color .2s ease}
    h1,h2,h3{letter-spacing:-.015em}
    .text-xs{letter-spacing:.01em}

    /* Form controls */
    input,textarea,select{
      border-radius:14px;
    }

    /* Fixed Messenger message input */
    .messenger-input{height:40px!important;min-height:40px!important;max-height:40px!important;overflow:hidden!important;flex:1 1 auto;}
    #chat-input-field{height:40px!important;min-height:40px!important;max-height:40px!important;line-height:40px!important;resize:none!important;overflow:hidden!important;}
    input:not([type="file"]):hover,textarea:hover,select:hover{border-color:rgba(47,111,87,.25)}
    input:not([type="file"]):focus,textarea:focus,select:focus{transform:none}

    /* Image polish */
    img{transition:filter .25s ease}
    .app-card img{backface-visibility:hidden}

    /* Modals */
    [role="dialog"] > div,.fixed.inset-0 > div{box-shadow:0 30px 100px rgba(0,0,0,.25)!important}

    /* Messenger premium treatment, while preserving its layout */
    .messenger-shell{
      background:
        radial-gradient(circle at 0% 0%,rgba(216,243,228,.75),transparent 24rem),
        radial-gradient(circle at 100% 12%,rgba(244,196,90,.13),transparent 22rem),
        #F5F5F0!important;
    }
    .messenger-theme-dark{
      background:
        radial-gradient(circle at 0% 0%,rgba(47,111,87,.20),transparent 25rem),
        radial-gradient(circle at 100% 10%,rgba(244,196,90,.06),transparent 20rem),
        #101612!important;
    }
    .messenger-list,.messenger-chat{
      border:1px solid rgba(47,111,87,.10)!important;
      box-shadow:var(--o2-shadow-soft)!important;
    }
    .messenger-search{border:1px solid rgba(47,111,87,.10)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 24px rgba(18,35,28,.05)}
    .messenger-chat-header{box-shadow:0 8px 24px rgba(18,35,28,.05)}
    .messenger-composer{box-shadow:0 -12px 30px rgba(18,35,28,.07)!important;border-top:1px solid rgba(47,111,87,.10)!important}
    .messenger-peer{transition:transform .18s ease,background .18s ease,box-shadow .18s ease!important;border-radius:16px!important}
    .messenger-peer:hover{transform:translateX(2px);box-shadow:0 8px 22px rgba(18,35,28,.06)}

    /* Status indicator */
    .oikko-status-pill{border:1px solid rgba(255,255,255,.10);box-shadow:0 12px 34px rgba(0,0,0,.20)!important}


    /* Mobile-first refinements */
    @media(max-width:768px){
      .app-topbar{box-shadow:0 8px 28px rgba(18,35,28,.18)!important}
      .app-card{border-radius:20px!important}
      .app-nav-item{border-radius:14px!important}
      body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5{padding-top:6px!important;padding-bottom:6px!important}
      body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5 button{height:38px!important;border-radius:14px!important}
    }
    @media(min-width:769px){
      main{padding-top:26px}
    }
    @media(prefers-reduced-motion:reduce){
      .app-brand-mark:hover,.app-card:hover,.messenger-peer:hover{transform:none!important}
    }
  </style>

  <script>
  (() => {
    'use strict';

    // Preserve scroll position across the app's full re-render cycles.
    const originalRender = window.renderApp;
    if (typeof originalRender === 'function' && !window.__oikkoRenderPatched) {
      window.__oikkoRenderPatched = true;
      window.renderApp = function(...args) {
        const y = window.scrollY || 0;
        const result = originalRender.apply(this,args);
        requestAnimationFrame(() => {
          if (y > 0 && Math.abs((window.scrollY||0)-y) > 20) window.scrollTo({top:y,behavior:'instant'});
          enhanceIconsAndImages();
          updateConnectionUI();
        });
        return result;
      };
    }

    function enhanceIconsAndImages(){
      document.querySelectorAll('img').forEach(img => {
        if (img.dataset.oikkoFallbackBound) return;
        img.dataset.oikkoFallbackBound='1';
        img.addEventListener('error', () => {
          img.onerror=null;
          img.src='https://ui-avatars.com/api/?background=2f6f57&color=ffffff&name=Oikko&bold=true';
        });
      });
      try{ if(window.lucide) window.lucide.createIcons(); }catch(e){}
    }

    // Show download buttons only for desktop/PC users. Mobile users see no download control.
    const oikkoDesktopDownloadStyle = document.createElement('style');
    oikkoDesktopDownloadStyle.id = 'oikko-desktop-download-only-style';
    oikkoDesktopDownloadStyle.textContent = `
      #oikko-apk-download { display: none !important; }
      .oikko-header-download, .oikko-messenger-download { display: none !important; }
      .oikko-login-download, .oikko-tube-download { display: none !important; }
      .oikko-tube-back {
        background: rgba(47,111,87,.10);
        color: #2F6F57;
        border: 1px solid rgba(47,111,87,.18);
      }
      .oikko-tube-back:hover {
        background: rgba(47,111,87,.18);
      }
      @media (min-width: 768px) {
        .oikko-header-download, .oikko-messenger-download,
        .oikko-login-download, .oikko-tube-download { display: flex !important; }
      }
      @media (max-width: 767px) {
        .oikko-header-download, .oikko-messenger-download,
        .oikko-login-download, .oikko-tube-download { display: none !important; }
      }
      .dark .oikko-tube-back, body.dark .oikko-tube-back {
        background: rgba(216,243,228,.10);
        color: #D8F3E4;
        border-color: rgba(216,243,228,.18);
      }
    `;
    document.head.appendChild(oikkoDesktopDownloadStyle);

    function ensureUtilityUI(){
      if(!document.getElementById('oikko-status-pill')){
        const pill=document.createElement('div');
        pill.id='oikko-status-pill'; pill.className='oikko-status-pill';
        pill.innerHTML='<span class="oikko-status-dot"></span><span class="oikko-status-text">অনলাইন</span>';
        document.body.appendChild(pill);
      }
      if(!document.getElementById('oikko-backtop')){
        const btn=document.createElement('button');
        btn.id='oikko-backtop'; btn.className='oikko-backtop'; btn.type='button';
        btn.setAttribute('aria-label','উপরে যান');
        btn.innerHTML='<i data-lucide="arrow-up" class="w-5 h-5"></i>';
        btn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
        document.body.appendChild(btn);
      }
      try{if(window.lucide) window.lucide.createIcons();}catch(e){}
    }

    function updateConnectionUI(){
      ensureUtilityUI();
      const online=navigator.onLine;
      const pill=document.getElementById('oikko-status-pill');
      if(!pill)return;
      pill.classList.toggle('offline',!online);
      const text=pill.querySelector('.oikko-status-text');
      if(text) text.textContent=online?'অনলাইন':'অফলাইন মোড';
    }

    window.addEventListener('online',()=>{updateConnectionUI(); if(window.showToast)window.showToast('ইন্টারনেট সংযোগ ফিরে এসেছে','success');});
    window.addEventListener('offline',()=>{updateConnectionUI(); if(window.showToast)window.showToast('আপনি অফলাইন মোডে আছেন','info');});
    window.addEventListener('scroll',()=>{
      const btn=document.getElementById('oikko-backtop');
      if(btn) btn.classList.toggle('show',(window.scrollY||0)>500);
    },{passive:true});

    // Prevent accidental duplicate submit/clicks while asynchronous Firebase calls are in flight.
    document.addEventListener('click', e => {
      const btn=e.target.closest('button');
      if(!btn || btn.dataset.oikkoBusy || btn.disabled) return;
      const label=(btn.textContent||'').trim();
      if(/লগইন|রেজিস্ট্রেশন|পোস্ট করুন|সংরক্ষণ|আপডেট/.test(label)){
        btn.dataset.oikkoBusy='1';
        setTimeout(()=>delete btn.dataset.oikkoBusy,700);
      }
    },true);

    // Escape closes open modals/lightboxes when possible without disturbing normal forms.
    document.addEventListener('keydown', e => {
      if(e.key==='Escape'){
        const lightbox=document.getElementById('lightbox-container');
        const modal=document.getElementById('modal-container');
        if(lightbox && lightbox.innerHTML.trim()){lightbox.innerHTML=''; if(window.state)window.state.selectedMedia=null;}
        else if(modal && modal.innerHTML.trim()) modal.innerHTML='';
      }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
        e.preventDefault();
        const search=document.querySelector('.app-search input, input[placeholder*="খুঁজ"], input[type="search"]');
        if(search){search.focus();search.select();}
      }
    });

    window.addEventListener('error', ev => {
      console.warn('Oikko UI recovery:',ev.message);
      updateConnectionUI();
    });

    document.addEventListener('DOMContentLoaded',()=>{
      ensureUtilityUI(); updateConnectionUI(); enhanceIconsAndImages();
      setTimeout(enhanceIconsAndImages,500);
    });
  })();
  </script>

</body>
</html>
