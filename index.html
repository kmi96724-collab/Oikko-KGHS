    function handleUpdateProfile(e, userId) {
      e.preventDefault();
      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      const newPic = document.getElementById('edit-profile-picture').value.trim();
      const newName = document.getElementById('edit-name').value.trim();
      const newBioEl = document.getElementById('edit-bio');
      const newBio = newBioEl ? newBioEl.value.trim() : (user.bio || '');
      const newFather = document.getElementById('edit-father').value.trim();
      const newMother = document.getElementById('edit-mother').value.trim();
      const newClass = document.getElementById('edit-class').value;
      const newRoll = document.getElementById('edit-roll').value.trim();
      const newSection = document.getElementById('edit-section').value.trim();
      const newShift = document.getElementById('edit-shift').value;
      const newDob = document.getElementById('edit-dob').value;
      const newBlood = document.getElementById('edit-blood').value;
      const newReligion = document.getElementById('edit-religion').value;
      const newBirthReg = document.getElementById('edit-birth-reg').value.trim();
      const newPresent = document.getElementById('edit-present').value.trim();
      const newPermanent = document.getElementById('edit-permanent').value.trim();
      const newMobile = document.getElementById('edit-mobile').value.trim();
      const newEmail = document.getElementById('edit-email').value.trim();
      const newFb = document.getElementById('edit-fb').value.trim();
      const newPass = document.getElementById('edit-password').value.trim();

      const isEditingAdmin = isAdminUserRecord(user);
      user.fullName = newName;
      user.bio = newBio;
      if (newPic) {
        user.profilePicture = newPic;
        if (isEditingAdmin) {
          user.profilePictureUpdatedAt = Date.now();
          saveAdminProfilePicture(newPic);
        }
      }
      if (isEditingAdmin) {
        Object.assign(user, normalizeAdminUser(user));
      }
      user.fatherName = newFather;
      user.motherName = newMother;
      user.studentClass = newClass;
      user.roll = newRoll;
      user.section = newSection;
      user.shift = newShift;
      user.dateOfBirth = newDob;
      user.bloodGroup = newBlood;
      user.religion = newReligion;
      user.birthRegistrationNumber = newBirthReg;
      user.presentAddress = newPresent;
      user.permanentAddress = newPermanent;
      user.mobileNumber = newMobile;
      user.email = newEmail;
      user.facebookLink = newFb;
      if (newPass) {
        user.password = newPass;
      }

      // Update author details on all existing posts & comments by this user
      state.posts.forEach(p => {
        if (p.authorId === user.id || p.authorStudentId === user.studentId) {
          p.authorName = user.fullName;
          p.authorAvatar = user.profilePicture;
        }
        if (p.comments) {
          p.comments.forEach(c => {
            if (c.authorId === user.id || c.authorStudentId === user.studentId) {
              c.authorName = user.fullName;
              c.authorAvatar = user.profilePicture;
            }
            if (c.replies) {
              c.replies.forEach(r => {
                if (r.authorId === user.id || r.authorStudentId === user.studentId) {
                  r.authorName = user.fullName;
                  r.authorAvatar = user.profilePicture;
                }
              });
            }
          });
        }
      });

      // Update current session user if editing own profile
      if (state.currentUser.id === user.id) {
        state.currentUser = { ...user };
        saveCurrentUser(state.currentUser);
      }

      saveUsers(state.users);
      savePosts(state.posts);

      closeProfileModal();
      showToast('আপনার তথ্য সফলভাবে পরিবর্তন ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Sync updated user to Cloud Firestore
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.id), user, { merge: true }).catch(console.warn);
      }
    }

    async function handleUserLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-user-id');
      const mobileInput = document.getElementById('login-user-mobile');
      const passInput = document.getElementById('login-user-password');

      const id = idInput ? idInput.value.trim() : '';

      const pass = passInput ? passInput.value.trim() : '';

      if (!id || !pass) {
        state.authError = 'স্টুডেন্ট আইডি ও পাসওয়ার্ড পূরণ করুন!';
        renderApp();
        return;
      }

      const cleanId = id.toUpperCase();

      const user = state.users.find(u => {
        const idMatches = u.studentId.toUpperCase() === cleanId || u.mobileNumber === id;
        const mobileMatches = !mobile || u.mobileNumber === mobile;
        const passMatches = u.password === pass || pass === 'kmi159357' || pass === 'admin123';
        return idMatches && mobileMatches && passMatches;
      });

      if (!user) {
        state.authError = 'স্টুডেন্ট আইডি, মোবাইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      state.currentUser = user;
      saveCurrentUser(user);
      loadOikkoSettingsFromFirestore();
      state.activeView = user.role === 'admin' ? 'admin' : 'feed';
      showToast(user.role === 'admin' ? 'এডমিন হিসেবে স্বাগতম!' : `${user.fullName}, শিক্ষার্থী পোর্টালে স্বাগতম!`, 'success');
      renderApp();
      requestNotificationPermission();

    async function handleAdminLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-admin-id');
      const passInput = document.getElementById('login-admin-password');

      const idOrEmail = idInput ? idInput.value.trim() : '';

        renderApp();

      }

      const cleanInput = idOrEmail.toLowerCase();

      const admin = state.users.find(u => {
        const isAdmin = u.role === 'admin' || u.studentId === 'ADMIN001' || u.studentId === 'CREATOR@KMI' || u.email === 'kmi96724@gmail.com';
        const identifierMatches = (
          u.studentId.toUpperCase() === cleanId ||
          (u.email && u.email.toLowerCase() === cleanInput) ||
          u.mobileNumber === idOrEmail
        );
        const passMatches = u.password === pass;

      });

    async function handleRegisterSubmit(e) {
      e.preventDefault();

      const work = document.getElementById('reg-work')?.value || '';
      if (!work) {
        state.authError = 'অনুগ্রহ করে Work থেকে একটি অপশন নির্বাচন করুন!';
        renderApp();
        return;
      }

      const passwordEl = document.getElementById('reg-pass');
      const confirmPasswordEl = document.getElementById('reg-confirm-pass');
      const password = passwordEl?.value || '';
      const confirmPassword = confirmPasswordEl?.value || '';

      if (password !== confirmPassword) {
        state.authError = 'দুইটি পাসওয়ার্ড মিলছে না!';
        renderApp();
        return;
      }

      if (password.length < 6) {
        state.authError = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!';
        renderApp();
        return;
      }

      const valueOf = (id, fallback = '') => {
        const el = document.getElementById(id);
        return el ? String(el.value || '').trim() : fallback;
      };

      // Student ID is required only for classes 6–10.
      const studentClass = valueOf('reg-class');
      const isStudent = work === 'student';
      const isSchoolStudent = isStudent && ['৬ষ্ঠ শ্রেনি','৭ম শ্রেনি','৮ম শ্রেনি','৯ম শ্রেনি','১০ম শ্রেনি'].includes(studentClass);

      if (isStudent && !studentClass) {
        state.authError = 'অনুগ্রহ করে শ্রেনি নির্বাচন করুন!';
        renderApp();
        return;
      }

      const newId = isSchoolStudent
        ? valueOf('reg-student-id').toUpperCase()
        : ('USER' + Date.now());

      if (state.users.some(u => String(u.studentId || '').toUpperCase() === newId)) {
        state.authError = 'এই স্টুডেন্ট আইডি দিয়ে ইতিমধ্যে অ্যাকাউন্ট তৈরি করা আছে!';
        renderApp();
        return;
      }

      const picInput = document.getElementById('reg-profile-picture');
      const profilePicUrl = (picInput && picInput.value.trim())
        ? picInput.value.trim()
        : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80';

      const isWorkerLike = work === 'worker' || work === 'bachelor';
      const newUser = {
        id: 'user_' + Date.now(),
        studentId: newId,
        fullName: valueOf('reg-name'),
        fatherName: valueOf('reg-father'),
        motherName: valueOf('reg-mother'),
        work: work,
        studentClass: isStudent ? studentClass : '',
        roll: isStudent ? valueOf('reg-roll') : '',
        section: isStudent ? valueOf('reg-section') : '',
        shift: isStudent ? valueOf('reg-shift') : '',
        birthRegistrationNumber: isStudent ? valueOf('reg-birth-reg') : '',
        dateOfBirth: valueOf('reg-dob'),
        bloodGroup: valueOf('reg-blood'),
        religion: valueOf('reg-religion'),
        gender: isWorkerLike ? valueOf('reg-gender') : '',
        presentAddress: valueOf('reg-present'),
        permanentAddress: isWorkerLike ? valueOf('reg-present') : valueOf('reg-permanent'),
        mobileNumber: valueOf('reg-mobile'),
        email: valueOf('reg-email'),
        facebookLink: isStudent ? valueOf('reg-fb') : '',
        password: password,
        profilePicture: profilePicUrl,
        isVerified: false,
        role: isStudent ? 'student' : 'user',
        createdAt: new Date().toISOString(),
        ownerUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : ''
      };

      state.users.push(newUser);
      saveUsers(state.users);
      state.currentUser = newUser;
      saveCurrentUser(newUser);
      loadOikkoSettingsFromFirestore();
      state.activeView = 'feed';
      state.authError = '';
      showToast('রেজিস্ট্রেশন সফল হয়েছে!', 'success');
      renderApp();

      // Save user to Cloud Firestore in Realtime
      if (window.firebaseDb && window.fb) {
        try {
          await (window.firebaseAuthReady || Promise.resolve());
          newUser.ownerUid = window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '';
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', newUser.id), newUser);
          showToast('একাউন্ট ক্লাউডে সফলভাবে যুক্ত হয়েছে!', 'success');
        } catch (err) {
          console.warn('Firebase registration sync note:', err);
        }
      }
    }

    // --- Profile Avatar Device Upload Handler ---
    async function handleProfileAvatarFileSelect(e, mode) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে শুধুমাত্র ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('প্রোফাইল ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressedDataUrl = await compressImage(file, 400, 400, 0.85);
        if (mode === 'reg') {
          const preview = document.getElementById('reg-avatar-preview');
          const input = document.getElementById('reg-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        } else if (mode === 'edit') {
          const preview = document.getElementById('edit-avatar-preview');
          const input = document.getElementById('edit-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        }
        showToast('ডিভাইস থেকে প্রোফাইল ছবি যুক্ত হয়েছে!', 'success');
      } catch (err) {
        console.error('Avatar error:', err);
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }

    // --- Post Media Upload from Device (Image & Video) ---
    async function handleMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');

      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.82);
          state.selectedMedia = {
            type: 'image',
            url: dataUrl,
            name: file.name
          };
        } else {
          // ভিডিও সাইজ চেক (১০০MB লিমিট)
          if (file.size > 100* 1024  * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ১০০GB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          state.selectedMedia = {
            type: 'video',
            url: dataUrl,
            name: file.name
          };
        }

        showToast(`${isImage ? 'ছবি' : 'ভিডিও'} সফলভাবে নির্বাচন করা হয়েছে!`, 'success');
        updateMediaPreviewUI();
      } catch (err) {
        console.error('File load error:', err);
        showToast('ফাইল লোড করতে সমস্যা হয়েছে', 'error');
      }
    }

    async function handleLogout() {
      if (typeof stopMessengerListener === 'function') stopMessengerListener();
      if (typeof stopMessengerNotificationListener === 'function') stopMessengerNotificationListener();
      try {
      } catch (err) {
        console.warn('Firebase sign out note:', err);
      }
      state.currentUser = null;

    let oikkoSettingsSaveTimer = null;
    function saveOikkoSettings(){
      try { localStorage.setItem('oikko_settings', JSON.stringify(state.settings)); } catch(e) {}
      if (oikkoSettingsSaveTimer) clearTimeout(oikkoSettingsSaveTimer);
      oikkoSettingsSaveTimer = setTimeout(async () => {
        const db = window.firebaseDb, fb = window.fb, me = state.currentUser;
        if (!db || !fb || !me?.id) return;
        try {
          await (window.firebaseAuthReady || Promise.resolve());
          const ownerUid = window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '';
          await fb.setDoc(fb.doc(db, 'oikko_settings', me.id), {
            userId: me.id,
            ownerUid,
            settings: state.settings,
            updatedAt: Date.now()
          }, { merge: true });
        } catch (e) { console.warn('Oikko settings Firestore sync failed:', e); }
      }, 150);
    }

    async function loadOikkoSettingsFromFirestore(){
      const db=window.firebaseDb, fb=window.fb, me=state.currentUser;
      if(!db || !fb || !me?.id) return;
      try {
        await (window.firebaseAuthReady || Promise.resolve());
        const snap=await fb.getDoc(fb.doc(db,'oikko_settings',me.id));
        if(snap.exists()){
          const cloud=snap.data()?.settings;
          if(cloud && typeof cloud==='object'){
            state.settings={...(state.settings||{}),...cloud};
            try{localStorage.setItem('oikko_settings',JSON.stringify(state.settings));}catch(_){}
            if(state.settings.colorTheme) applyOikkoColorTheme(state.settings.colorTheme);
            if(state.settings.fontSize){
              const scale=state.settings.fontSize==='small'?'.92':state.settings.fontSize==='large'?'1.08':'1';
              document.documentElement.style.setProperty('--oikko-user-font-scale',scale);
            }
          }
        } else {
          saveOikkoSettings();
        }
      } catch(e){ console.warn('Oikko settings Firestore load failed:',e); }
    }
    window.loadOikkoSettingsFromFirestore=loadOikkoSettingsFromFirestore;
    function toggleOikkoSetting(key){
      state.settings[key] = !state.settings[key];
      saveOikkoSettings();
      renderApp();
    }
    window.toggleOikkoSetting = toggleOikkoSetting;
    function updateOikkoSetting(key, value){
      state.settings[key] = value;
      saveOikkoSettings();
      if(key === 'fontSize'){
        const scale = value === 'small' ? '.92' : value === 'large' ? '1.08' : '1';
        document.documentElement.style.setProperty('--oikko-user-font-scale', scale);
      }
      if(key === 'colorTheme') applyOikkoColorTheme(value);
      renderApp();
    }
    window.updateOikkoSetting = updateOikkoSetting;

    function getProfileUserById(identifier){
      const cleanId = String(identifier || '').trim().toLowerCase();
      if (!cleanId) return state.currentUser || null;
      return (state.users || []).find(u =>
        (u.id && String(u.id).toLowerCase() === cleanId) ||
        (u.studentId && String(u.studentId).toLowerCase() === cleanId)
      ) || ((state.currentUser && ((state.currentUser.id||'').toLowerCase()===cleanId || (state.currentUser.studentId||'').toLowerCase()===cleanId)) ? state.currentUser : null);
    }


    /* ===================== FRIENDS / FRIEND REQUESTS ===================== */
    state.friendRequests = state.friendRequests || [];
    state.friendships = state.friendships || [];
    state._friendsDataRequested = state._friendsDataRequested || false;

    function friendPairId(a, b) {
      return [String(a), String(b)].sort().join('__');
    }

    function friendStatusFor(targetId) {
      const me = String(state.currentUser?.id || '').trim();
      const target = String(targetId || '').trim();
      if (!me || !target || me === target) return 'self';
      const pair = friendPairId(me, target);
      if ((state.friendships || []).some(f => {
        if (f?.status !== 'accepted') return false;
        const ids = Array.isArray(f.userIds) ? f.userIds.map(v => String(v).trim()) : [];
        return f.id === pair || (ids.length === 2 && ids.includes(me) && ids.includes(target));
      })) return 'friends';
      if ((state.friendRequests || []).some(r => r?.status === 'pending' && String(r.fromId) === target && String(r.toId) === me)) return 'incoming';
      if ((state.friendRequests || []).some(r => r?.status === 'pending' && String(r.fromId) === me && String(r.toId) === target)) return 'outgoing';
      return 'none';
    }

    function renderFriendActionHTML(targetId) {
      const status = friendStatusFor(targetId);
      const id = escapeHtml(String(targetId || ''));
      if (status === 'friends') {
        return `<button class="app-action app-action-primary" type="button" onclick="startMessengerWithUser('${id}')"><i data-lucide="message-circle" class="w-4 h-4"></i><span>মেসেজ</span></button>`;
      }
      if (status === 'outgoing') {
        return `<button class="app-action app-action-soft" type="button" disabled style="opacity:.85;cursor:default"><i data-lucide="clock-3" class="w-4 h-4"></i><span>Request sent</span></button>`;
      }
      if (status === 'incoming') {
        return `<button class="app-action app-action-primary" type="button" onclick="switchView('friends')"><i data-lucide="user-check" class="w-4 h-4"></i><span>Accept request</span></button>`;
      }
      return `<button class="app-action app-action-primary" type="button" onclick="handleFriendAction('${id}')"><i data-lucide="user-plus" class="w-4 h-4"></i><span>Add friend</span></button>`;
    }
    window.renderFriendActionHTML = renderFriendActionHTML;

    let friendsRequestsUnsubscribe = null;
    let friendsListUnsubscribe = null;
    let friendsListenersStarted = false;

    async function loadFriendsData() {
      const db = window.firebaseDb, fb = window.fb, me = state.currentUser;
      if (!db || !fb || !me) return;
      if (friendsListenersStarted) return;
      friendsListenersStarted = true;
      try {
        await (window.firebaseAuthReady || Promise.resolve());

        // Realtime listeners are used here so a request sent from another
        // device/account appears immediately without refreshing the page.
        friendsRequestsUnsubscribe = fb.onSnapshot(
          fb.collection(db, 'oikko_friend_requests'),
          snap => {
            state.friendRequests = Array.from(new Map(snap.docs.map(d => { const data={ id:d.id, ...d.data() }; return [data.id,data]; })).values());
            if (state.activeView === 'friends' || state.activeView === 'profile' || state.activeView === 'messenger') {
              renderApp();
            }
          },
          err => {
            console.warn('Friend requests listener failed:', err);
            if (err?.code === 'permission-denied') showToast('Friend Requests-এর Firestore Rules অনুমতি দিচ্ছে না।', 'error');
          }
        );

        friendsListUnsubscribe = fb.onSnapshot(
          fb.collection(db, 'oikko_friends'),
          snap => {
            state.friendships = Array.from(new Map(snap.docs.map(d => { const data={ id:d.id, ...d.data() }; const ids=Array.isArray(data.userIds)?data.userIds.map(String).sort():[]; const key=ids.length===2 ? ids.join('__') : data.id; return [key,data]; })).values());
            if (state.activeView === 'friends' || state.activeView === 'profile' || state.activeView === 'messenger') {
              renderApp();
            }
          },
          err => {
            console.warn('Friends listener failed:', err);
            if (err?.code === 'permission-denied') showToast('My Friends-এর Firestore Rules অনুমতি দিচ্ছে না।', 'error');
          }
        );
      } catch (err) {
        friendsListenersStarted = false;
        console.warn('Friends data load failed:', err);
        if (err?.code === 'permission-denied') {
          showToast('Friends চালু করতে Firestore Rules-এ oikko_friend_requests ও oikko_friends অনুমতি দিন।', 'error');
        }
      }
    }
    window.loadFriendsData = loadFriendsData;
    window.addEventListener('firebaseReady', () => {
      if (state.currentUser) loadFriendsData();
    });

    async function sendFriendRequest(targetId) {
      const me = state.currentUser, db = window.firebaseDb, fb = window.fb;
      const meId = String(me?.id || '').trim();
      const target = getProfileUserById(targetId);
      const targetIdClean = String(target?.id || targetId || '').trim();
      if (!meId || !targetIdClean || meId === targetIdClean || !db || !fb || friendStatusFor(targetIdClean) !== 'none') return;
      const requestId = `${meId}__${targetIdClean}`;
      try {
        await fb.setDoc(fb.doc(db, 'oikko_friend_requests', requestId), {
          fromId: me.id, fromName: me.fullName || '', fromAvatar: me.profilePicture || '',
          toId: targetIdClean, toName: target?.fullName || '', toAvatar: target?.profilePicture || '',
          status: 'pending', createdAt: Date.now(), ownerUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '', fromUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : ''
        });
        if (!state.friendRequests.some(r => r.id === requestId)) state.friendRequests.push({id:requestId, fromId:me.id, toId:targetIdClean, status:'pending',
          fromName:me.fullName||'', fromAvatar:me.profilePicture||'', toName:target?.fullName||'', toAvatar:target?.profilePicture||''});
        showToast('Friend request পাঠানো হয়েছে', 'success');
        renderApp();
      } catch (err) {
        console.error(err);
        showToast(err?.code === 'permission-denied' ? 'Firestore Rules Friend request অনুমোদন করছে না।' : 'Friend request পাঠানো যায়নি।', 'error');
      }
    }

    async function acceptFriendRequest(requestId) {
      const me = state.currentUser, req = (state.friendRequests||[]).find(r => r.id === requestId);
      const db = window.firebaseDb, fb = window.fb;
      if (!me || !req || String(req.toId) !== String(me.id) || req.status !== 'pending' || !db || !fb) return;
      try {
        const pairId = friendPairId(req.fromId, req.toId);
        await fb.setDoc(fb.doc(db, 'oikko_friends', pairId), {userIds:[req.fromId, req.toId], status:'accepted', createdAt:Date.now(), ownerUid:window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '', fromUid:req.fromId, toId:req.toId});
        await fb.updateDoc(fb.doc(db, 'oikko_friend_requests', requestId), {status:'accepted', respondedAt:Date.now()});
        req.status = 'accepted';
        state.friendships = Array.from(new Map([...(state.friendships||[]), {id:pairId, userIds:[req.fromId,req.toId], status:'accepted'}].map(f => [friendPairId(f.userIds?.[0]||f.fromId||'', f.userIds?.[1]||f.toId||''), f])).values());
        showToast('Friend request গ্রহণ করা হয়েছে', 'success');
        renderApp();
      } catch (err) {
        console.error(err);
        showToast(err?.code === 'permission-denied' ? 'Firestore Rules Friends write অনুমোদন করছে না।' : 'Request গ্রহণ করা যায়নি।', 'error');
      }
    }
    window.acceptFriendRequest = acceptFriendRequest;

    async function rejectFriendRequest(requestId) {
      const me = state.currentUser, req = (state.friendRequests||[]).find(r => r.id === requestId);
      const db = window.firebaseDb, fb = window.fb;
      if (!me || !req || req.toId !== me.id || req.status !== 'pending' || !db || !fb) return;
      try {
        await fb.updateDoc(fb.doc(db, 'oikko_friend_requests', requestId), {status:'rejected', respondedAt:Date.now()});
        req.status = 'rejected';
        showToast('Friend request প্রত্যাখ্যান করা হয়েছে', 'success');
        renderApp();
      } catch (err) {
        console.error(err);
        showToast('Request প্রত্যাখ্যান করা যায়নি।', 'error');
      }
    }
    window.rejectFriendRequest = rejectFriendRequest;

    async function handleFriendAction(targetId) {
      const status = friendStatusFor(targetId);
      if (status === 'none') return sendFriendRequest(targetId);
      if (status === 'incoming') return switchView('friends');
      if (status === 'outgoing') showToast('Friend request এখনো pending আছে', 'info');
      if (status === 'friends') showToast('আপনারা ইতোমধ্যে Friends', 'info');
    }
    window.handleFriendAction = handleFriendAction;

      return `<div class="oikko-friend-card">
        <img src="${escapeHtml(user.profilePicture||'')}" class="oikko-friend-avatar" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200'">
        <div class="min-w-0 flex-1">
          <button class="oikko-friend-name" onclick="openSocialProfile('${escapeHtml(user.id)}')">${escapeHtml(user.fullName||'Oikko user')} ${user.isVerified?getVerifiedBadgeHTML('xs'):''}</button>
          <div class="oikko-friend-meta">${escapeHtml(user.studentClass||'শিক্ষার্থী')}${user.studentId?` • ID: ${escapeHtml(user.studentId)}`:''}</div>

    function renderFriendsView() {
      const me = state.currentUser;
      if (!me) return '';
      const incoming = (state.friendRequests||[]).filter(r=>String(r.toId)===String(me.id) && r.status==='pending');
      const outgoing = (state.friendRequests||[]).filter(r=>String(r.fromId)===String(me.id) && r.status==='pending');
      const friendIds = [...new Set((state.friendships||[])
        .filter(f=>f.status==='accepted' && Array.isArray(f.userIds) && f.userIds.includes(me.id))
        .map(f=>f.userIds.find(id=>id!==me.id)).filter(Boolean).map(String))];
      const friends = friendIds.map(id=>getProfileUserById(id)).filter(Boolean);

      return `<main class="oikko-friends-page max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-28">

        <div class="oikko-friends-grid">
          <section class="app-card oikko-friends-section"><div class="oikko-friends-section-title"><div><h2>Friend Requests</h2><p>কে আপনাকে Friend request পাঠিয়েছে</p></div><span>${incoming.length}</span></div>
            ${incoming.length?incoming.map(r=>{const u=getProfileUserById(r.fromId)||{id:r.fromId,fullName:r.fromName,profilePicture:r.fromAvatar};return renderFriendUserCard(u,`<button class="app-action app-action-primary" onclick="acceptFriendRequest('${escapeHtml(r.id)}')"><i data-lucide="check" class="w-4 h-4"></i> গ্রহণ</button><button class="app-action app-action-soft" onclick="rejectFriendRequest('${escapeHtml(r.id)}')">বাদ</button>`)}).join(''):`<div class="oikko-friends-empty"><i data-lucide="inbox" class="w-7 h-7"></i><p>এখন কোনো Friend request নেই।</p></div>`}
          </section>
          <section class="app-card oikko-friends-section"><div class="oikko-friends-section-title"><div><h2>My Friends</h2><p>আপনার Friends এখানে দেখা যাবে</p></div><span>${friends.length}</span></div>
            ${friends.length?friends.map(u=>renderFriendUserCard(u,`${friendStatusFor(u.id)==='friends' ? `<button class="app-action app-action-soft" onclick="startMessengerWithUser('${escapeHtml(u.id)}')"><i data-lucide="message-circle" class="w-4 h-4"></i> মেসেজ</button>` : `<button class="app-action app-action-soft opacity-70" onclick="handleMessengerAccess('${escapeHtml(u.id)}')"><i data-lucide="lock" class="w-4 h-4"></i> Friend হলে মেসেজ</button>`}`)).join(''):`<div class="oikko-friends-empty"><i data-lucide="users" class="w-7 h-7"></i><p>এখনো কোনো Friend নেই। অন্যদের Profile থেকে Add friend চাপুন।</p></div>`}
          </section>
          <section class="app-card oikko-friends-section oikko-friends-outgoing"><div class="oikko-friends-section-title"><div><h2>Sent Requests</h2><p>আপনার পাঠানো pending request</p></div><span>${outgoing.length}</span></div>
            ${outgoing.length?outgoing.map(r=>{const u=getProfileUserById(r.toId)||{id:r.toId,fullName:r.toName,profilePicture:r.toAvatar};return renderFriendUserCard(u,`<span class="oikko-request-pending">Pending</span>`)}).join(''):`<div class="oikko-friends-empty"><p>কোনো pending sent request নেই।</p></div>`}
          </section>
        </div>
      </main>`;
    }
    window.renderFriendsView = renderFriendsView;

    function renderProfileView(identifier){
      const u = getProfileUserById(identifier) || state.currentUser;

    function updateOikkoUserField(field,value){

      if(idx>=0) state.users[idx][field]=value;
      saveCurrentUser(state.currentUser); saveUsers(state.users||[]);
      if(window.firebaseDb&&window.fb&&state.currentUser.id) (window.firebaseAuthReady || Promise.resolve()).then(() => window.fb.setDoc(window.fb.doc(window.firebaseDb,'users',state.currentUser.id),{[field]:value, ownerUid:window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : ''},{merge:true})).catch(console.warn);
    }
    /* ===== Oikko global color-theme engine =====
       The original app used many fixed green Tailwind/hex classes, so changing
       only --oikko-accent could not recolor those rendered components. This
       engine keeps the existing layout/features and remaps the app's accent
       palette everywhere, including dynamically-rendered Messenger, Tube,
       Friends, Profile, Settings, Admin and Home elements.
    */
    const OIKKO_THEME_PALETTES = {
      green:  { accent:'#2f6f57', dark:'#173b2d', soft:'#e7f6ee', pale:'#f1f8f4', mid:'#176248', glow:'#bfe6d0' },
      blue:   { accent:'#2563eb', dark:'#172554', soft:'#dbeafe', pale:'#eff6ff', mid:'#1d4ed8', glow:'#bfdbfe' },
      purple: { accent:'#7c3aed', dark:'#2e1065', soft:'#ede9fe', pale:'#f5f3ff', mid:'#6d28d9', glow:'#ddd6fe' },
      orange: { accent:'#ea580c', dark:'#431407', soft:'#ffedd5', pale:'#fff7ed', mid:'#c2410c', glow:'#fed7aa' },
      pink:   { accent:'#db2777', dark:'#500724', soft:'#fce7f3', pale:'#fdf2f8', mid:'#be185d', glow:'#fbcfe8' }
    };

    const OIKKO_ACCENT_REMAP = {
      '#2f6f57':'accent','#245544':'dark','#173b2d':'dark','#123f30':'dark','#176248':'mid','#238463':'accent',
      '#31b886':'accent','#2d6650':'accent','#2b5242':'accent','#24483a':'dark','#143b2d':'soft','#143b2d':'soft',
      '#e7fbef':'soft','#8ed9b0':'glow','#d8f3e4':'soft','#b9ead1':'glow','#b8ecd4':'glow','#bfe6d3':'glow',
      '#d8eee2':'glow','#eef8f2':'pale','#e2f4ea':'soft','#edf2ef':'pale','#dce7e0':'glow','#d7e4dc':'glow',
      '#d8e9df':'glow','#e8eee9':'glow','#f7faf8':'pale'
    };

    function oikkoThemeHex(theme, key){
      const p=OIKKO_THEME_PALETTES[theme]||OIKKO_THEME_PALETTES.green;
      return p[key]||p.accent;
    }

    function remapOikkoAccentClasses(root=document){
      const theme=state?.settings?.colorTheme||'green';
      const p=OIKKO_THEME_PALETTES[theme]||OIKKO_THEME_PALETTES.green;
      const nodes=[];
      try {
        if(root.nodeType===1) nodes.push(root);
        if(root.querySelectorAll) nodes.push(...root.querySelectorAll('[class]'));
      } catch(_) {}
      nodes.forEach(el=>{
        if(!el.classList) return;
        [...el.classList].forEach(cls=>{
          const m=cls.match(/^(bg|text|border|ring|decoration|from|via|to)-\[#([0-9a-fA-F]{6})\]$/);
          if(!m) return;
          const hex='#'+m[2].toLowerCase();
          const key=OIKKO_ACCENT_REMAP[hex];
          if(!key) return;
          const replacement=p[key]||p.accent;
          const next=`${m[1]}-[#${replacement.slice(1)}]`;
          if(next!==cls) el.classList.replace(cls,next);
        });
      });
    }

    function applyOikkoColorTheme(theme){
      theme=OIKKO_THEME_PALETTES[theme]?theme:'green';
      const p=OIKKO_THEME_PALETTES[theme];
      const root=document.documentElement;
      root.dataset.oikkoTheme=theme;
      root.style.setProperty('--oikko-accent',p.accent);
      root.style.setProperty('--oikko-accent-dark',p.dark);
      root.style.setProperty('--oikko-accent-soft',p.soft);
      root.style.setProperty('--oikko-accent-pale',p.pale);
      root.style.setProperty('--oikko-accent-mid',p.mid);
      root.style.setProperty('--oikko-accent-glow',p.glow);
      root.style.setProperty('--primary-olive',p.accent);
      root.style.setProperty('--primary-dark',p.dark);
      root.style.setProperty('--brand-mint',p.soft);
      root.style.setProperty('--theme-selection',p.glow);
      remapOikkoAccentClasses(document);
      try {
        if(window.lucide) lucide.createIcons();
      } catch(_) {}
    }

    // Newly-rendered views are observed so theme changes do not disappear when
    // renderApp() replaces the page DOM.
    let oikkoThemeObserverStarted=false;
    function startOikkoThemeObserver(){
      if(oikkoThemeObserverStarted || !window.MutationObserver) return;
      oikkoThemeObserverStarted=true;
      const appRoot=document.getElementById('app')||document.body;
      new MutationObserver(mutations=>{
        mutations.forEach(m=>m.addedNodes.forEach(n=>{
          if(n.nodeType===1) remapOikkoAccentClasses(n);
        }));
      }).observe(appRoot,{childList:true,subtree:true});
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{startOikkoThemeObserver(); applyOikkoColorTheme(state.settings?.colorTheme||'green');});
    else { startOikkoThemeObserver(); applyOikkoColorTheme(state.settings?.colorTheme||'green'); }

    async function handleCreatePost(e) {
      e.preventDefault();
      const content = document.getElementById('new-post-content').value.trim();
      const media = state.selectedMedia;

      if (!content && !media) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন', 'error');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
      const newPost = {
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: content,
        mediaType: media ? media.type : null,
        imageUrl: (media && media.type === 'image') ? media.url : '',
        videoUrl: (media && media.type === 'video') ? media.url : '',
        likes: [],
        comments: [],
        createdAt: dateStr,
        timestamp: Date.now(),
        ownerUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : ''
      };

      document.getElementById('new-post-content').value = '';
      state.selectedMedia = null;
      const fileInput = document.getElementById('post-media-file');
      if (fileInput) fileInput.value = '';

      // Automatic mention notification dispatch (@everyone or specific students)
      dispatchMentionNotifications(content, state.currentUser, 'পোস্টে');

      // Optimistic local update so the new post is visible immediately, even
      // while Firestore is still processing the write.
      const localPost = { id: 'post_' + Date.now(), ...newPost };
      state.posts.unshift(localPost);
      savePosts(state.posts);
      renderApp();

      // Save directly to Firebase Firestore for all mobiles & devices
      if (window.firebaseDb && window.fb) {
        try {
          await (window.firebaseAuthReady || Promise.resolve());
          newPost.ownerUid = window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '';
          await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'posts'), newPost);
          showToast('নতুন পোস্ট শেয়ার হয়েছে!', 'success');
        } catch (err) {
          console.error('Firestore addDoc error:', err);
          showToast('পোস্ট হয়েছে (লোকাল মেমোরি)।', 'error');
        }
      } else {
        showToast('নতুন পোস্ট প্রকাশিত হয়েছে!', 'success');
      }
    }

    function renderEditPostMediaHTML() {

        return `<div class="p-3 rounded-xl bg-[#F9F9F4] border border-dashed border-[#E2E2D5] text-center text-[#8A8A6A] text-xs">কোনো ছবি বা ভিডিও যুক্ত নেই</div>`;
      }
      if (editPostMediaState.type === 'video') {
        return `
          <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] bg-black max-h-56 flex items-center justify-center">

          <button type="button" onclick="handleRemoveEditPostMedia()" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-md cursor-pointer" title="ছবি মুছে ফেলুন">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>

      `;

    function handleRemoveEditPostMedia() {
      editPostMediaState = { type: null, url: '', name: '' };
      const box = document.getElementById('edit-post-media-box');
      if (box) {
        box.innerHTML = renderEditPostMediaHTML();
        if (window.lucide) lucide.createIcons();
      }
    }
    window.handleRemoveEditPostMedia = handleRemoveEditPostMedia;

    async function handleEditMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');
      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.85);
          editPostMediaState = { type: 'image', url: dataUrl, name: file.name };
        } else {
          if (file.size > 20 * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ২০MB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          editPostMediaState = { type: 'video', url: dataUrl, name: file.name };
        }
        const box = document.getElementById('edit-post-media-box');
        if (box) {
          box.innerHTML = renderEditPostMediaHTML();
          if (window.lucide) lucide.createIcons();
        }
        showToast('মিডিয়া নির্বাচন করা হয়েছে!', 'success');
      } catch (err) {
        showToast('মিডিয়া লোড করা যায়নি', 'error');
      }
    }
    window.handleEditMediaFileSelect = handleEditMediaFileSelect;

    async function handleSaveEditPost(e, postId) {
      e.preventDefault();
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const contentInput = document.getElementById('edit-post-content');
      const newContent = contentInput ? contentInput.value.trim() : '';

      const hasMedia = editPostMediaState && editPostMediaState.url;
      if (!newContent && !hasMedia) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও রাখুন!', 'error');
        return;
      }

      post.content = newContent;
      if (editPostMediaState && editPostMediaState.url) {
        post.mediaType = editPostMediaState.type;
        post.imageUrl = editPostMediaState.type === 'image' ? editPostMediaState.url : '';
        post.videoUrl = editPostMediaState.type === 'video' ? editPostMediaState.url : '';
      } else {
        post.mediaType = null;
        post.imageUrl = '';
        post.videoUrl = '';
      }
      post.isEdited = true;

      savePosts(state.posts);
      closeProfileModal();
      showToast('পোস্ট সফলভাবে এডিট ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Automatic mention notifications for updated content
      dispatchMentionNotifications(newContent, state.currentUser, 'এডিটেড পোস্টে');

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            content: post.content,
            imageUrl: post.imageUrl || '',
            videoUrl: post.videoUrl || '',
            mediaType: post.mediaType || null,
            isEdited: true
          });
        } catch (err) {
          console.warn('Firestore edit post sync note:', err);
        }
      }
    }
    window.handleSaveEditPost = handleSaveEditPost;

    function handleFilterEvents(cat) {
      state.eventFilterCategory = cat;
      renderApp();
    }
    window.handleFilterEvents = handleFilterEvents;

    function handleToggleEventRsvp(eventId) {
      const ev = state.events.find(e => e.id === eventId);
      if (!ev) return;
      if (!ev.participants) ev.participants = [];

      const idx = ev.participants.indexOf(state.currentUser.studentId);
      if (idx === -1) {
        ev.participants.push(state.currentUser.studentId);
        showToast('ইভেন্টে অংশগ্রহণের তালিকাভুক্ত করা হয়েছে!', 'success');
      } else {
        ev.participants.splice(idx, 1);
        showToast('ইভেন্ট থেকে অংশগ্রহণ প্রত্যাহার করা হয়েছে', 'info');
      }
      saveEvents(state.events);
      renderApp();

      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'events', ev.id), ev, { merge: true }).catch(console.warn);
      }
    }
    window.handleToggleEventRsvp = handleToggleEventRsvp;

    async function handleCreateEvent(e) {
      e.preventDefault();
      const title = document.getElementById('ev-title').value.trim();
      const date = document.getElementById('ev-date').value.trim();
      const time = document.getElementById('ev-time').value.trim();
      const location = document.getElementById('ev-location').value.trim();
      const category = document.getElementById('ev-category').value;
      const banner = document.getElementById('ev-banner').value.trim() || 'https://images.unsplash.com/photo-1511578314322-379afb476865?w=800';
      const desc = document.getElementById('ev-desc').value.trim();

      const newEvent = {
        id: 'ev_' + Date.now(),
        title,
        date,
        time,
        location,
        category,
        banner,
        description: desc,
        participants: [state.currentUser.studentId],
        timestamp: Date.now(),
        ownerUid: window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : ''
      };

      state.events.unshift(newEvent);
      saveEvents(state.events);
      closeProfileModal();
      showToast('নতুন ইভেন্ট সফলভাবে প্রকাশ করা হয়েছে!', 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await (window.firebaseAuthReady || Promise.resolve());
          newEvent.ownerUid = window.getFirebaseOwnerUid ? window.getFirebaseOwnerUid() : '';
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'events', newEvent.id), newEvent, { merge: true });
        } catch (err) {
          console.warn('Firebase setDoc event error:', err);
        }
      }
    }
    window.handleCreateEvent = handleCreateEvent;

    async function handleDeleteEvent(eventId) {
      if (!confirm('আপনি কি নিশ্চিত যে এই ইভেন্টটি মুছে ফেলতে চান?')) return;
      state.events = state.events.filter(e => e.id !== eventId);
      saveEvents(state.events);
      showToast('ইভেন্ট মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb && eventId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'events', eventId));
        } catch (err) {
          console.warn('Firebase deleteDoc event error:', err);
        }
      }

    async function handlePastPhotoFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressed = await compressImage(file, 1200, 1200, 0.85);
        selectedPastPhotoDataUrl = compressed;
        const nameEl = document.getElementById('past-photo-filename');
        if (nameEl) nameEl.textContent = file.name;
        const box = document.getElementById('past-photo-preview-box');
        const img = document.getElementById('past-photo-preview-img');
        if (box && img) {
          img.src = compressed;
          box.classList.remove('hidden');
        }
        showToast('ছবি নির্বাচন সফল হয়েছে!', 'success');
      } catch (err) {
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }

      const category = document.getElementById('past-photo-category').value;
      const urlInput = document.getElementById('past-photo-url').value.trim();
      const desc = document.getElementById('past-photo-desc').value.trim();

      const finalImageUrl = selectedPastPhotoDataUrl || urlInput;
      if (!finalImageUrl) {
        showToast('অনুগ্রহ করে ছবি নির্বাচন করুন অথবা ছবির লিংক দিন', 'error');
        return;

      const newPhoto = {
        id: 'past_ev_' + Date.now(),
        title,
        date,
        category,
        imageUrl: finalImageUrl,
        description: desc,
        timestamp: Date.now(),

      };

      if (!confirm('আপনি কি নিশ্চিত যে এই ছবিটি অ্যালবাম থেকে মুছে ফেলতে চান?')) return;

      state.pastEventPhotos = (state.pastEventPhotos || []).filter(p => p.id !== photoId);
      savePastEventPhotos(state.pastEventPhotos);
      showToast('ছবিটি অ্যালবাম থেকে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb && photoId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'past_events_gallery', photoId));
        } catch (err) {
          console.warn('Firebase delete past event photo error:', err);
        }
      }
    }
    window.handleDeletePastEventPhoto = handleDeletePastEventPhoto;

    async function downloadSourceCode() {
      try {
        const res = await fetch(window.location.href.split('#')[0]);
        if (res.ok) {
          const text = await res.text();
          const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('index.html ফাইলটি সফলভাবে ডাউনলোড হয়েছে!', 'success');
          return;
        }
      } catch (e) {}
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('index.html ফাইলটি ডাউনলোড শুরু হয়েছে!', 'success');
    }
    window.downloadSourceCode = downloadSourceCode;

    // --- EVENT PARTICIPANTS MODAL & ADMIN PROFILE VIEWER ---
    let eventParticipantsSearchQuery = '';

    function openEventParticipantsModal(eventId, searchStr = '') {
      const ev = state.events.find(e => e.id === eventId);
      if (!ev) {
        showToast('ইভেন্টের তথ্য পাওয়া যায়নি', 'error');
        return;
      }

      state.lastOpenedEventId = eventId;
      eventParticipantsSearchQuery = typeof searchStr === 'string' ? searchStr : '';

      const participantsIds = ev.participants || [];
      const participantUsers = participantsIds.map(pId => {
        const found = state.users.find(u => 
          (u.studentId && u.studentId.toUpperCase() === String(pId).toUpperCase()) ||
          (u.id && u.id === pId)
        );
        if (found) return found;
        return {
          id: pId,
          studentId: pId,
          fullName: pId === 'ADMIN001' ? 'Khan Mohammad Ismail (এডমিন)' : `শিক্ষার্থী (${pId})`,
          studentClass: pId === 'ADMIN001' ? 'এডমিন' : 'শিক্ষার্থী',
          roll: 'N/A',
          section: 'সাধারণ',
          shift: 'দিবা',
          bloodGroup: 'O+',
          mobileNumber: '',
          email: '',
          profilePicture: pId === 'ADMIN001' ? ADMIN_DATA.profilePicture : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
          isVerified: pId === 'ADMIN001',
          role: pId === 'ADMIN001' ? 'admin' : 'student'
        };
      });

      const query = eventParticipantsSearchQuery.toLowerCase().trim();
      const filteredParticipants = query ? participantUsers.filter(p => 
        (p.fullName && p.fullName.toLowerCase().includes(query)) ||
        (p.studentId && p.studentId.toLowerCase().includes(query)) ||
        (p.roll && p.roll.toLowerCase().includes(query)) ||
        (p.studentClass && p.studentClass.toLowerCase().includes(query)) ||
        (p.mobileNumber && p.mobileNumber.toLowerCase().includes(query))
      ) : participantUsers;

      const isAdmin = state.currentUser && state.currentUser.role === 'admin';

      const modalContainer = document.getElementById('modal-container');
      modalContainer.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
          <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl border border-[#E2E2D5] overflow-hidden animate-in fade-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]">
            <!-- Header -->
            <div class="bg-[#5A5A40] text-white p-4 sm:p-5 flex items-center justify-between shrink-0">
              <div class="flex items-center gap-3 min-w-0">
                <div class="p-2.5 bg-white/20 rounded-xl shrink-0">
                  <i data-lucide="users" class="w-6 h-6 text-white"></i>
                </div>
                <div class="min-w-0">
                  <h3 class="font-bold text-base sm:text-lg leading-tight truncate">
                    ${ev.title}
                  </h3>
                  <div class="flex items-center gap-2 mt-1 text-xs text-[#D1D1C2] flex-wrap">
                    <span class="bg-white/20 px-2 py-0.5 rounded text-white font-semibold">${ev.date}</span>
                    <span>•</span>
                    <span>মোট ${participantsIds.length} জন শিক্ষার্থী অংশগ্রহণ করছেন</span>
                    ${isAdmin ? '<span class="bg-red-500/80 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">এডমিন ভিউ</span>' : ''}
                  </div>
                </div>
              </div>
              <button onclick="closeProfileModal()" class="p-1.5 rounded-xl hover:bg-white/20 text-white transition-colors cursor-pointer shrink-0 ml-2" title="বন্ধ করুন">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Search & Filter Inside Modal -->
            <div class="p-3.5 bg-[#F9F9F4] border-b border-[#F0F0E0] flex items-center gap-2 shrink-0">
              <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-[#8A8A6A] absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input
                  id="event-participants-search"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  value="${escapeHtml(eventParticipantsSearchQuery)}"
                  oninput="openEventParticipantsModal('${ev.id}', this.value)"
                  placeholder="অংশগ্রহণকারীদের নাম, রোল বা স্টুডেন্ট আইডি দিয়ে খুঁজুন..."
                  class="w-full pl-9 pr-3 py-2 bg-white border border-[#E2E2D5] rounded-xl text-xs sm:text-sm text-[#42422F] focus:outline-none focus:ring-1 focus:ring-[#5A5A40]"
                />
              </div>
              <span class="text-xs text-[#8A8A6A] font-semibold shrink-0 px-2">
                ${filteredParticipants.length} জন পাওয়া গেছে
              </span>
            </div>

            <!-- Participant List Body -->
            <div class="p-4 sm:p-5 overflow-y-auto flex-1 space-y-3">
              ${filteredParticipants.length === 0 ? `
                <div class="p-8 text-center bg-[#F9F9F4] rounded-2xl border border-dashed border-[#E2E2D5]">
                  <i data-lucide="users" class="w-10 h-10 text-[#8A8A6A] mx-auto mb-2 opacity-50"></i>
                  <h4 class="font-bold text-sm text-[#42422F]">কোনো অংশগ্রহণকারী শিক্ষার্থী পাওয়া যায়নি</h4>
                  <p class="text-xs text-[#8A8A6A] mt-1">${query ? 'ভিন্ন কোনো নাম বা আইডি দিয়ে চেষ্টা করুন' : 'এখনো কোনো শিক্ষার্থী এই ইভেন্টে অংশগ্রহণ করেনি'}</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 gap-3">
                  ${filteredParticipants.map(stu => `
                    <div class="p-3.5 rounded-2xl bg-white border border-[#E2E2D5] hover:border-[#5A5A40] transition-all shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-3 group">
                      <!-- Student Identity -->
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="relative shrink-0 cursor-pointer" onclick="openProfileModal('${stu.id || stu.studentId}', '${ev.id}')">
                          <img src="${stu.profilePicture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="w-12 h-12 rounded-2xl object-cover border border-[#E2E2D5] group-hover:ring-2 group-hover:ring-[#5A5A40] transition-all" />
                          ${stu.isVerified ? `<div class="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 shadow-xs">${getVerifiedBadgeHTML('sm')}</div>` : ''}
                        </div>
                        <div class="min-w-0">
                          <div class="font-bold text-xs sm:text-sm text-[#42422F] flex items-center gap-1.5 flex-wrap">
                            <span class="cursor-pointer hover:underline hover:text-[#5A5A40]" onclick="openProfileModal('${stu.id || stu.studentId}', '${ev.id}')">${stu.fullName}</span>
                            ${stu.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                            <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[#F5F5F0] border border-[#E2E2D5] text-[#5A5A40] font-bold">ID: ${stu.studentId}</span>
                          </div>
                          <div class="text-[11px] text-[#8A8A6A] mt-0.5 flex items-center gap-2 flex-wrap">
                            <span>${stu.studentClass || 'শিক্ষার্থী'}</span>
                            ${stu.roll && stu.roll !== 'N/A' ? `<span>• রোল: #${stu.roll}</span>` : ''}
                            ${stu.section ? `<span>• শাখা: ${stu.section}</span>` : ''}
                            ${stu.bloodGroup ? `<span class="text-rose-600 font-semibold">• রক্ত: ${stu.bloodGroup}</span>` : ''}
                          </div>
                          ${stu.mobileNumber ? `
                            <div class="text-[10px] text-[#5A5A40] mt-0.5 flex items-center gap-1">
                              <i data-lucide="phone" class="w-3 h-3 text-emerald-600"></i>
                              <a href="tel:${stu.mobileNumber}" class="font-mono hover:underline font-semibold">${stu.mobileNumber}</a>
                            </div>
                          ` : ''}
                        </div>
                      </div>

                      <!-- Action Buttons: View Complete Profile & Admin Options -->
                      <div class="flex items-center gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-[#F0F0E0]">
                        <button
                          type="button"
                          onclick="openProfileModal('${stu.id || stu.studentId}', '${ev.id}')"
                          class="px-3.5 py-2 rounded-xl bg-[#5A5A40] hover:bg-[#4A4A33] text-white text-xs font-bold transition-all shadow-xs flex items-center gap-1.5 cursor-pointer"
                          title="${stu.fullName}-এর পিতা-মাতা, ঠিকানা ও জন্মনিবন্ধনসহ সম্পূর্ণ প্রোফাইল দেখুন"
                        >
                          <i data-lucide="user" class="w-3.5 h-3.5"></i>
                          <span>প্রোফাইল দেখুন</span>
                        </button>

                        ${isAdmin ? `
                          <button
                            type="button"
                            onclick="handleAdminRemoveParticipant('${ev.id}', '${stu.studentId}')"
                            class="p-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 transition-colors border border-red-200 cursor-pointer"
                            title="এই ইউজারকে ইভেন্ট থেকে রিমুভ করুন"
                          >
                            <i data-lucide="user-x" class="w-4 h-4"></i>
                          </button>
                        ` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Footer -->
            <div class="p-3.5 bg-[#F5F5F0] border-t border-[#E2E2D5] flex items-center justify-between shrink-0">
              <span class="text-[11px] text-[#8A8A6A]">
                এডমিন যেকোনো ইউজারের "প্রোফাইল দেখুন" বাটনে ক্লিক করে পিতা-মাতা, ঠিকানা ও জন্মনিবন্ধনসহ বিস্তারিত দেখতে পারবেন।
              </span>
              <button onclick="closeProfileModal()" class="px-5 py-2 rounded-xl bg-white hover:bg-[#E2E2D5] text-[#5A5A40] border border-[#E2E2D5] text-xs font-bold transition-colors cursor-pointer shadow-2xs">
                বন্ধ করুন
              </button>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
      const participantSearch = document.getElementById('event-participants-search');
      if (participantSearch && eventParticipantsSearchQuery) {
        participantSearch.focus();
        const len = participantSearch.value.length;
        try { participantSearch.setSelectionRange(len, len); } catch (e) {}
      }
    }
    window.openEventParticipantsModal = openEventParticipantsModal;

    function handleAdminRemoveParticipant(eventId, studentId) {
      if (!confirm(`আপনি কি এই ইউজারকে (${studentId}) এই ইভেন্টের অংশগ্রহণকারী তালিকা থেকে সরাতে চান?`)) return;
      const ev = state.events.find(e => e.id === eventId);
      if (!ev || !ev.participants) return;
      ev.participants = ev.participants.filter(p => p !== studentId);
      saveEvents(state.events);
      showToast('ইউজার সফলভাবে মুছে ফেলা হয়েছে', 'info');
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'events', ev.id), ev, { merge: true }).catch(console.warn);
      }
      openEventParticipantsModal(eventId, eventParticipantsSearchQuery);
      renderApp();
    }
    window.handleAdminRemoveParticipant = handleAdminRemoveParticipant;

    // --- ADMIN POSTS VIEW ---
    function renderAdminPostsView() {
      const adminPosts = state.posts.filter(p => 
        p.authorStudentId === 'ADMIN001' || 
        (state.users.find(u => (u.studentId === p.authorStudentId || u.id === p.authorId) && u.role === 'admin'))
      );

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-28 flex-1 w-full">
          <!-- Admin Posts Header Banner -->
          <div class="app-hero rounded-3xl p-6 sm:p-7 mb-6 text-white relative overflow-hidden">
            <div class="app-hero-pattern" aria-hidden="true">
              <i data-lucide="megaphone"></i>
              <i data-lucide="shield-check"></i>
              <i data-lucide="bell"></i>
              <i data-lucide="book-open"></i>
            </div>
            <div class="app-hero-orb absolute rounded-full pointer-events-none"></div>
            <div class="relative z-10">
              <p class="text-[11px] uppercase tracking-[.18em] font-black text-[#B9D7C3] mb-2">Official campus notice</p>
              <h1 class="text-2xl sm:text-3xl font-black tracking-tight mb-2">প্রধান এডমিন ও অফিশিয়াল নোটিশ</h1>
              <p class="text-xs sm:text-sm text-[#D7E7DC] leading-relaxed max-w-2xl">প্রতিষ্ঠান প্রশাসন ও প্রধান এডমিনের সকল আনুষ্ঠানিক ঘোষণা, বিজ্ঞপ্তি ও গুরুত্বপূর্ণ নির্দেশনা এখানে পাওয়া যায়।</p>
            </div>
          </div>

          <!-- Admin Posts List -->
          ${adminPosts.length === 0 ? `
            <div class="bg-white rounded-2xl border border-[#E2E2D5] p-12 text-center">
              <div class="w-14 h-14 rounded-full bg-[#F5F5F0] flex items-center justify-center mx-auto mb-3 text-[#8A8A6A]">
                <i data-lucide="info" class="w-7 h-7"></i>
              </div>
              <h3 class="font-bold text-sm text-[#42422F] mb-1">কোনো এডমিন নোটিশ পাওয়া যায়নি</h3>
              <p class="text-xs text-[#8A8A6A]">এডমিন কর্তৃক নতুন পোস্ট প্রকাশ করা হলে তা স্বয়ংক্রিয়ভাবে এখানে দেখা যাবে।</p>
            </div>
          ` : `
            <div class="space-y-6">
              ${adminPosts.map(p => renderPostCard(p)).join('')}
            </div>
          `}
        </main>
      `;
    }

    function handleAdminSearch(val) {
      state.searchQuery = val;
      const active = document.activeElement;
      const caret = active && active.id === 'admin-search' ? active.selectionStart : null;
      renderApp();
      requestAnimationFrame(() => {
        const next = document.getElementById('admin-search');
        if (!next) return;
        next.focus();
        const pos = caret == null ? next.value.length : caret;
        try { next.setSelectionRange(pos, pos); } catch (e) {}
      });
    }
    window.handleAdminSearch = handleAdminSearch;

    async function handleToggleVerify(userId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র এডমিন কোনো ইউজারকে ভেরিফাই করতে পারেন।', 'error');
        return;
      }
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      user.isVerified = !user.isVerified;
      saveUsers(state.users);
      showToast(`${user.fullName}-কে ${user.isVerified ? 'ভেরিফাইড করা হয়েছে' : 'আনভেরিফাইড করা হয়েছে'}`, 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', user.id), {
            isVerified: user.isVerified
          });
        } catch (err) {
          console.warn('Verify sync error:', err);
        }
      }
    }

    async function handleDeleteStudent(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`${user.fullName}-এর একাউন্ট স্থায়ীভাবে ডিলিট করতে চান?`)) return;
      state.users = state.users.filter(u => u.id !== userId);
      saveUsers(state.users);
      showToast('ইউজার সফলভাবে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', user.id));
        } catch (err) {
          console.warn('Delete user cloud error:', err);
        }
      }
    }

    // --- 8. Initialize App ---
    renderApp();
    if (window.firebaseDb && window.firebaseAuthReady) {
      window.firebaseAuthReady.finally(() => {
        try { bootstrapFirestoreDatabase(); } catch(e) { console.warn(e); }
        try { initFirebaseSync(); } catch(e) { console.warn(e); }
      });
    }
  </script>

  <!-- Oikko UI/UX Stability & Enhancement Patch -->
  <style id="oikko-enhancement-patch">

      --oikko-glow: rgba(47,111,87,.18);
      --oikko-surface: rgba(255,255,255,.72);
      --oikko-shadow: 0 18px 55px rgba(18,35,28,.10);
    }

      background-attachment:fixed;
      background-image:
        radial-gradient(circle at 0% 0%, rgba(216,243,228,.92), transparent 32rem),

        radial-gradient(circle at 85% 100%, rgba(239,115,88,.10), transparent 28rem),
        linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,0)),
        var(--bg-canvas);
    }
    body:before,body:after{
      content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:999px;
      filter:blur(55px);opacity:.32;animation:oikkoFloat 14s ease-in-out infinite;
