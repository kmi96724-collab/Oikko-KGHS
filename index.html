    async function handleMessengerMediaSelected(event, targetUserId) {
      const file = event?.target?.files?.[0];
      if (!file || !canMessageUser(targetUserId)) return;
      if (!/^image\/(.+)|^video\/(.+)$/.test(file.type)) {
        showToast('শুধু ছবি বা ভিডিও পাঠানো যাবে', 'error');
        return;
      }
      if (file.size > MAX_MESSENGER_MEDIA_BYTES) {
        showToast('একটি ছবি/ভিডিও সর্বোচ্চ ৫ GB হতে পারবে', 'error');
        return;
      }

      const storage = window.firebaseStorage;
      const api = window.firebaseStorageApi;
      if (!storage || !api) {
        showToast('Media upload চালু নেই। Firebase Storage সেটআপ করুন।', 'error');
        return;
      }

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const firebaseUser = await ensureFirebaseCampusAuth(state.currentUser);
      if (!firebaseUser?.uid) return;
      const path = `oikko_messenger_media/${firebaseUser.uid}/${targetUserId}/${Date.now()}_${safeName}`;
      const storageReference = api.storageRef(storage, path);
      const uploadTask = api.uploadBytesResumable(storageReference, file, {
        contentType: file.type,
        customMetadata: {
          senderId: String(state.currentUser.id),
          receiverId: String(targetUserId),
          originalName: file.name
        }
      });

      showToast(`আপলোড শুরু হয়েছে: 0%`, 'info');
      await new Promise((resolve, reject) => {
        uploadTask.on('state_changed', snapshot => {
          const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
          if (pct === 100 || pct % 10 === 0) showToast(`মিডিয়া আপলোড: ${pct}%`, 'info');
        }, reject, resolve);
      }).catch(err => {
        console.error('Messenger media upload failed:', err);
        showToast('ছবি/ভিডিও আপলোড করা যায়নি। আবার চেষ্টা করুন।', 'error');
        throw err;
      });

      try {
        const downloadUrl = await api.getDownloadURL(storageReference);
        const isVideo = file.type.startsWith('video/');
        const sent = await persistMessengerMessage(targetUserId, {
          text: isVideo ? 'ভিডিও পাঠিয়েছেন' : 'ছবি পাঠিয়েছেন',
          imageUrl: isVideo ? '' : downloadUrl,
          videoUrl: isVideo ? downloadUrl : '',
          mediaType: isVideo ? 'video' : 'image',
          fileName: file.name,
          fileSize: file.size
        });
        if (sent) {
          showToast(isVideo ? 'ভিডিও পাঠানো হয়েছে' : 'ছবি পাঠানো হয়েছে', 'success');
          renderApp();
          scrollChatToBottom();
        }
      } catch (err) {
        console.error('Messenger media message save failed:', err);
        showToast('মিডিয়া পাঠানো যায়নি। আবার চেষ্টা করুন।', 'error');
      }
    }
    window.handleMessengerMediaSelected = handleMessengerMediaSelected;

          <!-- Messenger-style header -->

                          ${msg.mediaType !== 'video' && msg.imageUrl ? `<img src="${escapeHtml(msg.imageUrl)}" alt="ছবি" loading="lazy" class="rounded-xl max-h-80 max-w-full object-cover mb-1.5" />` : ''}
                          ${msg.text && !(msg.mediaType === 'video' && msg.text === 'ভিডিও পাঠিয়েছেন') && !(msg.mediaType === 'image' && msg.text === 'ছবি পাঠিয়েছেন') ? `<p class="break-words whitespace-pre-wrap">${escapeHtml(msg.text)}</p>` : ''}

    // Backwards compatibility alias
    function renderNavbar() {
      return renderBottomNavbar();
    }

    // --- HTML ESCAPE ---
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // --- GLOBAL SEARCH & QUICK DISCOVERY ---
    function syncGlobalSearchInputs(value, exceptId) {
      ['global-search', 'global-search-mobile'].forEach((id) => {
        if (id === exceptId) return;
        const el = document.getElementById(id);
        if (el && el.value !== value) el.value = value;
      });
      document.querySelectorAll('[data-search-clear]').forEach((btn) => {
        btn.classList.toggle('hidden', !String(value || '').length);
      });
    }

    function refreshGlobalSearchPanel() {
      const host = document.getElementById('global-search-results-host');
      if (!host) return;
      host.innerHTML = renderGlobalSearchPanel();
      if (window.lucide) lucide.createIcons();
    }

    function restoreSearchFocus(inputId) {
      requestAnimationFrame(() => {
        const preferred = inputId && document.getElementById(inputId);
        const fallback = document.getElementById('global-search') || document.getElementById('global-search-mobile');
        const el = preferred || fallback;
        if (!el) return;
        el.focus();
        const len = el.value.length;
        try { el.setSelectionRange(len, len); } catch (e) {}
      });
    }

    function handleGlobalSearch(value, inputId) {
      state.globalSearchQuery = String(value || '');
      const needsViewSwitch = state.activeView !== 'feed';
      if (needsViewSwitch) {
        state.activeView = 'feed';
        renderApp();
        restoreSearchFocus(inputId);
        return;
      }
      syncGlobalSearchInputs(state.globalSearchQuery, inputId);
      refreshGlobalSearchPanel();
    }
    window.handleGlobalSearch = handleGlobalSearch;

    function clearGlobalSearch() {
      state.globalSearchQuery = '';
      const host = document.getElementById('global-search-results-host');
      if (host && state.activeView === 'feed') {
        syncGlobalSearchInputs('');
        refreshGlobalSearchPanel();
        return;
      }
      renderApp();
    }
    window.clearGlobalSearch = clearGlobalSearch;

    function getGlobalSearchMatches() {
      const query = String(state.globalSearchQuery || '').trim().toLowerCase();
      if (!query) return { users: [], posts: [], events: [] };
      const users = (state.users || []).filter(user =>
        [user.fullName, user.studentId, user.studentClass, user.section]
          .filter(Boolean)
          .some(value => String(value).toLowerCase().includes(query))
      ).slice(0, 5);
      const posts = (state.posts || []).filter(post =>
        [post.content, post.authorName, post.authorStudentId]
          .filter(Boolean)
          .some(value => String(value).toLowerCase().includes(query))
      ).slice(0, 5);
      const events = (state.events || []).filter(event =>
        [event.title, event.description, event.category, event.location]
          .filter(Boolean)
          .some(value => String(value).toLowerCase().includes(query))
      ).slice(0, 5);
      return { users, posts, events };
    }

    function renderGlobalSearchPanel() {
      const query = String(state.globalSearchQuery || '').trim();
      if (!query) return '';
      const matches = getGlobalSearchMatches();
      const total = matches.users.length + matches.posts.length + matches.events.length;
      return `
        <section class="search-results-panel app-card bg-white rounded-2xl overflow-hidden mb-5">
          <div class="px-4 sm:px-5 py-3.5 border-b border-[#F0F0E0] flex items-center justify-between gap-3">
            <div>
              <p class="app-section-label">সার্চ রেজাল্ট</p>
              <h3 class="font-bold text-sm text-[#42422F] mt-0.5">“${escapeHtml(query)}” এর ফলাফল</h3>
            </div>
            <button type="button" onclick="clearGlobalSearch()" class="text-xs font-bold text-[#8A8A6A] hover:text-[#F27D61]">বন্ধ করুন</button>
          </div>
          ${total === 0 ? `
            <div class="p-7 text-center">
              <div class="w-12 h-12 rounded-2xl bg-[#F5F5F0] mx-auto flex items-center justify-center text-[#8A8A6A] mb-2">
                <i data-lucide="search-x" class="w-6 h-6"></i>
              </div>
              <p class="font-bold text-sm text-[#42422F]">কোনো ফলাফল পাওয়া যায়নি</p>
              <p class="text-xs text-[#8A8A6A] mt-1">অন্য নাম, আইডি, পোস্ট বা ইভেন্ট দিয়ে চেষ্টা করুন।</p>
            </div>
          ` : `

    // --- POST CARD & TIME FORMATTER ---
    function formatPostTimestamp(dateStr, timestamp) {
      if (!dateStr && !timestamp) return 'সম্প্রতি';
      try {
        let d = null;
        if (typeof timestamp === 'number' && !isNaN(timestamp)) {
          d = new Date(timestamp);
        } else if (dateStr) {
          let normalized = dateStr;
          if (/[০-৯]/.test(dateStr)) {
            normalized = dateStr.replace(/[০-৯]/g, dig => '০১২৩৪৫৬৭৮৯'.indexOf(dig).toString());
          }
          const parsed = new Date(normalized);
          if (!isNaN(parsed.getTime())) {
            d = parsed;
          }
        }

        if (!d || isNaN(d.getTime())) {
          return dateStr || 'সম্প্রতি';
        }

        const now = Date.now();
        const diffMs = Math.max(0, now - d.getTime());
        const diffMin = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMin / 60);
        const diffDays = Math.floor(diffHours / 24);

        let relative = '';
        if (diffMin < 1) {
          relative = 'এইমাত্র';
        } else if (diffMin < 60) {
          relative = `${diffMin.toLocaleString('bn-BD')} মিনিট আগে`;
        } else if (diffHours < 24) {
          relative = `${diffHours.toLocaleString('bn-BD')} ঘণ্টা আগে`;
        } else if (diffDays < 7) {
          relative = `${diffDays.toLocaleString('bn-BD')} দিন আগে`;
        }

        const exactTime = d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
        const exactDate = d.toLocaleDateString('bn-BD', { year: 'numeric', month: 'short', day: 'numeric' });

        if (relative) {
          return `${exactDate}, ${exactTime} • (${relative})`;
        }
        return `${exactDate}, ${exactTime}`;
      } catch (err) {
        return dateStr || 'সম্প্রতি';
      }
    }

      // শুধুমাত্র ভেরিফাইড হলে বা এডমিন হলে ব্লু ব্যাজ প্রদর্শিত হবে

      return `

    // --- STUDENT PROFILE MODAL ---
    function openProfileModal(identifier, fromEventId = null) {
      if (fromEventId !== undefined) {
        state.lastOpenedEventId = fromEventId;
      }
      let targetId = identifier;
      if (!targetId && state.currentUser) {
        targetId = state.currentUser.id || state.currentUser.studentId;
      }
      if (!targetId) {
        showToast('প্রোফাইল লোড করতে শিক্ষার্থীর আইডি পাওয়া যায়নি', 'error');
        return;
      }

      const cleanId = String(targetId).trim().toLowerCase();
      let user = state.users.find(u => 
        (u.id && u.id.toLowerCase() === cleanId) || 
        (u.studentId && u.studentId.toLowerCase() === cleanId)
      );

      // If not found in users array, check current user
      if (!user && state.currentUser && (
        (state.currentUser.id && state.currentUser.id.toLowerCase() === cleanId) ||
        (state.currentUser.studentId && state.currentUser.studentId.toLowerCase() === cleanId)
      )) {
        user = state.currentUser;
      }

      // If still not found, check author information from posts
      if (!user && state.posts) {
        const postAuthor = state.posts.find(p => 
          (p.authorId && p.authorId.toLowerCase() === cleanId) ||
          (p.authorStudentId && p.authorStudentId.toLowerCase() === cleanId)
        );
        if (postAuthor) {
          user = {
            id: postAuthor.authorId || `user_${postAuthor.authorStudentId}`,
            studentId: postAuthor.authorStudentId,
            fullName: postAuthor.authorName,
            fatherName: 'তথ্য হালনাগাদ করা হয়নি',
            motherName: 'তথ্য হালনাগাদ করা হয়নি',
            studentClass: 'শিক্ষার্থী',
            roll: 'N/A',
            section: 'সাধারণ',
            shift: 'দিবা',
            birthRegistrationNumber: 'তথ্য দেওয়া হয়নি',
            dateOfBirth: 'তথ্য দেওয়া হয়নি',
            bloodGroup: 'অজানা',
            religion: 'উল্লেখ করা হয়নি',
            presentAddress: 'তথ্য দেওয়া হয়নি',
            permanentAddress: 'তথ্য দেওয়া হয়নি',
            mobileNumber: '',
            email: '',
            facebookLink: '',
            profilePicture: postAuthor.authorAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
            isVerified: postAuthor.authorStudentId === 'ADMIN001',
            role: postAuthor.authorStudentId === 'ADMIN001' ? 'admin' : 'student'
          };
        }
      }

      if (!user) {
        showToast('শিক্ষার্থীর প্রোফাইল তথ্য পাওয়া যায়নি', 'error');
        return;
      }

      const isOwnProfile = Boolean(state.currentUser && (
        (state.currentUser.id && user.id && state.currentUser.id.toLowerCase() === user.id.toLowerCase()) ||
        (state.currentUser.studentId && user.studentId && state.currentUser.studentId.toLowerCase() === user.studentId.toLowerCase())

      modalContainer.innerHTML = `

    function closeProfileModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    // --- FULLSCREEN MEDIA LIGHTBOX VIEWER ---
    let lightboxState = {
      isZoomed: false,
      mediaUrl: '',
      mediaType: 'image'
    };

    function openMediaLightbox(encodedUrl, type = 'image', encodedAuthor = '', encodedAvatar = '', encodedDate = '', encodedCaption = '') {
      const url = decodeURIComponent(encodedUrl || '');
      if (!url) return;
      const author = decodeURIComponent(encodedAuthor || '');
      const avatar = decodeURIComponent(encodedAvatar || '');
      const dateStr = decodeURIComponent(encodedDate || '');
      const caption = decodeURIComponent(encodedCaption || '');

      lightboxState = {
        isZoomed: false,
        mediaUrl: url,
        mediaType: type
      };

      const container = document.getElementById('lightbox-container');
      if (!container) return;

      container.innerHTML = `
        <div id="lightbox-backdrop" class="fixed inset-0 z-50 bg-black/95 flex flex-col justify-between backdrop-blur-md select-none animate-in fade-in duration-200">
          <!-- Top Bar -->
          <div class="p-3 sm:p-4 bg-gradient-to-b from-black/90 via-black/60 to-transparent flex items-center justify-between text-white z-20 gap-3 border-b border-white/10">
            <div class="flex items-center gap-2.5 min-w-0">
              ${avatar ? `<img src="${avatar}" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full object-cover border border-white/30 shrink-0" />` : ''}
              <div class="min-w-0">
                <div class="font-bold text-xs sm:text-sm text-white truncate">${author || 'পোস্ট মিডিয়া'}</div>
                <div class="text-[10px] sm:text-xs text-white/70 flex items-center gap-1.5 truncate">
                  <span class="px-1.5 py-0.5 rounded bg-white/15 text-[10px] font-semibold">${type === 'video' ? 'ভিডিও' : 'ছবি'}</span>
                  ${dateStr ? `<span>${dateStr}</span>` : ''}
                </div>
              </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
              ${type === 'image' ? `
                <button type="button" onclick="toggleLightboxZoom()" id="lightbox-zoom-btn" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer border border-white/10" title="আসল সাইজ ও জুম টগল">
                  <i data-lucide="zoom-in" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">জুম</span>
                </button>
              ` : ''}
              <button type="button" onclick="toggleDeviceFullscreen()" class="p-2 rounded-xl bg-white/15 hover:bg-white/25 text-white transition-all cursor-pointer border border-white/10" title="ডিভাইস ফুল স্ক্রীন">
                <i data-lucide="maximize" class="w-4 h-4"></i>
              </button>
              <a href="${url}" download="${type === 'video' ? 'video.mp4' : 'photo.jpg'}" target="_blank" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer border border-white/10" title="ডাউনলোড করুন">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">ডাউনলোড</span>
              </a>
              <button type="button" onclick="closeMediaLightbox()" class="p-2 rounded-xl bg-white/20 hover:bg-red-600 text-white transition-all cursor-pointer ml-1 border border-white/10" title="বন্ধ করুন (Esc)">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
          </div>

          <!-- Media Display Center -->
          <div id="lightbox-viewport" onclick="handleLightboxBackdropClick(event)" class="flex-1 overflow-auto flex items-center justify-center p-2 sm:p-4 z-10 relative">
            ${type === 'video' ? `
              <video id="lightbox-media-element" src="${url}" controls autoplay playsinline class="max-h-[82vh] max-w-[96vw] w-auto h-auto object-contain rounded-xl shadow-2xl bg-black"></video>
            ` : `
              <img id="lightbox-media-element" src="${url}" alt="${author}" onclick="toggleLightboxZoom()" class="max-h-[82vh] max-w-[96vw] w-auto h-auto object-contain rounded-xl shadow-2xl cursor-zoom-in transition-all duration-200 select-none" />
            `}
          </div>

          <!-- Bottom Caption & Info Bar -->
          <div class="p-3 sm:p-4 bg-gradient-to-t from-black/90 via-black/60 to-transparent text-white z-20 border-t border-white/10">
            <div class="max-w-4xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
              ${caption ? `
                <p class="text-white/95 text-xs sm:text-sm line-clamp-2 max-w-2xl">${caption}</p>
              ` : '<span class="text-white/50 text-[11px]">ফুল স্ক্রীন প্রিভিউ</span>'}
              <div class="text-[11px] text-white/60 shrink-0 flex items-center gap-2">
                <span>${type === 'image' ? 'ছবিতে ক্লিক করে জুম / স্বাভাবিক সাইজ করুন' : 'প্লে বা পজ করতে ট্যাপ করুন'}</span>
                <span>•</span>
                <span>Esc চাপুন বন্ধ করতে</span>
              </div>
            </div>
          </div>
        </div>
      `;

      if (window.lucide) lucide.createIcons();

      // Keyboard listener for Escape key
      window.removeEventListener('keydown', handleLightboxKeyDown);
      window.addEventListener('keydown', handleLightboxKeyDown);
    }
    window.openMediaLightbox = openMediaLightbox;

    function closeMediaLightbox() {
      const container = document.getElementById('lightbox-container');
      if (container) container.innerHTML = '';
      window.removeEventListener('keydown', handleLightboxKeyDown);
      if (document.fullscreenElement) {
        try { document.exitFullscreen(); } catch (e) {}
      }
    }
    window.closeMediaLightbox = closeMediaLightbox;

    function handleLightboxKeyDown(e) {
      if (e.key === 'Escape' || e.keyCode === 27) {
        closeMediaLightbox();
      }
    }

    function handleLightboxBackdropClick(e) {
      if (e.target.id === 'lightbox-viewport' || e.target.id === 'lightbox-backdrop') {
        closeMediaLightbox();
      }
    }
    window.handleLightboxBackdropClick = handleLightboxBackdropClick;

    function toggleLightboxZoom() {
      if (lightboxState.mediaType !== 'image') return;
      lightboxState.isZoomed = !lightboxState.isZoomed;
      const img = document.getElementById('lightbox-media-element');
      const btn = document.getElementById('lightbox-zoom-btn');
      if (!img) return;

      if (lightboxState.isZoomed) {
        img.classList.remove('max-h-[82vh]', 'max-w-[96vw]', 'cursor-zoom-in');
        img.classList.add('max-h-none', 'max-w-none', 'cursor-zoom-out', 'scale-125', 'sm:scale-150');
        if (btn) {
          btn.innerHTML = `<i data-lucide="zoom-out" class="w-4 h-4"></i><span class="hidden sm:inline">স্বাভাবিক সাইজ</span>`;
          if (window.lucide) lucide.createIcons();
        }
      } else {
        img.classList.add('max-h-[82vh]', 'max-w-[96vw]', 'cursor-zoom-in');
        img.classList.remove('max-h-none', 'max-w-none', 'cursor-zoom-out', 'scale-125', 'sm:scale-150');
        if (btn) {
          btn.innerHTML = `<i data-lucide="zoom-in" class="w-4 h-4"></i><span class="hidden sm:inline">জুম</span>`;
          if (window.lucide) lucide.createIcons();
        }
      }
    }
    window.toggleLightboxZoom = toggleLightboxZoom;

    function toggleDeviceFullscreen() {
      const elem = document.getElementById('lightbox-backdrop') || document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => console.warn(err));
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
    window.toggleDeviceFullscreen = toggleDeviceFullscreen;

      const newMobile = document.getElementById('edit-mobile').value.trim();
      const newEmail = document.getElementById('edit-email').value.trim();
      const newFb = document.getElementById('edit-fb').value.trim();
      const newPass = document.getElementById('edit-password').value.trim();

      const isEditingAdmin = isAdminUserRecord(user);
      user.fullName = newName;
      if (newPic) {
        user.profilePicture = newPic;
        if (isEditingAdmin) {
          user.profilePictureUpdatedAt = Date.now();
          saveAdminProfilePicture(newPic);
        }
      }
      if (isEditingAdmin) {
        Object.assign(user, normalizeAdminUser(user));
      }
      user.fatherName = newFather;
      user.motherName = newMother;
      user.studentClass = newClass;
      user.roll = newRoll;
      user.section = newSection;
      user.shift = newShift;
      user.dateOfBirth = newDob;
      user.bloodGroup = newBlood;
      user.religion = newReligion;
      user.birthRegistrationNumber = newBirthReg;
      user.presentAddress = newPresent;
      user.permanentAddress = newPermanent;
      user.mobileNumber = newMobile;
      user.email = newEmail;
      user.facebookLink = newFb;
      if (newPass) {
        user.password = newPass;
      }

      // Update author details on all existing posts & comments by this user
      state.posts.forEach(p => {
        if (p.authorId === user.id || p.authorStudentId === user.studentId) {
          p.authorName = user.fullName;
          p.authorAvatar = user.profilePicture;
        }
        if (p.comments) {
          p.comments.forEach(c => {
            if (c.authorId === user.id || c.authorStudentId === user.studentId) {
              c.authorName = user.fullName;
              c.authorAvatar = user.profilePicture;
            }
            if (c.replies) {
              c.replies.forEach(r => {
                if (r.authorId === user.id || r.authorStudentId === user.studentId) {
                  r.authorName = user.fullName;
                  r.authorAvatar = user.profilePicture;
                }
              });
            }
          });
        }
      });

      // Update current session user if editing own profile
      if (state.currentUser.id === user.id) {
        state.currentUser = { ...user };
        saveCurrentUser(state.currentUser);
      }

      saveUsers(state.users);
      savePosts(state.posts);

      closeProfileModal();
      showToast('আপনার তথ্য সফলভাবে পরিবর্তন ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Sync updated user to Cloud Firestore
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.id), user, { merge: true }).catch(console.warn);
      }
    }

    async function handleProfileAvatarFileSelect(e, mode) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে শুধুমাত্র ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('প্রোফাইল ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressedDataUrl = await compressImage(file, 400, 400, 0.85);
        if (mode === 'reg') {
          const preview = document.getElementById('reg-avatar-preview');
          const input = document.getElementById('reg-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        } else if (mode === 'edit') {
          const preview = document.getElementById('edit-avatar-preview');
          const input = document.getElementById('edit-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        }
        showToast('ডিভাইস থেকে প্রোফাইল ছবি যুক্ত হয়েছে!', 'success');
      } catch (err) {
        console.error('Avatar error:', err);
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }

    // --- Post Media Upload from Device (Image & Video) ---
    async function handleMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');

      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.82);
          state.selectedMedia = {
            type: 'image',
            url: dataUrl,
            name: file.name
          };
        } else {
          // ভিডিও সাইজ চেক (১০০MB লিমিট)
          if (file.size > 100* 1024  * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ১০০GB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          state.selectedMedia = {
            type: 'video',
            url: dataUrl,
            name: file.name
          };
        }

        showToast(`${isImage ? 'ছবি' : 'ভিডিও'} সফলভাবে নির্বাচন করা হয়েছে!`, 'success');
        updateMediaPreviewUI();
      } catch (err) {
        console.error('File load error:', err);
        showToast('ফাইল লোড করতে সমস্যা হয়েছে', 'error');
      }
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const content = document.getElementById('new-post-content').value.trim();
      const media = state.selectedMedia;

      if (!content && !media) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন', 'error');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
      const newPost = {
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: content,
        mediaType: media ? media.type : null,
        imageUrl: (media && media.type === 'image') ? media.url : '',
        videoUrl: (media && media.type === 'video') ? media.url : '',
        likes: [],
        comments: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      document.getElementById('new-post-content').value = '';
      state.selectedMedia = null;
      const fileInput = document.getElementById('post-media-file');
      if (fileInput) fileInput.value = '';

      // Automatic mention notification dispatch (@everyone or specific students)
      dispatchMentionNotifications(content, state.currentUser, 'পোস্টে');

      // Optimistic local update so the new post is visible immediately, even
      // while Firestore is still processing the write.
      const localPost = { id: 'post_' + Date.now(), ...newPost };
      state.posts.unshift(localPost);
      savePosts(state.posts);
      renderApp();

      // Save directly to Firebase Firestore for all mobiles & devices
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'posts'), newPost);
          showToast('নতুন পোস্ট শেয়ার হয়েছে!', 'success');
        } catch (err) {
          console.error('Firestore addDoc error:', err);
          showToast('পোস্ট হয়েছে (লোকাল মেমোরি)।', 'error');
        }
      } else {
        showToast('নতুন পোস্ট প্রকাশিত হয়েছে!', 'success');
      }
    }

    async function handleDeletePost(postId) {
      if (!confirm('আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?')) return;
      state.posts = state.posts.filter(p => p.id !== postId);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'posts', postId));
          showToast('পোস্ট মুছে ফেলা হয়েছে', 'info');
        } catch (err) {
          console.warn('Delete post error:', err);
          savePosts(state.posts);
        }

    async function handleEditMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');
      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.85);
          editPostMediaState = { type: 'image', url: dataUrl, name: file.name };
        } else {
          if (file.size > 20 * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ২০MB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          editPostMediaState = { type: 'video', url: dataUrl, name: file.name };
        }
        const box = document.getElementById('edit-post-media-box');
        if (box) {
          box.innerHTML = renderEditPostMediaHTML();
          if (window.lucide) lucide.createIcons();
        }
        showToast('মিডিয়া নির্বাচন করা হয়েছে!', 'success');
      } catch (err) {
        showToast('মিডিয়া লোড করা যায়নি', 'error');
      }
    }

    async function handleSaveEditPost(e, postId) {
      e.preventDefault();
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const contentInput = document.getElementById('edit-post-content');
      const newContent = contentInput ? contentInput.value.trim() : '';

      const hasMedia = editPostMediaState && editPostMediaState.url;
      if (!newContent && !hasMedia) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও রাখুন!', 'error');
        return;
      }

      post.content = newContent;
      if (editPostMediaState && editPostMediaState.url) {
        post.mediaType = editPostMediaState.type;
        post.imageUrl = editPostMediaState.type === 'image' ? editPostMediaState.url : '';
        post.videoUrl = editPostMediaState.type === 'video' ? editPostMediaState.url : '';
      } else {
        post.mediaType = null;
        post.imageUrl = '';
        post.videoUrl = '';
      }
      post.isEdited = true;

      }

    // --- AMAR ALBUM VIEW & HANDLERS ---
    let albumFilter = 'all';
    let albumSearch = '';
    let albumViewMode = 'grid';
    let albumCurrentIndex = 0;
    let albumTouchX = 0;

    function getAlbumFavorites() {
      try { return JSON.parse(localStorage.getItem('oikko_amar_album_favorites') || '[]'); }
      catch(e) { return []; }
    }
    function saveAlbumFavorites(list) {
      try { localStorage.setItem('oikko_amar_album_favorites', JSON.stringify(list)); } catch(e) {}
    }
    function getAlbumItems() {
      const list = Array.isArray(state.pastEventPhotos) ? state.pastEventPhotos : [];
      const q = String(albumSearch || '').trim().toLowerCase();
      return list.filter(p => {
        const fav = getAlbumFavorites().includes(p.id);
        const text = [p.title,p.category,p.date,p.description].filter(Boolean).join(' ').toLowerCase();
        return (albumFilter === 'all' || fav) && (!q || text.includes(q));
      });
    }
    function toggleAlbumFavorite(id) {
      let favs = getAlbumFavorites();
      favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
      saveAlbumFavorites(favs);
      renderApp();
      showToast(favs.includes(id) ? 'ছবিটি প্রিয় অ্যালবামে যোগ হয়েছে' : 'প্রিয় তালিকা থেকে সরানো হয়েছে', 'success');
    }
    window.toggleAlbumFavorite = toggleAlbumFavorite;

    function renderAlbumView() {
      const all = Array.isArray(state.pastEventPhotos) ? state.pastEventPhotos : [];
      const favs = getAlbumFavorites();
      const items = getAlbumItems();
      const categories = [...new Set(all.map(p => p.category).filter(Boolean))];
      const cards = items.map((photo, index) => {
        const originalIndex = all.findIndex(p => p.id === photo.id);
        const isFav = favs.includes(photo.id);
        const safeUrl = escapeHtml(photo.imageUrl || '');
        const safeTitle = escapeHtml(photo.title || 'স্মৃতির ছবি');
        const safeCat = escapeHtml(photo.category || 'ইভেন্ট');
        const safeDate = escapeHtml(photo.date || '');
        return `
          <article class="oikko-album-card" tabindex="0" onclick="openAlbumLightbox('${escapeHtml(photo.id)}')" onkeydown="if(event.key==='Enter'||event.key===' ')openAlbumLightbox('${escapeHtml(photo.id)}')">
            <div class="oikko-album-media">
              <img src="${safeUrl}" alt="${safeTitle}" loading="${index < 4 ? 'eager':'lazy'}" onerror="this.style.opacity='.35'">
              <button type="button" class="oikko-album-heart ${isFav?'active':''}" onclick="event.stopPropagation();toggleAlbumFavorite('${escapeHtml(photo.id)}')" aria-label="প্রিয়">${isFav?'♥':'♡'}</button>
              <span class="oikko-album-badge">${safeCat}</span>
            </div>
            <div class="oikko-album-body">
              <div class="oikko-album-title">${safeTitle}</div>
              <div class="oikko-album-meta"><span>${safeDate}</span><span>Photo ${String(originalIndex+1).padStart(2,'0')} ›</span></div>
            </div>
          </article>`;
      }).join('');

      return `
        <main class="oikko-album-shell">
          <section class="oikko-album-hero">
            <div class="oikko-album-eyebrow">OIKKO · AMAR ALBUM</div>
            <h1>স্মৃতিগুলো থাকুক সুন্দর ফ্রেমে।</h1>
            <p>ক্যাম্পাসের অনুষ্ঠান, প্রতিযোগিতা ও বিশেষ মুহূর্তের ছবিগুলো এখন আপনার Oikko UI-এর সাথেই একটি আধুনিক অ্যালবামে।</p>
            <div class="oikko-album-stats">
              <div class="oikko-album-stat"><b>${all.length}</b> মোট ছবি</div>
              <div class="oikko-album-stat"><b>${favs.length}</b> প্রিয়</div>
              <div class="oikko-album-stat"><b>${categories.length}</b> ক্যাটাগরি</div>
            </div>
          </section>

          <div class="oikko-album-toolbar">
            <div class="oikko-album-tabs">
              <button class="oikko-album-tab ${albumFilter==='all'?'active':''}" onclick="setAlbumFilter('all')">সব ছবি</button>
              <button class="oikko-album-tab ${albumFilter==='fav'?'active':''}" onclick="setAlbumFilter('fav')">♥ প্রিয়</button>
            </div>
            <div class="oikko-album-tools">
              <div class="oikko-album-search-wrap">
                <i data-lucide="search"></i>
                <input class="oikko-album-search" value="${escapeHtml(albumSearch)}" placeholder="অ্যালবামে খুঁজুন..." oninput="setAlbumSearch(this.value)" aria-label="অ্যালবামে খুঁজুন">
              </div>
              <button class="oikko-album-viewbtn ${albumViewMode==='grid'?'active':''}" onclick="setAlbumViewMode('grid')" title="গ্রিড"><i data-lucide="grid-2x2"></i></button>
              <button class="oikko-album-viewbtn ${albumViewMode==='list'?'active':''}" onclick="setAlbumViewMode('list')" title="লিস্ট"><i data-lucide="list"></i></button>
            </div>
          </div>

          <div class="${albumViewMode==='list'?'oikko-album-list':'oikko-album-grid'}">
            ${items.length ? cards : `
              <div class="oikko-album-empty">
                <div class="oikko-album-empty-icon"><i data-lucide="images"></i></div>
                <div class="font-bold text-sm">কোনো ছবি পাওয়া যায়নি</div>
                <div class="text-xs mt-1">অন্য ফিল্টার বা সার্চ দিয়ে চেষ্টা করুন।</div>
              </div>`}
          </div>
        </main>
        <div id="oikko-album-lightbox" class="oikko-album-lightbox" aria-hidden="true"></div>`;
    }

    function setAlbumFilter(value){ albumFilter=value; renderApp(); }
    window.setAlbumFilter=setAlbumFilter;
    function setAlbumSearch(value){ albumSearch=value; renderApp(); }
    window.setAlbumSearch=setAlbumSearch;
    function setAlbumViewMode(value){ albumViewMode=value; renderApp(); }
    window.setAlbumViewMode=setAlbumViewMode;

    function openAlbumLightbox(id) {
      const all = Array.isArray(state.pastEventPhotos) ? state.pastEventPhotos : [];
      const idx = all.findIndex(p => p.id === id);
      if (idx < 0) return;
      albumCurrentIndex = idx;
      const root = document.getElementById('oikko-album-lightbox');
      if (!root) return;
      root.classList.add('show');
      root.setAttribute('aria-hidden','false');
      document.body.style.overflow='hidden';
      updateAlbumLightbox();
    }
    window.openAlbumLightbox=openAlbumLightbox;

    function updateAlbumLightbox() {
      const all = Array.isArray(state.pastEventPhotos) ? state.pastEventPhotos : [];
      if (!all.length) return;
      if (albumCurrentIndex < 0) albumCurrentIndex = all.length-1;
      if (albumCurrentIndex >= all.length) albumCurrentIndex = 0;
      const p = all[albumCurrentIndex];
      const favs=getAlbumFavorites();
      const root=document.getElementById('oikko-album-lightbox');
      if(!root)return;
      root.innerHTML=`
        <div class="oikko-album-viewer">
          <div class="oikko-album-viewer-top">
            <div><strong>${escapeHtml(p.title || 'স্মৃতির ছবি')}</strong><div class="mt-0.5 text-white/45">${escapeHtml(p.category || 'ইভেন্ট')}</div></div>
            <div class="flex items-center gap-2"><span>${albumCurrentIndex+1} / ${all.length}</span><button class="oikko-album-close" onclick="closeAlbumLightbox()" aria-label="বন্ধ"><i data-lucide="x"></i></button></div>
          </div>
          <div class="oikko-album-viewer-image">
            <img src="${escapeHtml(p.imageUrl || '')}" alt="${escapeHtml(p.title || '')}">
            <div class="oikko-album-nav">
              <button onclick="albumPrev()" aria-label="আগের"><i data-lucide="chevron-left"></i></button>
              <button onclick="albumNext()" aria-label="পরের"><i data-lucide="chevron-right"></i></button>
            </div>
          </div>
          <div class="oikko-album-viewer-bottom">
            <span>${escapeHtml(p.date || '')}${p.description ? ' · '+escapeHtml(p.description) : ''}</span>
            <div class="oikko-album-actions">
              <button class="oikko-album-action" onclick="toggleAlbumFavorite('${escapeHtml(p.id)}')">${favs.includes(p.id)?'♥':'♡'} প্রিয়</button>
              <button class="oikko-album-action" onclick="shareAlbumPhoto()">↗ শেয়ার</button>
              <button class="oikko-album-action" onclick="openAlbumPhotoNewTab()">↗ ছবি খুলুন</button>
            </div>
          </div>
        </div>`;
      if(window.lucide)lucide.createIcons();
      const img=root.querySelector('.oikko-album-viewer-image img');
      if(img){
        img.addEventListener('touchstart',e=>albumTouchX=e.changedTouches[0].screenX,{passive:true});
        img.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-albumTouchX;if(Math.abs(dx)>45)dx<0?albumNext():albumPrev()},{passive:true});
      }
    }
    function closeAlbumLightbox(){const root=document.getElementById('oikko-album-lightbox');if(root){root.classList.remove('show');root.setAttribute('aria-hidden','true')}document.body.style.overflow='';}
    window.closeAlbumLightbox=closeAlbumLightbox;
    function albumNext(){const n=Array.isArray(state.pastEventPhotos)?state.pastEventPhotos.length:0;if(n){albumCurrentIndex=(albumCurrentIndex+1)%n;updateAlbumLightbox()}}
    function albumPrev(){const n=Array.isArray(state.pastEventPhotos)?state.pastEventPhotos.length:0;if(n){albumCurrentIndex=(albumCurrentIndex-1+n)%n;updateAlbumLightbox()}}
    window.albumNext=albumNext; window.albumPrev=albumPrev;
    function shareAlbumPhoto(){
      const all=Array.isArray(state.pastEventPhotos)?state.pastEventPhotos:[],p=all[albumCurrentIndex];
      if(!p)return;
      if(navigator.share){navigator.share({title:p.title||'Amar Album',url:p.imageUrl}).catch(()=>{});}
      else if(navigator.clipboard){navigator.clipboard.writeText(p.imageUrl).then(()=>showToast('ছবির লিংক কপি হয়েছে','success')).catch(()=>showToast('শেয়ার করা যাচ্ছে না','error'));}
    }
    window.shareAlbumPhoto=shareAlbumPhoto;
    function openAlbumPhotoNewTab(){const p=(state.pastEventPhotos||[])[albumCurrentIndex];if(p?.imageUrl)window.open(p.imageUrl,'_blank','noopener')}
    window.openAlbumPhotoNewTab=openAlbumPhotoNewTab;

    document.addEventListener('keydown',e=>{
      const root=document.getElementById('oikko-album-lightbox');
      if(!root || !root.classList.contains('show')) return;
      if(e.key==='Escape') closeAlbumLightbox();
      if(e.key==='ArrowRight') albumNext();
      if(e.key==='ArrowLeft') albumPrev();
    });
    document.addEventListener('click',e=>{
      const root=document.getElementById('oikko-album-lightbox');
      if(root && e.target===root) closeAlbumLightbox();
    });

    // --- EVENTS VIEW & HANDLERS ---
    function renderEventsView() {
      const u = state.currentUser;
      const isAdmin = u.role === 'admin';
      const defaultCategories = ['নোটিশ', 'ক্রীড়া', 'বিজ্ঞান ও প্রযুক্তি', 'শিক্ষা', 'সাংস্কৃতিক', 'অন্যান্য'];
      const categories = ['সকল', ...new Set([
        ...defaultCategories,
        ...(state.events || []).map(ev => ev.category).filter(Boolean)
      ])];
      const activeCategory = state.eventFilterCategory || 'সকল';

      const filteredEvents = activeCategory === 'সকল' 
        ? state.events 
        : state.events.filter(ev => ev.category === activeCategory);

      return `
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-28 flex-1 w-full">
          <!-- পূর্ববর্তী ইভেন্টসমূহের স্মৃতির অ্যালবাম (Past Events Continuous Sliding Gallery) -->
          <div class="mb-6 bg-white dark:bg-[#21211A] rounded-3xl p-4 sm:p-5 border border-[#E2E2D5] dark:border-[#36362B] shadow-xs overflow-hidden">
            <div class="flex items-center justify-between mb-3 px-1">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-amber-50 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400 flex items-center justify-center">
                  <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
                <div>
                  <h3 class="font-bold text-sm sm:text-base text-[#42422F] dark:text-[#EDEDE4] flex items-center gap-2">
                    <span>পূর্ববর্তী ইভেন্টসমূহের স্মৃতি ও ছবি</span>
                    <span class="text-[10px] bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-200 px-2 py-0.5 rounded-full font-bold">অ্যালবাম</span>
                  </h3>
                  <p class="text-[11px] text-[#8A8A6A] dark:text-[#9E9E88]">ক্যাম্পাসে অনুষ্ঠিত আগের বিভিন্ন প্রতিযোগিতা ও আয়োজনের স্মৃতির কিছু মুহূর্ত</p>
                </div>
              </div>
              <div class="flex items-center gap-1.5 text-xs text-[#8A8A6A]">
                <button type="button" onclick="scrollPastGallery(-300)" class="p-1.5 rounded-lg hover:bg-[#F5F5F0] dark:hover:bg-[#2A2A20] text-[#5A5A40] dark:text-[#D6D6BC] transition-colors cursor-pointer" title="বামে স্ক্রোল করুন">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <button type="button" onclick="scrollPastGallery(300)" class="p-1.5 rounded-lg hover:bg-[#F5F5F0] dark:hover:bg-[#2A2A20] text-[#5A5A40] dark:text-[#D6D6BC] transition-colors cursor-pointer" title="ডানে স্ক্রোল করুন">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Continuous Sliding Marquee from Right to Left -->
               <div class="marquee-wrapper relative overflow-x-auto hide-scrollbar py-1" onmouseenter="pauseMarquee(true)" onmouseleave="pauseMarquee(false)">
              <div id="past-events-marquee" class="animate-marquee-continuous flex gap-3.5 items-center">
                ${renderPastEventCards(getMarqueePhotoList(state.pastEventPhotos))}
                ${renderPastEventCards(getMarqueePhotoList(state.pastEventPhotos))}
              </div>
            </div>
          </div>

          <!-- Events Header Banner -->
          <div class="bg-gradient-to-r from-[#5A5A40] to-[#42422F] text-white rounded-3xl p-6 sm:p-8 mb-6 shadow-md relative overflow-hidden">
            <div class="relative z-10 max-w-2xl">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 text-white text-xs font-bold mb-3 border border-white/30 backdrop-blur-xs">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span>ক্যাম্পাস ক্যালেন্ডার ও ইভেন্ট</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">আসন্ন ক্যাম্পাস ইভেন্ট ও আয়োজন</h1>
              <p class="text-xs sm:text-sm text-[#E2E2D5] leading-relaxed">বিদ্যালয় ও কলেজের বিভিন্ন প্রতিযোগিতা, বিজ্ঞান মেলা, ক্রীড়া ও বিশেষ সেমিনারে অংশগ্রহণ করুন এবং নতুন অভিজ্ঞতা অর্জন করুন।</p>
              ${isAdmin ? `
                <div class="mt-4">
                  <button onclick="openCreateEventModal()" class="px-4 py-2 rounded-xl bg-white text-[#5A5A40] font-bold text-xs sm:text-sm shadow-sm hover:bg-[#F5F5F0] transition-all flex items-center gap-2 cursor-pointer">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>নতুন ইভেন্ট প্রকাশ করুন</span>
                  </button>
                </div>
              ` : ''}
            </div>
            <div class="absolute -right-10 -bottom-10 opacity-15 pointer-events-none">
              <i data-lucide="calendar" class="w-64 h-64 text-white"></i>
            </div>
          </div>

          <!-- Categories Filter Tabs -->
          <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 scrollbar-none">
            ${categories.map(cat => `
              <button onclick="handleFilterEvents('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all cursor-pointer ${activeCategory === cat ? 'bg-[#5A5A40] text-white shadow-xs' : 'bg-white text-[#5A5A40] border border-[#E2E2D5] hover:bg-[#F5F5F0]'}">
                ${cat}
              </button>
            `).join('')}
          </div>

          <!-- Events Grid -->
          ${filteredEvents.length === 0 ? `
            <div class="bg-white rounded-2xl border border-[#E2E2D5] p-12 text-center">
              <div class="w-14 h-14 rounded-full bg-[#F5F5F0] flex items-center justify-center mx-auto mb-3 text-[#8A8A6A]">
                <i data-lucide="calendar-x" class="w-7 h-7"></i>
              </div>
              <h3 class="font-bold text-sm text-[#42422F] mb-1">এই ক্যাটাগরিতে কোনো ইভেন্ট নেই</h3>
              <p class="text-xs text-[#8A8A6A]">অন্য ক্যাটাগরি বাছাই করুন অথবা পরবর্তীতে আবার চেক করুন।</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${filteredEvents.map(ev => {
                const isParticipating = (ev.participants || []).includes(u.studentId);
                const participantCount = (ev.participants || []).length;
                const participantUsers = (ev.participants || []).map(pId => {
                  const found = state.users.find(usr => 
                    (usr.studentId && usr.studentId.toUpperCase() === String(pId).toUpperCase()) || 
                    (usr.id && usr.id === pId)
                  );
                  return found || {
                    id: pId,
                    studentId: pId,
                    fullName: pId === 'ADMIN001' ? 'Khan Mohammad Ismail' : `শিক্ষার্থী (${pId})`,
                    profilePicture: pId === 'ADMIN001' ? ADMIN_DATA.profilePicture : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100',
                    isVerified: pId === 'ADMIN001'
                  };
                });

                return `
                  <div class="bg-white rounded-2xl border border-[#E2E2D5] overflow-hidden shadow-xs flex flex-col transition-all hover:shadow-md">
                    ${ev.banner ? `
                      <div class="h-44 w-full overflow-hidden bg-[#F5F5F0] relative">
                        <img src="${ev.banner}" class="w-full h-full object-cover" />
                        <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-black/60 text-white text-[10px] font-bold backdrop-blur-xs border border-white/20">
                          ${ev.category || 'ইভেন্ট'}
                        </span>
                        ${isAdmin ? `
                          <button onclick="handleDeleteEvent('${ev.id}')" class="absolute top-3 right-3 p-1.5 bg-red-600/80 hover:bg-red-600 text-white rounded-lg backdrop-blur-xs transition-colors cursor-pointer" title="ইভেন্ট মুছুন">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        ` : ''}
                      </div>
                    ` : ''}

                    <div class="p-5 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 class="font-bold text-base text-[#42422F] mb-2 leading-snug">${ev.title}</h3>
                        <p class="text-xs text-[#8A8A6A] leading-relaxed mb-4 line-clamp-3">${ev.description}</p>
                        
                        <div class="space-y-2 mb-4 text-xs text-[#42422F]">
                          <div class="flex items-center gap-2 text-[#5A5A40]">
                            <i data-lucide="calendar" class="w-4 h-4 shrink-0"></i>
                            <span class="font-medium">${ev.date}</span>
                            ${ev.time ? `<span>• ${ev.time}</span>` : ''}
                          </div>
                          ${ev.location ? `
                            <div class="flex items-center gap-2 text-[#8A8A6A]">
                              <i data-lucide="map-pin" class="w-4 h-4 shrink-0 text-[#5A5A40]"></i>
                              <span class="truncate">${ev.location}</span>
                            </div>
                          ` : ''}

                          <!-- Interactive Participant Counter & Avatar Stack -->
                          <div class="pt-1">
                            <button
                              type="button"
                              onclick="openEventParticipantsModal('${ev.id}')"
                              class="flex items-center gap-2 text-xs font-semibold text-[#5A5A40] hover:text-[#42422F] cursor-pointer group transition-colors"
                              title="অংশগ্রহণকারী সকল শিক্ষার্থীর প্রোফাইল তালিকা দেখুন"
                            >
                              <div class="flex -space-x-2 overflow-hidden py-0.5 items-center">
                                ${participantUsers.slice(0, 4).map(p => `
                                  <img src="${p.profilePicture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="inline-block h-6 w-6 rounded-full ring-2 ring-white object-cover shadow-2xs" title="${p.fullName} (${p.studentId})" />
                                `).join('')}
                                ${participantCount > 4 ? `
                                  <span class="inline-flex items-center justify-center h-6 w-6 rounded-full ring-2 ring-white bg-[#5A5A40] text-white text-[10px] font-bold">+${participantCount - 4}</span>
                                ` : ''}
                              </div>
                              <div class="flex items-center gap-1">
                                <i data-lucide="users" class="w-4 h-4 shrink-0 text-[#5A5A40]"></i>
                                <span class="group-hover:underline">${participantCount} জন অংশগ্রহণকারী ${isAdmin ? '(প্রোফাইল দেখুন)' : ''}</span>
                              </div>
                            </button>
                          </div>
                        </div>
                      </div>

                      <div class="pt-4 border-t border-[#F0F0E0] flex items-center justify-between gap-2">
                        <button onclick="handleToggleEventRsvp('${ev.id}')" class="${isAdmin ? 'flex-1' : 'w-full'} py-2 px-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 cursor-pointer ${isParticipating ? 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-xs' : 'bg-[#5A5A40] text-white hover:bg-[#4A4A33] shadow-xs'}">
                          <i data-lucide="${isParticipating ? 'check' : 'user-plus'}" class="w-4 h-4"></i>
                          <span class="truncate">${isParticipating ? 'অংশগ্রহণ করছেন' : 'অংশগ্রহণ করব'}</span>
                        </button>

                        ${isAdmin ? `
                          <button
                            type="button"
                            onclick="openEventParticipantsModal('${ev.id}')"
                            class="flex-1 py-2 px-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 cursor-pointer bg-white hover:bg-[#F5F5F0] text-[#5A5A40] border border-[#E2E2D5] shadow-2xs hover:border-[#5A5A40]"
                            title="অংশগ্রহণকারী সকল শিক্ষার্থীর সম্পূর্ণ প্রোফাইল দেখুন"
                          >
                            <i data-lucide="users" class="w-4 h-4 text-[#5A5A40]"></i>
                            <span class="truncate">প্রোফাইল তালিকা (${participantCount})</span>
                          </button>
                        ` : (participantCount > 0 ? `

    async function handleCreateEvent(e) {
      e.preventDefault();
      const title = document.getElementById('ev-title').value.trim();
      const date = document.getElementById('ev-date').value.trim();
      const time = document.getElementById('ev-time').value.trim();
      const location = document.getElementById('ev-location').value.trim();
      const category = document.getElementById('ev-category').value;
      const banner = document.getElementById('ev-banner').value.trim() || 'https://images.unsplash.com/photo-1511578314322-379afb476865?w=800';
      const desc = document.getElementById('ev-desc').value.trim();

      const newEvent = {
        id: 'ev_' + Date.now(),
        title,
        date,
        time,
        location,
        category,
        banner,
        description: desc,
        participants: [state.currentUser.studentId],
        timestamp: Date.now()
      };

      state.events.unshift(newEvent);
      saveEvents(state.events);
      closeProfileModal();
      showToast('নতুন ইভেন্ট সফলভাবে প্রকাশ করা হয়েছে!', 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'events', newEvent.id), newEvent, { merge: true });
        } catch (err) {
          console.warn('Firebase setDoc event error:', err);
        }
      }
    }
    window.handleCreateEvent = handleCreateEvent;

      state.events = state.events.filter(e => e.id !== eventId);
      saveEvents(state.events);
      showToast('ইভেন্ট মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb && eventId) {

      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressed = await compressImage(file, 1200, 1200, 0.85);
        selectedPastPhotoDataUrl = compressed;
        const nameEl = document.getElementById('past-photo-filename');
        if (nameEl) nameEl.textContent = file.name;
        const box = document.getElementById('past-photo-preview-box');
        const img = document.getElementById('past-photo-preview-img');
        if (box && img) {
          img.src = compressed;
          box.classList.remove('hidden');
        }
        showToast('ছবি নির্বাচন সফল হয়েছে!', 'success');
      } catch (err) {
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }
    window.handlePastPhotoFileSelect = handlePastPhotoFileSelect;

    async function handleSavePastEventPhoto(e) {
      e.preventDefault();
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই!', 'error');
        return;
      }

      const titleEl = document.getElementById('past-photo-title');
      const dateEl = document.getElementById('past-photo-date');
      const categoryEl = document.getElementById('past-photo-category');
      const urlEl = document.getElementById('past-photo-url');
      const descEl = document.getElementById('past-photo-desc');
      if (!titleEl || !dateEl || !categoryEl || !urlEl || !descEl) {
        showToast('অ্যালবাম ফর্ম পাওয়া যায়নি। আবার চেষ্টা করুন।', 'error');
        return;
      }

      const title = titleEl.value.trim();
      const date = dateEl.value.trim();
      const category = categoryEl.value;
      const urlInput = urlEl.value.trim();
      const desc = descEl.value.trim();
      const existingPhoto = editingPastPhotoId
        ? (state.pastEventPhotos || []).find(p => String(p.id) === String(editingPastPhotoId))
        : null;
      const finalImageUrl = selectedPastPhotoDataUrl || urlInput || existingPhoto?.imageUrl || '';

      if (!title || !date) {
        showToast('শিরোনাম এবং তারিখ/বছর পূরণ করুন।', 'error');
        return;
      }
      if (!finalImageUrl) {
        showToast('অনুগ্রহ করে একটি ছবি নির্বাচন করুন অথবা ছবির URL দিন।', 'error');
        return;
      }

      const savedId = existingPhoto?.id || ('past_ev_' + Date.now());
      const savedPhoto = {
        ...(existingPhoto || {}),
        id: savedId, title, date, category, imageUrl: finalImageUrl, description: desc, timestamp: Date.now()
      };

      const submitBtn = e.submitter;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.dataset.originalText = submitBtn.innerText; submitBtn.innerText = 'সংরক্ষণ হচ্ছে...'; }

      try {
        if (window.firebaseDb && window.fb) {
          await window.fb.setDoc(
            window.fb.doc(window.firebaseDb, 'past_events_gallery', String(savedId)),
            savedPhoto,
            { merge: true }
          );
        }

        if (!Array.isArray(state.pastEventPhotos)) state.pastEventPhotos = [];
        if (existingPhoto) {
          state.pastEventPhotos = state.pastEventPhotos.map(p => String(p.id) === String(savedId) ? savedPhoto : p);
        } else {
          state.pastEventPhotos = [savedPhoto, ...state.pastEventPhotos];
        }
        savePastEventPhotos(state.pastEventPhotos);
        try { localStorage.setItem('oikko_gallery_seeded', '1'); } catch(err) {}

        editingPastPhotoId = '';
        selectedPastPhotoDataUrl = '';
        closeProfileModal();
        renderApp();
        showToast(existingPhoto ? 'অ্যালবাম সফলভাবে আপডেট হয়েছে!' : 'অ্যালবামে নতুন ছবি যুক্ত হয়েছে!', 'success');
      } catch (err) {
        console.error('Album save/update failed:', err);
        showToast('Firebase-এ সংরক্ষণ করা যায়নি। আপনার Firebase Rules/Authentication পরীক্ষা করুন।', 'error');
      } finally {
        if (submitBtn) { submitBtn.disabled = false; if (submitBtn.dataset.originalText) submitBtn.innerText = submitBtn.dataset.originalText; }
      }
    }
    window.handleSavePastEventPhoto = handleSavePastEventPhoto;

    async function handleDeletePastEventPhoto(photoId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র প্রধান এডমিন ছবি মুছতে পারেন।', 'error');
        return;
      }
      const existingPhoto = (state.pastEventPhotos || []).find(p => String(p.id) === String(photoId));
      if (!existingPhoto) {
        showToast('এই অ্যালবাম ছবিটি পাওয়া যায়নি।', 'error');
        return;
      }
      if (!confirm(`“${existingPhoto.title || 'এই ছবি'}” অ্যালবাম থেকে মুছে ফেলতে চান?`)) return;

      try {
        if (window.firebaseDb && window.fb) {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'past_events_gallery', String(photoId)));
        }
        state.pastEventPhotos = (state.pastEventPhotos || []).filter(p => String(p.id) !== String(photoId));
        savePastEventPhotos(state.pastEventPhotos);
        if (String(editingPastPhotoId) === String(photoId)) editingPastPhotoId = '';
        renderApp();
        showToast('অ্যালবাম থেকে ছবিটি মুছে ফেলা হয়েছে।', 'success');
      } catch (err) {
        console.error('Album delete failed:', err);
        showToast('ছবিটি Firebase থেকে মুছে ফেলা যায়নি। Firebase Rules/Authentication পরীক্ষা করুন।', 'error');
      }
    }
    window.handleDeletePastEventPhoto = handleDeletePastEventPhoto;

    async function downloadSourceCode() {
      try {
        const res = await fetch(window.location.href.split('#')[0]);
        if (res.ok) {
          const text = await res.text();
          const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('index.html ফাইলটি সফলভাবে ডাউনলোড হয়েছে!', 'success');
          return;
        }
      } catch (e) {}
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('index.html ফাইলটি ডাউনলোড শুরু হয়েছে!', 'success');
    }
    window.downloadSourceCode = downloadSourceCode;

              </div>
              <h3 class="font-bold text-sm text-[#42422F] mb-1">কোনো এডমিন নোটিশ পাওয়া যায়নি</h3>
              <p class="text-xs text-[#8A8A6A]">এডমিন কর্তৃক নতুন পোস্ট প্রকাশ করা হলে তা স্বয়ংক্রিয়ভাবে এখানে দেখা যাবে।</p>
            </div>
          ` : `
            <div class="space-y-6">
              ${adminPosts.map(p => renderPostCard(p)).join('')}
            </div>
          `}
        </main>
      `;
    }

    function handleAdminSearch(val) {
      state.searchQuery = val;
      const active = document.activeElement;
      const caret = active && active.id === 'admin-search' ? active.selectionStart : null;
      renderApp();
      requestAnimationFrame(() => {
        const next = document.getElementById('admin-search');
        if (!next) return;
        next.focus();
        const pos = caret == null ? next.value.length : caret;
        try { next.setSelectionRange(pos, pos); } catch (e) {}
      });
    }
    window.handleAdminSearch = handleAdminSearch;

    async function handleToggleVerify(userId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র এডমিন কোনো ইউজারকে ভেরিফাই করতে পারেন।', 'error');
        return;
      }
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      user.isVerified = !user.isVerified;
      saveUsers(state.users);
      showToast(`${user.fullName}-কে ${user.isVerified ? 'ভেরিফাইড করা হয়েছে' : 'আনভেরিফাইড করা হয়েছে'}`, 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', user.id), {
            isVerified: user.isVerified
          });
        } catch (err) {
          console.warn('Verify sync error:', err);
        }
      }
    }

    async function handleDeleteStudent(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`${user.fullName}-এর একাউন্ট স্থায়ীভাবে ডিলিট করতে চান?`)) return;
      state.users = state.users.filter(u => u.id !== userId);
      saveUsers(state.users);
      showToast('ইউজার সফলভাবে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', user.id));
        } catch (err) {
          console.warn('Delete user cloud error:', err);
        }
      }
    }

    // --- 8. Initialize App ---
    renderApp();
    if (window.firebaseDb) {
      initFirebaseSync();
    }
  </script>

  <script>
  (() => {
    'use strict';

    // Preserve scroll position across the app's full re-render cycles.
    const originalRender = window.renderApp;
    if (typeof originalRender === 'function' && !window.__oikkoRenderPatched) {
      window.__oikkoRenderPatched = true;
      window.renderApp = function(...args) {
        const y = window.scrollY || 0;
        const result = originalRender.apply(this,args);
        requestAnimationFrame(() => {
          if (y > 0 && Math.abs((window.scrollY||0)-y) > 20) window.scrollTo({top:y,behavior:'instant'});
          enhanceIconsAndImages();
          updateConnectionUI();
        });
        return result;
      };
    }

    function enhanceIconsAndImages(){
      document.querySelectorAll('img').forEach(img => {
        if (img.dataset.oikkoFallbackBound) return;
        img.dataset.oikkoFallbackBound='1';
        img.addEventListener('error', () => {
          img.onerror=null;
          img.src='https://ui-avatars.com/api/?background=2f6f57&color=ffffff&name=Oikko&bold=true';
        });
      });
      try{ if(window.lucide) window.lucide.createIcons(); }catch(e){}
    }

    function ensureUtilityUI(){
      if(!document.getElementById('oikko-status-pill')){
        const pill=document.createElement('div');
        pill.id='oikko-status-pill'; pill.className='oikko-status-pill';
        pill.innerHTML='<span class="oikko-status-dot"></span><span class="oikko-status-text">অনলাইন</span>';
        document.body.appendChild(pill);
      }
      if(!document.getElementById('oikko-backtop')){
        const btn=document.createElement('button');
        btn.id='oikko-backtop'; btn.className='oikko-backtop'; btn.type='button';
        btn.setAttribute('aria-label','উপরে যান');
        btn.innerHTML='<i data-lucide="arrow-up" class="w-5 h-5"></i>';
        btn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
        document.body.appendChild(btn);
      }
      try{if(window.lucide) window.lucide.createIcons();}catch(e){}
    }

    function updateConnectionUI(){
      ensureUtilityUI();
      const online=navigator.onLine;
      const pill=document.getElementById('oikko-status-pill');
      if(!pill)return;
      pill.classList.toggle('offline',!online);
      const text=pill.querySelector('.oikko-status-text');
      if(text) text.textContent=online?'অনলাইন':'অফলাইন মোড';
    }

    window.addEventListener('online',()=>{updateConnectionUI(); if(window.showToast)window.showToast('ইন্টারনেট সংযোগ ফিরে এসেছে','success');});
    window.addEventListener('offline',()=>{updateConnectionUI(); if(window.showToast)window.showToast('আপনি অফলাইন মোডে আছেন','info');});
    window.addEventListener('scroll',()=>{
      const btn=document.getElementById('oikko-backtop');
      if(btn) btn.classList.toggle('show',(window.scrollY||0)>500);
    },{passive:true});

    // Prevent accidental duplicate submit/clicks while asynchronous Firebase calls are in flight.
    document.addEventListener('click', e => {
      const btn=e.target.closest('button');
      if(!btn || btn.dataset.oikkoBusy || btn.disabled) return;
      const label=(btn.textContent||'').trim();
      if(/লগইন|রেজিস্ট্রেশন|পোস্ট করুন|সংরক্ষণ|আপডেট/.test(label)){
        btn.dataset.oikkoBusy='1';
        setTimeout(()=>delete btn.dataset.oikkoBusy,700);
      }
    },true);

    // Escape closes open modals/lightboxes when possible without disturbing normal forms.
    document.addEventListener('keydown', e => {
      if(e.key==='Escape'){
        const lightbox=document.getElementById('lightbox-container');
        const modal=document.getElementById('modal-container');
        if(lightbox && lightbox.innerHTML.trim()){lightbox.innerHTML=''; if(window.state)window.state.selectedMedia=null;}
        else if(modal && modal.innerHTML.trim()) modal.innerHTML='';
      }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
        e.preventDefault();
        const search=document.querySelector('.app-search input, input[placeholder*="খুঁজ"], input[type="search"]');
        if(search){search.focus();search.select();}
      }
    });

    window.addEventListener('error', ev => {
      console.warn('Oikko UI recovery:',ev.message);
      updateConnectionUI();
    });

    document.addEventListener('DOMContentLoaded',()=>{
      ensureUtilityUI(); updateConnectionUI(); enhanceIconsAndImages();
      setTimeout(enhanceIconsAndImages,500);
    });
  })();
  </script>
