    function switchView(v) {
      state.activeView = v;
      state.sidebarOpen = false;
      document.body.classList.remove('oikko-sidebar-open');
      if (v === 'youtube') {
        ensureOikkoTubeReady();
        loadOikkoTubeAgeVerification();
      }
      renderApp();
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const content = document.getElementById('new-post-content').value.trim();
      const media = state.selectedMedia;

      if (!content && !media) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন', 'error');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
      const newPost = {
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: content,
        mediaType: media ? media.type : null,
        imageUrl: (media && media.type === 'image') ? media.url : '',
        videoUrl: (media && media.type === 'video') ? media.url : '',
        likes: [],
        comments: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      document.getElementById('new-post-content').value = '';
      state.selectedMedia = null;
      const fileInput = document.getElementById('post-media-file');
      if (fileInput) fileInput.value = '';

      // Automatic mention notification dispatch (@everyone or specific students)
      dispatchMentionNotifications(content, state.currentUser, 'পোস্টে');

      // Optimistic local update so the new post is visible immediately, even
      // while Firestore is still processing the write.
      const localPost = { id: 'post_' + Date.now(), ...newPost };
      state.posts.unshift(localPost);
      savePosts(state.posts);
      renderApp();

      // Save directly to Firebase Firestore for all mobiles & devices
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'posts'), newPost);
          showToast('নতুন পোস্ট শেয়ার হয়েছে!', 'success');
        } catch (err) {
          console.error('Firestore addDoc error:', err);
          showToast('পোস্ট হয়েছে (লোকাল মেমোরি)।', 'error');
        }
      } else {
        showToast('নতুন পোস্ট প্রকাশিত হয়েছে!', 'success');
      }
    }

    async function handleDeletePost(postId) {
      if (!confirm('আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?')) return;
      state.posts = state.posts.filter(p => p.id !== postId);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'posts', postId));
          showToast('পোস্ট মুছে ফেলা হয়েছে', 'info');
        } catch (err) {
          console.warn('Delete post error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
        showToast('পোস্ট মুছে ফেলা হয়েছে', 'info');
      }
    }

    async function handleToggleLike(postId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const updatedLikes = [...(post.likes || [])];
      const idx = updatedLikes.indexOf(u.studentId);
      if (idx === -1) updatedLikes.push(u.studentId);
      else updatedLikes.splice(idx, 1);

      post.likes = updatedLikes;
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            likes: updatedLikes
          });
        } catch (err) {
          console.warn('Like sync error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
      }
    }

    // --- কমেন্ট লাইক সিস্টেম ---
    async function handleToggleCommentLike(postId, commentId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment) return;

      if (!comment.likes) comment.likes = [];
      const idx = comment.likes.indexOf(u.studentId);
      if (idx === -1) {
        comment.likes.push(u.studentId);
      } else {
        comment.likes.splice(idx, 1);
      }

      savePosts(state.posts);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
        } catch (err) {
          console.warn('Comment like sync error:', err);
        }
      }
    }

    // --- কমেন্ট রিপ্লাই বক্স টগল ---
    function toggleReplyInput(commentId, targetAuthorName = '') {
      state.openReplyBoxes = state.openReplyBoxes || {};
      state.openReplyBoxes[commentId] = !state.openReplyBoxes[commentId];
      renderApp();
      if (state.openReplyBoxes[commentId]) {
        setTimeout(() => {
          const input = document.getElementById('reply-input-' + commentId);
          if (input) {
            if (targetAuthorName) {
              input.value = `@${targetAuthorName} `;
            }
            input.focus();
          }
        }, 50);
      }
    }
    window.toggleReplyInput = toggleReplyInput;

    // --- কমেন্ট এ রিপ্লাই যোগ করা (একাধিকবার রিপ্লাই সমর্থন ও সঠিক সময় নির্ধারণ) ---
    async function handleAddReply(e, postId, commentId) {
      e.preventDefault();
      const input = document.getElementById('reply-input-' + commentId);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment) return;

      if (!comment.replies) comment.replies = [];

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

      const newReply = {
        id: 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: text,
        likes: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      comment.replies.push(newReply);
      state.expandedComments[postId] = true; // রিপ্লাই দিলে পুরো কমেন্ট থ্রেড দৃশ্যমান থাকা
      state.openReplyBoxes = state.openReplyBoxes || {};
      state.openReplyBoxes[commentId] = true; // রিপ্লাই বক্স খোলা রাখা যাতে সাথে সাথে আবার রিপ্লাই করা যায়
      
      savePosts(state.posts);
      renderApp();

      // ইনপুট ক্লিয়ার এবং পুনরায় ফোকাস যাতে সহজে পরবর্তী রিপ্লাই দেওয়া যায়
      setTimeout(() => {
        const nextInput = document.getElementById('reply-input-' + commentId);
        if (nextInput) {
          nextInput.value = '';
        }
      }, 20);

      // ডিভাইসে তাৎক্ষণিক নোটিফিকেশন অ্যালার্ট
      sendDeviceNotification('মন্তব্যে রিপ্লাই যোগ হয়েছে!', {
        body: `${state.currentUser.fullName}: "${text.length > 50 ? text.substring(0, 50) + '...' : text}"`,
        icon: state.currentUser.profilePicture
      });

      // Automatic mention notification dispatch
      dispatchMentionNotifications(text, state.currentUser, 'রিপ্লাইয়ে');

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
          showToast('রিপ্লাই সফলভাবে যোগ করা হয়েছে', 'success');
        } catch (err) {
          console.warn('Reply sync error:', err);
        }
      } else {
        showToast('রিপ্লাই যুক্ত হয়েছে', 'success');
      }
    }

    // --- রিপ্লাইতে লাইক দেওয়া ---
    async function handleToggleReplyLike(postId, commentId, replyId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment || !comment.replies) return;

      const reply = comment.replies.find(r => r.id === replyId);
      if (!reply) return;

      if (!reply.likes) reply.likes = [];
      const idx = reply.likes.indexOf(u.studentId);
      if (idx === -1) {
        reply.likes.push(u.studentId);
      } else {
        reply.likes.splice(idx, 1);
      }

      savePosts(state.posts);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
        } catch (err) {
          console.warn('Reply like sync error:', err);
        }
      }
    }

    // --- মূল কমেন্ট যোগ করা (সঠিক সময় ও নোটিফিকেশন সহ) ---
    async function handleAddComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('comment-input-' + postId);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const now = new Date();
      const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

      const newComment = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: text,
        likes: [],
        replies: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      const updatedComments = [...(post.comments || []), newComment];

    window.openEditPostModal = openEditPostModal;

    function renderEditPostMediaHTML() {
      if (!editPostMediaState || !editPostMediaState.url) {
        return `<div class="p-3 rounded-xl bg-[#F9F9F4] border border-dashed border-[#E2E2D5] text-center text-[#8A8A6A] text-xs">কোনো ছবি বা ভিডিও যুক্ত নেই</div>`;
      }
      if (editPostMediaState.type === 'video') {
        return `
          <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] bg-black max-h-56 flex items-center justify-center">
            <video src="${editPostMediaState.url}" controls class="max-h-56 w-full object-contain"></video>
            <button type="button" onclick="handleRemoveEditPostMedia()" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-md cursor-pointer" title="ভিডিও মুছে ফেলুন">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>

      }
      return `
        <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] max-h-56 flex items-center justify-center bg-[#F5F5F0]">
          <img src="${editPostMediaState.url}" class="max-h-56 w-full object-cover" />
          <button type="button" onclick="handleRemoveEditPostMedia()" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full shadow-md cursor-pointer" title="ছবি মুছে ফেলুন">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `;
    }

    function handleRemoveEditPostMedia() {
      editPostMediaState = { type: null, url: '', name: '' };
      const box = document.getElementById('edit-post-media-box');
      if (box) {
        box.innerHTML = renderEditPostMediaHTML();
        if (window.lucide) lucide.createIcons();
      }
    }
    window.handleRemoveEditPostMedia = handleRemoveEditPostMedia;

    async function handleEditMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');
      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.85);
          editPostMediaState = { type: 'image', url: dataUrl, name: file.name };
        } else {
          if (file.size > 20 * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ২০MB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          editPostMediaState = { type: 'video', url: dataUrl, name: file.name };
        }
        const box = document.getElementById('edit-post-media-box');
        if (box) {
          box.innerHTML = renderEditPostMediaHTML();
          if (window.lucide) lucide.createIcons();
        }
        showToast('মিডিয়া নির্বাচন করা হয়েছে!', 'success');
      } catch (err) {
        showToast('মিডিয়া লোড করা যায়নি', 'error');
      }
    }
    window.handleEditMediaFileSelect = handleEditMediaFileSelect;

    async function handleSaveEditPost(e, postId) {
      e.preventDefault();
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const contentInput = document.getElementById('edit-post-content');
      const newContent = contentInput ? contentInput.value.trim() : '';

      const hasMedia = editPostMediaState && editPostMediaState.url;
      if (!newContent && !hasMedia) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও রাখুন!', 'error');
        return;
      }

      post.content = newContent;
      if (editPostMediaState && editPostMediaState.url) {
        post.mediaType = editPostMediaState.type;
        post.imageUrl = editPostMediaState.type === 'image' ? editPostMediaState.url : '';
        post.videoUrl = editPostMediaState.type === 'video' ? editPostMediaState.url : '';
      } else {
        post.mediaType = null;
        post.imageUrl = '';
        post.videoUrl = '';
      }
      post.isEdited = true;

      savePosts(state.posts);
      closeProfileModal();
      showToast('পোস্ট সফলভাবে এডিট ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Automatic mention notifications for updated content
      dispatchMentionNotifications(newContent, state.currentUser, 'এডিটেড পোস্টে');

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            content: post.content,
            imageUrl: post.imageUrl || '',
            videoUrl: post.videoUrl || '',
            mediaType: post.mediaType || null,
            isEdited: true
          });
        } catch (err) {
          console.warn('Firestore edit post sync note:', err);
        }
      }
    }
    window.handleSaveEditPost = handleSaveEditPost;

    function handleFilterEvents(cat) {
      state.eventFilterCategory = cat;
      renderApp();
    }
    window.handleFilterEvents = handleFilterEvents;

    function handleToggleEventRsvp(eventId) {
      const ev = state.events.find(e => e.id === eventId);
      if (!ev) return;
      if (!ev.participants) ev.participants = [];

      const idx = ev.participants.indexOf(state.currentUser.studentId);
      if (idx === -1) {
        ev.participants.push(state.currentUser.studentId);
        showToast('ইভেন্টে অংশগ্রহণের তালিকাভুক্ত করা হয়েছে!', 'success');

    async function handleCreateEvent(e) {
      e.preventDefault();
      const title = document.getElementById('ev-title').value.trim();
      const date = document.getElementById('ev-date').value.trim();
      const time = document.getElementById('ev-time').value.trim();
      const location = document.getElementById('ev-location').value.trim();
      const category = document.getElementById('ev-category').value;
      const banner = document.getElementById('ev-banner').value.trim() || 'https://images.unsplash.com/photo-1511578314322-379afb476865?w=800';
      const desc = document.getElementById('ev-desc').value.trim();

      const newEvent = {
        id: 'ev_' + Date.now(),
        title,
        date,
        time,
        location,
        category,
        banner,
        description: desc,
        participants: [state.currentUser.studentId],
        timestamp: Date.now()
      };

      state.events.unshift(newEvent);
      saveEvents(state.events);
      closeProfileModal();
      showToast('নতুন ইভেন্ট সফলভাবে প্রকাশ করা হয়েছে!', 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'events', newEvent.id), newEvent, { merge: true });
        } catch (err) {
          console.warn('Firebase setDoc event error:', err);
        }
      }
    }

    async function handlePastPhotoFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressed = await compressImage(file, 1200, 1200, 0.85);
        selectedPastPhotoDataUrl = compressed;
        const nameEl = document.getElementById('past-photo-filename');
        if (nameEl) nameEl.textContent = file.name;
        const box = document.getElementById('past-photo-preview-box');
        const img = document.getElementById('past-photo-preview-img');
        if (box && img) {
          img.src = compressed;
          box.classList.remove('hidden');
        }
        showToast('ছবি নির্বাচন সফল হয়েছে!', 'success');
      } catch (err) {
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }
    window.handlePastPhotoFileSelect = handlePastPhotoFileSelect;

    async function handleSavePastEventPhoto(e) {
      e.preventDefault();
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই!', 'error');
        return;
      }

      const title = document.getElementById('past-photo-title').value.trim();
      const date = document.getElementById('past-photo-date').value.trim();
      const category = document.getElementById('past-photo-category').value;
      const urlInput = document.getElementById('past-photo-url').value.trim();
      const desc = document.getElementById('past-photo-desc').value.trim();

      const finalImageUrl = selectedPastPhotoDataUrl || urlInput;
      if (!finalImageUrl) {
        showToast('অনুগ্রহ করে ছবি নির্বাচন করুন অথবা ছবির লিংক দিন', 'error');
        return;
      }

      const newPhoto = {
        id: 'past_ev_' + Date.now(),
        title,
        date,
        category,
        imageUrl: finalImageUrl,
        description: desc,
        timestamp: Date.now()
      };

      selectedPastPhotoDataUrl = '';
      if (!state.pastEventPhotos) state.pastEventPhotos = [];
      state.pastEventPhotos.unshift(newPhoto);
      savePastEventPhotos(state.pastEventPhotos);
      closeProfileModal();
      showToast('পূর্ববর্তী ইভেন্টের ছবি সফলভাবে যুক্ত হয়েছে!', 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'past_events_gallery', newPhoto.id), newPhoto);
        } catch (err) {
          console.warn('Firebase save past event photo error:', err);
        }
      }
    }
    window.handleSavePastEventPhoto = handleSavePastEventPhoto;

    async function handleDeletePastEventPhoto(photoId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র প্রধান এডমিন ছবি মুছতে পারেন।', 'error');
        return;
      }
      if (!confirm('আপনি কি নিশ্চিত যে এই ছবিটি অ্যালবাম থেকে মুছে ফেলতে চান?')) return;

      state.pastEventPhotos = (state.pastEventPhotos || []).filter(p => p.id !== photoId);
      savePastEventPhotos(state.pastEventPhotos);
      showToast('ছবিটি অ্যালবাম থেকে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb && photoId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'past_events_gallery', photoId));
        } catch (err) {
          console.warn('Firebase delete past event photo error:', err);
        }
      }
    }
    window.handleDeletePastEventPhoto = handleDeletePastEventPhoto;

    async function downloadSourceCode() {
      try {
        const res = await fetch(window.location.href.split('#')[0]);
        if (res.ok) {
          const text = await res.text();
          const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('index.html ফাইলটি সফলভাবে ডাউনলোড হয়েছে!', 'success');
          return;
        }
      } catch (e) {}
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('index.html ফাইলটি ডাউনলোড শুরু হয়েছে!', 'success');
    }
    window.downloadSourceCode = downloadSourceCode;

    // --- EVENT PARTICIPANTS MODAL & ADMIN PROFILE VIEWER ---
    let eventParticipantsSearchQuery = '';

    function openEventParticipantsModal(eventId, searchStr = '') {
      const ev = state.events.find(e => e.id === eventId);
      if (!ev) {
        showToast('ইভেন্টের তথ্য পাওয়া যায়নি', 'error');
        return;
      }

      state.lastOpenedEventId = eventId;
      eventParticipantsSearchQuery = typeof searchStr === 'string' ? searchStr : '';

      const participantsIds = ev.participants || [];
      const participantUsers = participantsIds.map(pId => {
        const found = state.users.find(u => 
          (u.studentId && u.studentId.toUpperCase() === String(pId).toUpperCase()) ||
          (u.id && u.id === pId)
        );
        if (found) return found;
        return {
          id: pId,
          studentId: pId,
          fullName: pId === 'ADMIN001' ? 'Khan Mohammad Ismail (এডমিন)' : `শিক্ষার্থী (${pId})`,
          studentClass: pId === 'ADMIN001' ? 'এডমিন' : 'শিক্ষার্থী',
          roll: 'N/A',
          section: 'সাধারণ',
          shift: 'দিবা',
          bloodGroup: 'O+',
          mobileNumber: '',
          email: '',
          profilePicture: pId === 'ADMIN001' ? ADMIN_DATA.profilePicture : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
          isVerified: pId === 'ADMIN001',
          role: pId === 'ADMIN001' ? 'admin' : 'student'
        };
      });

      const query = eventParticipantsSearchQuery.toLowerCase().trim();
      const filteredParticipants = query ? participantUsers.filter(p => 
        (p.fullName && p.fullName.toLowerCase().includes(query)) ||
        (p.studentId && p.studentId.toLowerCase().includes(query)) ||
        (p.roll && p.roll.toLowerCase().includes(query)) ||
        (p.studentClass && p.studentClass.toLowerCase().includes(query)) ||
        (p.mobileNumber && p.mobileNumber.toLowerCase().includes(query))
      ) : participantUsers;

      const isAdmin = state.currentUser && state.currentUser.role === 'admin';

      const modalContainer = document.getElementById('modal-container');
      modalContainer.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
          <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl border border-[#E2E2D5] overflow-hidden animate-in fade-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]">
            <!-- Header -->
            <div class="bg-[#5A5A40] text-white p-4 sm:p-5 flex items-center justify-between shrink-0">
              <div class="flex items-center gap-3 min-w-0">
                <div class="p-2.5 bg-white/20 rounded-xl shrink-0">
                  <i data-lucide="users" class="w-6 h-6 text-white"></i>
                </div>
                <div class="min-w-0">
                  <h3 class="font-bold text-base sm:text-lg leading-tight truncate">
                    ${ev.title}
                  </h3>
                  <div class="flex items-center gap-2 mt-1 text-xs text-[#D1D1C2] flex-wrap">
                    <span class="bg-white/20 px-2 py-0.5 rounded text-white font-semibold">${ev.date}</span>
                    <span>•</span>
                    <span>মোট ${participantsIds.length} জন শিক্ষার্থী অংশগ্রহণ করছেন</span>
                    ${isAdmin ? '<span class="bg-red-500/80 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">এডমিন ভিউ</span>' : ''}
                  </div>
                </div>
              </div>
              <button onclick="closeProfileModal()" class="p-1.5 rounded-xl hover:bg-white/20 text-white transition-colors cursor-pointer shrink-0 ml-2" title="বন্ধ করুন">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Search & Filter Inside Modal -->
            <div class="p-3.5 bg-[#F9F9F4] border-b border-[#F0F0E0] flex items-center gap-2 shrink-0">
              <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-[#8A8A6A] absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input
                  id="event-participants-search"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  value="${escapeHtml(eventParticipantsSearchQuery)}"
                  oninput="openEventParticipantsModal('${ev.id}', this.value)"
                  placeholder="অংশগ্রহণকারীদের নাম, রোল বা স্টুডেন্ট আইডি দিয়ে খুঁজুন..."
                  class="w-full pl-9 pr-3 py-2 bg-white border border-[#E2E2D5] rounded-xl text-xs sm:text-sm text-[#42422F] focus:outline-none focus:ring-1 focus:ring-[#5A5A40]"
                />
              </div>
              <span class="text-xs text-[#8A8A6A] font-semibold shrink-0 px-2">
                ${filteredParticipants.length} জন পাওয়া গেছে
              </span>
            </div>

            <!-- Participant List Body -->
            <div class="p-4 sm:p-5 overflow-y-auto flex-1 space-y-3">
              ${filteredParticipants.length === 0 ? `
                <div class="p-8 text-center bg-[#F9F9F4] rounded-2xl border border-dashed border-[#E2E2D5]">
                  <i data-lucide="users" class="w-10 h-10 text-[#8A8A6A] mx-auto mb-2 opacity-50"></i>
                  <h4 class="font-bold text-sm text-[#42422F]">কোনো অংশগ্রহণকারী শিক্ষার্থী পাওয়া যায়নি</h4>
                  <p class="text-xs text-[#8A8A6A] mt-1">${query ? 'ভিন্ন কোনো নাম বা আইডি দিয়ে চেষ্টা করুন' : 'এখনো কোনো শিক্ষার্থী এই ইভেন্টে অংশগ্রহণ করেনি'}</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 gap-3">
                  ${filteredParticipants.map(stu => `
                    <div class="p-3.5 rounded-2xl bg-white border border-[#E2E2D5] hover:border-[#5A5A40] transition-all shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-3 group">
                      <!-- Student Identity -->
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="relative shrink-0 cursor-pointer" onclick="openProfileModal('${stu.id || stu.studentId}', '${ev.id}')">
                          <img src="${stu.profilePicture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="w-12 h-12 rounded-2xl object-cover border border-[#E2E2D5] group-hover:ring-2 group-hover:ring-[#5A5A40] transition-all" />
                          ${stu.isVerified ? `<div class="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 shadow-xs">${getVerifiedBadgeHTML('sm')}</div>` : ''}
                        </div>
                        <div class="min-w-0">
                          <div class="font-bold text-xs sm:text-sm text-[#42422F] flex items-center gap-1.5 flex-wrap">
                            <span class="cursor-pointer hover:underline hover:text-[#5A5A40]" onclick="openProfileModal('${stu.id || stu.studentId}', '${ev.id}')">${stu.fullName}</span>
                            ${stu.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                            <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[#F5F5F0] border border-[#E2E2D5] text-[#5A5A40] font-bold">ID: ${stu.studentId}</span>
                          </div>
                          <div class="text-[11px] text-[#8A8A6A] mt-0.5 flex items-center gap-2 flex-wrap">
                            <span>${stu.studentClass || 'শিক্ষার্থী'}</span>
                            ${stu.roll && stu.roll !== 'N/A' ? `<span>• রোল: #${stu.roll}</span>` : ''}
                            ${stu.section ? `<span>• শাখা: ${stu.section}</span>` : ''}
                            ${stu.bloodGroup ? `<span class="text-rose-600 font-semibold">• রক্ত: ${stu.bloodGroup}</span>` : ''}
                          </div>
                          ${stu.mobileNumber ? `
                            <div class="text-[10px] text-[#5A5A40] mt-0.5 flex items-center gap-1">
                              <i data-lucide="phone" class="w-3 h-3 text-emerald-600"></i>
                              <a href="tel:${stu.mobileNumber}" class="font-mono hover:underline font-semibold">${stu.mobileNumber}</a>
                            </div>
                          ` : ''}
                        </div>
                      </div>

                      <!-- Action Buttons: View Complete Profile & Admin Options -->
                      <div class="flex items-center gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-[#F0F0E0]">
                        <button
                          type="button"
                          onclick="openProfileModal('${stu.id || stu.studentId}', '${ev.id}')"
                          class="px-3.5 py-2 rounded-xl bg-[#5A5A40] hover:bg-[#4A4A33] text-white text-xs font-bold transition-all shadow-xs flex items-center gap-1.5 cursor-pointer"
                          title="${stu.fullName}-এর পিতা-মাতা, ঠিকানা ও জন্মনিবন্ধনসহ সম্পূর্ণ প্রোফাইল দেখুন"
                        >
                          <i data-lucide="user" class="w-3.5 h-3.5"></i>
                          <span>প্রোফাইল দেখুন</span>
                        </button>

                        ${isAdmin ? `
                          <button
                            type="button"
                            onclick="handleAdminRemoveParticipant('${ev.id}', '${stu.studentId}')"
                            class="p-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 transition-colors border border-red-200 cursor-pointer"
                            title="এই ইউজারকে ইভেন্ট থেকে রিমুভ করুন"
                          >
                            <i data-lucide="user-x" class="w-4 h-4"></i>
                          </button>
                        ` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Footer -->
            <div class="p-3.5 bg-[#F5F5F0] border-t border-[#E2E2D5] flex items-center justify-between shrink-0">
              <span class="text-[11px] text-[#8A8A6A]">
                এডমিন যেকোনো ইউজারের "প্রোফাইল দেখুন" বাটনে ক্লিক করে পিতা-মাতা, ঠিকানা ও জন্মনিবন্ধনসহ বিস্তারিত দেখতে পারবেন।
              </span>
              <button onclick="closeProfileModal()" class="px-5 py-2 rounded-xl bg-white hover:bg-[#E2E2D5] text-[#5A5A40] border border-[#E2E2D5] text-xs font-bold transition-colors cursor-pointer shadow-2xs">
                বন্ধ করুন
              </button>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
      const participantSearch = document.getElementById('event-participants-search');
      if (participantSearch && eventParticipantsSearchQuery) {
        participantSearch.focus();
        const len = participantSearch.value.length;
        try { participantSearch.setSelectionRange(len, len); } catch (e) {}
      }
    }
    window.openEventParticipantsModal = openEventParticipantsModal;

    function handleAdminRemoveParticipant(eventId, studentId) {
      if (!confirm(`আপনি কি এই ইউজারকে (${studentId}) এই ইভেন্টের অংশগ্রহণকারী তালিকা থেকে সরাতে চান?`)) return;
      const ev = state.events.find(e => e.id === eventId);
      if (!ev || !ev.participants) return;
      ev.participants = ev.participants.filter(p => p !== studentId);
      saveEvents(state.events);
      showToast('ইউজার সফলভাবে মুছে ফেলা হয়েছে', 'info');
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'events', ev.id), ev, { merge: true }).catch(console.warn);
      }
      openEventParticipantsModal(eventId, eventParticipantsSearchQuery);
      renderApp();
    }
    window.handleAdminRemoveParticipant = handleAdminRemoveParticipant;

    // --- ADMIN POSTS VIEW ---
    function renderAdminPostsView() {
      const adminPosts = state.posts.filter(p => 
        p.authorStudentId === 'ADMIN001' || 
        (state.users.find(u => (u.studentId === p.authorStudentId || u.id === p.authorId) && u.role === 'admin'))
      );

      return `
        <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-28 flex-1 w-full">
          <!-- Admin Posts Header Banner -->
          <div class="bg-gradient-to-r from-[#5A5A40] to-[#42422F] text-white rounded-3xl p-6 sm:p-7 mb-6 shadow-md relative overflow-hidden">
            <div class="relative z-10">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-600 text-white text-xs font-bold mb-3 shadow-xs">
                <i data-lucide="megaphone" class="w-3.5 h-3.5"></i>
                <span>অফিসিয়াল নোটিশ বোর্ড</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">প্রধান এডমিন ও অফিশিয়াল নোটিশ</h1>
              <p class="text-xs sm:text-sm text-[#E2E2D5] leading-relaxed">প্রতিষ্ঠান প্রশাসন ও প্রধান এডমিনের সকল আনুষ্ঠানিক ঘোষণা, বিজ্ঞপ্তি ও গুরুত্বপূর্ণ নির্দেশনা এখানে পাওয়া যায়।</p>
            </div>
            <div class="absolute -right-8 -bottom-8 opacity-15 pointer-events-none">
              <i data-lucide="shield-check" class="w-52 h-52 text-white"></i>
            </div>
          </div>

          <!-- Admin Posts List -->
          ${adminPosts.length === 0 ? `
            <div class="bg-white rounded-2xl border border-[#E2E2D5] p-12 text-center">
              <div class="w-14 h-14 rounded-full bg-[#F5F5F0] flex items-center justify-center mx-auto mb-3 text-[#8A8A6A]">
                <i data-lucide="info" class="w-7 h-7"></i>
              </div>
              <h3 class="font-bold text-sm text-[#42422F] mb-1">কোনো এডমিন নোটিশ পাওয়া যায়নি</h3>
              <p class="text-xs text-[#8A8A6A]">এডমিন কর্তৃক নতুন পোস্ট প্রকাশ করা হলে তা স্বয়ংক্রিয়ভাবে এখানে দেখা যাবে।</p>
            </div>
          ` : `
            <div class="space-y-6">
              ${adminPosts.map(p => renderPostCard(p)).join('')}
            </div>
          `}
        </main>
      `;
    }

    function handleAdminSearch(val) {
      state.searchQuery = val;
      const active = document.activeElement;
      const caret = active && active.id === 'admin-search' ? active.selectionStart : null;
      renderApp();
      requestAnimationFrame(() => {
        const next = document.getElementById('admin-search');
        if (!next) return;
        next.focus();
        const pos = caret == null ? next.value.length : caret;
        try { next.setSelectionRange(pos, pos); } catch (e) {}
      });
    }
    window.handleAdminSearch = handleAdminSearch;

    async function handleToggleVerify(userId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র এডমিন কোনো ইউজারকে ভেরিফাই করতে পারেন।', 'error');
        return;
      }
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      user.isVerified = !user.isVerified;
      saveUsers(state.users);
      showToast(`${user.fullName}-কে ${user.isVerified ? 'ভেরিফাইড করা হয়েছে' : 'আনভেরিফাইড করা হয়েছে'}`, 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', user.id), {
            isVerified: user.isVerified
          });
        } catch (err) {
          console.warn('Verify sync error:', err);
        }
      }
    }

    async function handleDeleteStudent(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`${user.fullName}-এর একাউন্ট স্থায়ীভাবে ডিলিট করতে চান?`)) return;
      state.users = state.users.filter(u => u.id !== userId);
      saveUsers(state.users);
      showToast('ইউজার সফলভাবে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', user.id));
        } catch (err) {
          console.warn('Delete user cloud error:', err);
        }
      }
    }

    // --- 8. Initialize App ---
    renderApp();
    if (window.firebaseDb) {
      initFirebaseSync();
    }
  </script>

  <!-- Oikko UI/UX Stability & Enhancement Patch -->
  <style id="oikko-enhancement-patch">
    :root{
      --oikko-glow: rgba(47,111,87,.18);
      --oikko-surface: rgba(255,255,255,.72);
      --oikko-shadow: 0 18px 55px rgba(18,35,28,.10);
    }
    body{
      min-height:100vh;
      background-attachment:fixed;
      background-image:
        radial-gradient(circle at 0% 0%, rgba(216,243,228,.92), transparent 32rem),
        radial-gradient(circle at 100% 8%, rgba(244,196,90,.18), transparent 30rem),
        radial-gradient(circle at 85% 100%, rgba(239,115,88,.10), transparent 28rem),
        linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,0)),
        var(--bg-canvas);
    }
    body:before,body:after{
      content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:999px;
      filter:blur(55px);opacity:.32;animation:oikkoFloat 14s ease-in-out infinite;
    }
    body:before{width:22rem;height:22rem;left:-9rem;bottom:10%;background:#8ed9b0}
    body:after{width:18rem;height:18rem;right:-7rem;top:35%;background:#f4c45a;animation-delay:-7s}
    html.dark body:before{opacity:.12} html.dark body:after{opacity:.08}
    @keyframes oikkoFloat{50%{transform:translate(35px,-28px) scale(1.08)}}
    #app{position:relative;isolation:isolate}
    .app-topbar,.app-nav{backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
    .app-card,.auth-panel,.search-results-panel{box-shadow:var(--oikko-shadow)}
    .app-card{background:var(--oikko-surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .app-card:hover{transform:translateY(-3px)}
    button{touch-action:manipulation}
    img{max-width:100%;image-rendering:auto}
    input,textarea,select{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
    input:focus,textarea:focus,select:focus{box-shadow:0 0 0 4px var(--oikko-glow)!important}
    .oikko-status-pill{
      position:fixed;right:14px;bottom:82px;z-index:60;display:flex;align-items:center;gap:7px;
      padding:7px 11px;border-radius:999px;font-size:11px;font-weight:700;
      background:rgba(18,35,28,.88);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);
      backdrop-filter:blur(16px);transition:opacity .25s ease,transform .25s ease;
    }
    .oikko-status-dot{width:7px;height:7px;border-radius:50%;background:#67e8a4;box-shadow:0 0 0 4px rgba(103,232,164,.13)}
    .oikko-status-pill.offline .oikko-status-dot{background:#f4c45a;box-shadow:0 0 0 4px rgba(244,196,90,.13)}
    .oikko-backtop{
      position:fixed;right:16px;bottom:132px;z-index:55;width:42px;height:42px;border:0;border-radius:14px;
      display:grid;place-items:center;background:var(--primary-olive);color:white;
      box-shadow:0 12px 30px rgba(47,111,87,.30);opacity:0;transform:translateY(12px);
      pointer-events:none;transition:.22s ease;
    }
    .oikko-backtop.show{opacity:1;transform:none;pointer-events:auto}
    .oikko-skeleton{background:linear-gradient(90deg,rgba(128,128,128,.08),rgba(255,255,255,.34),rgba(128,128,128,.08));background-size:200% 100%;animation:oikkoShimmer 1.5s infinite}
    @keyframes oikkoShimmer{to{background-position:-200% 0}}
    @media (max-width:640px){
      body{background-attachment:scroll}
      body:before{width:15rem;height:15rem}
      body:after{width:12rem;height:12rem}
      .app-card:hover{transform:none}
      .oikko-status-pill{bottom:72px;right:10px}
      .oikko-backtop{right:12px;bottom:120px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
    }
  </style>

  <!-- Oikko Modern Visual Design v2 -->
  <style id="oikko-modern-design">
    :root{
      --o2-green:#2F6F57;
      --o2-green-dark:#173B2D;
      --o2-mint:#D8F3E4;
      --o2-coral:#F27D61;
      --o2-cream:#F7F8F4;
      --o2-line:rgba(47,111,87,.12);
      --o2-shadow:0 18px 60px rgba(18,35,28,.10);
      --o2-shadow-soft:0 8px 30px rgba(18,35,28,.07);
    }
    html.dark{
      --o2-cream:#101612;
      --o2-line:rgba(216,243,228,.10);
      --o2-shadow:0 20px 70px rgba(0,0,0,.30);
      --o2-shadow-soft:0 10px 34px rgba(0,0,0,.22);
    }

    /* App-wide visual language */
    body{font-feature-settings:"kern" 1,"liga" 1;overflow-x:hidden}
    .app-topbar{
      border-bottom:1px solid rgba(255,255,255,.10)!important;
      box-shadow:0 12px 38px rgba(18,35,28,.20)!important;
      background:linear-gradient(135deg,rgba(18,48,37,.96),rgba(35,86,66,.93))!important;
    }
    .app-brand-mark{
      box-shadow:0 8px 24px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.75);
      transition:transform .22s ease,box-shadow .22s ease;
    }
    .app-brand-mark:hover{transform:translateY(-2px) rotate(-1deg);box-shadow:0 12px 28px rgba(0,0,0,.20)}
    .app-search{
      border:1px solid rgba(255,255,255,.13)!important;
      background:rgba(255,255,255,.095)!important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.08);
      transition:all .22s ease;
    }
    .app-search:focus-within{background:rgba(255,255,255,.14)!important;border-color:rgba(216,243,228,.35)!important;box-shadow:0 0 0 4px rgba(216,243,228,.10),0 10px 28px rgba(0,0,0,.12)}

    /* Modern Messenger launcher */
    body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5{position:relative}
    body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5 button{
      min-height:36px!important;
      background:linear-gradient(135deg,#2F6F57,#4A9874)!important;
      box-shadow:0 8px 24px rgba(47,111,87,.20)!important;
      border:1px solid rgba(255,255,255,.16);
      letter-spacing:.02em;
    }
    body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5 button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(47,111,87,.27)!important}

    /* Cards: premium glass / depth */
    .app-card,.auth-panel,.search-results-panel{
      border:1px solid var(--o2-line)!important;
      box-shadow:var(--o2-shadow)!important;
      border-radius:24px!important;
      transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .app-card:hover{box-shadow:0 24px 70px rgba(18,35,28,.14)!important;border-color:rgba(47,111,87,.20)!important}
    html.dark .app-card{border-color:rgba(216,243,228,.08)!important}

    /* Buttons feel tactile and consistent */
    button:not(.messenger-topbar button):not(.messenger-composer button){transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,opacity .18s ease}
    button:not(:disabled):active{transform:scale(.97)}
    .app-nav{
      background:rgba(18,35,28,.88)!important;
      border-top:1px solid rgba(255,255,255,.10)!important;
      box-shadow:0 -12px 38px rgba(18,35,28,.18)!important;
    }
    .app-nav-item{border-radius:16px!important;min-height:46px}
    .app-nav-item.active{background:linear-gradient(135deg,rgba(216,243,228,.18),rgba(255,255,255,.06))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 20px rgba(0,0,0,.10)}

    /* Feed / content hierarchy */
    main{scroll-margin-top:80px}
    main .rounded-3xl,main .rounded-2xl{transition:box-shadow .2s ease,border-color .2s ease}
    h1,h2,h3{letter-spacing:-.015em}
    .text-xs{letter-spacing:.01em}

    /* Form controls */
    input,textarea,select{
      border-radius:14px;
    }

    /* Fixed Messenger message input */
    .messenger-input{height:40px!important;min-height:40px!important;max-height:40px!important;overflow:hidden!important;flex:1 1 auto;}
    #chat-input-field{height:40px!important;min-height:40px!important;max-height:40px!important;line-height:40px!important;resize:none!important;overflow:hidden!important;}
    input:not([type="file"]):hover,textarea:hover,select:hover{border-color:rgba(47,111,87,.25)}
    input:not([type="file"]):focus,textarea:focus,select:focus{transform:none}

    /* Image polish */
    img{transition:filter .25s ease}
    .app-card img{backface-visibility:hidden}

    /* Modals */
    [role="dialog"] > div,.fixed.inset-0 > div{box-shadow:0 30px 100px rgba(0,0,0,.25)!important}

    /* Messenger premium treatment, while preserving its layout */
    .messenger-shell{
      background:
        radial-gradient(circle at 0% 0%,rgba(216,243,228,.75),transparent 24rem),
        radial-gradient(circle at 100% 12%,rgba(244,196,90,.13),transparent 22rem),
        #F5F5F0!important;
    }
    .messenger-theme-dark{
      background:
        radial-gradient(circle at 0% 0%,rgba(47,111,87,.20),transparent 25rem),
        radial-gradient(circle at 100% 10%,rgba(244,196,90,.06),transparent 20rem),
        #101612!important;
    }
    .messenger-list,.messenger-chat{
      border:1px solid rgba(47,111,87,.10)!important;
      box-shadow:var(--o2-shadow-soft)!important;
    }
    .messenger-search{border:1px solid rgba(47,111,87,.10)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 24px rgba(18,35,28,.05)}
    .messenger-chat-header{box-shadow:0 8px 24px rgba(18,35,28,.05)}
    .messenger-composer{box-shadow:0 -12px 30px rgba(18,35,28,.07)!important;border-top:1px solid rgba(47,111,87,.10)!important}
    .messenger-peer{transition:transform .18s ease,background .18s ease,box-shadow .18s ease!important;border-radius:16px!important}
    .messenger-peer:hover{transform:translateX(2px);box-shadow:0 8px 22px rgba(18,35,28,.06)}

    /* Status indicator */
    .oikko-status-pill{border:1px solid rgba(255,255,255,.10);box-shadow:0 12px 34px rgba(0,0,0,.20)!important}


    /* Mobile-first refinements */
    @media(max-width:768px){
      .app-topbar{box-shadow:0 8px 28px rgba(18,35,28,.18)!important}
      .app-card{border-radius:20px!important}
      .app-nav-item{border-radius:14px!important}
      body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5{padding-top:6px!important;padding-bottom:6px!important}
      body > #app > div > .w-full.px-3.sm\:px-6.py-1\.5 button{height:38px!important;border-radius:14px!important}
    }
    @media(min-width:769px){
      main{padding-top:26px}
    }
    @media(prefers-reduced-motion:reduce){
      .app-brand-mark:hover,.app-card:hover,.messenger-peer:hover{transform:none!important}
    }
  </style>

  <script>
  (() => {
    'use strict';

    // Preserve scroll position across the app's full re-render cycles.
    const originalRender = window.renderApp;
    if (typeof originalRender === 'function' && !window.__oikkoRenderPatched) {
      window.__oikkoRenderPatched = true;
      window.renderApp = function(...args) {
        const y = window.scrollY || 0;
        const result = originalRender.apply(this,args);
        requestAnimationFrame(() => {
          if (y > 0 && Math.abs((window.scrollY||0)-y) > 20) window.scrollTo({top:y,behavior:'instant'});
          enhanceIconsAndImages();
          updateConnectionUI();
        });
        return result;
      };
    }

    function enhanceIconsAndImages(){
      document.querySelectorAll('img').forEach(img => {
        if (img.dataset.oikkoFallbackBound) return;
        img.dataset.oikkoFallbackBound='1';
        img.addEventListener('error', () => {
          img.onerror=null;
          img.src='https://ui-avatars.com/api/?background=2f6f57&color=ffffff&name=Oikko&bold=true';
        });
      });
      try{ if(window.lucide) window.lucide.createIcons(); }catch(e){}
    }

    // Show download buttons only for desktop/PC users. Mobile users see no download control.
    const oikkoDesktopDownloadStyle = document.createElement('style');
    oikkoDesktopDownloadStyle.id = 'oikko-desktop-download-only-style';
    oikkoDesktopDownloadStyle.textContent = `
      #oikko-apk-download { display: none !important; }
      .oikko-header-download, .oikko-messenger-download { display: none !important; }
      .oikko-login-download, .oikko-tube-download { display: none !important; }
      .oikko-tube-back {
        background: rgba(47,111,87,.10);
        color: #2F6F57;
        border: 1px solid rgba(47,111,87,.18);
      }
      .oikko-tube-back:hover {
        background: rgba(47,111,87,.18);
      }
      @media (min-width: 768px) {
        .oikko-header-download, .oikko-messenger-download,
        .oikko-login-download, .oikko-tube-download { display: flex !important; }
      }
      @media (max-width: 767px) {
        .oikko-header-download, .oikko-messenger-download,
        .oikko-login-download, .oikko-tube-download { display: none !important; }
      }
      .dark .oikko-tube-back, body.dark .oikko-tube-back {
        background: rgba(216,243,228,.10);
        color: #D8F3E4;
        border-color: rgba(216,243,228,.18);
      }
    `;
    document.head.appendChild(oikkoDesktopDownloadStyle);

    function ensureUtilityUI(){
      if(!document.getElementById('oikko-status-pill')){
        const pill=document.createElement('div');
        pill.id='oikko-status-pill'; pill.className='oikko-status-pill';
        pill.innerHTML='<span class="oikko-status-dot"></span><span class="oikko-status-text">অনলাইন</span>';
        document.body.appendChild(pill);
      }
      if(!document.getElementById('oikko-backtop')){
        const btn=document.createElement('button');
        btn.id='oikko-backtop'; btn.className='oikko-backtop'; btn.type='button';
        btn.setAttribute('aria-label','উপরে যান');
        btn.innerHTML='<i data-lucide="arrow-up" class="w-5 h-5"></i>';
        btn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
        document.body.appendChild(btn);
      }
      try{if(window.lucide) window.lucide.createIcons();}catch(e){}
    }

    function updateConnectionUI(){
      ensureUtilityUI();
      const online=navigator.onLine;
      const pill=document.getElementById('oikko-status-pill');
      if(!pill)return;
      pill.classList.toggle('offline',!online);
      const text=pill.querySelector('.oikko-status-text');
      if(text) text.textContent=online?'অনলাইন':'অফলাইন মোড';
    }

    window.addEventListener('online',()=>{updateConnectionUI(); if(window.showToast)window.showToast('ইন্টারনেট সংযোগ ফিরে এসেছে','success');});
    window.addEventListener('offline',()=>{updateConnectionUI(); if(window.showToast)window.showToast('আপনি অফলাইন মোডে আছেন','info');});
    window.addEventListener('scroll',()=>{
      const btn=document.getElementById('oikko-backtop');
      if(btn) btn.classList.toggle('show',(window.scrollY||0)>500);
    },{passive:true});

    // Prevent accidental duplicate submit/clicks while asynchronous Firebase calls are in flight.
    document.addEventListener('click', e => {
      const btn=e.target.closest('button');
      if(!btn || btn.dataset.oikkoBusy || btn.disabled) return;
      const label=(btn.textContent||'').trim();
      if(/লগইন|রেজিস্ট্রেশন|পোস্ট করুন|সংরক্ষণ|আপডেট/.test(label)){
        btn.dataset.oikkoBusy='1';
        setTimeout(()=>delete btn.dataset.oikkoBusy,700);
      }
    },true);

    // Escape closes open modals/lightboxes when possible without disturbing normal forms.
    document.addEventListener('keydown', e => {
      if(e.key==='Escape'){
        const lightbox=document.getElementById('lightbox-container');
        const modal=document.getElementById('modal-container');
        if(lightbox && lightbox.innerHTML.trim()){lightbox.innerHTML=''; if(window.state)window.state.selectedMedia=null;}
        else if(modal && modal.innerHTML.trim()) modal.innerHTML='';
      }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
        e.preventDefault();
        const search=document.querySelector('.app-search input, input[placeholder*="খুঁজ"], input[type="search"]');
        if(search){search.focus();search.select();}
      }
    });

    window.addEventListener('error', ev => {
      console.warn('Oikko UI recovery:',ev.message);
      updateConnectionUI();
    });

    document.addEventListener('DOMContentLoaded',()=>{
      ensureUtilityUI(); updateConnectionUI(); enhanceIconsAndImages();
      setTimeout(enhanceIconsAndImages,500);
    });
  })();
  </script>

</body>
</html>
