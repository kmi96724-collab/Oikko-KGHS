    // --- Device Media File Helpers (Photo & Video) ---
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // --- অডিও নোটিফিকেশন সাউন্ড হেল্পার ---
    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn('AudioContext sound note:', e);
      }
    }

    // --- ডিভাইস নোটিফিকেশন পারমিশন ও পুশ সেন্ডার ---
    function requestNotificationPermission() {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              showToast('ডিভাইস নোটিফিকেশন সফলভাবে চালু করা হয়েছে!', 'success');
              playNotificationSound();
            }
          });

        }
      }
    }
    window.requestNotificationPermission = requestNotificationPermission;

    function sendDeviceNotification(title, options = {}) {
      // ১. মোবাইল ভাইব্রেশন
      if ('vibrate' in navigator) {
        try { navigator.vibrate([180, 80, 180]); } catch (e) {}
      }

      // ২. অডিও বেল সাউন্ড
      playNotificationSound();

      // ৩. ডিভাইসের আসল সিস্টেম নোটিফিকেশন (মোবাইল / ডেক্সটপ পপআপ)
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            const notif = new Notification(title, {
              body: options.body || '',
              icon: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              badge: options.icon || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
              silent: false,
              ...options
            });
            notif.onclick = function() {
              window.focus();
              this.close();
            };
          } catch (e) {
            console.warn('Native notification trigger error:', e);
          }
        } else if (Notification.permission === 'default') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') {
              try {
                new Notification(title, options);
              } catch (e) {}
            }
          });
        }
      }

      // ৪. ইন-অ্যাপ লাইভ টোস্ট অ্যালার্ট
      showToast(`🔔 ${title}: ${options.body || ''}`, 'info');
    }
    window.sendDeviceNotification = sendDeviceNotification;

    // --- 3.1 Firebase Firestore Realtime Synchronizer ---
    let isFirebaseSyncInitialized = false;
    window._prevPostCommentCount = window._prevPostCommentCount || {};

    function initFirebaseSync() {
      if (!window.firebaseDb || !window.fb || isFirebaseSyncInitialized) return;
      isFirebaseSyncInitialized = true;
      const db = window.firebaseDb;
      const { collection, onSnapshot, doc, setDoc } = window.fb;

      // ১. রিয়েল-টাইমে পোস্ট সিঙ্ক (সব মোবাইল ও ডিভাইসের জন্য)
      try {
        const postsCol = collection(db, 'posts');
        onSnapshot(postsCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudPosts = [];
            snapshot.forEach(docSnap => {
              const pData = { id: docSnap.id, ...docSnap.data() };
              cloudPosts.push(pData);

              // রিয়েল-টাইমে অন্য ডিভাইস থেকে নতুন কমেন্ট আসলে ডিভাইসে নোটিফিকেশন পাঠানো
              const currentComments = pData.comments || [];
              if (window._prevPostCommentCount[pData.id] !== undefined) {
                const prevCount = window._prevPostCommentCount[pData.id];
                if (currentComments.length > prevCount) {
                  const newestComment = currentComments[currentComments.length - 1];
                  // যদি পোস্টের লেখক স্বয়ং লগইন করা ইউজার হন এবং মন্তব্যকারী অন্য কেউ হন
                  if (state.currentUser && (pData.authorStudentId === state.currentUser.studentId || pData.authorId === state.currentUser.id)) {
                    if (newestComment.authorStudentId !== state.currentUser.studentId) {
                      sendDeviceNotification(`${newestComment.authorName} আপনার পোস্টে মন্তব্য করেছেন!`, {
                        body: `"${newestComment.content}"`,
                        icon: newestComment.authorAvatar
                      });
                    }
                  }
                }
              }
              window._prevPostCommentCount[pData.id] = currentComments.length;
            });

            // লেটেস্ট পোস্ট সবার আগে সাজানো
            cloudPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            state.posts = cloudPosts;
            savePosts(cloudPosts);
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ক্লাউড সম্পূর্ণ খালি থাকলে প্রাথমিক পোস্ট ক্লাউডে জমা করা
            INITIAL_POSTS.forEach(p => {
              setDoc(doc(db, 'posts', p.id), { ...p, timestamp: Date.now() }).catch(console.warn);
            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase posts onSnapshot note:', error);
          state.cloudStatus = 'offline';
          renderApp();
        });
      } catch (err) {
        console.warn('Posts listener exception:', err);
      }

      // ২. রিয়েল-টাইমে ইউজার ও ভেরিফিকেশন ডাটা সিঙ্ক
      try {
        const usersCol = collection(db, 'users');
        onSnapshot(usersCol, (snapshot) => {
          if (!snapshot.empty) {
            const cloudUsers = [];
            snapshot.forEach(docSnap => {
              cloudUsers.push({ id: docSnap.id, ...docSnap.data() });
            });
            
            // এডমিন প্রোফাইল নিশ্চিত করা
            const hasAdmin = cloudUsers.some(u => u.role === 'admin' || u.studentId === 'ADMIN001');
            if (!hasAdmin) {
              cloudUsers.unshift(ADMIN_DATA);
              setDoc(doc(db, 'users', ADMIN_DATA.id), ADMIN_DATA).catch(console.warn);
            }

            state.users = cloudUsers;
            saveUsers(cloudUsers);

            // কারেন্ট সেশন ইউজারের তথ্য আপডেট
            if (state.currentUser) {
              const fresh = cloudUsers.find(u => u.id === state.currentUser.id || u.studentId === state.currentUser.studentId);
              if (fresh) {
                state.currentUser = fresh;
                saveCurrentUser(fresh);
              }
            }
            state.cloudStatus = 'connected';
            renderApp();
          } else {
            // ইনিশিয়াল ইউজারদের ফায়ারবেসে সিঙ্ক করা
            INITIAL_USERS.forEach(u => {

            });
            state.cloudStatus = 'connected';
            renderApp();
          }
        }, (error) => {
          console.warn('Firebase users onSnapshot note:', error);
        });
      } catch (err) {
        console.warn('Users listener exception:', err);
      }
    }

    // --- 4. Toast Notification ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      const isError = type === 'error';
      const bg = isError ? 'bg-red-600' : isSuccess ? 'bg-[#5A5A40]' : 'bg-slate-800';
      
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

                onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80'"

                <input type="file" id="reg-avatar-file" accept="image/*" onchange="handleProfileAvatarFileSelect(event, 'reg')" class="hidden" />
                <button type="button" onclick="document.getElementById('reg-avatar-file').click()" class="px-3 py-1.5 bg-[#5A5A40] hover:bg-[#4A4A33] text-white text-xs font-bold rounded-xl transition-all shadow-xs flex items-center gap-1.5">

                  id="reg-profile-picture"
                  type="hidden"

    // --- NAVBAR ---
    function renderNavbar() {
      const u = state.currentUser;
      const isAdmin = u.role === 'admin';

              </div>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-lg text-white tracking-tight leading-none">Oikko</span>

                <span class="w-2 h-2 rounded-full ${state.cloudStatus === 'connected' ? 'bg-emerald-400 animate-pulse' : state.cloudStatus === 'connecting' ? 'bg-amber-400' : 'bg-rose-400'}"></span>
                <span class="hidden md:inline">${state.cloudStatus === 'connected' ? 'অনলাইন' : state.cloudStatus === 'connecting' ? 'সংযুক্ত হচ্ছে...' : 'অফলাইন'}</span>
              </div>

              ${isAdmin ? `
                <button onclick="switchView('${state.activeView === 'admin' ? 'feed' : 'admin'}')" class="px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${state.activeView === 'admin' ? 'bg-white text-red-600 shadow-xs' : 'bg-red-600 hover:bg-red-700 text-white'}">
                  <i data-lucide="shield-check" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">${state.activeView === 'admin' ? 'ফিডে যান' : 'এডমিন প্যানেল'}</span>

              <div class="flex items-center gap-2 bg-white/10 px-3 py-1 rounded-xl border border-white/20">

                <span class="text-xs font-bold text-white hidden sm:inline">${u.fullName}</span>
                ${u.isVerified ? getVerifiedBadgeHTML('sm') : ''}
              </div>

              <!-- Notification Bell Button -->
              <button onclick="requestNotificationPermission()" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-colors" title="ডিভাইস নোটিফিকেশন সক্রিয় করুন">

              <button onclick="handleLogout()" title="লগআউট" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-colors">

    // --- FEED VIEW ---
    function renderFeedView() {
      const u = state.currentUser;
      const verifiedStudents = state.users.filter(usr => usr.isVerified && usr.role !== 'admin');

      return `
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Sidebar -->
            <div class="hidden lg:block lg:col-span-4 space-y-5">
              <!-- Current User Identity Card -->
              <div class="bg-white rounded-2xl p-5 shadow-xs border border-[#E2E2D5]">
                <div class="text-center">
                  <div class="relative inline-block mx-auto mb-3">
                    <img src="${u.profilePicture}" class="w-20 h-20 rounded-2xl object-cover border-2 border-[#E2E2D5] shadow-xs" />
                    ${u.isVerified ? `<div class="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 shadow-xs">${getVerifiedBadgeHTML('md')}</div>` : ''}
                  </div>
                  <h3 class="font-bold text-base text-[#42422F] flex items-center justify-center gap-1.5">
                    <span>${u.fullName}</span>
                    ${u.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                  </h3>
                  <div class="mt-1 flex items-center justify-center gap-1.5 font-mono text-xs text-[#5A5A40]">
                    <span class="bg-[#F5F5F0] px-2 py-0.5 rounded-lg border border-[#E2E2D5] font-semibold">ID: ${u.studentId}</span>
                  </div>
                  <p class="text-xs text-[#8A8A6A] mt-1">${u.studentClass} • রোল #${u.roll}</p>

                  <div class="mt-4 pt-4 border-t border-[#F0F0E0] flex items-center justify-around text-xs">
                    <div>
                      <span class="text-[#8A8A6A] block text-[11px]">শাখা</span>
                      <span class="font-semibold text-[#42422F]">${u.section}</span>
                    </div>
                    <div class="border-r border-[#E2E2D5] h-6"></div>
                    <div>
                      <span class="text-[#8A8A6A] block text-[11px]">শিফট</span>
                      <span class="font-semibold text-[#42422F]">${u.shift}</span>
                    </div>
                    <div class="border-r border-[#E2E2D5] h-6"></div>
                    <div>
                      <span class="text-[#8A8A6A] block text-[11px]">রক্তের গ্রুপ</span>
                      <span class="font-semibold text-rose-600">${u.bloodGroup || 'O+'}</span>
                    </div>
                  </div>

                  <div class="mt-4 flex gap-2">
                    <button onclick="openProfileModal('${u.id}')" class="flex-1 py-2 px-2 bg-[#F5F5F0] hover:bg-[#E2E2D5] text-[#5A5A40] text-xs font-bold rounded-xl transition-colors border border-[#E2E2D5] flex items-center justify-center gap-1.5">
                      <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                      <span>প্রোফাইল</span>
                    </button>
                    <button onclick="openEditProfileModal('${u.id}')" class="flex-1 py-2 px-2 bg-[#5A5A40] hover:bg-[#4A4A33] text-white text-xs font-bold rounded-xl transition-colors shadow-xs flex items-center justify-center gap-1.5">
                      <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                      <span>তথ্য পরিবর্তন</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Verified Students Widget -->
              <div class="bg-white rounded-2xl p-5 shadow-xs border border-[#E2E2D5]">
                <div class="flex items-center gap-2 mb-3">
                  <div class="p-1.5 rounded-lg bg-[#F5F5F0] text-[#5A5A40]">
                    <i data-lucide="award" class="w-4 h-4"></i>
                  </div>
                  <h4 class="font-bold text-xs sm:text-sm text-[#42422F]">ভেরিফাইড শিক্ষার্থী</h4>
                </div>
                <div class="space-y-2.5">
                  ${verifiedStudents.length === 0 ? '<p class="text-xs text-[#8A8A6A]">কোনো শিক্ষার্থী এখনো ভেরিফাইড হয়নি।</p>' : 
                    verifiedStudents.slice(0, 4).map(stu => `
                      <div onclick="openProfileModal('${stu.id}')" class="flex items-center justify-between p-2 rounded-xl hover:bg-[#F9F9F4] cursor-pointer transition-colors">
                        <div class="flex items-center gap-2">
                          <img src="${stu.profilePicture}" class="w-8 h-8 rounded-full object-cover border border-[#E2E2D5]" />
                          <div>
                            <div class="font-semibold text-xs text-[#42422F] flex items-center gap-1">
                              <span>${stu.fullName}</span>
                              ${getVerifiedBadgeHTML('sm')}
                            </div>
                            <span class="text-[10px] font-mono text-[#8A8A6A]">ID: ${stu.studentId}</span>
                          </div>
                        </div>
                        <span class="text-[10px] font-semibold text-[#5A5A40] bg-[#F5F5F0] px-2 py-0.5 rounded">${stu.studentClass}</span>
                      </div>
                    `).join('')}
                </div>
              </div>
            </div>

            <!-- Right Feed Content -->
            <div class="lg:col-span-8 space-y-5">
              
              <!-- Post Creator Box -->
              <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-xs border border-[#E2E2D5]">
                <form onsubmit="handleCreatePost(event)">
                  <div class="flex gap-3">
                    <img src="${u.profilePicture}" class="w-10 h-10 rounded-full object-cover border border-[#E2E2D5] shrink-0" />
                    <div class="flex-1">
                      <textarea id="new-post-content" rows="3" placeholder="ক্যাম্পাসের স্মৃতি, পড়াশোনার প্রশ্ন বা যেকোনো তথ্য লিখুন..." class="w-full p-3 rounded-xl bg-[#F5F5F0] border border-[#E2E2D5] text-[#42422F] placeholder-[#8A8A6A] text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-[#5A5A40] focus:bg-white resize-none"></textarea>
                    </div>
                  </div>

                  <!-- Device Media File Input (Hidden) -->
                  <input type="file" id="post-media-file" accept="image/*,video/*" onchange="handleMediaFileSelect(event)" class="hidden" />

                  <!-- Selected Media Preview Container -->
                  <div id="post-media-preview-container" class="mt-3 ${state.selectedMedia ? '' : 'hidden'}">
                    ${renderMediaPreviewHTML()}
                  </div>

                  <div class="mt-3 pt-3 border-t border-[#F0F0E0] flex items-center justify-between flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                      <button type="button" onclick="document.getElementById('post-media-file').click()" class="flex items-center gap-1.5 text-xs text-[#5A5A40] hover:text-[#42422F] font-bold px-3 py-1.5 rounded-xl bg-[#F5F5F0] hover:bg-[#EAEAE0] transition-colors border border-[#E2E2D5]">
                        <i data-lucide="paperclip" class="w-4 h-4 text-[#5A5A40]"></i>
                        <span>আপলোড</span>
                      </button>
                    </div>

                    <button type="submit" class="px-5 py-2 rounded-xl text-white text-xs sm:text-sm font-bold bg-[#5A5A40] hover:bg-[#4A4A33] shadow-xs flex items-center gap-1.5 transition-all">
                      <i data-lucide="send" class="w-3.5 h-3.5"></i>
                      <span>পোস্ট করুন</span>
                    </button>
                  </div>
                </form>
              </div>

              <!-- Posts List Header -->
              <div class="flex items-center justify-between px-1">
                <h3 class="text-xs sm:text-sm font-bold text-[#42422F] flex items-center gap-2">
                  <i data-lucide="book-open" class="w-4 h-4 text-[#5A5A40]"></i>
                  <span>পোস্ট</span>
                </h3>
                <span class="text-[11px] text-[#8A8A6A]">সর্বশেষ পোস্ট আগে</span>
              </div>

              <!-- Posts Feed -->
              <div class="space-y-4">
                ${state.posts.length === 0 ? `
                  <div class="bg-white rounded-2xl p-12 text-center border border-[#E2E2D5]">
                    <i data-lucide="megaphone" class="w-10 h-10 text-[#8A8A6A] mx-auto mb-3 opacity-60"></i>
                    <h4 class="text-base font-bold text-[#42422F]">এখনো কোনো পোস্ট করা হয়নি</h4>
                    <p class="text-xs text-[#8A8A6A] mt-1 max-w-sm mx-auto">প্রথম পোস্ট হিসেবে ক্যাম্পাস নিয়ে কিছু শেয়ার করুন!</p>
                  </div>
                ` : state.posts.map(post => renderPostCard(post)).join('')}
              </div>

            </div>

          </div>
        </main>
      `;
    }

    // --- POST CARD ---
    function renderPostCard(post) {
      const u = state.currentUser;
      const isAuthor = post.authorStudentId === u.studentId;
      const isAdmin = u.role === 'admin';
      const canDelete = isAuthor || isAdmin;
      const isLiked = (post.likes || []).includes(u.studentId);
      const authorIdentifier = post.authorStudentId || post.authorId;

      // শুধুমাত্র ভেরিফাইড হলে বা এডমিন হলে ব্লু ব্যাজ প্রদর্শিত হবে
      const authorUser = state.users.find(usr => 
        (usr.studentId && usr.studentId === post.authorStudentId) || 
        (usr.id && usr.id === post.authorId)
      );
      const isAuthorVerified = (authorUser && Boolean(authorUser.isVerified)) || (post.authorStudentId === 'ADMIN001');

      return `
        <div class="bg-white rounded-2xl shadow-xs border border-[#E2E2D5] overflow-hidden transition-all">
          <div class="p-4 sm:p-5">
            <!-- Header -->
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3 cursor-pointer group" onclick="openProfileModal('${authorIdentifier}')" title="${post.authorName}-এর প্রোফাইল দেখুন">
                <img src="${post.authorAvatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200'}" class="w-10 h-10 rounded-full object-cover border border-[#E2E2D5] group-hover:ring-2 group-hover:ring-[#5A5A40] transition-all" />
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xs sm:text-sm text-[#42422F] group-hover:text-[#5A5A40] group-hover:underline">${post.authorName}</span>
                    ${isAuthorVerified ? getVerifiedBadgeHTML('sm') : ''}
                  </div>
                  <div class="flex items-center gap-2 text-[11px] text-[#8A8A6A]">
                    <span class="font-mono bg-[#F5F5F0] px-1.5 py-0.2 rounded border border-[#E2E2D5]">ID: ${post.authorStudentId}</span>
                    <span>•</span>
                    <span>${post.createdAt}</span>
                  </div>
                </div>
              </div>

              ${canDelete ? `
                <button onclick="handleDeletePost('${post.id}')" title="পোস্ট ডিলিট করুন" class="p-1.5 text-[#8A8A6A] hover:text-red-600 rounded-lg hover:bg-red-50 transition-colors">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              ` : ''}
            </div>

            <!-- Content Body -->
            ${post.content ? `<p class="text-xs sm:text-sm text-[#42422F] whitespace-pre-line leading-relaxed mb-3">${post.content}</p>` : ''}

            <!-- Video or Image Media from Device -->
            ${(post.videoUrl || post.mediaType === 'video') ? `
              <div class="rounded-xl overflow-hidden mb-3 border border-[#E2E2D5] bg-black">
                <video src="${post.videoUrl || post.imageUrl}" controls playsinline class="w-full max-h-96 object-contain"></video>
              </div>
            ` : (post.imageUrl || post.mediaType === 'image') ? `
              <div class="rounded-xl overflow-hidden mb-3 border border-[#E2E2D5]">
                <img src="${post.imageUrl}" class="w-full max-h-96 object-cover" />
              </div>
            ` : ''}

            <!-- Post Reactions Bar -->
            <div class="pt-3 border-t border-[#F0F0E0] flex items-center justify-between text-xs">
              <div class="flex items-center gap-3">
                <button onclick="handleToggleLike('${post.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-colors font-semibold ${isLiked ? 'text-blue-600 bg-blue-50' : 'text-[#8A8A6A] hover:bg-[#F5F5F0]' }">
                  <i data-lucide="thumbs-up" class="w-4 h-4 ${isLiked ? 'fill-blue-600' : ''}"></i>
                  <span>${(post.likes || []).length} পছন্দ</span>
                </button>
                <button type="button" onclick="toggleAllComments('${post.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-colors font-semibold text-[#8A8A6A] hover:bg-[#F5F5F0] hover:text-[#42422F]" title="মন্তব্য দেখতে বা সংক্ষেপ করতে ক্লিক করুন">
                  <i data-lucide="message-square" class="w-4 h-4"></i>
                  <span>${(post.comments || []).length} মন্তব্য ${(post.comments || []).length > 1 ? (state.expandedComments[post.id] ? '(সংক্ষেপ)' : '(সকল দেখুন)') : ''}</span>
                </button>
              </div>
            </div>

            <!-- Comments & Replies Section -->
            <div class="mt-3 pt-3 border-t border-[#F0F0E0] space-y-3">
              ${(() => {
                const allComments = post.comments || [];
                if (allComments.length === 0) {
                  return '<p class="text-xs text-[#8A8A6A] py-1 text-center">এখনো কোনো মন্তব্য নেই। প্রথম মন্তব্যটি আপনি করুন!</p>';
                }

                const isExpanded = Boolean(state.expandedComments[post.id]);

                              return `

                                  <img onclick="openProfileModal('${replyAuthorId}')" src="${r.authorAvatar}" class="w-5 h-5 rounded-full object-cover border border-[#E2E2D5] mt-0.5 cursor-pointer shrink-0" />
                                  <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between gap-1">
                                      <span onclick="openProfileModal('${replyAuthorId}')" class="font-bold text-[#42422F] text-[11px] cursor-pointer hover:underline flex items-center gap-1 truncate">
                                        <span>${r.authorName}</span>
                                        ${isReplyVerified ? getVerifiedBadgeHTML('sm') : ''}

                                    <p class="text-[#42422F] text-[11px] mt-0.5 break-words">${r.content}</p>
                                    <div class="mt-1 flex items-center gap-2">

                                    </div>

                        <!-- Reply Input Box (Toggled) -->
                        <div id="reply-box-${c.id}" class="hidden mt-2.5 pt-2 border-t border-[#EAEAE0]">

                    </div>

                let toggleButtonHTML = '';
                if (!isExpanded && hiddenCount > 0) {
                  toggleButtonHTML = `
                  `;
                } else if (isExpanded && allComments.length > 1) {
                  toggleButtonHTML = `
                  `;
                }

                return commentsHTML + toggleButtonHTML;
              })()}

              <!-- Add Comment Input Form -->
              <form onsubmit="handleAddComment(event, '${post.id}')" class="flex items-center gap-2 mt-2">

                </button>
              </form>
            </div>

          </div>
        </div>
      `;
    }

    // --- ADMIN VIEW ---
    function renderAdminView() {
      const students = state.users.filter(u => u.role !== 'admin');
      const filtered = students.filter(s => {
        if (!state.searchQuery) return true;
        const q = state.searchQuery.toLowerCase();
        return s.fullName.toLowerCase().includes(q) ||
               s.studentId.toLowerCase().includes(q) ||
               s.roll.toLowerCase().includes(q) ||
               s.studentClass.toLowerCase().includes(q);
      });

      const totalStudents = students.length;
      const verifiedCount = students.filter(s => s.isVerified).length;
      const pendingCount = totalStudents - verifiedCount;

      return `
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

                <input id="admin-search" oninput="handleAdminSearch(this.value)" value="${state.searchQuery}" placeholder="নাম বা আইডি দিয়ে খুঁজুন..." class="w-full pl-9 pr-3 py-1.5 bg-[#F5F5F0] border border-[#E2E2D5] rounded-xl text-xs text-[#42422F] focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#5A5A40]" />
              </div>

            <!-- Table -->
            <div class="overflow-x-auto">

                <thead class="bg-[#F9F9F4] text-[#8A8A6A] uppercase font-bold text-[11px] border-b border-[#F0F0E0]">

                        <button onclick="handleToggleVerify('${s.id}')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-colors ${s.isVerified ? 'bg-amber-50 text-amber-700 hover:bg-amber-100' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}">

                          এডিট

                </tbody>
              </table>
            </div>

          </div>

        </main>
      `;
    }

    // --- STUDENT PROFILE MODAL ---
    function openProfileModal(identifier) {
      if (!identifier) return;
      const cleanId = String(identifier).trim().toLowerCase();
      const user = state.users.find(u => 
        (u.id && u.id.toLowerCase() === cleanId) || 
        (u.studentId && u.studentId.toLowerCase() === cleanId)
      );
      if (!user) {
        showToast('শিক্ষার্থীর প্রোফাইল তথ্য পাওয়া যায়নি', 'error');
        return;
      }

      const isViewerAuthorized = state.currentUser && (
        state.currentUser.role === 'admin' ||
        state.currentUser.id === user.id ||
        state.currentUser.studentId === user.studentId
      );

      const maskPhone = (phone) => {
        if (!phone) return 'দেওয়া হয়নি';
        if (isViewerAuthorized) return phone;
        if (phone.length <= 5) return '••••••';
        return phone.slice(0, 3) + '••••••' + phone.slice(-2);
      };

      const maskEmail = (email) => {
        if (!email) return 'দেওয়া হয়নি';
        if (isViewerAuthorized) return email;
        const parts = email.split('@');
        if (parts.length < 2) return '••••••';
        return parts[0].slice(0, 2) + '••••@' + parts[1];
      };

      const modalContainer = document.getElementById('modal-container');

      modalContainer.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
          <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-[#E2E2D5] overflow-hidden animate-in fade-in zoom-in-95 duration-200">

              <div class="flex items-center gap-3">

                  <h3 class="font-bold text-base flex items-center gap-1.5">
                    <span>${user.fullName}</span>
                    ${user.isVerified ? getVerifiedBadgeHTML('sm') : ''}
                  </h3>
                  <span class="text-xs text-[#D1D1C2] font-mono">ID: ${user.studentId} • ${user.studentClass}</span>
                </div>
              </div>
              <button onclick="closeProfileModal()" class="p-1 rounded-lg hover:bg-white/20 text-white transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Modal Content -->
            <div class="p-5 max-h-[75vh] overflow-y-auto space-y-4 text-xs text-[#42422F]">
              
              <!-- Privacy Note Banner if unauthorized viewer -->
              ${!isViewerAuthorized ? `
                <div class="p-3 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-xl flex items-center gap-2">
                  <i data-lucide="shield-check" class="w-4 h-4 text-amber-600 shrink-0"></i>
                  <span>ব্যক্তিগত গোপনীয়তার স্বার্থে মোবাইল নম্বর, জন্ম নিবন্ধন ও ঠিকানার বিবরণ আড়াল করে রাখা হয়েছে।</span>
                </div>
              ` : ''}

              <!-- Academic Info -->
              <div class="bg-[#F9F9F4] p-3.5 rounded-xl border border-[#F0F0E0]">
                <h4 class="font-bold text-[#5A5A40] mb-2 uppercase text-[11px] tracking-wider">শিক্ষা সংক্রান্ত তথ্য</h4>
                <div class="grid grid-cols-2 gap-2">
                  <div><span class="text-[#8A8A6A]">শ্রেণি:</span> <strong>${user.studentClass}</strong></div>
                  <div><span class="text-[#8A8A6A]">রোল:</span> <strong>${user.roll}</strong></div>
                  <div><span class="text-[#8A8A6A]">শাখা:</span> <strong>${user.section}</strong></div>
                  <div><span class="text-[#8A8A6A]">শিফট:</span> <strong>${user.shift}</strong></div>
                </div>
              </div>

                <div class="grid grid-cols-2 gap-2">
                  <div><span class="text-[#8A8A6A]">পিতার নাম:</span> <strong>${isViewerAuthorized ? (user.fatherName || 'প্রযোজ্য নয়') : 'সুরক্ষিত / আড়ালকৃত'}</strong></div>
                  <div><span class="text-[#8A8A6A]">মাতার নাম:</span> <strong>${isViewerAuthorized ? (user.motherName || 'প্রযোজ্য নয়') : 'সুরক্ষিত / আড়ালকৃত'}</strong></div>

                </div>

                  <div><span class="text-[#8A8A6A]">স্থায়ী ঠিকানা:</span> ${isViewerAuthorized ? (user.permanentAddress || 'দেওয়া হয়নি') : 'নিরাপত্তার স্বার্থে আড়ালকৃত'}</div>
                </div>
              </div>

              <!-- Contact Info -->

    function handleUpdateProfile(e, userId) {
      e.preventDefault();
      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      const newPic = document.getElementById('edit-profile-picture').value.trim();
      const newName = document.getElementById('edit-name').value.trim();
      const newFather = document.getElementById('edit-father').value.trim();
      const newMother = document.getElementById('edit-mother').value.trim();
      const newClass = document.getElementById('edit-class').value;
      const newRoll = document.getElementById('edit-roll').value.trim();
      const newSection = document.getElementById('edit-section').value.trim();
      const newShift = document.getElementById('edit-shift').value;
      const newDob = document.getElementById('edit-dob').value;
      const newBlood = document.getElementById('edit-blood').value;
      const newReligion = document.getElementById('edit-religion').value;
      const newBirthReg = document.getElementById('edit-birth-reg').value.trim();
      const newPresent = document.getElementById('edit-present').value.trim();
      const newPermanent = document.getElementById('edit-permanent').value.trim();
      const newMobile = document.getElementById('edit-mobile').value.trim();
      const newEmail = document.getElementById('edit-email').value.trim();
      const newFb = document.getElementById('edit-fb').value.trim();
      const newPass = document.getElementById('edit-password').value.trim();

      user.fullName = newName;
      if (newPic) user.profilePicture = newPic;
      user.fatherName = newFather;
      user.motherName = newMother;
      user.studentClass = newClass;
      user.roll = newRoll;
      user.section = newSection;
      user.shift = newShift;
      user.dateOfBirth = newDob;
      user.bloodGroup = newBlood;
      user.religion = newReligion;
      user.birthRegistrationNumber = newBirthReg;
      user.presentAddress = newPresent;
      user.permanentAddress = newPermanent;
      user.mobileNumber = newMobile;
      user.email = newEmail;
      user.facebookLink = newFb;
      if (newPass) {
        user.password = newPass;
      }

      // Update author details on all existing posts & comments by this user
      state.posts.forEach(p => {
        if (p.authorId === user.id || p.authorStudentId === user.studentId) {
          p.authorName = user.fullName;
          p.authorAvatar = user.profilePicture;
        }
        if (p.comments) {
          p.comments.forEach(c => {
            if (c.authorId === user.id || c.authorStudentId === user.studentId) {
              c.authorName = user.fullName;
              c.authorAvatar = user.profilePicture;
            }
          });
        }
      });

      // Update current session user if editing own profile
      if (state.currentUser.id === user.id) {
        state.currentUser = { ...user };
        saveCurrentUser(state.currentUser);
      }

      saveUsers(state.users);
      savePosts(state.posts);

      closeProfileModal();
      showToast('আপনার তথ্য সফলভাবে পরিবর্তন ও সংরক্ষণ করা হয়েছে!', 'success');
      renderApp();

      // Sync updated user to Cloud Firestore
      if (window.firebaseDb && window.fb) {
        window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.id), user, { merge: true }).catch(console.warn);
      }
    }

    function setAuthTab(tab) {

    function handleUserLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-user-id');
      const mobileInput = document.getElementById('login-user-mobile');
      const passInput = document.getElementById('login-user-password');

      const id = idInput ? idInput.value.trim() : '';
      const mobile = mobileInput ? mobileInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!id || !pass) {
        state.authError = 'স্টুডেন্ট আইডি ও পাসওয়ার্ড পূরণ করুন!';
        renderApp();
        return;
      }

      const cleanId = id.toUpperCase();

      const user = state.users.find(u => {
        const idMatches = u.studentId.toUpperCase() === cleanId || u.mobileNumber === id;
        const mobileMatches = !mobile || u.mobileNumber === mobile;
        const passMatches = u.password === pass;
        return idMatches && mobileMatches && passMatches;
      });

      if (!user) {
        state.authError = 'স্টুডেন্ট আইডি, মোবাইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      state.currentUser = user;
      saveCurrentUser(user);
      state.activeView = user.role === 'admin' ? 'admin' : 'feed';
      showToast(user.role === 'admin' ? 'এডমিন হিসেবে স্বাগতম!' : `${user.fullName}, শিক্ষার্থী পোর্টালে স্বাগতম!`, 'success');
      renderApp();
      requestNotificationPermission();
    }

    function handleAdminLoginSubmit(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('login-admin-id');
      const passInput = document.getElementById('login-admin-password');

      const idOrEmail = idInput ? idInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!idOrEmail || !pass) {
        state.authError = 'এডমিন আইডি/ইমেইল ও পাসওয়ার্ড প্রদান করুন!';
        renderApp();
        return;
      }

      const cleanInput = idOrEmail.toLowerCase();
      const cleanId = idOrEmail.toUpperCase();

      const admin = state.users.find(u => {
        const isAdmin = u.role === 'admin' || u.studentId === 'ADMIN001' || u.email === 'kmi96724@gmail.com';
        const identifierMatches = (
          u.studentId.toUpperCase() === cleanId ||
          (u.email && u.email.toLowerCase() === cleanInput) ||
          u.mobileNumber === idOrEmail
        );
        const passMatches = u.password === pass;
        return isAdmin && identifierMatches && passMatches;
      });

      if (!admin) {
        state.authError = 'এডমিন আইডি/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়!';
        renderApp();
        return;
      }

      state.currentUser = admin;
      saveCurrentUser(admin);
      state.activeView = 'admin';
      showToast('প্রধান এডমিন হিসেবে স্বাগতম!', 'success');
      renderApp();
      requestNotificationPermission();
    }

    // Fallback legacy handler
    function handleLoginSubmit(e) {
      if (state.authMode === 'admin_login') {
        handleAdminLoginSubmit(e);
      } else {
        handleUserLoginSubmit(e);

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const password = document.getElementById('reg-pass').value;
      const confirmPassword = document.getElementById('reg-confirm-pass').value;

      if (password !== confirmPassword) {
        state.authError = 'দুইটি পাসওয়ার্ড মিলছে না!';
        renderApp();
        return;
      }

      const newId = document.getElementById('reg-student-id').value.trim().toUpperCase();
      if (state.users.some(u => u.studentId.toUpperCase() === newId)) {
        state.authError = 'এই স্টুডেন্ট আইডি দিয়ে ইতিমধ্যে অ্যাকাউন্ট তৈরি করা আছে!';
        renderApp();
        return;
      }

      const picInput = document.getElementById('reg-profile-picture');
      const profilePicUrl = (picInput && picInput.value.trim()) 
        ? picInput.value.trim() 
        : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80';

      const newUser = {
        id: 'user_' + Date.now(),
        studentId: newId,
        fullName: document.getElementById('reg-name').value.trim(),
        fatherName: document.getElementById('reg-father').value.trim(),
        motherName: document.getElementById('reg-mother').value.trim(),
        studentClass: document.getElementById('reg-class').value,
        roll: document.getElementById('reg-roll').value.trim(),
        section: document.getElementById('reg-section').value.trim(),
        shift: document.getElementById('reg-shift').value,
        birthRegistrationNumber: document.getElementById('reg-birth-reg').value.trim(),
        dateOfBirth: document.getElementById('reg-dob').value,
        bloodGroup: document.getElementById('reg-blood').value,
        religion: document.getElementById('reg-religion').value,
        presentAddress: document.getElementById('reg-present').value.trim(),
        permanentAddress: document.getElementById('reg-permanent').value.trim(),
        mobileNumber: document.getElementById('reg-mobile').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        facebookLink: document.getElementById('reg-fb').value.trim(),
        password: password,
        profilePicture: profilePicUrl,
        isVerified: false,
        role: 'student',
        createdAt: new Date().toISOString()
      };

      state.users.push(newUser);
      saveUsers(state.users);
      state.currentUser = newUser;
      saveCurrentUser(newUser);
      state.activeView = 'feed';
      showToast('রেজিস্ট্রেশন সফল হয়েছে!', 'success');
      renderApp();

      // Save user to Cloud Firestore in Realtime
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', newUser.id), newUser);
          showToast('একাউন্ট ক্লাউডে সফলভাবে যুক্ত হয়েছে!', 'success');
        } catch (err) {
          console.warn('Firebase registration sync note:', err);
        }
      }
    }

    // --- Profile Avatar Device Upload Handler ---
    async function handleProfileAvatarFileSelect(e, mode) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে শুধুমাত্র ছবি ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast('প্রোফাইল ছবি প্রসেস করা হচ্ছে...', 'info');
      try {
        const compressedDataUrl = await compressImage(file, 400, 400, 0.85);
        if (mode === 'reg') {
          const preview = document.getElementById('reg-avatar-preview');
          const input = document.getElementById('reg-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        } else if (mode === 'edit') {
          const preview = document.getElementById('edit-avatar-preview');
          const input = document.getElementById('edit-profile-picture');
          if (preview) preview.src = compressedDataUrl;
          if (input) input.value = compressedDataUrl;
        }
        showToast('ডিভাইস থেকে প্রোফাইল ছবি যুক্ত হয়েছে!', 'success');
      } catch (err) {
        console.error('Avatar error:', err);
        showToast('ছবি লোড করা যায়নি', 'error');
      }
    }

    // --- Post Media Upload from Device (Image & Video) ---
    async function handleMediaFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');

      if (!isImage && !isVideo) {
        showToast('অনুগ্রহ করে ছবি অথবা ভিডিও ফাইল নির্বাচন করুন', 'error');
        return;
      }

      showToast(`${isImage ? 'ছবি' : 'ভিডিও'} প্রসেস করা হচ্ছে...`, 'info');

      try {
        if (isImage) {
          const dataUrl = await compressImage(file, 1200, 1200, 0.82);
          state.selectedMedia = {
            type: 'image',
            url: dataUrl,
            name: file.name
          };
        } else {
          // ভিডিও সাইজ চেক (২০MB লিমিট)
          if (file.size > 20 * 1024 * 1024) {
            showToast('ভিডিও ফাইলের সাইজ ২০MB এর চেয়ে কম হতে হবে!', 'error');
            return;
          }
          const dataUrl = await readFileAsDataURL(file);
          state.selectedMedia = {
            type: 'video',
            url: dataUrl,
            name: file.name
          };
        }

        showToast(`${isImage ? 'ছবি' : 'ভিডিও'} সফলভাবে নির্বাচন করা হয়েছে!`, 'success');
        updateMediaPreviewUI();
      } catch (err) {
        console.error('File load error:', err);
        showToast('ফাইল লোড করতে সমস্যা হয়েছে', 'error');
      }
    }

    function clearSelectedMedia() {
      state.selectedMedia = null;
      const fileInput = document.getElementById('post-media-file');
      if (fileInput) fileInput.value = '';
      updateMediaPreviewUI();
    }

    function renderMediaPreviewHTML() {
      if (!state.selectedMedia) return '';
      const m = state.selectedMedia;
      if (m.type === 'image') {
        return `
          <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] bg-[#F5F5F0] p-2 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
              <img src="${m.url}" class="w-14 h-14 rounded-lg object-cover border border-[#E2E2D5] shrink-0" />
              <div class="overflow-hidden">
                <span class="text-xs font-bold text-[#42422F] block truncate">${m.name}</span>
                <span class="text-[11px] text-emerald-600 font-semibold flex items-center gap-1">
                  <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> ছবি যুক্ত করা হয়েছে
                </span>
              </div>
            </div>
            <button type="button" onclick="clearSelectedMedia()" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold transition-colors flex items-center gap-1" title="মুছে ফেলুন">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
              <span>বাতিল</span>
            </button>
          </div>
        `;
      } else {
        return `
          <div class="relative rounded-xl overflow-hidden border border-[#E2E2D5] bg-[#F5F5F0] p-2 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
              <div class="w-14 h-14 rounded-lg bg-black flex items-center justify-center border border-[#E2E2D5] shrink-0">
                <i data-lucide="video" class="w-6 h-6 text-white"></i>
              </div>
              <div class="overflow-hidden">
                <span class="text-xs font-bold text-[#42422F] block truncate">${m.name}</span>
                <span class="text-[11px] text-emerald-600 font-semibold flex items-center gap-1">
                  <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> ভিডিও যুক্ত করা হয়েছে
                </span>
              </div>
            </div>
            <button type="button" onclick="clearSelectedMedia()" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold transition-colors flex items-center gap-1" title="মুছে ফেলুন">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
              <span>বাতিল</span>
            </button>
          </div>
        `;
      }
    }

    function updateMediaPreviewUI() {
      const previewContainer = document.getElementById('post-media-preview-container');
      if (!previewContainer) return;

      if (!state.selectedMedia) {
        previewContainer.innerHTML = '';
        previewContainer.classList.add('hidden');
      } else {
        previewContainer.innerHTML = renderMediaPreviewHTML();
        previewContainer.classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
      }
    }

    function handleLogout() {
      state.currentUser = null;
      saveCurrentUser(null);
      state.authMode = 'user_login';
      showToast('লগআউট সম্পন্ন হয়েছে', 'info');
      renderApp();
    }

    function switchView(v) {
      state.activeView = v;
      renderApp();
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const content = document.getElementById('new-post-content').value.trim();
      const media = state.selectedMedia;

      if (!content && !media) {
        showToast('অনুগ্রহ করে কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন', 'error');
        return;
      }

      const dateStr = new Date().toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
      const newPost = {
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: content,
        mediaType: media ? media.type : null,
        imageUrl: (media && media.type === 'image') ? media.url : '',
        videoUrl: (media && media.type === 'video') ? media.url : '',
        likes: [],
        comments: [],
        createdAt: dateStr,
        timestamp: Date.now()
      };

      document.getElementById('new-post-content').value = '';
      state.selectedMedia = null;
      const fileInput = document.getElementById('post-media-file');
      if (fileInput) fileInput.value = '';

      // Save directly to Firebase Firestore for all mobiles & devices
      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'posts'), newPost);
          showToast('নতুন পোস্ট রিয়েল-টাইমে ক্লাউডে শেয়ার হয়েছে!', 'success');
        } catch (err) {
          console.error('Firestore addDoc error:', err);
          state.posts.unshift({ id: 'post_' + Date.now(), ...newPost });
          savePosts(state.posts);
          showToast('পোস্ট হয়েছে (লোকাল মেমোরি)। ফায়ারবেস রুলস চেক করুন!', 'error');
          renderApp();
        }
      } else {
        state.posts.unshift({ id: 'post_' + Date.now(), ...newPost });
        savePosts(state.posts);
        showToast('নতুন পোস্ট প্রকাশিত হয়েছে!', 'success');
        renderApp();
      }
    }

    async function handleDeletePost(postId) {
      if (!confirm('আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?')) return;
      state.posts = state.posts.filter(p => p.id !== postId);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'posts', postId));
          showToast('পোস্ট ক্লাউড থেকে মুছে ফেলা হয়েছে', 'info');
        } catch (err) {
          console.warn('Delete post error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
        showToast('পোস্ট মুছে ফেলা হয়েছে', 'info');
      }
    }

    async function handleToggleLike(postId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const updatedLikes = [...(post.likes || [])];
      const idx = updatedLikes.indexOf(u.studentId);
      if (idx === -1) updatedLikes.push(u.studentId);
      else updatedLikes.splice(idx, 1);

      post.likes = updatedLikes;
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            likes: updatedLikes
          });
        } catch (err) {
          console.warn('Like sync error:', err);
          savePosts(state.posts);
        }
      } else {
        savePosts(state.posts);
      }
    }

    // --- কমেন্ট লাইক সিস্টেম ---
    async function handleToggleCommentLike(postId, commentId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment) return;

      if (!comment.likes) comment.likes = [];
      const idx = comment.likes.indexOf(u.studentId);
      if (idx === -1) {
        comment.likes.push(u.studentId);
      } else {
        comment.likes.splice(idx, 1);
      }

      savePosts(state.posts);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
        } catch (err) {
          console.warn('Comment like sync error:', err);
        }
      }
    }

    // --- কমেন্ট রিপ্লাই বক্স টগল ---
    function toggleReplyInput(commentId) {
      const box = document.getElementById('reply-box-' + commentId);
      if (!box) return;
      const isHidden = box.classList.contains('hidden');
      box.classList.toggle('hidden', !isHidden);
      if (isHidden) {
        const input = document.getElementById('reply-input-' + commentId);
        if (input) setTimeout(() => input.focus(), 50);
      }
    }

    // --- কমেন্ট এ রিপ্লাই যোগ করা ---
    async function handleAddReply(e, postId, commentId) {
      e.preventDefault();
      const input = document.getElementById('reply-input-' + commentId);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment) return;

      if (!comment.replies) comment.replies = [];

      const newReply = {
        id: 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: text,
        likes: [],
        createdAt: 'এইমাত্র'
      };

      comment.replies.push(newReply);
      state.expandedComments[postId] = true; // রিপ্লাই দিলে পুরো কমেন্ট থ্রেড দৃশ্যমান থাকা
      if (input) input.value = '';
      savePosts(state.posts);
      renderApp();

      // ডিভাইসে তাৎক্ষণিক নোটিফিকেশন অ্যালার্ট
      sendDeviceNotification('মন্তব্যে রিপ্লাই যোগ হয়েছে!', {
        body: `${state.currentUser.fullName}: "${text.length > 50 ? text.substring(0, 50) + '...' : text}"`,
        icon: state.currentUser.profilePicture
      });

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
          showToast('রিপ্লাই সফলভাবে যুক্ত হয়েছে', 'success');
        } catch (err) {
          console.warn('Reply sync error:', err);
        }
      } else {
        showToast('রিপ্লাই যুক্ত হয়েছে', 'success');
      }
    }

    // --- রিপ্লাইতে লাইক দেওয়া ---
    async function handleToggleReplyLike(postId, commentId, replyId) {
      const u = state.currentUser;
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const comment = (post.comments || []).find(c => c.id === commentId);
      if (!comment || !comment.replies) return;

      const reply = comment.replies.find(r => r.id === replyId);
      if (!reply) return;

      if (!reply.likes) reply.likes = [];
      const idx = reply.likes.indexOf(u.studentId);
      if (idx === -1) {
        reply.likes.push(u.studentId);
      } else {
        reply.likes.splice(idx, 1);
      }

      savePosts(state.posts);
      renderApp();

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: post.comments
          });
        } catch (err) {
          console.warn('Reply like sync error:', err);
        }
      }
    }

    // --- মূল কমেন্ট যোগ করা ---
    async function handleAddComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('comment-input-' + postId);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const newComment = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        authorId: state.currentUser.id,
        authorStudentId: state.currentUser.studentId,
        authorName: state.currentUser.fullName,
        authorAvatar: state.currentUser.profilePicture,
        content: text,
        likes: [],
        replies: [],
        createdAt: 'এইমাত্র'
      };

      const updatedComments = [...(post.comments || []), newComment];
      post.comments = updatedComments;
      state.expandedComments[postId] = true; // নতুন কমেন্ট করার পর সব কমেন্ট খুলে দেওয়া যাতে ইউজার দেখতে পান
      if (input) input.value = '';
      savePosts(state.posts);
      renderApp();

      // ডিভাইসে তাৎক্ষণিক নোটিফিকেশন ভাইব্রেশন, সাউন্ড ও ব্যানার পাঠানো
      sendDeviceNotification('নতুন মন্তব্য সফলভাবে যোগ হয়েছে!', {
        body: `${state.currentUser.fullName}: "${text.length > 50 ? text.substring(0, 50) + '...' : text}"`,
        icon: state.currentUser.profilePicture
      });

      if (window.firebaseDb && window.fb && postId) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'posts', postId), {
            comments: updatedComments
          });
          showToast('মন্তব্য রিয়েল-টাইমে যোগ হয়েছে', 'success');
        } catch (err) {
          console.warn('Comment sync error:', err);
        }
      } else {
        showToast('মন্তব্য যুক্ত হয়েছে', 'success');
      }
    }

    function handleAdminSearch(val) {
      state.searchQuery = val;
      renderApp();
    }

    async function handleToggleVerify(userId) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        showToast('অনুমতি নেই! শুধুমাত্র এডমিন কোনো শিক্ষার্থীকে ভেরিফাই করতে পারেন।', 'error');
        return;
      }
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      user.isVerified = !user.isVerified;
      saveUsers(state.users);
      showToast(`${user.fullName}-কে ${user.isVerified ? 'ভেরিফাইড করা হয়েছে' : 'আনভেরিফাইড করা হয়েছে'}`, 'success');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', user.id), {
            isVerified: user.isVerified
          });
        } catch (err) {
          console.warn('Verify sync error:', err);
        }
      }
    }

    async function handleDeleteStudent(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`${user.fullName}-এর একাউন্ট স্থায়ীভাবে ডিলিট করতে চান?`)) return;
      state.users = state.users.filter(u => u.id !== userId);
      saveUsers(state.users);
      showToast('শিক্ষার্থী সফলভাবে মুছে ফেলা হয়েছে', 'info');
      renderApp();

      if (window.firebaseDb && window.fb) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', user.id));
        } catch (err) {
          console.warn('Delete user cloud error:', err);
        }
      }
    }

    // --- 8. Initialize App ---
    renderApp();
    if (window.firebaseDb) {
      initFirebaseSync();
    }
  </script>
</body>
</html>
